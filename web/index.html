<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中英语课标核心词汇 3500</title>
<style>
  :root {
    --bg: #f7f5ef;
    --paper: #ffffff;
    --ink: #1d2433;
    --muted: #6b7280;
    --line: #e5e1d6;
    --accent: #2f4a6d;
    --accent-soft: #e8eef6;
    --gold: #b98b3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(247,245,239,.94);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding-top: 16px; flex-wrap: wrap; }
  h1 { font-family: Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 22px; margin: 0; letter-spacing: .5px; }
  .count { color: var(--muted); font-size: 13px; }
  .search { margin: 12px 0; display: flex; gap: 10px; }
  .search input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,74,109,.12); }
  .search button { padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
    color: var(--muted); cursor: pointer; font-size: 14px; }
  .search button:hover { color: var(--accent); border-color: var(--accent); }

  .layout { max-width: 1120px; margin: 0 auto; padding: 18px 20px 40px; display: flex; gap: 24px; align-items: flex-start; }
  .alpha { width: 150px; flex: 0 0 150px; position: sticky; top: calc(var(--hdr, 120px) + 12px);
    max-height: calc(100vh - var(--hdr, 120px) - 30px); overflow-y: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .alpha button { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 34px;
    padding: 0 12px; margin-bottom: 2px; border-radius: 9px; border: 1px solid transparent; background: none;
    color: var(--ink); cursor: pointer; font-size: 14px; transition: background .15s, color .15s; }
  .alpha button .letter { font: 700 15px Georgia, serif; }
  .alpha button .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alpha button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .alpha button.active { background: var(--accent); color: #fff; }
  .alpha button.active .num { color: rgba(255,255,255,.8); }
  .alpha button:disabled { opacity: .35; cursor: default; }
  .alpha hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }

  main { flex: 1; min-width: 0; }
  .entry { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px;
    margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: box-shadow .2s; }
  .entry:hover { box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .word { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; color: var(--accent);
    cursor: pointer; }
  .word:hover { text-decoration: underline; text-underline-offset: 3px; }
  .ipa { font-family: "Doulos SIL", "Lucida Sans Unicode", "DejaVu Sans", serif; color: var(--muted); font-size: 15px; }
  .pos { font-size: 12px; color: #fff; background: var(--gold); border-radius: 6px; padding: 1px 7px; }
  .spk { border: none; background: var(--accent-soft); color: var(--accent); width: 32px; height: 32px;
    border-radius: 50%; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
    transition: transform .1s, background .2s; }
  .spk:hover { background: var(--accent); color: #fff; }
  .spk:active { transform: scale(.92); }
  .spk.playing { background: var(--gold); color: #fff; }
  .meaning { margin-top: 8px; font-size: 16px; }
  .en { margin-top: 4px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .derived { margin: 12px 0 0; padding: 10px 0 0 14px; border-left: 2px solid var(--accent-soft); list-style: none; }
  .derived li { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 4px 0; font-size: 14px; }
  .derived .dw { font-weight: 600; cursor: pointer; color: var(--ink); }
  .derived .dw:hover { color: var(--accent); }
  .derived .dpos { color: var(--gold); font-size: 12px; }
  .derived .dzh { color: var(--ink); }
  .derived .den { color: var(--muted); font-size: 13px; width: 100%; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  nav.pager { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
  nav.pager button { min-width: 36px; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); cursor: pointer; font-size: 14px; }
  nav.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  nav.pager button.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
  nav.pager button:disabled { opacity: .35; cursor: default; }
  nav.pager span { color: var(--muted); padding: 0 4px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 20px 30px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .toast.show { opacity: .95; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; gap: 12px; }
    .alpha { width: 100%; flex: none; position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
    .alpha button { width: auto; min-width: 58px; height: 30px; padding: 0 8px; gap: 6px; }
    .alpha hr { display: none; }
  }
  @media (max-width: 600px) {
    .word { font-size: 19px; }
    .entry { padding: 14px; }
  }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
  .tabs button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
    color: var(--muted); cursor: pointer; font-size: 14px; }
  .tabs button:hover { color: var(--accent); border-color: var(--accent); }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  body.nonvocab .layout, body.nonvocab .search, body.nonvocab #count { display: none; }
  #grammar, #subject { display: none; padding: 8px 0 24px; }
  body.grammar #grammar, body.subject #subject { display: block; }
  .qx { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .qx:first-of-type { border-top: none; padding-top: 0; margin-top: 12px; }
  .qx .q { font-size: 14.5px; line-height: 1.75; white-space: pre-line; }
  .qx .qn { display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft);
    color: var(--accent); font-size: 12px; font-weight: 600; }
  .qx details { margin-top: 6px; }
  .qx summary { cursor: pointer; color: var(--accent); font-size: 13.5px; user-select: none; }
  .qx .idea, .qx .ans { margin: 6px 0 0; font-size: 14px; line-height: 1.75; white-space: pre-line; color: #333; }
  .qx .ans { color: var(--ink); }

  .gtoc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
  .gtoc button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
    color: var(--muted); cursor: pointer; font-size: 13px; }
  .gtoc button:hover { color: var(--accent); border-color: var(--accent); }
  .gsec { scroll-margin-top: calc(var(--hdr, 120px) + 16px); margin-top: 28px; }
  .gsec > h2 { font-family: Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 19px; margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--accent); }
  .gcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .gcard h3 { margin: 0 0 6px; font-size: 16px; }
  .gcard .gdesc { color: var(--ink); line-height: 1.75; font-size: 14.5px; margin: 0; }
  .gcard .gtip { margin: 8px 0 0; padding: 8px 12px; background: #fbf6ec; border-left: 3px solid var(--gold);
    border-radius: 6px; font-size: 13.5px; color: #5b4a2b; line-height: 1.7; }
  .gex { list-style: none; margin: 10px 0 0; padding: 0; }
  .gex li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--line); }
  .gex li:first-child { border-top: none; }
  .gex .en { flex: 1; font-size: 15px; }
  .gex .zh { flex: 1; color: var(--muted); font-size: 14px; }
  .gex .spk { border: none; background: none; cursor: pointer; font-size: 14px; padding: 0 2px; opacity: .7; }
  .gex .spk:hover { opacity: 1; }
  @media (max-width: 600px) {
    .gex li { flex-direction: column; gap: 2px; }
  }
</style>
</head>

 v.","en":"an injury to the body; to injure","zh":"伤口；伤害","w":"wound","l":"w","d":[]},{"ipa":"/ræp/","pos":"v. / n.","en":"to cover with paper or cloth; a covering","zh":"包裹；披上","w":"wrap","l":"w","d":[]},{"ipa":"/rɪst/","pos":"n.","en":"the joint between the hand and the arm","zh":"手腕","w":"wrist","l":"w","d":[]},{"ipa":"/raɪt/","pos":"v.","en":"to produce words or text on paper or a screen","zh":"写；写作","w":"write","l":"w","d":[{"ipa":"/ˈraɪtə(r)/","pos":"n.","en":"a person who writes books or articles","zh":"作家；作者","w":"writer"},{"ipa":"/ˈraɪtɪŋ/","pos":"n.","en":"written words; the activity of writing","zh":"书面文字；写作","w":"writing"}]},{"ipa":"/rɒŋ/","pos":"adj. / adv. / v.","en":"not correct; not right; to treat unfairly","zh":"错误的；不对；冤枉","w":"wrong","l":"w","d":[]},{"ipa":"/jɑːd/","pos":"n.","en":"a unit of length; an enclosed area next to a building","zh":"码；院子","w":"yard","l":"y","d":[]},{"ipa":"/jɪə(r)/","pos":"n.","en":"a period of twelve months","zh":"年","w":"year","l":"y","d":[]},{"ipa":"/jel/","pos":"v. / n.","en":"to shout loudly","zh":"大叫；喊叫","w":"yell","l":"y","d":[]},{"ipa":"/ˈjeləʊ/","pos":"n. / adj.","en":"the colour of lemons or sunshine","zh":"黄色；黄色的","w":"yellow","l":"y","d":[]},{"ipa":"/jes/","pos":"int.","en":"used to agree or accept","zh":"是；对","w":"yes","l":"y","d":[]},{"ipa":"/ˈjestədeɪ/","pos":"n. / adv.","en":"the day before today","zh":"昨天","w":"yesterday","l":"y","d":[]},{"ipa":"/jet/","pos":"adv. / conj.","en":"up to now; but","zh":"还；仍然；然而","w":"yet","l":"y","d":[]},{"ipa":"/jiːld/","pos":"v. / n.","en":"to produce; to give way; a quantity produced","zh":"产出；屈服；产量","w":"yield","l":"y","d":[]},{"ipa":"/juː/","pos":"pron.","en":"the person or people being addressed","zh":"你；你们","w":"you","l":"y","d":[]},{"ipa":"/jʌŋ/","pos":"adj. / n.","en":"having lived only a short time; young people","zh":"年轻的；年轻人","w":"young","l":"y","d":[]},{"ipa":"/juːθ/","pos":"n.","en":"the period of being young; young people","zh":"青年时期；青年","w":"youth","l":"y","d const GRAMMAR = [{"title":"一、动词时态","items":[{"name":"一般现在时","desc":"表示经常性、习惯性的动作，或客观事实与真理。结构：主语 + 动词原形（第三人称单数加 -s / -es）。","tip":"常与 always, usually, often, every day 等连用。","ex":[["She reads English every morning.","她每天早上读英语。"],["The earth goes around the sun.","地球绕着太阳转。"]]},{"name":"一般过去时","desc":"表示过去某个时间发生的动作或存在的状态。结构：动词过去式（be 动词用 was / were）。","tip":"常与 yesterday, last week, in 2008, just now 等过去时间状语连用。","ex":[["I visited my grandma last weekend.","我上个周末去看望了奶奶。"],["He was ill yesterday.","他昨天生病了。"]]},{"name":"一般将来时","desc":"表示将来要发生的动作。结构：will / shall + 动词原形；be going to + 动词原形 表示计划或有迹象的将来；be about to 表示即将发生。","ex":[["We will hold a sports meeting next month.","我们下个月将举行运动会。"],["It is going to rain soon.","天快要下雨了。"]]},{"name":"现在进行时","desc":"表示说话时正在进行的动作，也可表示最近一段时间内的动作，或按计划将要发生的安排。结构：am / is / are + doing。","ex":[["They are playing football now.","他们现在正在踢足球。"],["I am meeting Tom tomorrow.","我明天要和汤姆见面。"]]},{"name":"现在完成时","desc":"表示过去发生的动作对现在造成影响，或动作从过去持续到现在。结构：have / has + 过去分词。","tip":"常与 already, yet, just, ever, never, for, since 连用。for 后接时间段，since 后接时间点。","ex":[["I have finished my homework.","我已经做完作业了。"],["She has lived here for ten years.","她在这里住了十年。"]]},{"name":"过去完成时","desc":"表示过去某一时间或动作之前已经完成的动作。结构：had + 过去分词。","ex":[["When I arrived, the film had already started.","我到的时候，电影已经开始了。"]]},{"name":"现在完成进行时","desc":"强调动作从过去开始、一直持续到现在，并可能继续下去。结构：have / has been + doing。","ex":[["I have been studying for three hours.","我已经学习三个小时了。"]]}]},{"title":"二、被动语态","items":[{"name":"被动语态的基本形式","desc":"主语是动作的承受者。结构：be + 过去分词（by 引出动作的执行者）。时态变化通过 be 动词体现。","ex":[["The window was broken last night.","窗户昨晚被打破了。"],["English is spoken in many countries.","许多国家都说英语。"]]},{"name":"含情态动词的被动语态","desc":"结构：情态动词 + be + 过去分词。","ex":[["The problem can be solved easily.","这个问题很容易解决。"],["The homework must be finished today.","作业必须今天完成。"]]}]},{"title":"三、非谓语动词","items":[{"name":"不定式（to do）","desc":"可在句中作主语、宾语、宾语补足语，也可作目的状语。","ex":[["To learn English well takes time.","学好英语需要时间。"],["She came here to help us.","她来这里是为了帮助我们。"]]},{"name":"动名词（doing）","desc":"具有名词性质，可作主语、宾语、表语。常接动名词作宾语的动词有 enjoy, finish, mind, consider, suggest, practise 等。","ex":[["Reading is my favourite hobby.","阅读是我最喜欢的爱好。"],["She enjoys swimming in summer.","她喜欢在夏天游泳。"]]},{"name":"现在分词与过去分词","desc":"现在分词（doing）表示主动或进行；过去分词（done）表示被动或完成。可作定语、状语等。","ex":[["The boy running over there is my brother.","那边跑着的男孩是我弟弟。"],["The letter written in English was from Tom.","那封用英语写的信是汤姆寄来的。"],["Walking along the street, I met my teacher.","沿着街道走的时候，我遇到了我的老师。"]]},{"name":"stop 等动词后接 to do 与 doing 的区别","desc":"stop to do 表示停下来去做另一件事；stop doing 表示停止正在做的事。","ex":[["He stopped to smoke.","他停下来抽烟。（停下手中的事去抽烟）"],["He stopped smoking.","他戒烟了。（停止抽烟）"]]}]},{"title":"四、情态动词","items":[{"name":"常用情态动词","desc":"can / could 表示能力或可能；may / might 表示允许或可能性；must 表示必须；should / ought to 表示建议或义务；need 表示需要。情态动词后接动词原形，没有人称和时态变化。","ex":[["You must finish it today.","你今天必须完成它。"],["You don't have to come.","你不必来。"],["You mustn't smoke here.","你不准在这里抽烟。"]]},{"name":"情态动词 + have done","desc":"should have done 表示本应该做而没做；needn't have done 表示本不必做却做了；must have done 表示对过去的推测。","ex":[["You should have called me.","你本该给我打电话的。"],["He must have forgotten it.","他一定是忘了。"]]}]},{"title":"五、虚拟语气","items":[{"name":"与现在事实相反","desc":"结构：If + 主语 + 动词过去式（be 动词多用 were），主句 would / could / might + 动词原形。","ex":[["If I were you, I would take the bus.","如果我是你，我会坐公交车。"]]},{"name":"与过去事实相反","desc":"结构：If + 主语 + had done，主句 would / could / might + have done。","ex":[["If we had left earlier, we would have caught the train.","如果我们早点出发，就能赶上火车了。"]]},{"name":"wish 后的虚拟语气","desc":"wish 后的从句表示与现在或过去事实相反的愿望：表示现在用过去式，表示过去用 had done。","ex":[["I wish I knew the answer.","我真希望我知道答案。（实际不知道）"],["I wish I had listened to you.","我真希望当初听了你的话。（实际没听）"]]}]},{"title":"六、从句","items":[{"name":"定语从句","desc":"修饰名词或代词，由关系代词 who / whom / whose / which / that 或关系副词 when / where / why 引导。","tip":"先行词指人用 who / whom / that；指物用 which / that；先行词是时间、地点用 when / where。","ex":[["The girl who is standing there is my sister.","站在那里的女孩是我的妹妹。"],["This is the place where we first met.","这是我们第一次见面的地方。"]]},{"name":"名词性从句","desc":"在句中充当主语、宾语、表语或同位语。常由 that, whether, if, what, when, who 等引导。","ex":[["What he said is true.","他说的话是真的。（主语从句）"],["I don't know whether he will come.","我不知道他会不会来。（宾语从句）"],["The question is when we'll start.","问题是我们什么时候出发。（表语从句）"],["The news that our team won spread quickly.","我们队获胜的消息很快传开了。（同位语从句）"]]},{"name":"状语从句","desc":"修饰主句的动词、形容词或副词，表示时间、条件、原因、让步、目的、结果等。","tip":"时间：when, as soon as, until；条件：if, unless；原因：because, since, as；让步：although, though；目的：so that；结果：so ... that。","ex":[["I will call you as soon as I arrive.","我一到就给你打电话。（时间）"],["You will fail unless you work harder.","除非你更加努力，否则你会失败。（条件）"],["Although it was raining, they went out.","尽管下着雨，他们还是出去了。（让步）"]]}]},{"title":"七、倒装与强调","items":[{"name":"部分倒装","desc":"否定副词（never, seldom, hardly, rarely, little 等）或 only + 状语位于句首时，句子要部分倒装：助动词或情态动词提前到主语前。","ex":[["Never have I seen such a beautiful view.","我从未见过如此美丽的景色。"],["Hardly had I got home when it started to rain.","我刚到家，天就开始下雨了。"],["Only then did I understand the problem.","直到那时我才明白这个问题。"]]},{"name":"强调句型","desc":"结构：It is / was + 被强调部分 + that / who + 其余部分。被强调部分可以是主语、宾语或状语。去掉 It is ... that 后句子仍然完整。","ex":[["It was in 2008 that he joined the army.","他是在2008年参军的。（强调时间）"],["It is Tom who broke the vase.","打碎花瓶的是汤姆。（强调主语）"]]}]},{"title":"八、主谓一致","items":[{"name":"常见主谓一致规则","desc":"谓语动词的人称和数要与主语一致。Neither ... nor / either ... or / not only ... but also 连接主语时，谓语与靠近它的主语一致。a number of 表示复数，the number of 表示单数。","ex":[["Neither he nor I am wrong.","他和我都没错。"],["A number of students are waiting outside.","很多学生正在外面等候。"],["The number of students is increasing.","学生人数正在增加。"]]}]},{"title":"九、冠词、介词与比较级","items":[{"name":"冠词 a / an / the","desc":"a / an 表示泛指“一个”，元音音素前用 an；the 表示特指或双方都知道的人或事物，也用于世界上独一无二的事物。","ex":[["I have a pen and an eraser.","我有一支钢笔和一块橡皮。"],["The sun rises in the east.","太阳从东方升起。"]]},{"name":"时间介词 in / on / at","desc":"at 用于具体时刻；on 用于具体日期和星期；in 用于月份、季节、年份及较长的时间段。","ex":[["We have class at 8 o'clock.","我们八点上课。"],["I was born on May 5th.","我出生于5月5日。"],["She was born in 2008.","她出生于2008年。"]]},{"name":"形容词和副词的比较级与最高级","desc":"单音节和部分双音节词加 -er / -est；多音节词前加 more / most。少数词不规则变化，如 good–better–best，bad–worse–worst。","ex":[["This book is more interesting than that one.","这本书比那本更有趣。"],["He is the tallest boy in our class.","他是我们班最高的男生。"],["She runs as fast as her brother.","她跑得和她哥哥一样快。"]]}]}];
const SUBJECTS = {"math":[{"title":"第一章 集合与常用逻辑用语","items":[{"name":"集合的概念与基本关系","desc":"集合是由确定的、互不相同的对象组成的整体，元素与集合的关系用∈、∉表示。若A的每个元素都属于B，则A⊆B（A是B的子集）；若还存在B中元素不属于A，则A⊊B（真子集）。空集∅是任何集合的子集。含n个元素的集合有2ⁿ个子集，2ⁿ−1个非空子集，2ⁿ−1个真子集。常用数集记号：N（自然数集）、N*（正整数集）、Z、Q、R。","tip":"讨论A⊆B时不要漏掉A=∅的情形，它是任何集合的子集。","ex":[{"q":"已知集合A={1,2,3}，写出A的所有子集，并求其真子集的个数。","idea":"含n个元素的集合有2ⁿ个子集，真子集个数为2ⁿ−1。","ans":"A的子集为∅,{1},{2},{3},{1,2},{1,3},{2,3},{1,2,3}，共8个；真子集个数为8−1=7。"},{"q":"已知A={x | x²−3x+2=0}，B={x | ax=1}，若B⊆A，求实数a的值组成的集合。","idea":"先求出A={1,2}。B=∅时a=0满足条件；B≠∅时需1/a∈{1,2}。","ans":"A={1,2}。a=0时B=∅⊆A成立；a≠0时x=1/a，需1/a=1或1/a=2，得a=1或a=1/2。故a的取值集合为{0,1,1/2}。"}]},{"name":"集合的基本运算","desc":"交集A∩B是由同时属于A和B的元素组成的集合；并集A∪B是由属于A或属于B的元素组成的集合；补集∁ᵤA是全集U中不属于A的元素组成的集合。德摩根律：∁ᵤ(A∩B)=(∁ᵤA)∪(∁ᵤB)，∁ᵤ(A∪B)=(∁ᵤA)∩(∁ᵤB)。解题时常借助数轴或韦恩图。","tip":"处理区间问题时，要注意端点是否能取到（实心点表示能取到，空心圈表示取不到）。","ex":[{"q":"设A={x | -1<x<3}，B={x | x≥1}，求A∩B与A∪B。","idea":"在数轴上分别画出A与B，A∩B取公共部分，A∪B取合并的部分。","ans":"A∩B={x | 1≤x<3}；A∪B={x | x>-1}。"},{"q":"已知全集U={1,2,3,4,5,6}，A={1,3,5}，B={2,3,4}，求∁ᵤA、∁ᵤB以及A∩(∁ᵤB)。","idea":"先求∁ᵤA与∁ᵤB（取U中不在集合里的元素），再与A取交集。","ans":"∁ᵤA={2,4,6}；∁ᵤB={1,5,6}；A∩(∁ᵤB)={1,5}。"},{"q":"设全集U=R，A={x | x²−4x−5≤0}，B={x | x<0}，求A∩B、A∪B与∁ᵤA。","idea":"x²−4x−5=(x−5)(x+1)≤0得A=[−1,5]，再结合数轴求各集合。","ans":"A∩B=[−1,0)；A∪B=(−∞,5]；∁ᵤA=(−∞,−1)∪(5,+∞)。"}]},{"name":"充分条件与必要条件","desc":"若由p能推出q（p⇒q），则p是q的充分条件，q是p的必要条件；若p⇒q且q⇒p，则p与q互为充要条件。从集合角度看：若{x | p}是{x | q}的真子集，则p是q的充分不必要条件。","tip":"记住“小推大”：充分条件对应的集合较小，必要条件对应的集合较大。","ex":[{"q":"“x>2”是“x²>4”的什么条件？","idea":"先判断x>2能否推出x²>4；再找反例说明x²>4推不出x>2。","ans":"x>2时x²>4成立；但x=-3时x²=9>4而x<2，因此x²>4推不出x>2。故“x>2”是“x²>4”的充分不必要条件。"},{"q":"已知p：x<a，q：x<3。若p是q的充分不必要条件，求实数a的取值范围。","idea":"p⇒q等价于(-∞,a)⊆(-∞,3)；“不必要”要求两集合不相等。","ans":"由a≤3得充分性成立；a=3时两集合相等（充要），应排除，故a<3，即a∈(-∞,3)。"}]},{"name":"全称量词与存在量词","desc":"含全称量词“∀”的命题形如“∀x∈M，p(x)”；含存在量词“∃”的命题形如“∃x∈M，p(x)”。否定规则：全称命题的否定是存在性命题，即“∀x∈M，p(x)”的否定为“∃x∈M，¬p(x)”；存在性命题的否定为“∀x∈M，¬p(x)”。全称命题为真需对所有元素成立，为假只需举一个反例；存在性命题为真只需找到一个例子。","tip":"否定时只否定结论，量词要同时改变；“都是”的否定是“不都是”，而不是“都不是”。","ex":[{"q":"写出命题“∀x∈R，x²+x+1>0”的否定，并判断真假。","idea":"否定为“∃x∈R，x²+x+1≤0”。配方x²+x+1=(x+1/2)²+3/4>0恒成立。","ans":"否定为“∃x∈R，x²+x+1≤0”，该命题为假；原命题为真。"},{"q":"若命题“∃x∈R，x²−2x+a≤0”为真，求实数a的取值范围。","idea":"存在性命题为真，即函数(x−1)²+a−1的最小值不大于0。","ans":"原式化为(x−1)²+a−1≤0。存在x使之成立，等价于(x−1)²的最小值0满足a−1≤0，即a≤1。"}]}]},{"title":"第二章 一元二次函数、方程和不等式","items":[{"name":"不等式的性质与比较大小","desc":"基本性质：若a>b且b>c，则a>c；若a>b，则a+c>b+c；若a>b且c>0，则ac>bc；若a>b且c<0，则ac<bc。作差法：a−b>0⇔a>b，a−b=0⇔a=b，a−b<0⇔a<b。同向不等式可以相加，但不能直接相减。","tip":"不等式两边同乘负数时要改变不等号方向；同向不等式相减不能得到有效的不等式。","ex":[{"q":"已知-1<a<2，3<b<5，求a−b与2a+b的取值范围。","idea":"利用同向不等式相加，注意−b的范围是(−5,−3)。","ans":"a−b∈(−6,−1)；由−2<2a<4，得2a+b∈(1,9)。"},{"q":"比较x²+3与3x的大小。","idea":"作差x²+3−3x=x²−3x+3，配方后判断符号。","ans":"x²−3x+3=(x−3/2)²+3/4>0，所以x²+3>3x恒成立。"}]},{"name":"基本不等式","desc":"若a>0，b>0，则(a+b)/2≥√(ab)，当且仅当a=b时取等号。常用变形：a+b≥2√(ab)，ab≤((a+b)/2)²。应用口诀：积定和有最小值，和定积有最大值。","tip":"使用基本不等式必须满足“一正、二定、三相等”，三者缺一不可。","ex":[{"q":"已知x>0，求y=x+4/x的最小值，并指出取最小值时x的值。","idea":"x+4/x≥2√(x·4/x)=4，等号条件是x=4/x。","ans":"最小值为4，此时x=2。"},{"q":"已知x>0，y>0，且x+y=1，求1/x+4/y的最小值。","idea":"把1用x+y代换，展开后再用基本不等式。","ans":"1/x+4/y=(x+y)(1/x+4/y)=5+y/x+4x/y≥5+2√4=9，当y=2x时取等，即x=1/3，y=2/3。最小值为9。"}]},{"name":"一元二次不等式","desc":"形如ax²+bx+c>0（a≠0）的不等式。解法：先求判别式Δ=b²−4ac及方程的根；当a>0时，大于0取两根之外，小于0取两根之间；若Δ<0，则ax²+bx+c>0的解集为R（a>0时）。三个“二次”的关系：二次函数图象、一元二次方程的根与一元二次不等式的解集相互对应。","tip":"二次项系数为负时，先两边乘以−1化为正数再求解；注意比较两根大小。","ex":[{"q":"解不等式2x²−x−3>0。","idea":"因式分解为(2x−3)(x+1)>0，开口向上。","ans":"由(2x−3)(x+1)>0，得x<−1或x>3/2。解集为(−∞,−1)∪(3/2,+∞)。"},{"q":"若不等式ax²+bx+2>0的解集为(−1,2)，求a、b的值。","idea":"解集为有限区间说明a<0，且−1、2是方程的两根，由根与系数关系求a、b。","ans":"由题意a<0，且ax²+bx+2=a(x+1)(x−2)=a(x²−x−2)，比较常数项得−2a=2，故a=−1，b=−a=1。验证：−x²+x+2>0⇔(x+1)(x−2)<0⇔−1<x<2，成立。"}]}]},{"title":"第三章 函数概念与性质","items":[{"name":"函数的概念与定义域","desc":"设A、B是非空数集，若对A中每个x，按照对应关系f在B中都有唯一确定的y与之对应，则y=f(x)是从A到B的函数。定义域是使解析式有意义的x的集合，常见限制：分母不为0；偶次根式的被开方数≥0；对数的真数>0、底数>0且≠1；零次幂的底数≠0。若f(x)的定义域为[a,b]，则f(g(x))的定义域由a≤g(x)≤b确定。","tip":"求出定义域后，若函数有实际背景，还要结合实际意义进一步限制。","ex":[{"q":"求函数f(x)=√(x−1)/(x−3)的定义域。","idea":"需要x−1≥0且x−3≠0。","ans":"x≥1且x≠3，定义域为[1,3)∪(3,+∞)。"},{"q":"已知f(x+1)的定义域为[0,2]，求f(2x−1)的定义域。","idea":"由x∈[0,2]得x+1∈[1,3]，即f的定义域为[1,3]；再令2x−1∈[1,3]。","ans":"f的定义域为[1,3]，由1≤2x−1≤3得1≤x≤2，即f(2x−1)的定义域为[1,2]。"}]},{"name":"函数的值域与求法","desc":"值域是函数值f(x)所有取值构成的集合。常用求法：观察法、配方法（二次函数及其在闭区间上的值域要比较对称轴与端点）、换元法（如令t=√(x+1)）、基本不等式法、单调性法。","tip":"用换元法时一定要写出新变量的取值范围，否则会得到错误的值域。","ex":[{"q":"求f(x)=x²−2x+3在x∈[0,3]上的值域。","idea":"配方得(x−1)²+2，对称轴x=1位于区间内，最小值在顶点处取得，最大值比较端点。","ans":"最小值f(1)=2；f(0)=3，f(3)=6，最大值为6。值域为[2,6]。"},{"q":"求函数y=2x−√(x+1)的值域。","idea":"令t=√(x+1)≥0，则x=t²−1，y=2t²−t−2，t∈[0,+∞)。","ans":"y=2(t−1/4)²−17/8，当t=1/4≥0时取最小值−17/8，且无最大值。值域为[−17/8,+∞)。"}]},{"name":"函数的单调性","desc":"设函数f(x)的定义域为D，区间I⊆D。若对任意x1<x2，都有f(x1)<f(x2)，则f(x)在I上单调递增；若都有f(x1)>f(x2)，则单调递减。用定义证明单调性的步骤：取值、作差、变形、判断符号、下结论。复合函数“同增异减”：内外层单调性相同则复合后递增，相反则递减。","tip":"单调区间写成区间形式，多个单调区间之间用“和”或逗号连接，不要用并集符号“∪”。","ex":[{"q":"用定义证明f(x)=x+1/x在(0,1)上单调递减。","idea":"取0<x1<x2<1，计算f(x1)−f(x2)并分解因式判断符号。","ans":"f(x1)−f(x2)=(x1−x2)(x1x2−1)/(x1x2)。由0<x1<x2<1，得x1−x2<0，x1x2−1<0，x1x2>0，故f(x1)−f(x2)>0，即f(x1)>f(x2)，所以f在(0,1)上单调递减。"},{"q":"求函数y=√(−x²+2x+3)的单调递增区间和递减区间。","idea":"先求定义域，再考虑内层二次函数的单调性，外层√·在[0,+∞)上递增。","ans":"由−x²+2x+3≥0得定义域为[−1,3]。内层在[−1,1]上递增、在[1,3]上递减，外层递增，故递增区间为[−1,1]，递减区间为[1,3]。"}]},{"name":"函数的奇偶性与对称性","desc":"若定义域关于原点对称，且f(−x)=f(x)，则f是偶函数，图象关于y轴对称；若f(−x)=−f(x)，则f是奇函数，图象关于原点对称。若奇函数在x=0处有定义，则f(0)=0。偶函数在关于原点对称的区间上单调性相反，奇函数则单调性相同。","tip":"判断奇偶性时先看定义域是否关于原点对称；若不对称，则函数既不是奇函数也不是偶函数。","ex":[{"q":"判断f(x)=x³+1/x的奇偶性。","idea":"定义域为{x | x≠0}，关于原点对称；计算f(−x)与f(x)的关系。","ans":"f(−x)=−x³−1/x=−f(x)，故f(x)是奇函数。"},{"q":"已知f(x)是R上的奇函数，当x≥0时f(x)=x²−2x，求f(x)的解析式。","idea":"x<0时−x>0，利用f(x)=−f(−x)求解；注意x=0处的值。","ans":"x<0时，f(−x)=x²+2x，故f(x)=−f(−x)=−x²−2x。所以f(x)=x²−2x（x≥0），f(x)=−x²−2x（x<0）。"}]}]},{"title":"第四章 指数函数、对数函数与幂函数","items":[{"name":"指数幂与指数函数","desc":"分数指数幂：a^(m/n)=ⁿ√(a^m)（a>0），a^(−r)=1/a^r。运算法则：a^r·a^s=a^(r+s)，(a^r)^s=a^(rs)，(ab)^r=a^r·b^r。指数函数y=a^x（a>0且a≠1）的定义域为R，值域为(0,+∞)，图象过定点(0,1)；a>1时在R上递增，0<a<1时在R上递减。","tip":"底数a>1与0<a<1时指数函数的单调性相反，讨论时必须分类。","ex":[{"q":"计算(8/27)^(−2/3)的值。","idea":"负指数化为倒数，再利用(27/8)=(3/2)³开立方。","ans":"(8/27)^(−2/3)=(27/8)^(2/3)=((3/2)³)^(2/3)=(3/2)²=9/4。"},{"q":"若y=a^x（a>0且a≠1）在[1,2]上的最大值比最小值大a/2，求a。","idea":"分a>1和0<a<1两种情况，分别确定最大值和最小值。","ans":"a>1时，最大值a²，最小值a，a²−a=a/2得a=3/2；0<a<1时，最大值a，最小值a²，a−a²=a/2得a=1/2。故a=3/2或a=1/2。"}]},{"name":"对数运算与对数函数","desc":"若a^b=N（a>0且a≠1），则b=log_a N。运算法则：log_a(MN)=log_a M+log_a N；log_a(M/N)=log_a M−log_a N；log_a M^n=n·log_a M。换底公式：log_a b=lg b/lg a。对数函数y=log_a x的定义域为(0,+∞)，值域为R，图象过定点(1,0)；a>1时递增，0<a<1时递减。指数函数与对数函数互为反函数。","tip":"真数必须大于0；log_a(M+N)≠log_a M+log_a N，不能随意拆分。","ex":[{"q":"计算2log₃2−log₃(32/9)+log₃8。","idea":"把系数化入真数，合并为一个对数再计算。","ans":"原式=log₃4+log₃(9/32)+log₃8=log₃(4·9·8/32)=log₃9=2。"},{"q":"求函数y=log_{1/2}(x²−3x+2)的单调递增区间和递减区间。","idea":"先求定义域(−∞,1)∪(2,+∞)；内层在(−∞,1)上递减，在(2,+∞)上递增，外层递减（底数1/2∈(0,1)）。","ans":"单调递增区间为(−∞,1)，单调递减区间为(2,+∞)。"}]},{"name":"幂函数","desc":"形如y=x^α（α为常数）的函数称为幂函数。所有幂函数的图象都过点(1,1)。当α>0时，函数在(0,+∞)上递增；当α<0时，函数在(0,+∞)上递减。常见的幂函数有y=x、y=x²、y=x³、y=√x、y=1/x。","tip":"比较幂的大小时，若指数相同，利用幂函数单调性；若底数相同，利用指数函数单调性。","ex":[{"q":"若幂函数f(x)=x^α的图象过点(4,2)，求f(9)。","idea":"代入点坐标求出α，再计算f(9)。","ans":"由4^α=2得α=1/2，故f(x)=√x，f(9)=3。"},{"q":"比较1.2^0.3与1.3^0.3的大小。","idea":"两数指数相同，看作幂函数y=x^0.3在(0,+∞)上的函数值比较。","ans":"y=x^0.3在(0,+∞)上递增，且1.2<1.3，所以1.2^0.3<1.3^0.3。"}]}]},{"title":"第五章 函数的应用","items":[{"name":"函数的零点与二分法","desc":"使f(x)=0的实数x称为函数f(x)的零点。零点存在定理：若函数f(x)在闭区间[a,b]上的图象是连续不断的，且f(a)·f(b)<0，则f(x)在(a,b)内至少有一个零点。二分法：取区间中点c，若f(c)与f(a)同号则零点在[c,b]内，否则在[a,c]内，不断重复，直到区间长度满足精度要求。","tip":"零点存在定理只说明存在性；f(a)·f(b)>0并不代表区间内没有零点。","ex":[{"q":"判断函数f(x)=x³+x−4在哪个区间内有零点。","idea":"计算端点函数值，观察符号变化；函数单调递增，零点唯一。","ans":"f(1)=−2<0，f(2)=6>0，故零点在(1,2)内。由于f(x)在R上递增，零点唯一。"},{"q":"用二分法求函数f(x)=x²−2在[1,2]内零点的近似位置（区间长度不超过0.125）。","idea":"依次取中点计算函数值，判断零点所在的半区间。","ans":"f(1)=−1<0，f(2)=2>0。取中点1.5：f(1.5)=0.25>0，零点在[1,1.5]；取1.25：f(1.25)=−0.4375<0，零点在[1.25,1.5]；取1.375：f(1.375)≈−0.109<0，零点在[1.375,1.5]，区间长度0.125。真实零点√2≈1.414位于其中。"}]},{"name":"函数模型及其应用","desc":"解决应用问题的一般步骤：审题、建模（列出函数关系式）、解模（求最值或解方程、不等式）、还原为实际问题的结论。常见模型有一次函数、二次函数、分段函数、指数函数模型y=N(1+p)^x等。二次函数求最值常用配方法或顶点公式。","tip":"实际问题中自变量的取值要受实际意义限制，求得结果后应检验是否合理。","ex":[{"q":"某商品每件进价40元，售价为x元（40≤x≤100）时，日销量为(100−x)件。求售价为多少时日利润最大，并求最大利润。","idea":"日利润P(x)=(x−40)(100−x)是开口向下的二次函数，求顶点。","ans":"P(x)=−x²+140x−4000，对称轴x=70在[40,100]内，故售价70元时利润最大，最大利润为P(70)=30×30=900元。"},{"q":"某公司今年产值为1000万元，若年增长率为10%，设n年后的产值为y万元，求y关于n的函数解析式，并求至少经过几年产值超过2000万元。","idea":"y=1000·1.1^n，解不等式1.1^n>2，逐年验证。","ans":"y=1000·1.1^n。因1.1^7≈1.949<2，1.1^8≈2.144>2，故至少经过8年产值超过2000万元。"}]}]},{"title":"第六章 三角函数","items":[{"name":"任意角与弧度制","desc":"角可以看作射线绕端点旋转形成，逆时针旋转为正角，顺时针为负角。与α终边相同的角构成集合{β | β=α+2kπ，k∈Z}。弧度制：长度等于半径的圆弧所对的圆心角为1弧度（1 rad）。弧长l=|α|r，扇形面积S=½lr=½|α|r²。角度与弧度换算：π rad=180°。","tip":"同一题中角度制与弧度制不能混用，运算前应统一单位。","ex":[{"q":"把750°写成2kπ+α（0≤α<2π）的形式，并判断它是第几象限角。","idea":"750°=2×360°+30°，30°=π/6。","ans":"750°=4π+π/6，α=π/6位于第一象限，故750°是第一象限角。"},{"q":"已知扇形的周长为8 cm，求面积最大时扇形的圆心角α（弧度）和最大面积。","idea":"设半径为r，则弧长l=8−2r，S=½lr=−r²+4r，用配方法求最大值。","ans":"S=−(r−2)²+4，当r=2时S最大为4 cm²，此时弧长l=4，圆心角α=l/r=2 rad。"}]},{"name":"任意角的三角函数与同角关系","desc":"在角α终边上任取一点P(x,y)，设|OP|=r，则sinα=y/r，cosα=x/r，tanα=y/x（x≠0）。各象限正负口诀：一全正，二正弦，三正切，四余弦。同角关系：sin²α+cos²α=1，tanα=sinα/cosα。","tip":"由sin²α+cos²α=1开方求cosα时，要先根据象限确定符号。","ex":[{"q":"已知sinα=−3/5，且α是第四象限角，求cosα与tanα。","idea":"由平方关系求cos²α，再由第四象限cosα>0确定符号。","ans":"cos²α=1−9/25=16/25，第四象限cosα>0，故cosα=4/5，tanα=(−3/5)/(4/5)=−3/4。"},{"q":"已知tanα=2，求(sinα+cosα)/(sinα−cosα)及sinα·cosα的值。","idea":"分子分母同除以cosα得关于tanα的式子；sinα·cosα用sin²α+cos²α=1齐次化。","ans":"(sinα+cosα)/(sinα−cosα)=(tanα+1)/(tanα−1)=3；sinα·cosα=sinα·cosα/(sin²α+cos²α)=tanα/(1+tan²α)=2/5。"}]},{"name":"诱导公式","desc":"诱导公式可概括为“奇变偶不变，符号看象限”：角为π/2的奇数倍时正弦与余弦互换，偶数倍时名称不变；符号取决于把α看作锐角时原函数值在该象限的符号。常用公式：sin(π+α)=−sinα，cos(π−α)=−cosα，sin(−α)=−sinα，cos(π/2−α)=sinα，sin(π/2+α)=cosα，tan(π+α)=tanα。","tip":"先处理符号再处理名称，并注意把角度化到0°~360°后判断象限。","ex":[{"q":"计算sin(−1200°)·cos1290°+cos(−1020°)·sin(−1050°)的值。","idea":"利用周期性把角化到[0°,360°)，再用诱导公式求值。","ans":"sin(−1200°)=−sin120°=−√3/2，cos1290°=cos210°=−√3/2，前一项为3/4；cos(−1020°)=cos300°=1/2，sin(−1050°)=−sin330°=1/2，后一项为1/4。故原式=3/4+1/4=1。"},{"q":"已知sin(π/6−α)=1/3，求cos(π/3+α)的值。","idea":"注意到(π/3+α)+(π/6−α)=π/2，利用cos(π/2−x)=sinx。","ans":"cos(π/3+α)=cos(π/2−(π/6−α))=sin(π/6−α)=1/3。"}]},{"name":"三角函数的图象与性质","desc":"y=sinx：周期2π，奇函数，最大值1，最小值−1，递增区间[−π/2+2kπ，π/2+2kπ]。y=cosx：周期2π，偶函数，递增区间[−π+2kπ，2kπ]，递减区间[2kπ，π+2kπ]。y=tanx：周期π，奇函数，定义域{x | x≠π/2+kπ}，在(−π/2+kπ，π/2+kπ)上递增。对于y=Asin(ωx+φ)+b，振幅为|A|，周期T=2π/|ω|，相位为ωx+φ，可用五点法作图。","tip":"求单调区间时，若ω<0，应先利用诱导公式把ω化为正数，再用整体代换法。","ex":[{"q":"求函数y=3sin(2x−π/3)+1的最大值、最小值及取得最大值时x的集合。","idea":"sin(2x−π/3)∈[−1,1]，取最大值时2x−π/3=π/2+2kπ。","ans":"最大值为3+1=4，此时2x−π/3=π/2+2kπ，即x=5π/12+kπ（k∈Z），x的集合为{x | x=5π/12+kπ，k∈Z}；最小值为−3+1=−2。"},{"q":"求函数y=cos(π/3−2x)的单调递增区间。","idea":"cos为偶函数，cos(π/3−2x)=cos(2x−π/3)；令2x−π/3∈[−π+2kπ，2kπ]。","ans":"由−π+2kπ≤2x−π/3≤2kπ，得−π/3+kπ≤x≤π/6+kπ。单调递增区间为[kπ−π/3，kπ+π/6]（k∈Z）。"}]},{"name":"两角和与差及二倍角公式","desc":"两角和与差：sin(α±β)=sinαcosβ±cosαsinβ；cos(α±β)=cosαcosβ∓sinαsinβ；tan(α±β)=(tanα±tanβ)/(1∓tanα·tanβ)。二倍角：sin2α=2sinαcosα，cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α，tan2α=2tanα/(1−tan²α)。降幂公式：cos²α=(1+cos2α)/2，sin²α=(1−cos2α)/2。","tip":"cos(α+β)展开时中间符号要变号；使用tan公式前应检验tanα、tanβ等是否存在。","ex":[{"q":"求sin15°的值。","idea":"15°=45°−30°，用差角正弦公式。","ans":"sin15°=sin45°cos30°−cos45°sin30°=(√2/2)(√3/2)−(√2/2)(1/2)=(√6−√2)/4。"},{"q":"已知sinα=3/5，且α是第二象限角，求sin2α与cos2α。","idea":"先由象限求cosα，再套用二倍角公式。","ans":"cosα=−4/5，sin2α=2·(3/5)·(−4/5)=−24/25，cos2α=cos²α−sin²α=16/25−9/25=7/25。"}]},{"name":"辅助角公式与三角函数的综合应用","desc":"形如asinx+bcosx的式子可化为一个角的正弦：asinx+bcosx=√(a²+b²)·sin(x+φ)，其中cosφ=a/√(a²+b²)，sinφ=b/√(a²+b²)。化简后可利用正弦函数的图象与性质求值域、最值和单调区间。","tip":"确定φ时要看点(a,b)所在象限，避免φ取错。","ex":[{"q":"求f(x)=sinx+√3cosx的最大值，并求取得最大值时x的值。","idea":"提取系数2得f(x)=2sin(x+π/3)。","ans":"f(x)=2sin(x+π/3)，最大值为2，此时x+π/3=π/2+2kπ，即x=π/6+2kπ（k∈Z）。"},{"q":"求函数f(x)=2sin(2x+π/6)在[0,π/2]上的值域。","idea":"由x∈[0,π/2]得2x+π/6∈[π/6,7π/6]，再结合正弦图象求范围。","ans":"当2x+π/6∈[π/6,7π/6]时，sin的取值范围为[−1/2,1]，故f(x)的值域为[−1,2]。"}]}]},{"title":"第七章 复数","items":[{"name":"复数的概念","desc":"形如a+bi（a、b∈R）的数称为复数，其中i²=−1，a为实部，b为虚部。b=0时为实数；b≠0时为虚数；a=0且b≠0时为纯虚数。两复数相等的充要条件是实部与虚部分别相等。共轭复数：z=a+bi的共轭为z̄=a−bi。复数的模|z|=√(a²+b²)。","tip":"判断复数类型前应先把复数化为代数形式a+bi，再分别检验实部与虚部的条件。","ex":[{"q":"实数m取何值时，复数z=(m²−3m+2)+(m²−1)i是纯虚数？","idea":"纯虚数要求实部为0且虚部不为0。","ans":"由m²−3m+2=0得m=1或m=2；由m²−1≠0得m≠±1。故m=2。"},{"q":"求复数z=3+4i的模|z|及共轭复数z̄。","idea":"直接套用模长公式与共轭定义。","ans":"|z|=√(9+16)=5，z̄=3−4i。"}]},{"name":"复数的四则运算","desc":"设z1=a+bi，z2=c+di，则z1±z2=(a±c)+(b±d)i；z1·z2=(ac−bd)+(ad+bc)i；除法通过分子分母同乘分母的共轭复数化为实数分母。i的幂具有周期性：i⁴ⁿ=1，i⁴ⁿ⁺¹=i，i⁴ⁿ⁺²=−1，i⁴ⁿ⁺³=−i。","tip":"运算中始终记住i²=−1，计算时不要漏掉负号。","ex":[{"q":"计算(1+2i)(3−i)/(1−i)。","idea":"先计算分子(1+2i)(3−i)，再除以1−i，即乘以它的共轭并除以2。","ans":"(1+2i)(3−i)=3−i+6i−2i²=5+5i；(5+5i)/(1−i)=(5+5i)(1+i)/2=(5+10i−5)/2=5i。"},{"q":"计算i+i²+i³+…+i²⁰²⁴的值。","idea":"每连续4个相邻幂之和为i+i²+i³+i⁴=0，共2024项恰好为506组。","ans":"原式可按每4项一组分组，每组和为0，共506组，故结果为0。"}]},{"name":"复数的几何意义","desc":"复数z=a+bi与复平面内的点(a,b)一一对应，也与向量OZ对应。|z|表示点Z到原点的距离；|z1−z2|表示点Z1与Z2之间的距离。|z−z0|=r表示以z0对应的点为圆心、r为半径的圆。","tip":"涉及模的几何问题，可以先把复数条件转化为平面上点与点距离的条件。","ex":[{"q":"若复数z满足|z−1|=|z+i|，求z对应点的轨迹方程。","idea":"设z=x+yi，两边平方化简，结果是一条直线。","ans":"(x−1)²+y²=x²+(y+1)²，化简得−2x=2y，即y=−x，轨迹为直线x+y=0。"},{"q":"若复数z满足|z|=1，求|z−(1+i)|的最大值。","idea":"点z在单位圆上，|z−(1+i)|表示圆上的点到点(1,1)的距离，最大值为圆心距加半径。","ans":"点(1,1)到原点的距离为√2，故最大值为√2+1。"}]}]},{"title":"第八章 平面向量与解三角形","items":[{"name":"平面向量的线性运算","desc":"既有大小又有方向的量称为向量。加法遵循三角形法则与平行四边形法则；减法a−b=a+(−b)。数乘λa的模为|λ||a|，λ>0时与a同向，λ<0时与a反向。共线定理：若b≠0，则a∥b的充要条件是存在唯一实数λ，使a=λb。若M为AB的中点，则OM=(OA+OB)/2。","tip":"向量只由大小和方向决定，与起点无关；零向量与任意向量平行。","ex":[{"q":"在△ABC中，点D在边BC上且BD=2DC，用AB、AC表示AD。","idea":"AD=AB+BD，且BD=(2/3)BC=(2/3)(AC−AB)。","ans":"AD=AB+(2/3)(AC−AB)=(1/3)AB+(2/3)AC。"},{"q":"设e1、e2不共线，已知AB=e1+2e2，BC=2e1+ke2，若A、B、C三点共线，求k的值。","idea":"三点共线等价于AB与BC共线，即BC=λAB。","ans":"由三点共线得BC=2AB=2e1+4e2，比较系数得k=4。"}]},{"name":"平面向量基本定理与坐标运算","desc":"若e1、e2是同一平面内的两个不共线向量，则该平面内任一向量a可唯一表示为a=λ1e1+λ2e2。在直角坐标系中，a=(x,y)表示a=xi+yj。坐标运算：a±b=(x1±x2,y1±y2)，λa=(λx,λy)。若A(x1,y1)、B(x2,y2)，则AB=(x2−x1,y2−y1)，|AB|=√((x2−x1)²+(y2−y1)²)。向量平行的坐标条件：x1y2−x2y1=0。","tip":"向量的坐标等于终点坐标减去起点坐标，不能直接把两点坐标相加减。","ex":[{"q":"已知A(−1,2)，B(3,−2)，求向量AB的坐标及|AB|。","idea":"AB=B−A，再求模长。","ans":"AB=(3−(−1),−2−2)=(4,−4)，|AB|=√(16+16)=4√2。"},{"q":"已知a=(1,2)，b=(x,−4)，若a∥b，求x的值。","idea":"利用坐标平行条件x1y2−x2y1=0。","ans":"1×(−4)−2×x=0，得x=−2。验证：b=(−2,−4)=−2a，确实平行。"}]},{"name":"平面向量的数量积","desc":"a·b=|a||b|cosθ（θ∈[0,π]为a与b的夹角）。若a=(x1,y1)，b=(x2,y2)，则a·b=x1x2+y1y2，cosθ=a·b/(|a||b|)。a⊥b⇔a·b=0；|a|²=a·a。数量积满足交换律与分配律，但(a·b)c≠a(b·c)。a在b方向上的投影为|a|cosθ。","tip":"数量积的结果是实数而不是向量；a·b=0时不能推出a=0或b=0。","ex":[{"q":"已知|a|=3，|b|=2，a与b的夹角为60°，求|a+b|及(a−b)·(a+2b)。","idea":"先求a·b=3·2·cos60°=3，再展开计算。","ans":"|a+b|²=9+2·3+4=19，故|a+b|=√19；(a−b)·(a+2b)=|a|²+a·b−2|b|²=9+3−8=4。"},{"q":"已知a=(1,2)，b=(−2,k)，若a与b的夹角为锐角，求k的取值范围。","idea":"夹角为锐角等价于a·b>0且a与b不同向共线；a∥b时k=−4，此时a·b<0，不影响结论。","ans":"a·b=−2+2k>0，得k>1。当k=−4时a·b<0，已被排除，故k∈(1,+∞)。"}]},{"name":"正弦定理与余弦定理","desc":"正弦定理：a/sinA=b/sinB=c/sinC=2R（R为外接圆半径）。余弦定理：a²=b²+c²−2bc·cosA，推论cosA=(b²+c²−a²)/(2bc)。三角形面积公式：S=½ab·sinC=½bc·sinA=½ac·sinB。已知两角和一边或两边及其夹角用正弦定理；已知三边或两边及其夹角用余弦定理。","tip":"已知两边及其中一边的对角时，可能有两解、一解或无解，需结合“大边对大角”及三角形内角和检验。","ex":[{"q":"在△ABC中，A=60°，b=4，c=6，求a及△ABC的面积S。","idea":"由余弦定理求a，由S=½bc·sinA求面积。","ans":"a²=16+36−2·4·6·½=28，a=2√7；S=½·4·6·(√3/2)=6√3。"},{"q":"在△ABC中，a=2，b=2√3，A=30°，求角B的所有可能值。","idea":"由正弦定理sinB=b·sinA/a=√3/2，B可能为锐角或钝角，需检验A+B<180°。","ans":"sinB=2√3·(1/2)/2=√3/2，故B=60°或B=120°，两者与A=30°之和均小于180°，均成立。"}]},{"name":"平面向量的应用","desc":"利用向量可以证明几何中的平行、垂直与长度关系，也可以求夹角与距离。物理中，力F作用于物体产生位移s时做功W=F·s。证明线段关系时，常选取基底向量并用向量运算表达几何条件。","tip":"用向量证明几何问题时，应先把几何条件转化为向量的线性关系或数量积关系。","ex":[{"q":"用向量方法证明：平行四边形两条对角线的平方和等于四条边的平方和。","idea":"设AB=a，AD=b，则AC=a+b，BD=b−a，分别计算两对角线平方和与四边平方和。","ans":"|AC|²+|BD|²=|a+b|²+|b−a|²=2|a|²+2|b|²，而四边平方和为|AB|²+|BC|²+|CD|²+|DA|²=2|a|²+2|b|²，二者相等。"},{"q":"一个质点受恒力F=(2,3)作用，从A(1,1)移动到B(4,5)，求力F所做的功。","idea":"位移s=AB=(3,4)，做功W=F·s。","ans":"W=2×3+3×4=18。"}]}]},{"title":"第九章 立体几何初步","items":[{"name":"空间几何体的表面积与体积","desc":"柱体体积V=Sh；锥体体积V=Sh/3；台体体积V=(S上+S下+√(S上·S下))h/3。圆柱侧面积2πrh，表面积2πr(r+h)；圆锥侧面积πrl（l为母线长），表面积πr(r+l)；圆台侧面积π(r1+r2)l；球的表面积4πR²，体积4πR³/3。","tip":"圆锥的侧面积公式中使用的是母线长l，不是高h，两者要用勾股定理联系。","ex":[{"q":"已知圆锥的底面半径为3，高为4，求它的侧面积与体积。","idea":"先由勾股定理求母线l=5，再套用侧面积与体积公式。","ans":"l=√(3²+4²)=5，侧面积πrl=15π，体积V=(1/3)π·9·4=12π。"},{"q":"一个球的表面积为36π，求它的体积。","idea":"由4πR²=36π求半径R，再求体积。","ans":"R=3，V=4π·27/3=36π。"}]},{"name":"平面的基本性质与平行关系","desc":"公理1：若直线上两点在平面内，则该直线在平面内；公理2：不共线的三点确定唯一一个平面；公理3：两个不重合的平面有公共点时，它们相交于过该点的一条直线。线面平行判定：若平面外的一条直线与平面内的一条直线平行，则该直线与此平面平行。面面平行判定：若一个平面内的两条相交直线分别平行于另一个平面，则两平面平行。性质：若直线a∥α，a⊂β，α∩β=b，则a∥b。","tip":"使用线面平行的判定定理时，必须强调“直线在平面外”这一条件。","ex":[{"q":"在三棱锥P−ABC中，D、E分别是PA、PB的中点，证明DE∥平面ABC。","idea":"在△PAB中，DE是中位线，故DE∥AB，再由线面平行判定定理证明。","ans":"由中位线定理得DE∥AB；AB⊂平面ABC，DE⊄平面ABC，故DE∥平面ABC。"},{"q":"已知a∥α，a⊂β，α∩β=b，证明a∥b。","idea":"a与b都在平面β内，只需证明它们无公共点。","ans":"因a∥α，a与α无公共点，而b⊂α，故a与b无公共点；又a、b都在β内，因此a∥b。"}]},{"name":"直线与平面垂直","desc":"线面垂直判定：若直线与平面内两条相交直线都垂直，则该直线垂直于此平面。线面垂直性质：垂直于同一平面的两条直线平行。面面垂直判定：若一个平面经过另一个平面的一条垂线，则两平面垂直。面面垂直性质：若两平面垂直，则在一个平面内垂直于交线的直线垂直于另一个平面。","tip":"判定线面垂直时必须是两条相交直线都垂直，只说“两条直线垂直”是不够的。","ex":[{"q":"在正方体ABCD−A1B1C1D1中，证明BD⊥平面AA1C1C。","idea":"证明BD垂直于平面内相交的两条直线AC与AA1。","ans":"正方形的对角线互相垂直，故BD⊥AC；又AA1⊥底面ABCD，BD⊂底面，故BD⊥AA1。因AC与AA1相交，所以BD⊥平面AA1C1C。"},{"q":"四棱锥P−ABCD中，PA⊥平面ABCD，底面ABCD是矩形，证明平面PAB⊥平面PAD。","idea":"证明AB⊥平面PAD，再由面面垂直判定定理得结论。","ans":"PA⊥平面ABCD，故PA⊥AB；矩形中AB⊥AD。PA与AD相交于A，所以AB⊥平面PAD。又AB⊂平面PAB，故平面PAB⊥平面PAD。"}]}]},{"title":"第十章 统计","items":[{"name":"随机抽样","desc":"简单随机抽样：每个个体被抽到的机会相等，常用抽签法和随机数表法。分层抽样：将总体按特征分为若干层，各层按同一比例抽取，第i层抽取人数n_i=N_i·n/N。系统抽样：将总体编号后按固定间隔k=N/n分段，每段抽取一个个体，各段抽取号码成等差数列。","tip":"分层抽样中各层的抽样比例相同，都等于样本容量与总体容量之比。","ex":[{"q":"某校高一、高二、高三学生分别有600、500、400人，用分层抽样抽取30人，求各年级抽取的人数。","idea":"抽样比为30/1500=1/50，各年级人数乘以抽样比。","ans":"高一抽取600/50=12人，高二抽取500/50=10人，高三抽取400/50=8人。合计30人。"},{"q":"从编号为1到1000的学生中用系统抽样抽取50人，若第1组抽到的号码为15，求第3组抽到的号码。","idea":"分段间隔k=1000/50=20，各组号码依次增加20。","ans":"第1组15，第2组35，第3组15+2×20=55。"}]},{"name":"频率分布直方图与统计图表","desc":"频率=频数/样本容量。频率分布直方图中，纵轴为频率/组距，每个小长方形的面积等于该组的频率，所有小长方形面积之和为1。常用统计图表还有条形图（比较各类别数量）、折线图（反映变化趋势）、扇形图（反映部分与整体的比例）。","tip":"直方图的纵坐标是频率/组距，不是频率，计算频率时要用面积或“纵坐标×组距”。","ex":[{"q":"样本容量为100，某组[60,70)在频率分布直方图中的纵坐标为0.03，组距为10，求该组的频率和频数。","idea":"频率=纵坐标×组距，频数=频率×样本容量。","ans":"频率=0.03×10=0.3，频数=0.3×100=30。"},{"q":"某组数据的前四组频率依次为0.1、0.15、0.35、0.25，若样本容量为80，求第五组的频率和频数。","idea":"所有组的频率之和为1，第五组频率=1−前四组频率之和。","ans":"前四组频率之和为0.85，故第五组频率为0.15，频数为0.15×80=12。"}]},{"name":"样本的数字特征","desc":"众数是出现次数最多的数据；中位数是将数据排序后位于中间的数（偶数个时取中间两数的平均）；平均数x̄=(x1+x2+…+xn)/n；方差s²=[(x1−x̄)²+…+(xn−x̄)²]/n，标准差为s=√s²。若数据在不同组中的平均数分别为x̄1、x̄2，样本量分别为n1、n2，则总平均数为(n1x̄1+n2x̄2)/(n1+n2)。方差越大，数据越分散。","tip":"计算方差时要用样本平均数x̄，并注意分母是数据个数n。","ex":[{"q":"求数据2，3，3，5，7，8的众数、中位数、平均数和方差。","idea":"众数看出现次数，中位数取中间两数平均，平均数与方差按定义计算。","ans":"众数为3；中位数为(3+5)/2=4；平均数为28/6=14/3；方差为[(2−14/3)²+2(3−14/3)²+(5−14/3)²+(7−14/3)²+(8−14/3)²]/6=(264/9)/6=44/9。"},{"q":"甲组20人的平均分为80，乙组30人的平均分为70，求两组全体的平均分。","idea":"用加权平均公式，权数为各组人数。","ans":"全体平均分=(20×80+30×70)/50=(1600+2100)/50=74。"}]}]},{"title":"第十一章 概率","items":[{"name":"古典概型","desc":"若随机试验的基本事件有限且等可能，则事件A的概率P(A)=m/n，其中n为基本事件总数，m为事件A包含的基本事件个数。计算时常用排列组合计数，例如从n个元素中任取k个的不同取法数为C(n,k)。","tip":"使用古典概型前必须确认基本事件是等可能的；有序与无序计数要保持一致。","ex":[{"q":"同时掷两颗质地均匀的骰子，求点数之和为7的概率。","idea":"基本事件共36个，点数和为7的有(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)共6个。","ans":"P=6/36=1/6。"},{"q":"袋中有3个红球和2个白球，从中不放回地任取2个，求两个都是红球的概率。","idea":"总取法C(5,2)=10，两红取法C(3,2)=3。","ans":"P=3/10。"},{"q":"3男2女站成一排，求两名女生相邻的概率。","idea":"把两名女生捆绑为一个整体，与3名男生排列；捆绑内部有2!种排法。","ans":"相邻排法数为4!×2!=48，总排法数为5!=120，故P=48/120=2/5。"}]},{"name":"事件的关系与概率的基本性质","desc":"A∪B表示A或B发生，A∩B（或AB）表示A与B同时发生。互斥事件：A∩B为不可能事件，此时P(A∪B)=P(A)+P(B)。对立事件：A与其补事件Ā满足P(A)+P(Ā)=1。一般地，P(A∪B)=P(A)+P(B)−P(A∩B)。","tip":"对立事件一定互斥，互斥事件不一定对立；求“至少一个”类概率时，常用对立事件P=1−P(都不发生)。","ex":[{"q":"已知P(A)=0.3，P(B)=0.5，且A与B互斥，求P(A∪B)及P(Ā)。","idea":"互斥时概率直接相加；P(Ā)=1−P(A)。","ans":"P(A∪B)=0.3+0.5=0.8，P(Ā)=1−0.3=0.7。"},{"q":"已知P(A)=0.5，P(B)=0.4，P(A∪B)=0.7，求P(A∩B)及P(Ā∩B̄)。","idea":"由加法公式求P(A∩B)，再由德摩根律P(Ā∩B̄)=1−P(A∪B)。","ans":"P(A∩B)=0.5+0.4−0.7=0.2；P(Ā∩B̄)=1−0.7=0.3。"}]},{"name":"相互独立事件与独立重复试验","desc":"若事件A与B相互独立，则P(AB)=P(A)P(B)，且A与B̄、Ā与B̄等也相互独立。独立重复试验中，n次试验中事件恰好发生k次的概率为P=C(n,k)p^k(1−p)^(n−k)。","tip":"互斥与独立是不同概念：若P(A)>0，P(B)>0，则互斥事件一定不独立。","ex":[{"q":"甲、乙两人独立射击，命中率分别为0.8和0.6，求两人中至少一人命中的概率。","idea":"求都不命中的概率，再用对立事件公式。","ans":"都不命中概率为0.2×0.4=0.08，故至少一人命中的概率为1−0.08=0.92。"},{"q":"A、B相互独立，P(A)=0.3，P(B)=0.6，求P(A∪B)。","idea":"利用P(A∪B)=P(A)+P(B)−P(A)P(B)。","ans":"P(A∪B)=0.3+0.6−0.18=0.72。"},{"q":"某射手每次命中率为0.6，独立射击3次，求恰好命中2次的概率。","idea":"这是独立重复试验，n=3，k=2，p=0.6。","ans":"P=C(3,2)×0.6²×0.4=3×0.36×0.4=0.432。"}]}]},{"title":"第十二章 空间向量与立体几何","items":[{"name":"空间向量及其运算","desc":"空间向量满足加法、数乘与平面向量类似。数量积a·b=|a||b|cos⟨a,b⟩。若a=(x1,y1,z1)，b=(x2,y2,z2)，则a·b=x1x2+y1y2+z1z2，|a|=√(x1²+y1²+z1²)。a⊥b⇔a·b=0。","tip":"空间向量的数量积与平面向量完全一致，夹角范围为[0,π]。","ex":[{"q":"已知|a|=2，|b|=3，⟨a,b⟩=60°，求|a+b|。","idea":"先求|a+b|²=|a|²+2a·b+|b|²。","ans":"a·b=2×3×cos60°=3，|a+b|²=4+6+9=19，故|a+b|=√19。"},{"q":"已知a=(1,0,2)，b=(0,1,−1)，求a·b及cos⟨a,b⟩。","idea":"坐标点乘后除以两模长之积。","ans":"a·b=0+0−2=−2，|a|=√5，|b|=√2，cos⟨a,b⟩=−2/√10=−√10/5。"},{"q":"已知a=(2,1,−1)，b=(1,x,3)，且a⊥b，求x的值。","idea":"由a·b=0列方程。","ans":"2+x−3=0，得x=1。"}]},{"name":"用空间向量证明平行与垂直","desc":"设直线l的方向向量为u，平面α的法向量为n。则l∥α（或l⊂α）⇔u·n=0；l⊥α⇔u∥n；两平面α⊥β⇔n_α·n_β=0；α∥β⇔n_α∥n_β。两直线平行、垂直分别等价于方向向量共线与数量积为零。","tip":"用u·n=0判断线面平行时，还需排除直线在平面内的情形。","ex":[{"q":"直线l的方向向量u=(1,−1,2)，平面α的法向量n=(2,−2,4)，判断l与α的位置关系。","idea":"判断u与n是否共线。","ans":"n=2u，二者共线，所以l⊥α。"},{"q":"直线l的方向向量u=(1,2,0)，平面α的法向量n=(2,−1,3)，判断l与α的位置关系。","idea":"计算u·n，若为0则l∥α或l⊂α。","ans":"u·n=2−2+0=0，所以l∥α或l⊂α。"}]},{"name":"空间角的计算","desc":"异面直线所成角θ满足cosθ=|u·v|/(|u||v|)，θ∈(0,π/2]。直线与平面所成角θ满足sinθ=|u·n|/(|u||n|)。二面角可由两平面法向量求得，cos⟨n1,n2⟩=n1·n2/(|n1||n2|)，再结合图形判断二面角为锐角或钝角。","tip":"求异面直线夹角时取绝对值，结果在(0,π/2]之内；二面角需根据图形判断是锐角还是钝角。","ex":[{"q":"正方体ABCD−A1B1C1D1中，A(0,0,0)，B(1,0,0)，C(1,1,0)，D(0,1,0)，A1(0,0,1)，C1(1,1,1)，求异面直线AC1与BD所成角。","idea":"AC1=(1,1,1)，BD=(−1,1,0)，求两向量数量积。","ans":"AC1·BD=−1+1+0=0，故所成角为90°。"},{"q":"同上正方体，求直线AC1与底面ABCD所成角的正弦值。","idea":"底面ABCD的法向量为(0,0,1)，AC1=(1,1,1)。","ans":"sinθ=|1|/(√3×1)=√3/3。"}]},{"name":"点到平面的距离","desc":"设A为平面α内的任一点，平面α的法向量为n，则点P到平面α的距离d=|PA·n|/|n|。它利用了法向量与平面垂直的性质，是求空间距离的常用方法。","tip":"代入公式时A可取平面内坐标简单的点；法向量可由两条相交直线的方向向量求得。","ex":[{"q":"求点P(1,2,3)到平面x+2y+2z=0的距离。","idea":"直接套用点到平面距离公式d=|Ax0+By0+Cz0+D|/√(A²+B²+C²)。","ans":"d=|1+4+6|/√(1+4+4)=11/3。"},{"q":"在棱长为1的正方体中（坐标同上），求点A1到平面ABC1的距离。","idea":"平面ABC1经过A(0,0,0)、B(1,0,0)、C1(1,1,1)，法向量n=(0,1,−1)，再计算A1A与n的数量积。","ans":"A1−A=(0,0,1)，d=|(0,0,1)·(0,1,−1)|/√2=1/√2=√2/2。"}]}]},{"title":"第十三章 直线与圆","items":[{"name":"直线的方程","desc":"斜率k=(y2−y1)/(x2−x1)=tanα（α为倾斜角，α∈[0,π)）。常见直线方程：点斜式y−y0=k(x−x0)；斜截式y=kx+b；两点式(y−y1)/(y2−y1)=(x−x1)/(x2−x1)；截距式x/a+y/b=1；一般式Ax+By+C=0（A、B不同时为0）。两直线平行⇔k1=k2且截距不等；垂直⇔k1·k2=−1（斜率都存在时）。","tip":"用点斜式时要注意斜率不存在的竖直线x=x0，它不能写成点斜式。","ex":[{"q":"求过点(1,2)与(3,8)的直线方程。","idea":"先求斜率k=(8−2)/(3−1)=3，再用点斜式。","ans":"y−2=3(x−1)，即3x−y−1=0。"},{"q":"求在x轴、y轴上截距分别为2与−4的直线方程。","idea":"直接用截距式x/2+y/(−4)=1，并化为一般式。","ans":"x/2−y/4=1，即2x−y−4=0。验证：(2,0)与(0,−4)均满足。"},{"q":"求过点(2,3)且与直线2x−y+1=0垂直的直线方程。","idea":"已知直线斜率为2，所求直线斜率为−1/2。","ans":"y−3=−½(x−2)，即x+2y−8=0。"}]},{"name":"两直线的位置关系与距离公式","desc":"对于直线l1: A1x+B1y+C1=0与l2: A2x+B2y+C2=0，平行⇔A1B2−A2B1=0且A1C2≠A2C1；垂直⇔A1A2+B1B2=0。点P(x0,y0)到直线Ax+By+C=0的距离d=|Ax0+By0+C|/√(A²+B²)。平行直线Ax+By+C1=0与Ax+By+C2=0之间的距离为|C1−C2|/√(A²+B²)。","tip":"判断两直线平行时，要排除两直线重合的情形，常见于含参数题目。","ex":[{"q":"求点(2,1)到直线3x+4y−7=0的距离。","idea":"代入点到直线距离公式。","ans":"d=|6+4−7|/5=3/5。"},{"q":"求平行直线x+y−1=0与x+y+3=0之间的距离。","idea":"利用平行线距离公式，C1=−1，C2=3。","ans":"d=|−1−3|/√2=4/√2=2√2。"},{"q":"已知直线l1: ax+2y+6=0与l2: x+(a−1)y+a²−1=0平行，求a的值。","idea":"由A1B2−A2B1=0得a(a−1)−2=0；再检验两直线是否重合。","ans":"a²−a−2=0，得a=2或a=−1。当a=2时l2为x+y+3=0，与l1: x+y+3=0重合，舍去；a=−1时两直线平行且不重合，故a=−1。"}]},{"name":"圆的方程","desc":"圆的标准方程为(x−a)²+(y−b)²=r²，圆心(a,b)，半径r。圆的一般方程为x²+y²+Dx+Ey+F=0（D²+E²−4F>0），圆心(−D/2,−E/2)，半径√(D²+E²−4F)/2。确定圆的方程常用待定系数法或几何法（圆心在弦的垂直平分线上）。","tip":"由一般方程化标准方程时，要通过配方求圆心与半径，半径需取正值。","ex":[{"q":"求以(0,0)与(4,6)为直径端点的圆的方程。","idea":"圆心为中点(2,3)，半径为两点距离的一半。","ans":"半径r=√(16+36)/2=√13，方程为(x−2)²+(y−3)²=13。"},{"q":"将方程x²+y²−4x+6y−3=0化为标准方程，并求圆心与半径。","idea":"配方：(x²−4x)+(y²+6y)=3。","ans":"(x−2)²+(y+3)²=16，圆心(2,−3)，半径r=4。"},{"q":"求△ABC外接圆的方程，其中A(0,0)，B(4,0)，C(0,2)。","idea":"AB的垂直平分线为x=2，AC的垂直平分线为y=1，交点即圆心。","ans":"圆心(2,1)，r²=2²+1²=5，方程为(x−2)²+(y−1)²=5。验证C：(0−2)²+(2−1)²=5。"}]},{"name":"直线与圆的位置关系","desc":"设圆心到直线的距离为d，半径为r。d>r时相离；d=r时相切；d<r时相交。相交时弦长为2√(r²−d²)。过圆上一点(x0,y0)的切线方程，对圆x²+y²=r²为x0x+y0y=r²。","tip":"求过圆外一点的切线时，要分斜率存在与不存在两种情况讨论，避免漏解。","ex":[{"q":"判断直线x+2y−5=0与圆x²+y²=5的位置关系。","idea":"计算圆心(0,0)到直线的距离d并与半径√5比较。","ans":"d=|−5|/√5=√5=r，故直线与圆相切。"},{"q":"求直线y=x被圆(x−1)²+(y−2)²=4截得的弦长。","idea":"先求圆心到直线的距离d，再用弦长公式2√(r²−d²)。","ans":"圆心(1,2)到x−y=0的距离d=|1−2|/√2=√2/2，弦长=2√(4−½)=2√(7/2)=√14。"},{"q":"求圆x²+y²=25上点(3,4)处的切线方程。","idea":"用切线公式x0x+y0y=r²。","ans":"3x+4y=25，即3x+4y−25=0。"}]},{"name":"圆与圆的位置关系","desc":"设两圆圆心距为d，半径分别为R、r（R≥r）。d>R+r时外离；d=R+r时外切；R−r<d<R+r时相交；d=R−r时内切；d<R−r时内含。相交时两圆公共弦所在直线可由两圆方程相减得到。","tip":"判断圆与圆的位置关系要先比较圆心距与半径和、差，不要直接用方程联立。","ex":[{"q":"判断圆x²+y²=1与圆(x−3)²+(y−4)²=16的位置关系。","idea":"计算圆心距d=√(9+16)=5，并比较与r+R的大小。","ans":"圆心距d=5，r+R=1+4=5，故两圆外切。"},{"q":"判断圆x²+y²=4与圆(x−3)²+y²=4的位置关系，并求公共弦所在直线方程。","idea":"圆心距d=3，满足0<3<4，两圆相交；将两圆方程相减得公共弦方程。","ans":"两圆相交。相减得x²+y²−4−[(x−3)²+y²−4]=0，化简得6x−9=0，即x=3/2。"}]}]},{"title":"第十四章 圆锥曲线","items":[{"name":"椭圆","desc":"平面内到两定点F1、F2的距离之和为定值2a（2a>|F1F2|=2c）的点的轨迹是椭圆。标准方程：焦点在x轴时x²/a²+y²/b²=1，焦点在y轴时y²/a²+x²/b²=1（a>b>0）。其中c²=a²−b²，离心率e=c/a∈(0,1)。","tip":"椭圆标准方程中a最大，且a²=b²+c²；判断焦点位置要看分母较大者所在的坐标轴。","ex":[{"q":"求椭圆x²/25+y²/16=1的焦点坐标与离心率。","idea":"a²=25，b²=16，c²=a²−b²=9。","ans":"c=3，焦点为(±3,0)，离心率e=3/5。"},{"q":"求焦点为(0,±√3)，长轴长为4的椭圆标准方程。","idea":"焦点在y轴上，a=2，c=√3，b²=a²−c²=1。","ans":"y²/4+x²=1。"},{"q":"椭圆x²/9+y²/5=1的左、右焦点为F1、F2，P为椭圆上一点且|PF1|=4，求|PF2|。","idea":"由椭圆定义|PF1|+|PF2|=2a=6。","ans":"|PF2|=6−4=2。"}]},{"name":"双曲线","desc":"平面内到两定点F1、F2的距离之差的绝对值为定值2a（0<2a<|F1F2|=2c）的点的轨迹是双曲线。标准方程：焦点在x轴时x²/a²−y²/b²=1，焦点在y轴时y²/a²−x²/b²=1。其中c²=a²+b²，离心率e=c/a>1，渐近线方程为y=±(b/a)x（焦点在x轴时）。","tip":"双曲线中c最大，即c²=a²+b²，与椭圆的关系式不同；求点到焦点距离时注意分清是左支还是右支。","ex":[{"q":"求双曲线x²/4−y²/5=1的离心率与渐近线方程。","idea":"a²=4，b²=5，c²=9。","ans":"c=3，e=c/a=3/2，渐近线为y=±(√5/2)x。"},{"q":"求渐近线为y=±2x且经过点(2,2)的双曲线标准方程（焦点在x轴上）。","idea":"设双曲线为x²/a²−y²/b²=1，由b/a=2得b=2a，代入点(2,2)求a²。","ans":"b²=4a²，4/a²−4/(4a²)=1，即3/a²=1，a²=3，b²=12，方程为x²/3−y²/12=1。"},{"q":"双曲线x²/4−y²/5=1的左、右焦点为F1、F2，P在右支上且|PF1|=7，求|PF2|。","idea":"右支上的点满足|PF1|−|PF2|=2a=4。","ans":"|PF2|=7−4=3。"}]},{"name":"抛物线","desc":"平面内到定点F与定直线l（F不在l上）距离相等的点的轨迹是抛物线。标准方程y²=2px（p>0）焦点为(p/2,0)，准线为x=−p/2；其他形式有y²=−2px、x²=2py、x²=−2py。抛物线上的点到焦点的距离等于它到准线的距离。","tip":"抛物线的一次项系数为2p，焦点到准线距离是p，不要误把p当作焦点横坐标。","ex":[{"q":"求抛物线y²=8x的焦点坐标与准线方程。","idea":"由2p=8得p=4，焦点为(p/2,0)，准线x=−p/2。","ans":"焦点(2,0)，准线x=−2。"},{"q":"抛物线y²=4x上一点P的横坐标为3，求P到焦点的距离。","idea":"由抛物线定义，|PF|等于P到准线x=−1的距离，即x+1。","ans":"|PF|=3+1=4。"},{"q":"过抛物线y²=4x的焦点F(1,0)作斜率为1的直线，交抛物线于A、B两点，求|AB|。","idea":"直线y=x−1代入y²=4x得x²−6x+1=0，焦点弦长公式|AB|=x1+x2+p。","ans":"x1+x2=6，p=2，故|AB|=6+2=8。"}]},{"name":"直线与圆锥曲线的位置关系","desc":"将直线方程与圆锥曲线方程联立，消元后得到一元二次方程。判别式Δ>0时有两个交点，Δ=0时相切（一个交点），Δ<0时无交点。求弦长时可用|AB|=√(1+k²)·|x1−x2|。弦的中点问题常用点差法，即将两交点代入曲线方程相减。","tip":"联立后若二次项系数可能为零，要单独讨论直线与渐近线或对称轴平行的情形。","ex":[{"q":"求直线y=x+1与椭圆x²/4+y²=1的交点坐标。","idea":"代入消去y，得关于x的方程。","ans":"x²/4+(x+1)²=1，化为5x²+8x=0，解得x=0或x=−8/5，对应交点(0,1)与(−8/5,−3/5)。"},{"q":"求椭圆x²/4+y²=1中以点(1,1/2)为中点的弦所在直线方程。","idea":"点差法：设交点为(x1,y1)、(x2,y2)，相减得(x1+x2)(x1−x2)/4+(y1+y2)(y1−y2)=0，代入中点坐标求斜率。","ans":"斜率k=−(1·1)/(4·½)=−½，直线为y−½=−½(x−1)，即x+2y−2=0。验证：与椭圆的交点为(2,0)与(0,1)，中点为(1,½)。"}]}]},{"title":"第十五章 数列","items":[{"name":"数列的概念与通项公式","desc":"数列是按一定次序排列的一列数，{a_n}表示。前n项和S_n=a1+…+a_n。由S_n求通项：a1=S1，当n≥2时a_n=S_n−S_(n−1)，需检验n=1时是否满足。由递推关系求通项，可用累加法、累乘法或构造等比数列。","tip":"用a_n=S_n−S_(n−1)求通项时必须验证n=1的情形，结果不一致时通项要分段表示。","ex":[{"q":"已知数列前n项和S_n=n²+n，求通项a_n。","idea":"a1=S1=2；当n≥2时a_n=S_n−S_(n−1)=2n。","ans":"n=1时2n=2也成立，故a_n=2n。"},{"q":"已知S_n=2^n−1，求a_n。","idea":"a1=S1=1，当n≥2时a_n=2^n−2^(n−1)=2^(n−1)。","ans":"n=1时2^(n−1)=1=a1，也满足，故a_n=2^(n−1)。"},{"q":"已知a1=1，a_(n+1)=2a_n+1，求a_n。","idea":"构造a_(n+1)+1=2(a_n+1)，说明{a_n+1}是首项为2、公比为2的等比数列。","ans":"a_n+1=2^n，故a_n=2^n−1。验证：a1=1，a2=3。"}]},{"name":"等差数列","desc":"若a_(n+1)−a_n=d（常数），则{a_n}为等差数列，通项a_n=a1+(n−1)d。前n项和S_n=n(a1+a_n)/2=na1+n(n−1)d/2。若m+n=p+q，则a_m+a_n=a_p+a_q。当d≠0时，S_n是关于n的二次函数且无常数项。","tip":"等差数列中若已知项数为奇数，则S_(2k−1)=(2k−1)a_k，这是快速求和的技巧。","ex":[{"q":"等差数列首项a1=3，公差d=2，求a10与S10。","idea":"a10=a1+9d，S10=10(a1+a10)/2。","ans":"a10=21，S10=10×(3+21)/2=120。"},{"q":"等差数列中a3=7，a7=15，求a1与d。","idea":"由a7−a3=4d求d，再回代求a1。","ans":"d=2，a1=a3−2d=3。"},{"q":"等差数列{a_n}中a4+a6=10，求S9。","idea":"S9=9a5，且a4+a6=2a5。","ans":"a5=5，S9=9×5=45。"}]},{"name":"等比数列","desc":"若a_(n+1)/a_n=q（非零常数），则{a_n}为等比数列，通项a_n=a1·q^(n−1)。前n项和：q=1时S_n=na1；q≠1时S_n=a1(1−q^n)/(1−q)。若m+n=p+q，则a_m·a_n=a_p·a_q。","tip":"应用求和公式前必须判断公比q是否等于1，q=1时不能套用q≠1的公式。","ex":[{"q":"等比数列首项a1=2，公比q=3，求S4。","idea":"直接用求和公式S4=a1(1−q⁴)/(1−q)。","ans":"S4=2(1−81)/(1−3)=80。验证：2+6+18+54=80。"},{"q":"等比数列中a2=6，a5=162，求a1与q（q为实数）。","idea":"由a5/a2=q³=27，得q=3，再求a1。","ans":"q=3，a1=a2/q=2。"},{"q":"等比数列中S3=7，q=2，求a_n。","idea":"由S3=a1(1+2+4)=7求a1。","ans":"a1=1，故a_n=2^(n−1)。"}]},{"name":"数列求和的常用方法","desc":"常用方法有：公式法（等差、等比求和）；分组求和（数列由几种可求和的数列相加组成）；错位相减法（a_n=b_n·c_n，其中b_n为等差、c_n为等比）；裂项相消法（如1/(n(n+1))=1/n−1/(n+1)，1/(√n+√(n+1))=√(n+1)−√n）；倒序相加法。","tip":"错位相减后要仔细处理中间的等比数列求和，项数与符号最易出错；裂项后要检查首尾保留的项是否正确。","ex":[{"q":"求数列a_n=n·2^n的前n项和S_n。","idea":"用错位相减法：S_n乘以2后与S_n相减。","ans":"S_n=(n−1)·2^(n+1)+2。验证：n=1时S1=2，公式得2；n=2时S2=10，公式得1×8+2=10。"},{"q":"求数列b_n=1/(n(n+1))的前n项和T_n。","idea":"裂项：b_n=1/n−1/(n+1)，逐项相消。","ans":"T_n=1−1/(n+1)=n/(n+1)。"},{"q":"求和：1/(√1+√2)+1/(√2+√3)+…+1/(√n+√(n+1))。","idea":"分母有理化：1/(√k+√(k+1))=√(k+1)−√k，再逐项相消。","ans":"原式=√(n+1)−1。"}]},{"name":"数列的综合应用","desc":"数列常与函数、不等式、实际问题结合。解题时常用思路：先求出通项与前n项和，再利用单调性或不等式求最值、判断项数范围；等差与等比数列模型常用于增长率、分期还款等实际问题。","tip":"应用问题中要注意项数n为正整数，求出的范围需取整数解。","ex":[{"q":"数列{a_n}满足a1=1，a_(n+1)−a_n=n，求a_n。","idea":"用累加法：a_n=a1+Σ(k=1到n−1)k。","ans":"a_n=1+(n−1)n/2。"},{"q":"数列a_n=2^n的前n项和为S_n，求使S_n>1000的最小正整数n。","idea":"S_n=2^(n+1)−2，解不等式2^(n+1)>1002。","ans":"n=8时S8=510，n=9时S9=1022>1000，故最小n=9。"},{"q":"某人每年初存入本金1000元，年利率按复利计算为10%，求第3年末的本利和（三次存款均在年初存入，只按整年计息）。","idea":"第一次存款计息3年，第二次计息2年，第三次计息1年，构成等比数列求和。","ans":"本利和=1000(1.1³+1.1²+1.1)=1000(1.331+1.21+1.1)=3641元。"}]}]},{"title":"第十六章 一元函数的导数及其应用","items":[{"name":"导数的概念与几何意义","desc":"函数f(x)在x0处的导数f′(x0)=lim(Δx→0)[f(x0+Δx)−f(x0)]/Δx，表示瞬时变化率。几何意义：f′(x0)是曲线y=f(x)在点(x0,f(x0))处切线的斜率，切线方程为y−f(x0)=f′(x0)(x−x0)。","tip":"求切线时要区分“在点处的切线”与“过某点的切线”，后者切点未知，需设切点。","ex":[{"q":"求f(x)=x²+1在x=1处的导数。","idea":"由定义计算极限，或先求f′(x)=2x再代入。","ans":"f′(x)=2x，f′(1)=2。"},{"q":"求曲线y=x³在点(1,1)处的切线方程。","idea":"切线斜率k=f′(1)=3，再用点斜式。","ans":"y−1=3(x−1)，即y=3x−2。"},{"q":"求过点(1,0)且与曲线y=x³相切的直线方程。","idea":"设切点为(t,t³)，切线斜率为3t²，切线过(1,0)，列方程求t。","ans":"切线方程为y−t³=3t²(x−t)，代入(1,0)得−t³=3t²(1−t)，即2t³−3t²=0，t=0或t=3/2。对应切线为y=0与y=(27/4)(x−1)，即27x−4y−27=0。"}]},{"name":"导数的运算法则","desc":"常见导数：(x^n)′=nx^(n−1)，(sinx)′=cosx，(cosx)′=−sinx，(e^x)′=e^x，(lnx)′=1/x。运算法则：(u±v)′=u′±v′；(uv)′=u′v+uv′；(u/v)′=(u′v−uv′)/v²；复合函数(f(g(x)))′=f′(g(x))·g′(x)。","tip":"商的求导法则分子是u′v−uv′，符号顺序不能颠倒；复合函数求导要逐层相乘。","ex":[{"q":"求f(x)=x²e^x的导数。","idea":"用乘积法则(uv)′=u′v+uv′，u=x²，v=e^x。","ans":"f′(x)=2x·e^x+x²·e^x=(x²+2x)e^x。"},{"q":"求f(x)=lnx/x的导数。","idea":"用商法则，u=lnx，v=x。","ans":"f′(x)=((1/x)·x−lnx·1)/x²=(1−lnx)/x²。"},{"q":"求f(x)=(2x+1)³的导数。","idea":"复合函数求导：外层为立方，内层为2x+1。","ans":"f′(x)=3(2x+1)²·2=6(2x+1)²。"}]},{"name":"利用导数研究函数的单调性","desc":"设函数f(x)在区间I内可导。若f′(x)>0在I内恒成立，则f(x)在I内单调递增；若f′(x)<0，则单调递减。讨论单调性的步骤：求定义域，求导数f′(x)，求f′(x)=0的根及不可导点，用这些点划分区间，判断各区间内f′(x)的符号。","tip":"f′(x)>0只是单调递增的充分条件，若在个别点导数为零，仍可单调递增；区间端点需写在定义域内。","ex":[{"q":"求f(x)=x³−3x的单调区间。","idea":"f′(x)=3x²−3=3(x−1)(x+1)，由符号变化确定单调区间。","ans":"f′(x)>0的区间为(−∞,−1)与(1,+∞)，递增；f′(x)<0的区间为(−1,1)，递减。"},{"q":"求f(x)=xlnx的单调区间（x>0）。","idea":"f′(x)=lnx+1，令其等于0求临界点。","ans":"lnx+1=0得x=1/e。在(0,1/e)上f′(x)<0递减，在(1/e,+∞)上f′(x)>0递增。"},{"q":"已知f(x)=x³−ax在R上单调递增，求实数a的取值范围。","idea":"f′(x)=3x²−a≥0对所有x成立，需a≤0。","ans":"a的取值范围是(−∞,0]。"}]},{"name":"函数的极值与最值","desc":"若f′(x0)=0且x0两侧f′(x)符号由正变负，则x0为极大值点；由负变正为极小值点。闭区间[a,b]上的最值，需比较区间内极值点处的函数值与端点处的函数值。","tip":"导数为零的点不一定是极值点，必须检验导数是否变号。","ex":[{"q":"求f(x)=x³−3x的极值。","idea":"由f′(x)=0得x=±1，再判断符号变化。","ans":"x=−1处为极大值f(−1)=2，x=1处为极小值f(1)=−2。"},{"q":"求f(x)=x³−3x在区间[−2,3]上的最大值与最小值。","idea":"比较极值点x=−1、1与端点x=−2、3处的函数值。","ans":"f(−2)=−2，f(−1)=2，f(1)=−2，f(3)=18，故最大值为18，最小值为−2。"},{"q":"求f(x)=xe^(−x)的极大值。","idea":"f′(x)=(1−x)e^(−x)，由符号变化判断极值点。","ans":"f′(x)在x=1处由正变负，故x=1为极大值点，极大值为f(1)=1/e。"}]},{"name":"导数在恒成立与零点问题中的应用","desc":"恒成立问题常转化为求函数最值：f(x)≥0恒成立⇔f(x)的最小值≥0；f(x)≤0恒成立⇔最大值≤0。零点问题可通过研究函数的单调性与极值，判断图象与x轴交点个数，极值异号时存在零点。","tip":"分离参数后要注意函数的定义域，极限值不一定能取到，需区分“最值”与“确界”。","ex":[{"q":"已知f(x)=x³−3x+a，讨论f(x)零点的个数。","idea":"极大值为f(−1)=2+a，极小值为f(1)=a−2，由极值的符号判断零点个数。","ans":"当|a|>2时有1个零点；当|a|=2时有2个零点；当|a|<2时有3个零点。"},{"q":"若x>0时，x−lnx−a≥0恒成立，求实数a的取值范围。","idea":"令f(x)=x−lnx−a，求f(x)的最小值。","ans":"f′(x)=1−1/x，x=1处取最小值f(1)=1−a，需1−a≥0，得a≤1。"}]}]},{"title":"第十七章 计数原理","items":[{"name":"分类加法计数原理与分步乘法计数原理","desc":"分类加法计数原理：完成一件事有n类办法，各类办法中的方法数分别为m1、…、mn且相互独立，则共有m1+…+mn种不同方法。分步乘法计数原理：完成一件事需要分n个步骤，各步骤的方法数为m1、…、mn，则共有m1×…×mn种不同方法。","tip":"分类用加法、分步用乘法；分类时各类之间要互不重复、互不遗漏。","ex":[{"q":"从甲地到乙地，可乘3班火车或4班汽车，求共有多少种不同的走法。","idea":"乘火车与乘汽车是两类互不相交的办法，用加法。","ans":"3+4=7种。"},{"q":"某人有3件不同的上衣和4条不同的长裤，求搭配的方法数。","idea":"上衣与长裤各选一件，分两步完成，用乘法。","ans":"3×4=12种。"},{"q":"用0到9这10个数字组成没有重复数字的三位数，共有多少个。","idea":"百位不能为0，有9种选择；十位从剩余9个数字中选；个位从剩余8个数字中选。","ans":"9×9×8=648个。"}]},{"name":"排列与组合","desc":"排列数A(n,m)=n(n−1)…(n−m+1)=n!/(n−m)!，表示从n个不同元素中取出m个按顺序排列的方法数。组合数C(n,m)=A(n,m)/m!=n!/(m!(n−m)!)，表示不考虑顺序的取法数，满足C(n,m)=C(n,n−m)，C(n,m)=C(n−1,m−1)+C(n−1,m)。","tip":"选取问题与顺序无关用组合，排队问题与顺序有关用排列；“至少”“至多”类问题常用间接法。","ex":[{"q":"计算A(5,2)与C(5,2)。","idea":"A(5,2)=5×4，C(5,2)=A(5,2)/2!。","ans":"A(5,2)=20，C(5,2)=10。"},{"q":"从5名男生和4名女生中选出3人参加活动，要求至少有一名女生，共有多少种选法。","idea":"用间接法：总数C(9,3)减去全是男生的选法C(5,3)。","ans":"C(9,3)−C(5,3)=84−10=74种。"},{"q":"4名男生和3名女生站成一排，要求女生两两不相邻，共有多少种排法。","idea":"先排4名男生，产生5个空位，再从5个空位中选3个安排女生。","ans":"4!×A(5,3)=24×60=1440种。"}]},{"name":"二项式定理","desc":"(a+b)^n=C(n,0)a^n+C(n,1)a^(n−1)b+…+C(n,k)a^(n−k)b^k+…+C(n,n)b^n。其中第k+1项T_(k+1)=C(n,k)a^(n−k)b^k，二项式系数为C(n,k)。令a=b=1可得所有二项式系数之和为2^n。","tip":"求某项系数时要区分二项式系数与项的系数；展开式中的符号由b的幂次决定，易漏负号。","ex":[{"q":"求(x+1)⁵展开式中x²的系数。","idea":"通项T_(k+1)=C(5,k)x^(5−k)，令5−k=2，得k=3。","ans":"x²的系数为C(5,3)=10。"},{"q":"求(2x−1)⁴展开式的常数项。","idea":"通项为C(4,k)(2x)^(4−k)(−1)^k，令x的指数为0，即k=4。","ans":"常数项为C(4,4)·(−1)⁴=1。"},{"q":"求(x−1/x)⁶展开式中的常数项。","idea":"通项为C(6,k)(−1)^k x^(6−2k)，令6−2k=0，得k=3。","ans":"常数项为C(6,3)(−1)³=−20。"}]}]},{"title":"第十八章 随机变量及其分布","items":[{"name":"条件概率、全概率公式与贝叶斯公式","desc":"条件概率P(B|A)=P(AB)/P(A)（P(A)>0）。乘法公式P(AB)=P(A)P(B|A)。全概率公式：若A1、…、An为一个划分，则P(B)=ΣP(Ai)P(B|Ai)。贝叶斯公式：P(Ai|B)=P(Ai)P(B|Ai)/P(B)。","tip":"全概率公式中的事件组要满足两两互斥且和为必然事件；贝叶斯公式的分母就是全概率公式。","ex":[{"q":"已知P(A)=0.5，P(AB)=0.3，求P(B|A)。","idea":"直接由条件概率定义计算。","ans":"P(B|A)=0.3/0.5=0.6。"},{"q":"三台机器生产同一零件，产量占比分别为50%、30%、20%，次品率分别为2%、3%、5%。随机抽取一件，求它是次品的概率。","idea":"用全概率公式P=Σ P(机器i)·P(次品|机器i)。","ans":"P=0.5×0.02+0.3×0.03+0.2×0.05=0.01+0.009+0.01=0.029。"},{"q":"沿用上题，若抽到的零件是次品，求它来自第一台机器的概率。","idea":"用贝叶斯公式，分子为0.5×0.02，分母为上题结果0.029。","ans":"P=0.01/0.029=10/29。"}]},{"name":"离散型随机变量的分布列、期望与方差","desc":"分布列列出随机变量X取各值的概率，且概率之和为1。期望E(X)=Σx_i p_i，方差D(X)=Σ(x_i−E(X))² p_i=E(X²)−[E(X)]²，标准差为√D(X)。线性变换有E(aX+b)=aE(X)+b，D(aX+b)=a²D(X)。","tip":"方差公式D(X)=E(X²)−[E(X)]²计算较简便，但要先求E(X²)，不要误用E(X)²。","ex":[{"q":"随机变量X的分布列为P(X=0)=0.2，P(X=1)=0.5，P(X=2)=0.3，求E(X)与D(X)。","idea":"E(X)=Σx p，再求E(X²)，代入D(X)=E(X²)−E(X)²。","ans":"E(X)=0.5+0.6=1.1，E(X²)=0.5+4×0.3=1.7，D(X)=1.7−1.21=0.49。"},{"q":"在上题基础上，求Y=2X+1的期望与方差。","idea":"利用E(aX+b)=aE(X)+b与D(aX+b)=a²D(X)。","ans":"E(Y)=2×1.1+1=3.2，D(Y)=4×0.49=1.96。"},{"q":"袋中有5件产品，其中2件次品，从中任取2件，X为取出的次品数，求X的分布列与E(X)。","idea":"X取0、1、2，分别用超几何概率公式计算，共C(5,2)=10种取法。","ans":"P(X=0)=C(3,2)/10=3/10，P(X=1)=C(2,1)C(3,1)/10=6/10，P(X=2)=C(2,2)/10=1/10；E(X)=0×0.3+1×0.6+2×0.1=0.8。"}]},{"name":"二项分布与超几何分布","desc":"若X~B(n,p)，则P(X=k)=C(n,k)p^k(1−p)^(n−k)，E(X)=np，D(X)=np(1−p)。超几何分布：从N件产品（其中M件次品）中不放回抽取n件，次品数X的概率P(X=k)=C(M,k)C(N−M,n−k)/C(N,n)，E(X)=nM/N。","tip":"二项分布是有放回或独立重复试验，超几何分布是不放回抽样，二者不能混淆。","ex":[{"q":"X~B(3,0.4)，求P(X=2)及E(X)、D(X)。","idea":"代入二项分布公式与期望、方差公式。","ans":"P(X=2)=3×0.4²×0.6=0.288，E(X)=1.2，D(X)=3×0.4×0.6=0.72。"},{"q":"已知X~B(n,p)，且E(X)=3，D(X)=1.5，求n与p。","idea":"由np=3与np(1−p)=1.5，得1−p=1/2。","ans":"p=1/2，n=6。"}]},{"name":"正态分布","desc":"若X~N(μ,σ²)，其密度曲线关于直线x=μ对称，且有P(μ−σ<X<μ+σ)≈0.6827，P(μ−2σ<X<μ+2σ)≈0.9545，P(μ−3σ<X<μ+3σ)≈0.9973。若X~N(μ,σ²)，则P(X<μ)=0.5，且对任意a有P(X>a)=P(X<2μ−a)。","tip":"利用正态分布的对称性转化概率时，要特别注意对称中心是μ，而不是0。","ex":[{"q":"设X~N(0,1)，求P(X<0)及P(−1<X<1)（取0.6827）。","idea":"由对称性P(X<0)=0.5，再用“一个标准差内”的概率。","ans":"P(X<0)=0.5，P(−1<X<1)≈0.6827。"},{"q":"设X~N(2,1)，求P(1<X<3)。","idea":"1与3恰好是μ−σ与μ+σ。","ans":"P(1<X<3)≈0.6827。"},{"q":"设X~N(3,4)，求P(X>5)与P(X<1)是否相等。","idea":"这里μ=3，σ=2，利用对称性P(X>a)=P(X<2μ−a)。","ans":"2μ−5=1，所以P(X>5)=P(X<1)，两者相等。"}]}]},{"title":"第十九章 成对数据的统计分析","items":[{"name":"变量的相关性与相关系数","desc":"变量间的相关关系可用散点图直观判断。样本相关系数r=Σ(x_i−x̄)(y_i−ȳ)/√[Σ(x_i−x̄)²·Σ(y_i−ȳ)²]，r∈[−1,1]。|r|越接近1，线性相关越强；|r|越接近0，线性相关越弱。r>0为正相关，r<0为负相关。","tip":"相关系数只刻画线性相关程度，r接近0不代表变量之间没有任何关系。","ex":[{"q":"已知x=(1,2,3)，y=(1,3,2)，求样本相关系数r。","idea":"x̄=2，ȳ=2，计算各离差的乘积和与平方和。","ans":"Σ(x−x̄)(y−ȳ)=(−1)(−1)+0×1+1×0=1，Σ(x−x̄)²=2，Σ(y−ȳ)²=2，r=1/2。"},{"q":"若一组数据满足y=2x+3，求其样本相关系数。","idea":"数据完全线性相关且斜率为正。","ans":"r=1。"}]},{"name":"一元线性回归模型","desc":"经验回归方程ŷ=b̂x+â，其中b̂=Σ(x_i−x̄)(y_i−ȳ)/Σ(x_i−x̄)²，â=ȳ−b̂x̄。回归直线必过样本中心点(x̄,ȳ)。残差为e_i=y_i−ŷ_i，残差越小拟合越好。决定系数R²越接近1，模型拟合效果越好。","tip":"求回归系数时，分子与分母是离差的平方和与乘积和，不要直接用原始数据代替。","ex":[{"q":"已知x=(1,2,3)，y=(1,3,2)，求经验回归方程。","idea":"沿用上面的离差计算，b̂=Sxy/Sxx，再由样本中心求â。","ans":"b̂=1/2，â=2−1/2×2=1，回归方程为ŷ=0.5x+1。"},{"q":"已知x=(1,2,3,4)，y=(2,4,5,7)，求经验回归方程。","idea":"x̄=2.5，ȳ=4.5，Sxy=8，Sxx=5。","ans":"b̂=8/5=1.6，â=4.5−1.6×2.5=0.5，回归方程为ŷ=1.6x+0.5。"}]},{"name":"独立性检验","desc":"对于2×2列联表，取值为a、b、c、d、n=a+b+c+d，统计量χ²=n(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]。当χ²≥3.841时，有95%的把握认为两个分类变量有关；当χ²≥6.635时，有99%的把握认为有关。","tip":"独立性检验的结论是“有把握认为有关”，不能表述为“一定有关”或“证明了有关”。","ex":[{"q":"某调查得到2×2列联表：a=20，b=30，c=10，d=40，n=100，判断两变量是否有关（取0.05显著性水平）。","idea":"代入χ²公式，与临界值3.841比较。","ans":"χ²=100×(20×40−30×10)²/(50×50×30×70)=100×250000/5250000≈4.76>3.841，故有95%的把握认为两变量有关。"},{"q":"在上题中，若把样本量扩大到200，各个格子数目均翻倍，判断结论有何变化。","idea":"χ²与n成正比，样本量翻倍后χ²也翻倍。","ans":"χ²≈9.52>6.635，故有99%的把握认为两变量有关，结论的把握程度提高。"}]}]}],"physics":[{"title":"第一章 运动的描述（必修第一册）","items":[{"name":"质点与参考系","desc":"质点是忽略物体大小和形状、只保留质量的理想模型。物体能否看作质点，取决于它的大小和形状对所研究的问题是否影响可以忽略，而不取决于物体本身的大小。参考系是描述物体运动时作为标准的物体，同一运动选取不同参考系，描述结果可能不同。","tip":"判断能否看作质点要看研究的问题，例如研究地球公转时地球可以看作质点，研究地球自转时则不能。","ex":[{"q":"研究地球绕太阳公转的周期（一年）时，能否把地球看作质点？","idea":"地球直径远小于日地距离，地球上各点的运动情况基本相同，地球的大小和形状对公转周期没有影响。","ans":"能。地球直径约 1.3×10^4 km，日地距离约 1.5×10^8 km，远大于地球直径，故可视为质点。"},{"q":"坐在匀速行驶的车厢中的乘客，分别以车厢和地面为参考系，乘客各处于什么状态？","idea":"运动是相对的，判断物体运动状态要先确定参考系。","ans":"以车厢为参考系，乘客是静止的；以地面为参考系，乘客做匀速直线运动。"}]},{"name":"位移、速度与加速度","desc":"位移是从初位置指向末位置的有向线段，是矢量；路程是运动轨迹的长度，是标量。平均速度 v̄ = Δx / Δt，瞬时速度是 Δt 趋近于零时的平均速度。加速度 a = Δv / Δt 描述速度变化的快慢，单位是 m/s²，其方向与速度变化量 Δv 的方向相同。","tip":"加速度大，速度不一定大；速度变化快，加速度才大。速度为零时加速度不一定为零。","ex":[{"q":"一人从 A 点向东走 30 m 到达 B 点，再向北走 40 m 到达 C 点。求此过程的路程和位移大小及方向。","idea":"路程是轨迹长度之和；位移是从 A 指向 C 的有向线段，由勾股定理求大小。","ans":"路程 s = 30 + 40 = 70 m；位移大小 x = √(30² + 40²) = 50 m，方向由 A 指向 C，东偏北 53°（tan θ = 40/30）。"},{"q":"足球以 10 m/s 的速度水平撞墙，并以 6 m/s 的速度反向弹回，与墙接触的时间为 0.2 s。求足球在此过程中的平均加速度。","idea":"取初速度方向为正，v0 = 10 m/s，v = −6 m/s，由 a = Δv / Δt 求解。","ans":"Δv = −6 − 10 = −16 m/s，a = −16 / 0.2 = −80 m/s²。加速度大小为 80 m/s²，方向与初速度方向相反。"}]}]},{"title":"第二章 匀变速直线运动（必修第一册）","items":[{"name":"匀变速直线运动规律","desc":"物体沿直线运动且加速度 a 恒定时，速度公式为 v = v0 + at，位移公式为 x = v0·t + ½at²，不含时间的关系式为 v² − v0² = 2ax。其中 v0 为初速度，v 为末速度，a 为加速度（与初速度同向时取正）。平均速度 v̄ = (v0 + v) / 2。","tip":"先规定正方向；若题目是减速到停止的运动，要先求停止时间，不能把时间直接代入公式得到停止后的运动。","ex":[{"q":"一辆汽车从静止开始做匀加速直线运动，加速度大小为 2 m/s²，求它经过 5 s 时的速度和这 5 s 内的位移。","idea":"初速度 v0 = 0，已知 a 和 t，直接用 v = v0 + at 求速度，再用 x = v0·t + ½at² 求位移。","ans":"v = 0 + 2×5 = 10 m/s；x = 0 + ½×2×5² = 25 m。5 s 末速度为 10 m/s，5 s 内位移为 25 m。"},{"q":"一辆汽车以 20 m/s 的速度匀速行驶，司机紧急刹车，做匀减速直线运动，加速度大小为 5 m/s²。求汽车从刹车到停下所用的时间和滑行距离。","idea":"取初速度方向为正，则 a = −5 m/s²。先由 v = v0 + at 令 v = 0 求停止时间，再用 v² − v0² = 2ax 求位移。","ans":"由 0 = 20 − 5t 得 t = 4 s；由 0² − 20² = 2×(−5)×x 得 x = 40 m。汽车经 4 s 停下，滑行 40 m。"}]},{"name":"匀变速直线运动的图像","desc":"v-t 图像中，图线的斜率表示加速度，图线与时间轴所围的面积表示位移，时间轴上方面积为正位移，下方为负位移。x-t 图像中，图线的斜率表示速度。匀变速直线运动的 v-t 图像是一条倾斜直线。","tip":"x-t 图像描述的是位置随时间的变化，图线不是运动轨迹；若图线为直线，物体做直线运动。","ex":[{"q":"某物体的 v-t 图像为：0~2 s 内速度由 0 均匀增大到 4 m/s；2~5 s 内速度保持 4 m/s；5~7 s 内速度均匀减小到 0。求 0~7 s 内的位移和 0~2 s 内的加速度。","idea":"0~2 s 与 5~7 s 的图线分别为三角形，2~5 s 为矩形，位移等于各段面积之和；加速度为斜率。","ans":"位移 x = ½×2×4 + 4×3 + ½×2×4 = 4 + 12 + 4 = 20 m；0~2 s 内 a = 4/2 = 2 m/s²。"},{"q":"做匀加速直线运动的物体，在连续两个相等时间 T = 2 s 内的位移分别为 x1 = 8 m 和 x2 = 16 m。求加速度和初速度。","idea":"连续相等时间内的位移差 Δx = aT²；再由第一段位移 x1 = v0T + ½aT² 求初速度。","ans":"由 Δx = 16 − 8 = 8 = a×4，得 a = 2 m/s²；由 8 = v0×2 + ½×2×4，得 v0 = 2 m/s。"}]},{"name":"追及与相遇问题","desc":"两物体在同一直线上运动，位置相同即为相遇。解决追及问题的关键是找出两物体的位移关系、时间关系，并分析速度相等时两者间距是否达到最大或最小。若被追物体先减速，要注意其停止后的运动状态。","tip":"速度相等往往是判断是否追上以及求最大距离的临界条件，应先比较速度再列方程。","ex":[{"q":"汽车从静止开始以 2 m/s² 的加速度启动，此时它前方 16 m 处有一辆自行车以 6 m/s 的速度匀速同向行驶。求汽车追上自行车所需的时间。","idea":"汽车位移 x1 = ½at²，自行车位移 x2 = 16 + 6t，追上时 x1 = x2，解二次方程。","ans":"t² = 16 + 6t，即 t² − 6t − 16 = 0，(t − 8)(t + 2) = 0，得 t = 8 s。验证：汽车位移 64 m，自行车位移 16 + 48 = 64 m，相等。"},{"q":"在上题中，汽车追上自行车之前，两车之间的最大距离是多少？","idea":"两车速度相等时距离最大，此时汽车速度 at = 6 m/s。","ans":"由 2t = 6 得 t = 3 s。此时汽车位移 x1 = ½×2×3² = 9 m，自行车位移 16 + 6×3 = 34 m，最大距离 Δx = 34 − 9 = 25 m。"}]},{"name":"自由落体运动","desc":"物体只在重力作用下从静止开始竖直下落，叫自由落体运动。它是初速度为零、加速度为 g 的匀加速直线运动，下落高度 h = ½gt²，速度 v = gt，且 v² = 2gh。取 g = 10 m/s² 时计算较简便。","tip":"自由落体是匀变速直线运动的特例，所有匀变速公式都适用，只需把加速度 a 换成 g。","ex":[{"q":"一个小石块从离地高 20 m 的楼顶由静止释放，不计空气阻力，取 g = 10 m/s²。求石块落地所用时间和落地速度大小。","idea":"初速度为零，由 h = ½gt² 求时间，再由 v = gt 求落地速度。","ans":"由 20 = ½×10×t² 得 t = 2 s；落地速度 v = 10×2 = 20 m/s，方向竖直向下。"},{"q":"一物体从某高度自由下落，最后 1 s 内下落的高度为 25 m，取 g = 10 m/s²。求下落的总时间和总高度。","idea":"设总时间为 T，则总高度 h = 5T²，前 (T − 1) s 下落高度为 5(T − 1)²，二者之差为 25 m。","ans":"5T² − 5(T − 1)² = 25，化简得 10T − 5 = 25，T = 3 s；总高度 h = 5×3² = 45 m。"}]}]},{"title":"第三章 相互作用（必修第一册）","items":[{"name":"重力、弹力与摩擦力","desc":"重力 G = mg，方向竖直向下。弹力的大小在弹性限度内满足胡克定律 F = kx，k 为劲度系数，x 为形变量。滑动摩擦力 f = μN，方向与相对运动方向相反；静摩擦力的大小随外力变化，0 ≤ f ≤ f_max，f_max 近似等于最大静摩擦力。","tip":"滑动摩擦力的方向与相对运动方向相反，不一定与物体运动方向相反；压力 N 不一定等于重力。","ex":[{"q":"弹簧原长 20 cm，劲度系数为 200 N/m，下端挂 2 kg 的物体并保持静止，取 g = 10 m/s²。求弹簧此时的长度。","idea":"弹力等于物体重力 F = mg，由 F = kx 求形变量，再加上原长。","ans":"F = 2×10 = 20 N；x = 20 / 200 = 0.1 m = 10 cm；弹簧长度 l = 20 + 10 = 30 cm。"},{"q":"质量 10 kg 的木箱放在水平地面上，与地面间动摩擦因数为 0.3，取 g = 10 m/s²。先用 20 N 的水平拉力拉木箱，再用 40 N 的水平拉力拉木箱，分别求木箱受到的摩擦力和第二种情况下的加速度。","idea":"最大静摩擦（近似等于滑动摩擦）为 μmg = 30 N。拉力 20 N 小于 30 N，木箱静止，摩擦力为静摩擦力；拉力 40 N 大于 30 N，木箱滑动，摩擦力为 30 N。","ans":"拉力 20 N 时木箱静止，静摩擦力 f = 20 N；拉力 40 N 时木箱滑动，滑动摩擦力 f = 30 N，加速度 a = (40 − 30) / 10 = 1 m/s²。"}]},{"name":"力的合成与分解","desc":"力的合成与分解遵循平行四边形定则。两个共点力 F1、F2 的合力范围为 |F1 − F2| ≤ F ≤ F1 + F2。把一个力分解为互相垂直的两个分力时，Fx = F cos θ，Fy = F sin θ。","tip":"合力可能大于分力，也可能小于分力，还可能等于分力，取决于两分力的夹角。","ex":[{"q":"两个大小分别为 3 N 和 4 N 的共点力互相垂直，求它们的合力大小及与 3 N 力的夹角。若两个大小均为 10 N 的力夹角为 120°，求合力大小。","idea":"垂直时合力 F = √(F1² + F2²)，夹角由 tan θ = F2 / F1 求得；两等大力的合力 F = 2F1 cos(θ/2)。","ans":"第一问：F = √(9 + 16) = 5 N，与 3 N 力的夹角 tan θ = 4/3，θ ≈ 53°。第二问：F = 2×10×cos60° = 10 N。"},{"q":"将 100 N 的力沿与水平方向成 30° 斜向上的方向进行分解，求水平分力和竖直分力的大小。","idea":"Fx = F cos 30°，Fy = F sin 30°。","ans":"Fx = 100 × (√3/2) = 50√3 ≈ 86.6 N，Fy = 100 × ½ = 50 N。"}]},{"name":"受力分析与共点力平衡","desc":"受力分析的一般步骤：先画重力，再画接触面的弹力，最后画摩擦力，最后检查每个力是否有施力物体。共点力平衡的条件是合力为零，即 Σ F = 0；通常用正交分解法，列出 Σ Fx = 0 与 Σ Fy = 0。","tip":"分析摩擦力时先判断是静摩擦还是滑动摩擦；静摩擦力的大小由平衡条件决定，不能直接用 μN 计算。","ex":[{"q":"质量为 8 kg 的物体放在水平面上，用与水平方向成 37° 斜向上的拉力 F = 50 N 拉它，使其匀速前进，取 g = 10 m/s²，sin 37° = 0.6，cos 37° = 0.8。求物体与地面间的动摩擦因数。","idea":"竖直方向 N + F sin 37° = mg，水平方向 F cos 37° = f = μN。","ans":"N = 80 − 50×0.6 = 50 N；f = 50×0.8 = 40 N；μ = 40 / 50 = 0.8。"},{"q":"质量为 2 kg 的物体静止在倾角为 30° 的粗糙斜面上，取 g = 10 m/s²。求斜面对物体的静摩擦力大小和方向。","idea":"沿斜面方向重力的分力 mg sin 30° 与静摩擦力平衡。","ans":"静摩擦力 f = mg sin 30° = 2×10×0.5 = 10 N，方向沿斜面向上。"}]}]},{"title":"第四章 牛顿运动定律（必修第一册）","items":[{"name":"牛顿三定律与单位制","desc":"牛顿第一定律：一切物体在没有受到外力作用时，总保持静止或匀速直线运动状态，惯性是物体保持运动状态不变的性质。牛顿第二定律 F = ma。牛顿第三定律：作用力与反作用力大小相等、方向相反、作用在两个物体上。国际单位制中力的单位 N 是导出单位，1 N = 1 kg·m/s²。","tip":"作用力与反作用力总是成对出现，始终大小相等，与物体的运动状态无关；它们不能相互抵消。","ex":[{"q":"一个质量为 2 kg 的物体同时受到 4 N 和 6 N 两个力的作用，求合力的范围及加速度的范围。","idea":"两力同向时合力最大，反向时合力最小，由 a = F / m 求加速度范围。","ans":"合力范围为 2 N 到 10 N，加速度范围为 1 m/s² 到 5 m/s²。"},{"q":"用国际单位制基本单位表示力的单位 N。","idea":"由 F = ma，把质量单位 kg、加速度单位 m/s² 代入。","ans":"1 N = 1 kg·m/s²。"}]},{"name":"牛顿第二定律与连接体","desc":"牛顿第二定律的核心是合外力决定加速度，且加速度与合外力方向一致。处理连接体问题时，若各物体加速度相同，可先用整体法 F = (m1 + m2) a 求加速度，再用隔离法求物体间的相互作用力。","tip":"求内力（如绳中张力）必须用隔离法；整体法只能求外力或整体的加速度。","ex":[{"q":"质量 m1 = 2 kg 和 m2 = 3 kg 的两物体用轻绳相连，放在光滑水平面上，用水平拉力 F = 10 N 拉 m2，求加速度和绳中张力。","idea":"整体法求加速度 a = F / (m1 + m2)；隔离 m1，由 T = m1·a 求张力。","ans":"a = 10 / 5 = 2 m/s²；T = 2×2 = 4 N。"},{"q":"质量分别为 m1 = 3 kg 和 m2 = 2 kg 的物体通过轻绳跨过光滑定滑轮，m1 原先高于 m2，取 g = 10 m/s²，求释放后的加速度和绳中张力。","idea":"m1 较重，向下加速。对系统 (m1 − m2) g = (m1 + m2) a；隔离 m2，T − m2 g = m2 a。","ans":"a = (30 − 20) / 5 = 2 m/s²；T = m2(g + a) = 2×12 = 24 N（用 m1 校验：m1(g − a) = 3×8 = 24 N，一致）。"}]},{"name":"超重与失重","desc":"物体对支持物的压力（或对悬挂物的拉力）大于重力时为超重，加速度方向向上；小于重力时为失重，加速度方向向下。若加速度恰好为 g（方向向下），则为完全失重。超重或失重时物体的重力并未改变，改变的是视重。","tip":"判断超重还是失重只看加速度方向，与速度方向无关：加速上升和减速下降都是超重。","ex":[{"q":"质量为 60 kg 的人站在升降机中的体重计上，升降机以 2 m/s² 的加速度加速上升，取 g = 10 m/s²。求体重计的示数。","idea":"加速度向上，属于超重。由 N − mg = ma 求支持力。","ans":"N = m(g + a) = 60×12 = 720 N，人处于超重状态。"},{"q":"同一人乘升降机以 2 m/s² 的加速度加速下降，求体重计的示数，并说明此时人的状态。","idea":"加速度向下，mg − N = ma。","ans":"N = m(g − a) = 60×8 = 480 N，人处于失重状态。"}]},{"name":"临界问题","desc":"当某个物理量变化到恰好使物体状态发生改变时的状态称为临界状态，对应的物理量取值称为临界值。常见的临界条件有：两物体恰好不发生相对滑动（静摩擦力达到最大值）、绳子恰好拉断（拉力达到最大值）、物体恰好离开接触面（弹力为零）。","tip":"先找出临界条件，再用临界条件列方程；临界条件通常是最大静摩擦、弹力为零或绳的最大拉力。","ex":[{"q":"质量 m = 1 kg 的物体 A 放在质量 M = 3 kg 的物体 B 上，水平面光滑，A、B 间动摩擦因数 μ = 0.4，取 g = 10 m/s²。要使 A、B 一起运动而不发生相对滑动，水平拉力 F 的最大值是多少？（设最大静摩擦等于滑动摩擦）","idea":"A 能获得的最大加速度为 a_max = μg = 4 m/s²，对整体 F_max = (m + M) a_max。","ans":"a_max = 0.4×10 = 4 m/s²，F_max = (1 + 3)×4 = 16 N。"},{"q":"一根细绳能承受的最大拉力为 40 N，用它沿水平方向拉质量为 4 kg 的物体，物体与地面间动摩擦因数为 0.5，取 g = 10 m/s²。求绳不被拉断的前提下，物体能获得的最大加速度。","idea":"绳拉力最大为 40 N 时加速度最大。滑动摩擦力 f = μmg = 20 N，由 F − f = ma 求解。","ans":"a_max = (40 − 20) / 4 = 5 m/s²。"}]}]},{"title":"第五章 实验：运动与力（必修第一册）","items":[{"name":"探究小车速度随时间变化的规律","desc":"用打点计时器打出纸带，50 Hz 交流电每隔 0.02 s 打一个点。若每 5 个点取一个计数点，相邻计数点时间间隔 T = 0.1 s。匀变速直线运动中，某段时间中间时刻的瞬时速度等于该段的平均速度，即 v_n = (x_n + x_{n+1}) / (2T)。加速度可用逐差法 a = [(x3 + x4) − (x1 + x2)] / (4T²)。","tip":"实验时应先接通电源，待打点稳定后再释放小车；数据处理时要统一单位。","ex":[{"q":"纸带上相邻计数点间的距离依次为 x1 = 3.00 cm、x2 = 4.20 cm、x3 = 5.40 cm、x4 = 6.60 cm，T = 0.1 s。求小车的加速度和计数点 2 的瞬时速度。","idea":"用逐差法求加速度；计数点 2 的速度等于 x2 与 x3 段的平均速度。","ans":"a = [(5.40 + 6.60) − (3.00 + 4.20)] × 10⁻² / (4×0.01) = 1.2 m/s²；v2 = (4.20 + 5.40)×10⁻² / 0.2 = 0.48 m/s。"},{"q":"某同学用 v-t 图像处理数据，测得 t = 0 时速度为 0.10 m/s，图线斜率为 0.80 m/s²。求 t = 2 s 时小车的速度。","idea":"由图线的截距和斜率写出 v = v0 + at，代入 t = 2 s。","ans":"v = 0.10 + 0.80×2 = 1.70 m/s。"}]},{"name":"探究加速度与力、质量的关系","desc":"采用控制变量法：保持小车质量不变，研究加速度与合外力的关系；保持合外力不变，研究加速度与质量的关系（a 与 1/m 成正比）。实验前要平衡摩擦力：不挂砝码桶，轻推小车使其匀速运动。只有当砝码桶及砝码的总质量 m 远小于小车质量 M 时，绳的拉力才近似等于 mg。","tip":"平衡摩擦力时不能挂砝码桶；改变小车质量后无需重新平衡摩擦力。","ex":[{"q":"某次实验中小车质量 M = 0.5 kg，砝码桶及砝码总质量 m = 0.05 kg，取 g = 10 m/s²。求绳拉力的理论值，并估算用 mg 代替拉力产生的相对误差。","idea":"对系统 a = mg / (M + m)，绳拉力 T = Ma = Mmg / (M + m)。","ans":"T = 0.5×0.05×10 / 0.55 ≈ 0.45 N，近似值 mg = 0.5 N，相对误差 (0.5 − 0.45) / 0.5 ≈ 9%。"},{"q":"在探究 a 与 F 的关系实验中，得到的 a-F 图线不过原点，而与 F 轴正半轴相交，分析原因。","idea":"图线与 F 轴相交说明拉力达到一定值后小车才开始加速，即摩擦力未被平衡或平衡不足。","ans":"原因是没有平衡摩擦力或平衡摩擦力不足，摩擦阻力需要先被拉力抵消，小车才开始加速。"}]},{"name":"探究两个互成角度的力的合成规律","desc":"用两个弹簧测力计互成角度拉橡皮条，使结点到达某一位置 O，记录两个拉力的大小和方向；再用一个弹簧测力计把结点拉到同一位置 O，记录拉力。以两个分力为邻边作平行四边形，其对角线即为理论合力，与一个弹簧测力计的拉力比较，验证平行四边形定则。","tip":"同一次实验中结点必须拉到同一位置 O，以保证效果相同；两拉力夹角不宜过大或过小，拉力方向应贴近木板平面。","ex":[{"q":"两弹簧测力计的示数分别为 F1 = 3.0 N 和 F2 = 4.0 N，夹角为 90°。若作图时用 1 cm 表示 1 N，求合力图示的长度和理论合力的大小。","idea":"在图上以 3 cm 和 4 cm 为邻边作矩形，对角线即合力；理论合力由勾股定理求得。","ans":"合力图示长度为 5 cm，对应理论合力 F = √(3² + 4²) = 5 N。"},{"q":"本实验中，若只提供一个弹簧测力计，为什么要把结点拉到同一位置 O？","idea":"本实验用的是等效替代法，关键是两种情况下作用效果相同。","ans":"结点拉到同一位置 O 说明橡皮条的形变量相同，即两种情况的作用效果相同，合力才能与分力等效替代。"}]}]},{"title":"第六章 抛体运动（必修第二册）","items":[{"name":"平抛运动","desc":"物体以水平初速度抛出，只受重力作用，即为平抛运动。水平方向做匀速直线运动 x = v0 t，竖直方向做自由落体运动 y = ½gt²，vy = gt。合速度 v = √(v0² + vy²)，与水平方向夹角 tan θ = vy / v0。落地时间由高度决定，t = √(2h / g)。","tip":"平抛的速度偏转角 θ 与位移偏转角 α 满足 tan θ = 2 tan α，不能混淆。","ex":[{"q":"以 v0 = 20 m/s 的初速度水平抛出一物体，取 g = 10 m/s²，求 2 s 末物体速度的大小和方向。","idea":"vy = gt，合速度由勾股定理求，方向由 tan θ = vy / v0 求。","ans":"vy = 10×2 = 20 m/s；v = √(20² + 20²) = 20√2 ≈ 28.3 m/s，与水平方向夹角 45°，斜向右下方。"},{"q":"从高 h = 45 m 处水平抛出一小球，落地点与抛出点的水平距离为 60 m，取 g = 10 m/s²。求小球的初速度和落地速度大小。","idea":"由 h = ½gt² 求时间，再由 x = v0 t 求初速度；落地竖直速度 vy = gt。","ans":"t = √(2×45/10) = 3 s；v0 = 60/3 = 20 m/s；vy = 30 m/s，落地速度 v = √(400 + 900) ≈ 36.1 m/s。"}]},{"name":"类平抛运动","desc":"物体所受合力恒定且与初速度方向垂直时，做类平抛运动。沿初速度方向做匀速直线运动，沿合力方向做初速度为零的匀加速直线运动，加速度 a = F合 / m。分析方法与平抛运动相同，即运动分解后分别列式。","tip":"类平抛的加速度不是 g，而是合外力产生的加速度，要先求出合力再求 a。","ex":[{"q":"质量 m = 2 kg 的物体在光滑水平面上以 v0 = 3 m/s 沿 x 方向运动，同时受到沿 y 方向的恒力 F = 4 N 作用。求 3 s 末物体的速度大小及其位置坐标（以出发点为原点）。","idea":"x 方向匀速，y 方向加速度 a = F/m = 2 m/s² 做匀加速运动。","ans":"vx = 3 m/s，vy = 2×3 = 6 m/s，v = √45 = 3√5 ≈ 6.7 m/s；x = 3×3 = 9 m，y = ½×2×3² = 9 m，位置坐标为 (9 m, 9 m)。"},{"q":"某物体在光滑水平面上做类平抛运动，沿 x 方向初速度 v0 = 4 m/s，沿 y 方向加速度 a = 3 m/s²。求 t = 2 s 时速度方向与初速度方向夹角的正切值。","idea":"vy = at，tan θ = vy / vx。","ans":"vy = 3×2 = 6 m/s，vx = 4 m/s，tan θ = 6/4 = 1.5。"}]}]},{"title":"第七章 圆周运动（必修第二册）","items":[{"name":"圆周运动的描述","desc":"线速度 v = 2πr / T，角速度 ω = 2π / T = 2πn（n 为转速，单位 r/s），且 v = ωr。向心加速度 a = v² / r = ω²r，方向始终指向圆心。周期 T 与转速 n 互为倒数关系。","tip":"同一皮带或齿轮传动时，轮缘上各点线速度相等；同一轮上各点角速度相等。","ex":[{"q":"半径 r = 0.5 m 的物体以 n = 120 r/min 的转速做匀速圆周运动，求角速度、线速度和向心加速度。","idea":"先把转速换算为 r/s，再求 ω = 2πn，v = ωr，a = ω²r。","ans":"n = 2 r/s，ω = 4π ≈ 12.6 rad/s，v = 4π×0.5 = 2π ≈ 6.28 m/s，a = (4π)²×0.5 = 8π² ≈ 79 m/s²。"},{"q":"大轮和小轮通过皮带传动，大轮半径 0.2 m，小轮半径 0.1 m，大轮角速度为 10 rad/s。求皮带的线速度及小轮的角速度。","idea":"皮带传动时轮缘线速度相等，大轮线速度 v = ω1 r1。","ans":"v = 10×0.2 = 2 m/s；小轮角速度 ω2 = v / r2 = 2 / 0.1 = 20 rad/s。"}]},{"name":"水平转盘与圆锥摆","desc":"做圆周运动的物体，向心力由沿半径方向的合外力提供，F = mv² / r = mω²r。水平转盘上物体的向心力由静摩擦力提供，存在最大角速度 ω_max = √(μg / r)。圆锥摆中，重力与绳拉力的合力水平指向圆心，mg tan θ = mω²L sin θ，ω = √(g / (L cos θ))。","tip":"分析圆周运动时先确定圆心和轨道平面，明确“向心力由谁提供”，再列牛顿第二定律的径向方程。","ex":[{"q":"质量 m = 1 kg 的物体随水平转盘一起匀速转动，离轴距离 r = 0.5 m，物体与盘面间的动摩擦因数为 0.5，取 g = 10 m/s²。求转盘的最大角速度。","idea":"最大静摩擦提供向心力：μmg = mω²r。","ans":"ω² = μg / r = 0.5×10 / 0.5 = 10，ω_max = √10 ≈ 3.2 rad/s。"},{"q":"质量为 m 的小球用长 L = 1 m 的细绳悬挂在顶端，在水平面内做圆锥摆运动，细绳与竖直方向夹角 θ = 37°，取 g = 10 m/s²，sin 37° = 0.6，cos 37° = 0.8。求小球的角速度和绳的拉力。","idea":"竖直方向 T cos θ = mg；水平方向 T sin θ = mω²L sin θ。","ans":"ω² = g / (L cos θ) = 10 / 0.8 = 12.5，ω ≈ 3.5 rad/s；T = mg / cos θ = 1.25 mg。"}]},{"name":"竖直面内圆周运动","desc":"物体在竖直面内做圆周运动，经过最高点时，轻绳（或圆轨道内侧）模型要求 v_top ≥ √(gR)，此时恰好由重力提供向心力；轻杆（或管道）模型中，最高点速度只需 v_top ≥ 0。从最高点到最低点，由机械能守恒可得 v_bot² = v_top² + 4gR。","tip":"轻绳模型的临界条件是重力恰好提供向心力；过最低点时拉力比重力大得多，要注意向心力方向向上。","ex":[{"q":"长 R = 0.5 m 的轻绳拴着小球，在竖直面内做圆周运动，小球恰好能通过最高点，取 g = 10 m/s²。求小球在最高点和最低点的速度大小。","idea":"最高点恰好通过时 mg = mv_top² / R；由机械能守恒求最低点速度。","ans":"v_top = √(gR) = √5 ≈ 2.2 m/s；由 ½mv_bot² = ½mv_top² + mg·2R，得 v_bot² = 5 + 20 = 25，v_bot = 5 m/s。"},{"q":"在上题中，若小球质量 m = 1 kg，经过最低点时速度为 5 m/s，求此时绳的拉力。","idea":"最低点合力向上提供向心力：T − mg = mv² / R。","ans":"T = 10 + 1×25 / 0.5 = 60 N。"}]}]},{"title":"第八章 万有引力与宇宙航行（必修第二册）","items":[{"name":"开普勒定律与万有引力定律","desc":"开普勒三定律：行星绕太阳运动的轨道是椭圆，太阳位于焦点上；相同时间内行星与太阳的连线扫过相等的面积；所有行星轨道半长轴的三次方与周期的二次方之比都相同，即 a³ / T² = 常量。万有引力定律 F = GMm / r²，引力常量 G = 6.67×10⁻¹¹ N·m²/kg²。","tip":"r 是两物体球心之间的距离；地表物体的重力近似等于万有引力，mg = GMm / R²，即 GM = gR²。","ex":[{"q":"已知地球表面重力加速度 g = 9.8 m/s²，地球半径 R = 6400 km，引力常量 G = 6.67×10⁻¹¹ N·m²/kg²。求地球的质量。","idea":"地表物体重力近似等于万有引力，mg = GMm / R²，故 M = gR² / G。","ans":"M = 9.8 × (6.4×10⁶)² / (6.67×10⁻¹¹) ≈ 6.0×10²⁴ kg。"},{"q":"两颗卫星绕同一中心天体做匀速圆周运动，轨道半径之比 r1 : r2 = 1 : 4，求它们的周期之比。","idea":"由 GMm / r² = m(4π²/T²) r，得 T² ∝ r³，即 T ∝ r^(3/2)。","ans":"T1 : T2 = (1/4)^(3/2) = 1 : 8。"}]},{"name":"天体质量、密度的计算","desc":"若已知环绕天体的周期 T 和轨道半径 r，则中心天体质量 M = 4π²r³ / (GT²)。中心天体密度 ρ = M / (4πR³/3)。若卫星在星球表面附近运行（r = R），则 ρ = 3π / (GT²)。注意区分卫星轨道半径 r 与天体半径 R。","tip":"计算密度时用的是中心天体的半径 R，而不是卫星的轨道半径 r；只有贴近表面运行时两者才相等。","ex":[{"q":"某卫星贴近某星球表面做匀速圆周运动，周期为 1 h，引力常量 G = 6.67×10⁻¹¹ N·m²/kg²，求该星球的平均密度。","idea":"贴近表面运行时 r = R，ρ = 3π / (GT²)，注意将时间换算为秒。","ans":"T = 3600 s，ρ = 3π / (6.67×10⁻¹¹ × 3600²) ≈ 1.1×10⁴ kg/m³。"},{"q":"某行星的卫星轨道半径为 r，周期为 T，求行星的质量。已知 r = 4×10⁸ m，T = 2×10⁴ s，G = 6.67×10⁻¹¹ N·m²/kg²（取 π² ≈ 10）。","idea":"由 GMm / r² = m(4π²/T²)r 得 M = 4π²r³ / (GT²)。","ans":"M = 4π²r³ / (GT²) ≈ 40 × 6.4×10²⁵ / (6.67×10⁻¹¹ × 4×10⁸) ≈ 9.6×10²⁸ kg。"}]},{"name":"宇宙速度与卫星变轨","desc":"第一宇宙速度 v1 = √(gR) ≈ 7.9 km/s，是最大环绕速度，也是最小发射速度。卫星线速度 v = √(GM / r)，轨道半径越大，线速度越小、周期越长、向心加速度越小。卫星从低轨道变到高轨道，需在低轨道点火加速做离心运动；从高轨道变到低轨道，需减速做近心运动。","tip":"同一轨道上加速或减速会改变轨道，而不是简单地改变速度大小后仍绕原轨道运动。","ex":[{"q":"卫星在半径为 r 的圆轨道上绕地球运行，线速度为 v。若要使它进入半径为 4r 的更高圆轨道运行，它的线速度变为多少？需要在何处加速？","idea":"由 v = √(GM / r)，v ∝ 1/√r；卫星要升高轨道，需在原轨道上点火加速使其做离心运动。","ans":"新轨道线速度 v' = v / √4 = v / 2；应在原轨道上点火加速，使卫星进入转移轨道，再在高轨道上加速入轨。"},{"q":"地球同步卫星的周期为 24 h，已知 GM = 3.99×10¹⁴ m³/s²，求同步卫星的轨道半径（取 π² ≈ 9.87）。","idea":"由 GMm/r² = m(4π²/T²)r，得 r³ = GMT² / (4π²)。","ans":"T = 8.64×10⁴ s，r³ = 3.99×10¹⁴ × (8.64×10⁴)² / (4×9.87) ≈ 7.5×10²² m³，r ≈ 4.2×10⁷ m（约 4.2×10⁴ km）。"}]}]},{"title":"第九章 功和能（必修第二册）","items":[{"name":"功与功率","desc":"恒力做功 W = Fl cos θ，θ 为力与位移的夹角。功率表示做功快慢，平均功率 P = W / t，瞬时功率 P = Fv cos θ。功的单位是 J，功率的单位是 W。","tip":"功是标量，有正负：θ 为锐角时做正功，为钝角时做负功，为直角时不做功。","ex":[{"q":"质量 2 kg 的物体在与水平方向成 37° 斜向上、大小为 10 N 的拉力作用下，水平移动 5 m。求拉力做的功；若此过程用时 4 s，求拉力的平均功率。（cos 37° = 0.8）","idea":"W = Fl cos θ；平均功率 P = W / t。","ans":"W = 10×5×0.8 = 40 J；P = 40 / 4 = 10 W。"},{"q":"某汽车的额定功率为 60 kW，在水平路面上以额定功率行驶，最大速度为 30 m/s。求汽车所受的阻力。","idea":"达到最大速度时牵引力等于阻力，P = Fv = fv。","ans":"f = P / v = 60000 / 30 = 2000 N。"}]},{"name":"机车启动问题","desc":"以额定功率启动时，牵引力 F = P / v 随速度增大而减小，加速度逐渐减小，当 F = f 时速度达到最大 vm = P / f。以恒定加速度启动时，匀加速阶段牵引力 F = f + ma 不变，功率随速度增大；当功率达到额定功率后，改为以额定功率做加速度减小的加速运动，直至达到最大速度。","tip":"匀加速阶段结束的时刻，是功率恰好达到额定功率的时刻，此时 v1 = P / (f + ma)。","ex":[{"q":"质量 m = 2000 kg 的汽车，额定功率 P = 80 kW，所受阻力 f = 4000 N。求汽车能达到的最大速度；若以额定功率行驶时速度为 10 m/s，求此时的加速度。","idea":"最大速度 vm = P / f；速度 10 m/s 时牵引力 F = P / v，再由牛顿第二定律求加速度。","ans":"vm = 80000 / 4000 = 20 m/s；F = 80000 / 10 = 8000 N，a = (8000 − 4000) / 2000 = 2 m/s²。"},{"q":"上述汽车以恒定加速度 a = 1 m/s² 从静止启动，求匀加速阶段能维持的时间。","idea":"匀加速时牵引力 F = f + ma；功率达到额定值时的速度 v1 = P / F，时间 t = v1 / a。","ans":"F = 4000 + 2000×1 = 6000 N；v1 = 80000 / 6000 ≈ 13.3 m/s；t = 13.3 / 1 ≈ 13.3 s。"}]},{"name":"动能定理","desc":"物体动能 Ek = ½mv²。动能定理：合外力所做的总功等于物体动能的变化，即 W合 = ½mv2² − ½mv1²。动能定理适用于恒力做功，也适用于变力做功和曲线运动。","tip":"用动能定理列式时，要把所有外力（包括重力、摩擦力）做功都算进去，并注意功的正负。","ex":[{"q":"质量 m = 2 kg 的物体静止在水平面上，受到水平恒力 F = 10 N 作用，动摩擦因数为 0.2，取 g = 10 m/s²。求物体移动 5 m 时的速度。","idea":"合外力做功 (F − μmg)x = ½mv²。","ans":"(10 − 4)×5 = 30 J = ½×2×v²，v² = 30，v = √30 ≈ 5.5 m/s。"},{"q":"一小球从高 h = 3 m 处自由下落，落入沙坑后陷入深度 d = 0.5 m 停止。小球质量 m = 1 kg，沙子对小球的阻力恒定，取 g = 10 m/s²，忽略空气阻力。求沙子的阻力大小。","idea":"全过程初末动能都为零，重力做功 mg(h + d)，阻力做功 −fd，二者之和为零。","ans":"mg(h + d) − fd = 0，10×3.5 = f×0.5，f = 70 N。"}]},{"name":"重力势能与弹性势能","desc":"重力势能 Ep = mgh，h 为相对零势能面的高度，重力做正功时重力势能减少。弹性势能 Ep = ½kx²，x 为弹簧的形变量。势能的零点可以任意选取，但同一问题中必须统一。","tip":"重力势能的变化与零势能面的选取无关，只与高度变化有关。","ex":[{"q":"质量 m = 1 kg 的小球从高 h = 5 m 处自由下落，不计阻力，取 g = 10 m/s²。求小球下落 2 m 时的速度大小。","idea":"由重力做功等于动能增量：mg·2 = ½mv²。","ans":"v² = 2×10×2 = 40，v = 2√10 ≈ 6.3 m/s。"},{"q":"劲度系数 k = 100 N/m 的弹簧被压缩 0.2 m，弹簧的弹性势能为多少？若将质量为 0.2 kg 的小物块放在弹簧旁并释放（水平光滑面），求弹簧恢复原长时物块的速度。","idea":"Ep = ½kx²；恢复原长时弹性势能全部转化为物块动能。","ans":"Ep = ½×100×0.2² = 2 J；½×0.2×v² = 2，v² = 20，v = 2√5 ≈ 4.5 m/s。"}]},{"name":"机械能守恒定律","desc":"在只有重力或弹力做功的情况下，物体的动能和势能相互转化，机械能总量保持不变。表达式为 ½mv1² + mgh1 = ½mv2² + mgh2，或 ΔEk = −ΔEp。若系统中有多个物体，应对整个系统列式。","tip":"判断机械能是否守恒，要看是否只有重力或弹力做功，而不是看物体是否匀速运动。","ex":[{"q":"摆长 L = 1 m 的单摆，将摆球拉至偏角 60° 处由静止释放，取 g = 10 m/s²。求摆球经过最低点时的速度大小。","idea":"摆球下降高度 h = L(1 − cos 60°)，由机械能守恒 v = √(2gh)。","ans":"h = 1×(1 − 0.5) = 0.5 m，v = √(2×10×0.5) = √10 ≈ 3.2 m/s。"},{"q":"质量 m1 = 2 kg 的物体放在光滑水平桌面上，通过轻绳跨过光滑定滑轮与质量 m2 = 1 kg 的物体相连，m2 开始时离地高 h = 1 m。释放后 m2 落地前，求 m2 落地瞬间的速度大小（取 g = 10 m/s²）。","idea":"系统机械能守恒：m2 减少的重力势能转化为两物体的动能，动能为 ½(m1 + m2)v²。","ans":"m2gh = ½(m1 + m2)v²，10×1 = ½×3×v²，v² = 20/3，v ≈ 2.6 m/s。"}]}]},{"title":"第十章 实验：曲线运动与机械能（必修第二册）","items":[{"name":"探究平抛运动的特点","desc":"用斜槽和描迹法研究平抛运动：每次从斜槽同一位置由静止释放小球，记录轨迹上若干点的坐标 (x, y)，由 x = v0 t 和 y = ½gt² 求初速度 v0 = x√(g / (2y))。利用频闪照片时，若相邻位置时间间隔为 T，则竖直方向 Δy = gT²，水平方向 v0 = Δx / T。","tip":"斜槽末端必须水平，且每次释放的位置必须相同，否则初速度不同，实验失败。","ex":[{"q":"频闪照片中相邻两位置的水平间距为 0.20 m，闪光时间间隔为 0.1 s，求小球的平抛初速度。","idea":"水平方向匀速运动，v0 = Δx / T。","ans":"v0 = 0.20 / 0.1 = 2 m/s。"},{"q":"频闪照片中，竖直方向相邻位置的位移之差 Δy = 0.1 m，取 g = 10 m/s²，求闪光的时间间隔 T。","idea":"平抛运动竖直方向是匀加速运动，Δy = gT²。","ans":"T = √(Δy / g) = √(0.1 / 10) = 0.1 s。"}]},{"name":"验证机械能守恒定律","desc":"让重物自由下落，打点计时器在纸带上记录下落过程。测得某点 B 的下落高度 h，由相邻点求出 B 点瞬时速度 vB = (hC − hA) / (2T)。若 ½mvB² 与 mgh 在误差范围内相等，则机械能守恒。由于存在空气阻力和限位孔摩擦，实验中动能增加量通常略小于重力势能减少量。","tip":"应先接通电源再释放纸带；选取的点应距离起始点较远，以便减小测量误差。","ex":[{"q":"质量 m = 1 kg 的重锤，纸带上 B 点距起始点 O 的下落高度为 0.20 m，测得 B 点速度为 1.96 m/s，取 g = 9.8 m/s²。求重力势能减少量与动能增加量，并判断机械能是否守恒。","idea":"ΔEp = mgh，ΔEk = ½mv²，比较二者大小。","ans":"ΔEp = 1×9.8×0.20 = 1.96 J，ΔEk = ½×1×1.96² ≈ 1.92 J，二者在实验误差范围内近似相等，机械能基本守恒。"},{"q":"为什么实验中得到的动能增加量常略小于重力势能减少量？","idea":"分析实验中存在的非重力做功。","ans":"重物下落过程中受到空气阻力，纸带与限位孔之间存在摩擦，这些阻力做负功，使部分机械能转化为内能，故动能增加量小于重力势能减少量。"}]},{"name":"探究向心力大小与哪些因素有关","desc":"用向心力演示器探究时采用控制变量法。向心力公式 F = mω²r = mv²/r。保持两个因素不变，研究向心力与另一个因素的关系：质量越大、半径越大、角速度越大，向心力越大；其中向心力与角速度的平方成正比。","tip":"改变角速度时，要保持质量和半径不变，且注意向心力与 ω²（而不是 ω）成正比。","ex":[{"q":"探究中保持小球质量和半径不变，将角速度增大为原来的 2 倍，向心力变为原来的几倍？","idea":"由 F = mω²r，F 与 ω² 成正比。","ans":"向心力变为原来的 4 倍。"},{"q":"质量 m = 0.2 kg 的小球做半径 r = 0.1 m 的匀速圆周运动，角速度 ω = 10 rad/s，求向心力的大小。","idea":"F = mω²r。","ans":"F = 0.2 × 10² × 0.1 = 2 N。"}]}]},{"title":"第十一章 静电场（必修第三册）","items":[{"name":"库仑定律与电场强度","desc":"真空中两个点电荷之间的库仑力 F = kQ1Q2 / r²，静电力常量 k = 9.0×10⁹ N·m²/C²，同种电荷相斥，异种电荷相吸。电场强度 E = F / q，点电荷周围的场强 E = kQ / r²，方向规定为正电荷受力方向。电荷守恒定律：电荷既不能创生也不能消灭，只能从一个物体转移到另一个物体。","tip":"计算库仑力时先取绝对值计算大小，再根据电性判断方向；电场强度与试探电荷 q 无关。","ex":[{"q":"真空中两点电荷 q1 = 2×10⁻⁶ C，q2 = −4×10⁻⁶ C，相距 0.2 m。求它们之间库仑力的大小和性质。","idea":"F = k|q1q2| / r²，异种电荷相互吸引。","ans":"F = 9.0×10⁹ × 2×10⁻⁶ × 4×10⁻⁶ / 0.2² = 1.8 N，为引力。"},{"q":"在距点电荷 Q = 1.0×10⁻⁸ C 为 0.3 m 处，求该点的电场强度大小和方向（Q 为正电荷）。","idea":"E = kQ / r²，方向沿两者连线背离 Q。","ans":"E = 9.0×10⁹ × 1.0×10⁻⁸ / 0.3² = 1000 N/C，方向沿连线背离 Q。"}]},{"name":"电场线、电势能、电势与电势差","desc":"电场线的切线方向表示场强方向，电场线越密场强越大；沿电场线方向电势逐渐降低。电势能 Ep = qφ。电场力做功 W_AB = Ep_A − Ep_B = qU_AB，电势差 U_AB = φA − φB = W_AB / q。电势与零势能点的选取有关，电势差与零势能点无关。","tip":"代入公式时 q 要带正负号；电子的电荷量为负，计算时注意符号。","ex":[{"q":"将电荷量 q = 2×10⁻⁸ C 的正电荷从 A 点移到 B 点，电场力做功 W = 4×10⁻⁷ J。求 A、B 两点间的电势差。","idea":"U_AB = W_AB / q。","ans":"U_AB = 4×10⁻⁷ / (2×10⁻⁸) = 20 V，即 A 点电势比 B 点高 20 V。"},{"q":"一个电子（电荷量 e = 1.6×10⁻¹⁹ C）从电势 φA = −10 V 的 A 点移到电势 φB = +5 V 的 B 点，求电场力做的功及电子电势能的变化。","idea":"U_AB = φA − φB = −15 V；W = qU_AB，电荷 q = −e。","ans":"W = (−1.6×10⁻¹⁹)×(−15) = 2.4×10⁻¹⁸ J（电场力做正功），电子电势能减少 2.4×10⁻¹⁸ J。"}]},{"name":"电容器","desc":"电容器的电容 C = Q / U，单位是法拉（F）。平行板电容器的电容 C = εS / (4πkd)，与板间距离 d 成反比，与正对面积 S 成正比。电容器充电后与电源断开时，电荷量 Q 不变；保持与电源相连时，电压 U 不变。","tip":"判断电容变化时要看 d、S、ε 的变化；断开电源时 Q 不变，两板间场强 E = U/d = Q/(Cd) 与 d 无关。","ex":[{"q":"电容为 20 μF 的电容器充电至电压 100 V，求其所带的电荷量。","idea":"Q = CU。","ans":"Q = 20×10⁻⁶ × 100 = 2×10⁻³ C。"},{"q":"上述电容器充电后与电源断开，若将两极板间距离减半，求此时两极板间的电压。","idea":"断开电源 Q 不变，d 减半使 C 加倍，由 U = Q / C 得 U 减半。","ans":"C' = 2C，U' = Q / C' = U / 2 = 50 V。"}]},{"name":"带电粒子在电场中的加速与偏转","desc":"带电粒子在电场中加速：由动能定理 qU = ½mv²，v = √(2qU / m)。垂直进入匀强电场时做类平抛运动，加速度 a = qU / (md)，穿过电场的时间 t = L / v0，偏移量 y = ½at² = qUL² / (2mdv0²)，偏转角 tan θ = at / v0。","tip":"粒子能否穿出极板要比较偏移量 y 与板间距离 d 的一半；带电粒子的重力通常可以忽略。","ex":[{"q":"电子（质量 9.1×10⁻³¹ kg，电荷量 1.6×10⁻¹⁹ C）从静止经 455 V 的电压加速，求它获得的速度大小。","idea":"由 qU = ½mv²，v = √(2qU / m)。","ans":"v = √(2×1.6×10⁻¹⁹×455 / 9.1×10⁻³¹) ≈ 1.3×10⁷ m/s。"},{"q":"质量 m = 1×10⁻⁴ kg、电荷量 q = 1×10⁻⁶ C 的带正电粒子，以 v0 = 10 m/s 的速度垂直进入两平行板间的匀强电场，板间电压 U = 100 V，板间距 d = 0.1 m，板长 L = 0.2 m。求粒子离开电场时的偏移量。","idea":"a = qU / (md)，t = L / v0，y = ½at²。","ans":"a = 1×10⁻⁶×100 / (1×10⁻⁴×0.1) = 10 m/s²，t = 0.2/10 = 0.02 s，y = ½×10×(0.02)² = 2×10⁻³ m = 2 mm（小于 d/2 = 50 mm，粒子能穿出）。"}]}]},{"title":"第十二章 恒定电流（必修第三册）","items":[{"name":"电流、欧姆定律与电阻定律","desc":"电流 I = q / t，单位是安培（A）。欧姆定律 I = U / R。电阻定律 R = ρL / S，ρ 为材料的电阻率，L 为长度，S 为横截面积。电阻率与材料和温度有关，金属的电阻率随温度升高而增大。","tip":"导体的电阻由材料和几何尺寸决定，与电压和电流无关；拉长导线时，体积不变，故 L 增大、S 减小。","ex":[{"q":"某导线 1 min 内通过横截面的电荷量为 60 C，求电流大小。若该导线长 1 m、横截面积 1 mm²、电阻为 4 Ω，求材料的电阻率。","idea":"I = q / t；ρ = RS / L，注意单位换算 1 mm² = 1×10⁻⁶ m²。","ans":"I = 60 / 60 = 1 A；ρ = 4×1×10⁻⁶ / 1 = 4×10⁻⁶ Ω·m。"},{"q":"一根粗细均匀的电阻丝，阻值为 R，若将其均匀拉长为原来的 2 倍，求电阻变为多少。","idea":"拉长后体积不变，L 变为 2L，S 变为 S/2，代入 R = ρL / S。","ans":"R' = ρ·2L / (S/2) = 4ρL / S = 4R。"}]},{"name":"串并联电路、电功与电功率、焦耳定律","desc":"串联电路：电流处处相等，R = R1 + R2，电压按电阻分配。并联电路：电压相等，1/R = 1/R1 + 1/R2，电流按电阻反比分配。电功 W = UIt，电功率 P = UI。纯电阻电路中电功等于电热，Q = I²Rt，电功率 P = I²R = U²/R。","tip":"非纯电阻电路（如含电动机）中，电功大于电热，不能用 U²/R 计算电功率。","ex":[{"q":"R1 = 6 Ω 与 R2 = 3 Ω 并联后接在 6 V 电源上，求总电阻、总电流和总功率。","idea":"并联总电阻 R = R1R2 / (R1 + R2)，P = U²/R。","ans":"R = 18/9 = 2 Ω；I = 6 / 2 = 3 A；P = 6×3 = 18 W。"},{"q":"额定电压 220 V、额定功率 1000 W 的电炉，接在 220 V 电源上工作 10 min，求消耗的电能和电炉的电阻。","idea":"W = Pt，R = U²/P。","ans":"W = 1000×600 = 6×10⁵ J（约 0.17 kW·h）；R = 220²/1000 = 48.4 Ω。"}]},{"name":"闭合电路欧姆定律","desc":"闭合电路欧姆定律：I = E / (R + r)，其中 E 为电源电动势，r 为内阻。路端电压 U = E − Ir，外电阻增大时路端电压增大。电源的输出功率 P出 = I²R，电源效率 η = U / E = R / (R + r)。","tip":"外电阻等于内阻时输出功率最大；外电阻远大于内阻时效率较高，但输出功率小。","ex":[{"q":"电动势 E = 6 V，内阻 r = 1 Ω 的电源接外电阻 R = 5 Ω，求电路中的电流和路端电压。","idea":"I = E / (R + r)，U = IR。","ans":"I = 6 / (5 + 1) = 1 A；U = 1×5 = 5 V。"},{"q":"电动势 E = 12 V，内阻 r = 2 Ω 的电源接外电阻 R = 4 Ω，求输出功率和电源效率。","idea":"I = E / (R + r)，P出 = I²R，η = R / (R + r)。","ans":"I = 12 / 6 = 2 A；P出 = 2²×4 = 16 W；η = 4 / 6 ≈ 66.7%。"}]},{"name":"电表改装","desc":"表头满偏电流为 Ig，内阻为 Rg。改装为量程 I 的电流表时，并联分流电阻 Rs = Ig·Rg / (I − Ig)；改装为量程 U 的电压表时，串联分压电阻 R = U / Ig − Rg。改装后的电表内阻与原表头内阻不同，测量时要考虑其影响。","tip":"并联电阻是分流，串联电阻是分压；改装后的总内阻不要与原表头混淆。","ex":[{"q":"表头满偏电流 Ig = 1 mA，内阻 Rg = 100 Ω，要将其改装为量程 0.6 A 的电流表，应并联多大的电阻？","idea":"Rs = Ig·Rg / (I − Ig)。","ans":"Rs = 1×10⁻³ × 100 / (0.6 − 0.001) ≈ 0.17 Ω。"},{"q":"用同一表头改装为量程 3 V 的电压表，应串联多大的电阻？","idea":"R = U / Ig − Rg。","ans":"R = 3 / (1×10⁻³) − 100 = 2900 Ω。"}]},{"name":"电阻的测量与实验","desc":"伏安法测电阻分为电流表内接和外接两种。当 Rx 远大于 RA 时用内接法；当 Rx 远小于 RV 时用外接法；若
