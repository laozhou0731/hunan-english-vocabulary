const GRAMMAR = [{"title":"一、动词时态","items":[{"name":"一般现在时","desc":"表示经常性、习惯性的动作，或客观事实与真理。结构：主语 + 动词原形（第三人称单数加 -s / -es）。","tip":"常与 always, usually, often, every day 等连用。","ex":[["She reads English every morning.","她每天早上读英语。"],["The earth goes around the sun.","地球绕着太阳转。"]]},{"name":"一般过去时","desc":"表示过去某个时间发生的动作或存在的状态。结构：动词过去式（be 动词用 was / were）。","tip":"常与 yesterday, last week, in 2008, just now 等过去时间状语连用。","ex":[["I visited my grandma last weekend.","我上个周末去看望了奶奶。"],["He was ill yesterday.","他昨天生病了。"]]},{"name":"一般将来时","desc":"表示将来要发生的动作。结构：will / shall + 动词原形；be going to + 动词原形 表示计划或有迹象的将来；be about to 表示即将发生。","ex":[["We will hold a sports meeting next month.","我们下个月将举行运动会。"],["It is going to rain soon.","天快要下雨了。"]]},{"name":"现在进行时","desc":"表示说话时正在进行的动作，也可表示最近一段时间内的动作，或按计划将要发生的安排。结构：am / is / are + doing。","ex":[["They are playing football now.","他们现在正在踢足球。"],["I am meeting Tom tomorrow.","我明天要和汤姆见面。"]]},{"name":"现在完成时","desc":"表示过去发生的动作对现在造成影响，或动作从过去持续到现在。结构：have / has + 过去分词。","tip":"常与 already, yet, just, ever, never, for, since 连用。for 后接时间段，since 后接时间点。","ex":[["I have finished my homework.","我已经做完作业了。"],["She has lived here for ten years.","她在这里住了十年。"]]},{"name":"过去完成时","desc":"表示过去某一时间或动作之前已经完成的动作。结构：had + 过去分词。","ex":[["When I arrived, the film had already started.","我到的时候，电影已经开始了。"]]},{"name":"现在完成进行时","desc":"强调动作从过去开始、一直持续到现在，并可能继续下去。结构：have / has been + doing。","ex":[["I have been studying for three hours.","我已经学习三个小时了。"]]}]},{"title":"二、被动语态","items":[{"name":"被动语态的基本形式","desc":"主语是动作的承受者。结构：be + 过去分词（by 引出动作的执行者）。时态变化通过 be 动词体现。","ex":[["The window was broken last night.","窗户昨晚被打破了。"],["English is spoken in many countries.","许多国家都说英语。"]]},{"name":"含情态动词的被动语态","desc":"结构：情态动词 + be + 过去分词。","ex":[["The problem can be solved easily.","这个问题很容易解决。"],["The homework must be finished today.","作业必须今天完成。"]]}]},{"title":"三、非谓语动词","items":[{"name":"不定式（to do）","desc":"可在句中作主语、宾语、宾语补足语，也可作目的状语。","ex":[["To learn English well takes time.","学好英语需要时间。"],["She came here to help us.","她来这里是为了帮助我们。"]]},{"name":"动名词（doing）","desc":"具有名词性质，可作主语、宾语、表语。常接动名词作宾语的动词有 enjoy, finish, mind, consider, suggest, practise 等。","ex":[["Reading is my favourite hobby.","阅读是我最喜欢的爱好。"],["She enjoys swimming in summer.","她喜欢在夏天游泳。"]]},{"name":"现在分词与过去分词","desc":"现在分词（doing）表示主动或进行；过去分词（done）表示被动或完成。可作定语、状语等。","ex":[["The boy running over there is my brother.","那边跑着的男孩是我弟弟。"],["The letter written in English was from Tom.","那封用英语写的信是汤姆寄来的。"],["Walking along the street, I met my teacher.","沿着街道走的时候，我遇到了我的老师。"]]},{"name":"stop 等动词后接 to do 与 doing 的区别","desc":"stop to do 表示停下来去做另一件事；stop doing 表示停止正在做的事。","ex":[["He stopped to smoke.","他停下来抽烟。（停下手中的事去抽烟）"],["He stopped smoking.","他戒烟了。（停止抽烟）"]]}]},{"title":"四、情态动词","items":[{"name":"常用情态动词","desc":"can / could 表示能力或可能；may / might 表示允许或可能性；must 表示必须；should / ought to 表示建议或义务；need 表示需要。情态动词后接动词原形，没有人称和时态变化。","ex":[["You must finish it today.","你今天必须完成它。"],["You don't have to come.","你不必来。"],["You mustn't smoke here.","你不准在这里抽烟。"]]},{"name":"情态动词 + have done","desc":"should have done 表示本应该做而没做；needn't have done 表示本不必做却做了；must have done 表示对过去的推测。","ex":[["You should have called me.","你本该给我打电话的。"],["He must have forgotten it.","他一定是忘了。"]]}]},{"title":"五、虚拟语气","items":[{"name":"与现在事实相反","desc":"结构：If + 主语 + 动词过去式（be 动词多用 were），主句 would / could / might + 动词原形。","ex":[["If I were you, I would take the bus.","如果我是你，我会坐公交车。"]]},{"name":"与过去事实相反","desc":"结构：If + 主语 + had done，主句 would / could / might + have done。","ex":[["If we had left earlier, we would have caught the train.","如果我们早点出发，就能赶上火车了。"]]},{"name":"wish 后的虚拟语气","desc":"wish 后的从句表示与现在或过去事实相反的愿望：表示现在用过去式，表示过去用 had done。","ex":[["I wish I knew the answer.","我真希望我知道答案。（实际不知道）"],["I wish I had listened to you.","我真希望当初听了你的话。（实际没听）"]]}]},{"title":"六、从句","items":[{"name":"定语从句","desc":"修饰名词或代词，由关系代词 who / whom / whose / which / that 或关系副词 when / where / why 引导。","tip":"先行词指人用 who / whom / that；指物用 which / that；先行词是时间、地点用 when / where。","ex":[["The girl who is standing there is my sister.","站在那里的女孩是我的妹妹。"],["This is the place where we first met.","这是我们第一次见面的地方。"]]},{"name":"名词性从句","desc":"在句中充当主语、宾语、表语或同位语。常由 that, whether, if, what, when, who 等引导。","ex":[["What he said is true.","他说的话是真的。（主语从句）"],["I don't know whether he will come.","我不知道他会不会来。（宾语从句）"],["The question is when we'll start.","问题是我们什么时候出发。（表语从句）"],["The news that our team won spread quickly.","我们队获胜的消息很快传开了。（同位语从句）"]]},{"name":"状语从句","desc":"修饰主句的动词、形容词或副词，表示时间、条件、原因、让步、目的、结果等。","tip":"时间：when, as soon as, until；条件：if, unless；原因：because, since, as；让步：although, though；目的：so that；结果：so ... that。","ex":[["I will call you as soon as I arrive.","我一到就给你打电话。（时间）"],["You will fail unless you work harder.","除非你更加努力，否则你会失败。（条件）"],["Although it was raining, they went out.","尽管下着雨，他们还是出去了。（让步）"]]}]},{"title":"七、倒装与强调","items":[{"name":"部分倒装","desc":"否定副词（never, seldom, hardly, rarely, little 等）或 only + 状语位于句首时，句子要部分倒装：助动词或情态动词提前到主语前。","ex":[["Never have I seen such a beautiful view.","我从未见过如此美丽的景色。"],["Hardly had I got home when it started to rain.","我刚到家，天就开始下雨了。"],["Only then did I understand the problem.","直到那时我才明白这个问题。"]]},{"name":"强调句型","desc":"结构：It is / was + 被强调部分 + that / who + 其余部分。被强调部分可以是主语、宾语或状语。去掉 It is ... that 后句子仍然完整。","ex":[["It was in 2008 that he joined the army.","他是在2008年参军的。（强调时间）"],["It is Tom who broke the vase.","打碎花瓶的是汤姆。（强调主语）"]]}]},{"title":"八、主谓一致","items":[{"name":"常见主谓一致规则","desc":"谓语动词的人称和数要与主语一致。Neither ... nor / either ... or / not only ... but also 连接主语时，谓语与靠近它的主语一致。a number of 表示复数，the number of 表示单数。","ex":[["Neither he nor I am wrong.","他和我都没错。"],["A number of students are waiting outside.","很多学生正在外面等候。"],["The number of students is increasing.","学生人数正在增加。"]]}]},{"title":"九、冠词、介词与比较级","items":[{"name":"冠词 a / an / the","desc":"a / an 表示泛指“一个”，元音音素前用 an；the 表示特指或双方都知道的人或事物，也用于世界上独一无二的事物。","ex":[["I have a pen and an eraser.","我有一支钢笔和一块橡皮。"],["The sun rises in the east.","太阳从东方升起。"]]},{"name":"时间介词 in / on / at","desc":"at 用于具体时刻；on 用于具体日期和星期；in 用于月份、季节、年份及较长的时间段。","ex":[["We have class at 8 o'clock.","我们八点上课。"],["I was born on May 5th.","我出生于5月5日。"],["She was born in 2008.","她出生于2008年。"]]},{"name":"形容词和副词的比较级与最高级","desc":"单音节和部分双音节词加 -er / -est；多音节词前加 more / most。少数词不规则变化，如 good–better–best，bad–worse–worst。","ex":[["This book is more interesting than that one.","这本书比那本更有趣。"],["He is the tallest boy in our class.","他是我们班最高的男生。"],["She runs as fast as her brother.","她跑得和她哥哥一样快。"]]}]}];
const SUBJECTS = {"math":[{"title":"第一章 集合与常用逻辑用语","items":[{"name":"集合的基本运算","desc":"交集 A∩B 是由同时属于 A 和 B 的元素组成的集合；并集 A∪B 是由属于 A 或属于 B 的元素组成的集合；补集 ∁ᵤA 是全集 U 中不属于 A 的元素组成的集合。解题时常借助数轴或韦恩图来辅助理解。","tip":"处理区间问题时，要注意端点是否能取到（实心点表示能取到，空心圈表示取不到）。","ex":[{"q":"设 A={x | -1<x<3}，B={x | x≥1}，求 A∩B 与 A∪B。","idea":"在数轴上分别画出 A 与 B，A∩B 取两者公共部分，A∪B 取两者合并的部分。","ans":"A∩B={x | 1≤x<3}；A∪B={x | x>-1}。"},{"q":"已知全集 U={1,2,3,4,5,6}，A={1,3,5}，B={2,3,4}，求 ∁ᵤA、∁ᵤB 以及 A∩(∁ᵤB)。","idea":"先求出 ∁ᵤA 与 ∁ᵤB（取 U 中不在集合里的元素），再与 A 取交集。","ans":"∁ᵤA={2,4,6}；∁ᵤB={1,5,6}；A∩(∁ᵤB)={1,5}。"}]},{"name":"充分条件与必要条件","desc":"若由 p 能推出 q（p⇒q），则 p 是 q 的充分条件，q 是 p 的必要条件；若 p⇒q 且 q⇒p，则 p 与 q 互为充要条件。判断时可转化为集合关系：若 {x | p} 是 {x | q} 的真子集，则 p 是 q 的充分不必要条件。","tip":"记住“小推大”：充分条件对应的集合较小，必要条件对应的集合较大。","ex":[{"q":"“x>2”是“x²>4”的什么条件？","idea":"先判断 x>2 能否推出 x²>4；再判断 x²>4 能否推出 x>2，并找反例。","ans":"x>2 时 x²>4 成立；但 x=-3 时 x²=9>4 而 x<2，因此 x²>4 推不出 x>2。故“x>2”是“x²>4”的充分不必要条件。"},{"q":"已知 p：x<a，q：x<3。若 p 是 q 的充分不必要条件，求实数 a 的取值范围。","idea":"p⇒q 等价于集合 (-∞,a) 包含于 (-∞,3)；“不必要”要求二者不相等。","ans":"由 a≤3 得充分性成立；a=3 时两集合相等（充要），应排除，故 a<3，即 a∈(-∞,3)。"}]}]},{"title":"第二章 等式与不等式","items":[{"name":"基本不等式","desc":"对任意正实数 a、b，有 (a+b)/2 ≥ √(ab)，当且仅当 a=b 时取等号。由此可得：若积 xy 为定值，则和 x+y 有最小值；若和 x+y 为定值，则积 xy 有最大值。","tip":"使用基本不等式必须同时满足“一正、二定、三相等”三个条件，缺一不可。","ex":[{"q":"已知 x>0，求 x+4/x 的最小值，并指出取得最小值时 x 的值。","idea":"x>0 满足“一正”；x·(4/x)=4 为定值，满足“二定”；用 x+4/x ≥ 2√(x·4/x) 求最小值，再检验等号条件。","ans":"x+4/x ≥ 2√4 = 4，当且仅当 x=4/x，即 x=2 时取等号。最小值为 4，此时 x=2。"},{"q":"已知 x>0，y>0 且 x+2y=1，求 xy 的最大值及取得最大值时 x、y 的值。","idea":"把 2y 看作一项，利用 x+2y ≥ 2√(2xy) 求出 xy 的上界，再验证等号成立条件。","ans":"1=x+2y ≥ 2√(2xy)，得 2xy ≤ 1/4，即 xy ≤ 1/8。等号当 x=2y 时成立，结合 x+2y=1 得 x=1/2，y=1/4。最大值为 1/8。"}]},{"name":"一元二次不等式","desc":"形如 ax²+bx+c>0（或 <0）的不等式称为一元二次不等式。解法是先求对应方程 ax²+bx+c=0 的根（判别式 Δ=b²-4ac），再结合二次函数图象：当 a>0 时，大于零的解在两根之外，小于零的解在两根之间。","tip":"若二次项系数为负，先两边同乘 -1 把它化为正数，并记得不等号方向要改变。","ex":[{"q":"解不等式 x²-5x+6≤0。","idea":"因式分解求根，开口向上，不等式小于等于零时取两根之间（含端点）。","ans":"x²-5x+6=(x-2)(x-3)≤0，两根为 2 和 3，故 2≤x≤3，解集为 [2,3]。"},{"q":"解不等式 -2x²+x+1<0。","idea":"先两边乘 -1 得 2x²-x-1>0 并注意不等号反向，再因式分解求解。","ans":"两边乘 -1 得 2x²-x-1>0，即 (2x+1)(x-1)>0，两根为 -1/2 和 1，故 x<-1/2 或 x>1，解集为 (-∞,-1/2)∪(1,+∞)。"}]}]},{"title":"第三章 函数的性质与指数、对数函数","items":[{"name":"函数的单调性","desc":"设函数 f(x) 定义在区间 D 上，若对任意 x₁<x₂，都有 f(x₁)<f(x₂)，则 f(x) 在 D 上单调递增；若 f(x₁)>f(x₂)，则单调递减。判断单调性的基本方法是定义法：作差 f(x₁)-f(x₂)，并判断其符号。","tip":"定义法的关键是把差式化为若干因式的乘积，逐一判断正负；单调性必须在指定区间上讨论。","ex":[{"q":"用定义证明：函数 f(x)=x+1/x 在区间 (1,+∞) 上单调递增。","idea":"任取 1<x₁<x₂，计算 f(x₂)-f(x₁)，化为 (x₂-x₁)(x₁x₂-1)/(x₁x₂) 的形式，再判断符号。","ans":"f(x₂)-f(x₁)=(x₂-x₁)+(x₁-x₂)/(x₁x₂)=(x₂-x₁)(x₁x₂-1)/(x₁x₂)。由 1<x₁<x₂ 知 x₂-x₁>0，x₁x₂>1，故差值大于 0，所以 f(x) 在 (1,+∞) 上单调递增。"},{"q":"求函数 f(x)=x²-4x+3 的单调递减区间。","idea":"配方得到对称轴，开口向上的二次函数在对称轴左侧递减。","ans":"f(x)=(x-2)²-1，图象开口向上，对称轴为 x=2，故单调递减区间为 (-∞,2]。"}]},{"name":"函数的奇偶性","desc":"若函数 f(x) 的定义域关于原点对称，且对定义域内任意 x 都有 f(-x)=f(x)，则 f(x) 为偶函数；若 f(-x)=-f(x)，则 f(x) 为奇函数。偶函数的图象关于 y 轴对称，奇函数的图象关于原点对称。","tip":"判断奇偶性时，先检查定义域是否关于原点对称，这一步不能省略。","ex":[{"q":"判断函数 f(x)=x³+x 的奇偶性。","idea":"先看定义域 R 是否关于原点对称，再计算 f(-x) 并与 f(x)、-f(x) 比较。","ans":"定义域 R 关于原点对称；f(-x)=(-x)³+(-x)=-(x³+x)=-f(x)，所以 f(x) 是奇函数。"},{"q":"已知 f(x) 是定义在 R 上的奇函数，且当 x≥0 时 f(x)=x²+2x，求 f(-1)。","idea":"利用奇函数 f(-x)=-f(x)，把 f(-1) 转化为 -f(1)，再由 x≥0 时的解析式求 f(1)。","ans":"f(1)=1²+2×1=3，故 f(-1)=-f(1)=-3。"}]},{"name":"指数运算与指数函数","desc":"指数函数定义为 y=a^x（a>0 且 a≠1）。当 a>1 时，函数在 R 上单调递增；当 0<a<1 时，函数在 R 上单调递减。指数函数的图象都过定点 (0,1)，且值域为 (0,+∞)。","tip":"比较幂的大小时，若底数不同，常借助中间量 1 或 0；若底数相同，则根据底数是否大于 1 决定单调性。","ex":[{"q":"比较 1.5^0.3 与 1.5^0.2 的大小，以及 0.8^2.1 与 0.8^2.3 的大小。","idea":"第一组底数 1.5>1，函数递增；第二组底数 0.8<1，函数递减，据此比较指数大小。","ans":"因 1.5>1 且 0.3>0.2，故 1.5^0.3>1.5^0.2；因 0.8<1 且 2.1<2.3，故 0.8^2.1>0.8^2.3。"},{"q":"求函数 y=(1/2)^(x²-2x) 的最大值，并指出取得最大值时 x 的值。","idea":"令 u=x²-2x 并求其最小值；由于底数 1/2 小于 1，y 随 u 增大而减小，故 u 取最小值时 y 最大。","ans":"u=x²-2x=(x-1)²-1 ≥ -1，等号当 x=1 时成立；y=(1/2)^u 递减，所以 y 的最大值为 (1/2)^(-1)=2，此时 x=1。"}]},{"name":"对数运算与对数函数","desc":"若 a^b=N（a>0 且 a≠1），则 b=log_a N。运算法则有 log_a(MN)=log_a M+log_a N，log_a(M/N)=log_a M-log_a N，log_a(M^n)=n·log_a M，换底公式为 log_a N=log_b N/log_b a。对数函数 y=log_a x 在 a>1 时递增，在 0<a<1 时递减，图象过定点 (1,0)。","tip":"真数必须大于 0；解对数方程后要检验每个解是否使真数为正。","ex":[{"q":"计算 log₃18-log₃2 的值。","idea":"利用同底对数的减法法则合并为一个对数，再化简真数。","ans":"log₃18-log₃2=log₃(18/2)=log₃9=2。"},{"q":"解方程 log₂(x+1)+log₂(x-1)=3。","idea":"先写出定义域 x>1，再用加法法则合并，化为整式方程求解，最后检验。","ans":"由定义域 x>1，方程化为 log₂[(x+1)(x-1)]=3，即 x²-1=8，得 x²=9，x=±3。因 x>1，舍去 x=-3，故 x=3。检验：log₂4+log₂2=2+1=3，成立。"}]}]},{"title":"第四章 三角函数","items":[{"name":"三角函数的图象与性质","desc":"正弦函数 y=sin x 与余弦函数 y=cos x 的最小正周期都是 2π，正切函数 y=tan x 的最小正周期是 π。函数 y=Asin(ωx+φ)（A>0，ω>0）的振幅为 A，最小正周期为 T=2π/ω，最大值为 A，最小值为 -A。","tip":"求单调区间与值域时，把 ωx+φ 看作一个整体，再套用正弦函数的相应性质。","ex":[{"q":"求函数 f(x)=2sin(2x-π/3) 的最大值、最小正周期以及单调递增区间。","idea":"最大值由振幅得到；周期 T=2π/2；令 2x-π/3 落在 [-π/2+2kπ, π/2+2kπ] 内，解出 x。","ans":"最大值为 2，最小正周期 T=π。由 -π/2+2kπ≤2x-π/3≤π/2+2kπ，得 -π/12+kπ≤x≤5π/12+kπ，故递增区间为 [kπ-π/12, kπ+5π/12]（k∈Z）。"},{"q":"函数 y=sin(2x+π/6) 的图象可由 y=sin2x 的图象经怎样的平移得到？","idea":"先把 2x+π/6 提出系数 2 化为 2(x+π/12)，看出是对 x 的平移量。","ans":"因为 2x+π/6=2(x+π/12)，所以 y=sin(2x+π/6) 的图象是把 y=sin2x 的图象向左平移 π/12 个单位得到的。"}]},{"name":"三角恒等变换","desc":"两角和与差公式：sin(α±β)=sinα·cosβ±cosα·sinβ，cos(α±β)=cosα·cosβ∓sinα·sinβ。二倍角公式：sin2α=2sinα·cosα，cos2α=cos²α-sin²α=1-2sin²α=2cos²α-1。","tip":"已知一个三角函数值求其他值时，要根据角所在象限确定正负号，不能忽略符号。","ex":[{"q":"已知 sinα=3/5，且 α 为第一象限角，求 sin2α 与 cos2α 的值。","idea":"先由 sin²α+cos²α=1 求出 cosα（第一象限中 cosα>0），再代入二倍角公式。","ans":"cosα=4/5。sin2α=2×(3/5)×(4/5)=24/25；cos2α=(4/5)²-(3/5)²=16/25-9/25=7/25。"},{"q":"求 sin75° 的值。","idea":"把 75° 拆成 45°+30°，再用两角和的正弦公式，并代入特殊角的三角函数值。","ans":"sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√2/2)(√3/2)+(√2/2)(1/2)=(√6+√2)/4。"}]}]},{"title":"第五章 平面向量、复数与解三角形","items":[{"name":"平面向量的数量积","desc":"若向量 a 与 b 的夹角为 θ，则 a·b=|a||b|cosθ；若 a=(x₁,y₁)，b=(x₂,y₂)，则 a·b=x₁x₂+y₁y₂，且 |a|=√(x²+y²)。a⊥b 当且仅当 a·b=0。","tip":"求夹角时用 cosθ=a·b/(|a||b|)，并注意 θ 的取值范围是 [0,π]。","ex":[{"q":"已知 |a|=2，|b|=3，a 与 b 的夹角为 60°，求 a·b 以及 |a+b|。","idea":"a·b 直接用定义式求；|a+b|² 展开为 |a|²+2a·b+|b|²，再开方。","ans":"a·b=2×3×cos60°=3；|a+b|²=4+2×3+9=19，故 |a+b|=√19。"},{"q":"已知 a=(1,2)，b=(x,-1)，若 a⊥b，求 x 的值以及 |b|。","idea":"由 a⊥b 得 a·b=0，列出关于 x 的一次方程；求出 x 后再代入模长公式。","ans":"a·b=x-2=0，得 x=2。此时 b=(2,-1)，|b|=√(4+1)=√5。"}]},{"name":"正弦定理与余弦定理","desc":"在△ABC 中，设 a、b、c 分别是角 A、B、C 的对边，R 为外接圆半径，则正弦定理为 a/sinA=b/sinB=c/sinC=2R；余弦定理为 a²=b²+c²-2bc·cosA，即 cosA=(b²+c²-a²)/(2bc)。面积公式 S=(1/2)bc·sinA。","tip":"已知两边及夹角或三边时用余弦定理；已知两角与一边、或两边与其中一边的对角时用正弦定理，后者要注意可能有两解。","ex":[{"q":"在△ABC 中，已知 A=60°，B=45°，a=√3，求 b。","idea":"由正弦定理 b=a·sinB/sinA，代入 sin45°=√2/2，sin60°=√3/2。","ans":"b=√3×(√2/2)/(√3/2)=√2。"},{"q":"在△ABC 中，a=3，b=5，c=7，求最大角 C 的大小。","idea":"最大边对应最大角，即 C 最大；用余弦定理求 cosC，再由 cosC 的值确定角。","ans":"cosC=(9+25-49)/(2×3×5)=-15/30=-1/2，又 0<C<π，故 C=120°。"}]},{"name":"复数的概念与运算","desc":"形如 a+bi（a，b∈R）的数叫复数，其中 i²=-1，a 为实部，b 为虚部。共轭复数 z̄=a-bi，复数的模 |z|=√(a²+b²)，且 z·z̄=|z|²。除法运算通过分子分母同乘分母的共轭复数来完成。","tip":"运算中遇到 i² 要替换为 -1；两个复数相等，当且仅当实部和虚部分别相等。","ex":[{"q":"计算 (1+2i)(3-i)/(1+i)。","idea":"先算分子 (1+2i)(3-i)，注意 i²=-1；再把结果除以 1+i，即化为分子分母同乘 1-i 的形式，或直接观察因式。","ans":"(1+2i)(3-i)=3-i+6i-2i²=5+5i；(5+5i)/(1+i)=5(1+i)/(1+i)=5。"},{"q":"设 z=a+i（a∈R），若 z² 为纯虚数，求实数 a 的值。","idea":"先展开 z²，分离实部与虚部；纯虚数要求实部为 0 且虚部不为 0。","ans":"z²=a²+2ai+i²=(a²-1)+2ai。由 a²-1=0 且 2a≠0，得 a=±1。"}]}]},{"title":"第六章 立体几何","items":[{"name":"空间几何体的表面积与体积","desc":"圆柱的侧面积为 2πrh，表面积为 2πr(r+h)，体积为 πr²h；圆锥的母线为 l，侧面积为 πrl，体积为 (1/3)πr²h；球的表面积为 4πR²，体积为 (4/3)πR³。棱柱与棱锥的体积分别为 底面积×高 与 (1/3)×底面积×高。","tip":"圆锥的母线 l=√(r²+h²)，求侧面积前要先求出 l。","ex":[{"q":"一个圆锥的底面半径为 3，高为 4，求它的侧面积和体积。","idea":"先由勾股定理求母线 l；再分别代入侧面积公式 πrl 与体积公式 (1/3)πr²h。","ans":"l=√(3²+4²)=5，侧面积为 π×3×5=15π；体积为 (1/3)π×9×4=12π。"},{"q":"一个球的体积为 36π，求它的表面积。","idea":"由体积公式 (4/3)πR³=36π 解出 R，再代入表面积公式。","ans":"R³=27，得 R=3；表面积为 4π×3²=36π。"}]},{"name":"直线与平面垂直的判定","desc":"判定定理：若一条直线与平面内两条相交直线都垂直，则该直线与此平面垂直。性质：若直线 l 垂直于平面 α，则 l 垂直于 α 内的任意直线。证明线面垂直时，常通过证明线线垂直来完成。","tip":"判定定理中“相交”二字必不可少，缺少这一条件是证明题中的常见失分点。","ex":[{"q":"在正方体 ABCD-A₁B₁C₁D₁ 中，证明 BD⊥平面 AA₁C₁C。","idea":"找到平面 AA₁C₁C 内两条相交直线，分别证明 BD 与它们垂直：AA₁ 与 AC 相交于 A。","ans":"因 AA₁⊥平面 ABCD，BD 在平面 ABCD 内，故 AA₁⊥BD；又 ABCD 为正方形，AC⊥BD。AA₁ 与 AC 相交于 A 且都在平面 AA₁C₁C 内，所以 BD⊥平面 AA₁C₁C。"},{"q":"在四棱锥 P-ABCD 中，PA⊥平面 ABCD，四边形 ABCD 为矩形，证明 BC⊥PB。","idea":"先证 BC⊥平面 PAB：BC⊥AB（矩形），BC⊥PA（PA⊥底面）；再由线面垂直得到线线垂直。","ans":"BC⊥AB，且 BC⊥PA，AB 与 PA 相交于 A，故 BC⊥平面 PAB。又 PB 在平面 PAB 内，所以 BC⊥PB。"}]},{"name":"用空间向量求直线与平面所成角","desc":"设直线的方向向量为 m，平面的法向量为 n，直线与平面所成角为 θ，则 sinθ=|cos⟨m,n⟩|=|m·n|/(|m||n|)，且 θ∈[0°,90°]。关键是先建立空间直角坐标系，写出相关点的坐标，再求法向量。","tip":"由于线面角不超过 90°，计算时要对内积取绝对值；平面法向量可由 n·(两个不平行的方向向量)=0 解出。","ex":[{"q":"正方体 ABCD-A₁B₁C₁D₁ 的棱长为 1，求直线 AB₁ 与底面 ABCD 所成角的大小。","idea":"以 A 为原点建立坐标系；底面 ABCD 的法向量取 (0,0,1)，直线 AB₁ 的方向向量为 B₁-A。","ans":"A(0,0,0)，B₁(1,0,1)，AB₁ 的方向向量 m=(1,0,1)，|m|=√2；底面法向量 n=(0,0,1)。sinθ=|m·n|/(|m||n|)=1/√2，故 θ=45°。"},{"q":"正方体 ABCD-A₁B₁C₁D₁ 的棱长为 1，求直线 AB₁ 与平面 BDD₁B₁ 所成角的正弦值及角度。","idea":"取 B、D、B₁ 的坐标求平面 BDD₁B₁ 的法向量 n，满足 n 与 BD、BB₁ 都垂直；再与 AB₁ 的方向向量求夹角。","ans":"A(0,0,0)，B(1,0,0)，D(0,1,0)，B₁(1,0,1)。BD=(-1,1,0)，BB₁=(0,0,1)，可取 n=(1,1,0)。AB₁=(1,0,1)，m·n=1，|m|=|n|=√2，sinθ=1/2，故 θ=30°。"}]}]},{"title":"第七章 直线与圆","items":[{"name":"直线的方程与两直线的位置关系","desc":"直线的一般式为 Ax+By+C=0，斜率 k=-A/B（B≠0）。对于 l₁：y=k₁x+b₁ 与 l₂：y=k₂x+b₂，两直线平行的条件是 k₁=k₂ 且 b₁≠b₂，垂直的条件是 k₁·k₂=-1。点 P(x₀,y₀) 到直线 Ax+By+C=0 的距离为 d=|Ax₀+By₀+C|/√(A²+B²)。","tip":"用斜率判断平行或垂直时，要先单独考虑斜率不存在（直线竖直）的情况。","ex":[{"q":"求过点 P(1,2) 且与直线 2x+y-5=0 垂直的直线方程。","idea":"已知直线斜率为 -2，所求直线斜率为 1/2；再用点斜式写出方程并化为一般式。","ans":"y-2=(1/2)(x-1)，化简得 x-2y+3=0。验证：点 (1,2) 满足方程；两直线法向量 (2,1) 与 (1,-2) 的内积为 0，确实垂直。"},{"q":"求点 P(2,1) 到直线 3x+4y-5=0 的距离。","idea":"直接代入点到直线的距离公式。","ans":"d=|3×2+4×1-5|/√(3²+4²)=|5|/5=1。"}]},{"name":"直线与圆的位置关系","desc":"圆的标准方程为 (x-a)²+(y-b)²=r²，圆心为 (a,b)，半径为 r。判断直线与圆的位置关系，可比较圆心到直线的距离 d 与半径 r：d<r 时相交，d=r 时相切，d>r 时相离。直线被圆截得的弦长为 2√(r²-d²)。","tip":"求弦长时常用垂径定理：半弦、弦心距与半径构成直角三角形。","ex":[{"q":"圆 x²+y²=25 被直线 4x+3y-15=0 截得的弦长是多少？","idea":"先求圆心 (0,0) 到直线的距离 d；再用弦长公式 2√(r²-d²)。","ans":"d=|-15|/√(16+9)=3，r=5，弦长为 2√(25-9)=2×4=8。"},{"q":"求过点 P(5,0) 且与圆 x²+y²=4 相切的直线方程。","idea":"竖直线 x=5 到原点距离为 5，不与圆相切；设斜率为 k 的直线 y=k(x-5)，令原点到它的距离等于 2。","ans":"直线为 kx-y-5k=0，由 |5k|/√(k²+1)=2 得 25k²=4k²+4，k²=4/21，k=±2√21/21。所求切线为 y=±(2√21/21)(x-5)。"}]}]},{"title":"第八章 圆锥曲线","items":[{"name":"椭圆","desc":"平面内到两定点 F₁、F₂ 的距离之和为常数（且大于 |F₁F₂|）的点的轨迹叫椭圆。焦点在 x 轴上时标准方程为 x²/a²+y²/b²=1（a>b>0），满足 c²=a²-b²，离心率 e=c/a，且 0<e<1。","tip":"焦点位于哪条坐标轴，取决于分母较大的那一项；椭圆中 a 最大，且 a²=b²+c²。","ex":[{"q":"已知椭圆 x²/25+y²/9=1，求它的焦点坐标与离心率。","idea":"由 a²=25，b²=9 求 c²=a²-b²；焦点在 x 轴上。","ans":"c²=25-9=16，c=4，焦点为 (±4,0)，离心率 e=4/5。"},{"q":"若椭圆 x²/m+y²/4=1 的焦距为 2，求实数 m 的值。","idea":"焦点可能在 x 轴或 y 轴上，需分两种情况讨论，并由 c=1 列方程。","ans":"若焦点在 x 轴上，则 m>4，c²=m-4=1，得 m=5；若焦点在 y 轴上，则 0<m<4，c²=4-m=1，得 m=3。故 m=3 或 m=5。"}]},{"name":"双曲线","desc":"平面内到两定点 F₁、F₂ 的距离之差的绝对值为常数（且小于 |F₁F₂|）的点的轨迹叫双曲线。焦点在 x 轴上的标准方程为 x²/a²-y²/b²=1，满足 c²=a²+b²，渐近线方程为 y=±(b/a)x，离心率 e=c/a>1。","tip":"双曲线中 c 最大，且 c²=a²+b²，这与椭圆的关系正好相反，不要混淆。","ex":[{"q":"求双曲线 x²/4-y²/5=1 的渐近线方程与离心率。","idea":"由 a²=4，b²=5 得 a=2，b=√5；再求 c 与渐近线斜率 ±b/a。","ans":"c²=4+5=9，c=3，离心率 e=3/2；渐近线方程为 y=±(√5/2)x。"},{"q":"双曲线 x²/9-y²/16=1 上一点 P 到右焦点 F₂ 的距离为 10，求 P 到左焦点 F₁ 的距离。","idea":"由双曲线定义，||PF₁|-|PF₂||=2a=6；P 可能在左支或右支，需分类讨论。","ans":"a=3，c=5。若 P 在右支，则 |PF₁|-|PF₂|=6，得 |PF₁|=16；若 P 在左支，则 |PF₂|-|PF₁|=6，得 |PF₁|=4。两种情况都满足几何条件（左支上点到 F₂ 的距离最小为 a+c=8≤10，右支上点到 F₂ 的距离最小为 c-a=2≤10），故 |PF₁|=4 或 16。"}]},{"name":"抛物线","desc":"平面内到定点 F 与定直线 l（F 不在 l 上）距离相等的点的轨迹叫抛物线。焦点在 x 轴正半轴时标准方程为 y²=2px（p>0），焦点为 (p/2,0)，准线方程为 x=-p/2。抛物线上任一点到焦点的距离等于它到准线的距离。","tip":"常利用“到焦点的距离 = 到准线的距离”把焦半径转化为横坐标之和加上 p/2，简化计算。","ex":[{"q":"抛物线 y²=8x 上一点 P 的横坐标为 4，求点 P 到焦点的距离。","idea":"由 2p=8 得 p=4，准线为 x=-2；利用焦半径公式 |PF|=x+p/2。","ans":"p=4，准线 x=-2，|PF|=4-(-2)=6。"},{"q":"过抛物线 y²=4x 的焦点 F 作倾斜角为 45° 的直线，与抛物线交于 A、B 两点，求 |AB|。","idea":"先写出直线方程 y=x-1，与抛物线联立得关于 x 的二次方程，用韦达定理求 x₁+x₂；过焦点弦长为 x₁+x₂+p。","ans":"由 (x-1)²=4x 得 x²-6x+1=0，x₁+x₂=6；由 y²=4x 知 p=2，故 |AB|=x₁+x₂+p=6+2=8。"}]}]},{"title":"第九章 导数及其应用","items":[{"name":"导数的几何意义与切线方程","desc":"函数 f(x) 在 x₀ 处的导数 f′(x₀) 是曲线 y=f(x) 在点 (x₀,f(x₀)) 处切线的斜率，切线方程为 y-f(x₀)=f′(x₀)(x-x₀)。常用求导公式包括 (xⁿ)′=n·xⁿ⁻¹，(sinx)′=cosx，(cosx)′=-sinx，(eˣ)′=eˣ，(lnx)′=1/x。","tip":"要区分“在某点处的切线”与“过某点的切线”：后者的切点未知，需要先设切点。","ex":[{"q":"求曲线 y=x³-2x 在点 (1,-1) 处的切线方程。","idea":"求导得 y′=3x²-2，代入 x=1 得切线斜率；再用点斜式写出方程。","ans":"y′=3x²-2，当 x=1 时斜率 k=1。切线为 y+1=x-1，即 x-y-2=0。"},{"q":"求过原点且与曲线 y=x²+1 相切的直线方程。","idea":"设切点为 (t,t²+1)，切线斜率为 2t；切线过原点，代入后解出 t。","ans":"切线方程为 y-(t²+1)=2t(x-t)，代入 (0,0) 得 -(t²+1)=-2t²，即 t²=1，t=±1。对应斜率为 ±2，切线方程为 y=2x 或 y=-2x。"}]},{"name":"利用导数研究函数的单调性与极值","desc":"若在某区间内 f′(x)>0，则 f(x) 在该区间上单调递增；若 f′(x)<0，则单调递减。极值点处 f′(x)=0，且其两侧 f′(x) 的符号发生改变：由正变负为极大值点，由负变正为极小值点。","tip":"求单调区间必须先确定定义域；f′(x)=0 的点不一定是极值点，例如 y=x³ 在 x=0 处，还需检验两侧符号是否改变。","ex":[{"q":"求函数 f(x)=x³-3x 的单调区间与极值。","idea":"求导分解 f′(x)=3(x-1)(x+1)，列表判断各区间符号，再求极值点处的函数值。","ans":"f′(x)=3(x-1)(x+1)。当 x<-1 或 x>1 时 f′(x)>0，递增；当 -1<x<1 时 f′(x)<0，递减。极大值 f(-1)=-1+3=2，极小值 f(1)=1-3=-2。"},{"q":"已知函数 f(x)=x³-ax 在 x=1 处取得极值，求 a 的值，并验证该点确为极值点。","idea":"极值点处导数为 0，由 f′(1)=0 求 a；再检验 f′(x) 在 x=1 两侧是否变号。","ans":"f′(x)=3x²-a，f′(1)=3-a=0，得 a=3。此时 f′(x)=3(x-1)(x+1)，在 x=1 两侧由负变正，故 x=1 为极小值点。"}]},{"name":"导数与函数的最值","desc":"在闭区间 [a,b] 上连续的函数，其最大值与最小值一定在极值点或端点处取得。求法是：求导数，解出 f′(x)=0 的点，然后比较这些点与端点处的函数值。利用最值还可以证明不等式。","tip":"求最值时要把所有极值点与两个端点的函数值全部比较，不能只看其中一个极值。","ex":[{"q":"求函数 f(x)=x³-3x 在区间 [-2,2] 上的最大值与最小值。","idea":"极值点为 x=±1；分别计算两个极值点与两个端点的函数值并比较。","ans":"f(-2)=-2，f(-1)=2，f(1)=-2，f(2)=2。故最大值为 2，最小值为 -2。"},{"q":"证明：当 x>0 时，x-ln x≥1 恒成立。","idea":"构造 g(x)=x-ln x-1，求导分析单调性，证明 g(x) 的最小值不小于 0。","ans":"g′(x)=1-1/x，x∈(0,1) 时 g′<0，x∈(1,+∞) 时 g′>0，故 g(x) 在 x=1 处取最小值 g(1)=0。因此 g(x)≥0，即 x-ln x≥1 恒成立。"}]}]},{"title":"第十章 数列","items":[{"name":"等差数列","desc":"若 a_{n+1}-a_n=d（d 为常数），则数列 {a_n} 为等差数列，其通项为 a_n=a₁+(n-1)d。前 n 项和为 S_n=n(a₁+a_n)/2=na₁+n(n-1)d/2。若 m+n=p+q，则 a_m+a_n=a_p+a_q。","tip":"第 n 项是 a₁+(n-1)d，不是 a₁+nd；项数与公差的关系最容易出错。","ex":[{"q":"等差数列 {a_n} 中，a₃=7，a₇=15，求通项公式及 S₁₀。","idea":"由 a₇-a₃=4d 求公差 d，再求 a₁，写出通项，最后用求和公式。","ans":"4d=15-7=8，d=2；a₁=a₃-2d=3；a_n=3+2(n-1)=2n+1；a₁₀=21，S₁₀=10×(3+21)/2=120。"},{"q":"求 1+3+5+…+99 的值（即前 50 个奇数之和）。","idea":"这是首项为 1、公差为 2、共 50 项的等差数列，套用求和公式。","ans":"首项 1，末项 99，项数 50，S=50×(1+99)/2=2500。"}]},{"name":"等比数列","desc":"若 a_{n+1}/a_n=q（q 为非零常数），则数列 {a_n} 为等比数列，通项为 a_n=a₁·qⁿ⁻¹。当 q≠1 时，前 n 项和为 S_n=a₁(1-qⁿ)/(1-q)。若 a、G、b 成等比数列，则 G²=ab（且 G≠0）。","tip":"公比 q 不能为 0；求和时要先讨论 q=1 的情况，此时 S_n=n·a₁。","ex":[{"q":"等比数列 {a_n} 中，a₁=2，a₄=16，求公比 q 及 S₅。","idea":"由 a₄=a₁q³ 求出 q³，再代入求和公式。","ans":"16=2q³，得 q³=8，q=2（公比为实数）；S₅=2(1-2⁵)/(1-2)=2×31=62。"},{"q":"若 S_n=3ⁿ+k 是某等比数列的前 n 项和，求常数 k 的值。","idea":"由 a_n=S_n-S_{n-1} 求出前三项，再利用等比中项 a₂²=a₁a₃ 列方程。","ans":"a₁=S₁=3+k，a₂=S₂-S₁=6，a₃=S₃-S₂=18。由 a₂²=a₁a₃ 得 36=18(3+k)，得 k=-1。验证：S_n=3ⁿ-1 时 a_n=2·3ⁿ⁻¹，确为等比数列。"}]},{"name":"数列求和：错位相减法与裂项相消法","desc":"若数列的每一项是一个等差数列与一个等比数列对应项之积，常用错位相减法求和。若通项可拆成两项之差，如 1/(n(n+1))=1/n-1/(n+1)，则用裂项相消法求和，前后项会相互抵消。","tip":"错位相减后要仔细核对项数和符号；裂项相消后要检查首尾剩余的项。","ex":[{"q":"求 1/(1×2)+1/(2×3)+…+1/(n(n+1)) 的和。","idea":"利用 1/(k(k+1))=1/k-1/(k+1)，逐项展开后中间项相互抵消。","ans":"S_n=(1-1/2)+(1/2-1/3)+…+(1/n-1/(n+1))=1-1/(n+1)=n/(n+1)。"},{"q":"求数列 a_n=n·2ⁿ 的前 n 项和 S_n。","idea":"写出 S_n 与 2S_n，两式相减，中间为等比数列求和，再化简。","ans":"S_n=1·2+2·2²+…+n·2ⁿ，2S_n=1·2²+…+n·2ⁿ⁺¹。相减得 -S_n=2+2²+…+2ⁿ-n·2ⁿ⁺¹=2ⁿ⁺¹-2-n·2ⁿ⁺¹，故 S_n=(n-1)·2ⁿ⁺¹+2。验证 n=2：S₂=2+8=10，公式得 8+2=10。"}]}]},{"title":"第十一章 计数原理与概率统计","items":[{"name":"排列与组合","desc":"从 n 个不同元素中取出 m 个并按顺序排成一列，排列数为 A(n,m)=n(n-1)…(n-m+1)=n!/(n-m)!。不考虑顺序的组合数为 C(n,m)=n!/(m!(n-m)!)，且 C(n,m)=C(n,n-m)。","tip":"先判断问题是否与顺序有关；遇到“至少”“至多”类问题，常用间接法（先算总数，再减去不符合的情况）。","ex":[{"q":"从 5 名男生和 4 名女生中选出 3 人，要求至少有 1 名女生，共有多少种选法？","idea":"用间接法：总选法 C(9,3) 减去全是男生的选法 C(5,3)。","ans":"C(9,3)=84，C(5,3)=10，所以共有 84-10=74 种选法。"},{"q":"把 4 本不同的书分给 3 个人，每人至少分到 1 本，共有多少种分法？","idea":"先把 4 本书分成 2、1、1 三组（有 C(4,2)=6 种），再把三组分给 3 个人（有 3!=6 种）。","ans":"分组方法数为 C(4,2)=6，分配方法数为 3!=6，共 6×6=36 种分法。"}]},{"name":"二项式定理","desc":"(a+b)ⁿ=C(n,0)aⁿ+C(n,1)aⁿ⁻¹b+…+C(n,n)bⁿ，其通项为 T_{k+1}=C(n,k)aⁿ⁻ᵏbᵏ（k=0,1,…,n）。所有二项式系数之和为 2ⁿ。","tip":"求某一特定项时，令字母的指数等于所需值，解出 k；注意展开式中可能出现的符号 (-1)ᵏ。","ex":[{"q":"求 (x-2/x)⁶ 展开式中的常数项。","idea":"写出通项，合并 x 的指数，令指数为 0 解出 k，再计算系数。","ans":"通项为 C(6,k)x⁶⁻ᵏ(-2/x)ᵏ=C(6,k)(-2)ᵏx⁶⁻²ᵏ。令 6-2k=0，得 k=3，常数项为 C(6,3)(-2)³=20×(-8)=-160。"},{"q":"求 (1+x)⁷ 展开式中 x³ 的系数，以及所有二项式系数之和。","idea":"x³ 的系数即通项中 k=3 时的组合数；二项式系数之和为 2⁷。","ans":"x³ 的系数为 C(7,3)=35；二项式系数之和为 2⁷=128。"}]},{"name":"离散型随机变量的分布列与数学期望","desc":"离散型随机变量 X 的分布列列出 X 取各个值 xᵢ 的概率 P(X=xᵢ)=pᵢ，且所有 pᵢ 之和为 1。数学期望为 E(X)=Σxᵢpᵢ。古典概型中，事件 A 的概率为 P(A)=（A 包含的基本事件数）/（基本事件总数）。","tip":"分布列中各概率之和必须等于 1，可用来检验计算是否正确；求概率时常用组合数计算基本事件数。","ex":[{"q":"袋中有 3 个红球和 2 个白球，从中任取 2 个球，记取出的红球数为 X，求 X 的分布列与数学期望。","idea":"总取法为 C(5,2)=10；分别计算 X=0、1、2 的取法数，再求概率与期望。","ans":"P(X=0)=C(2,2)/10=1/10，P(X=1)=C(3,1)C(2,1)/10=6/10，P(X=2)=C(3,2)/10=3/10；概率和为 1。E(X)=0×1/10+1×6/10+2×3/10=6/5。"},{"q":"在上题条件下，求取出的两个球颜色相同的概率。","idea":"颜色相同即两个都是红球或两个都是白球，用古典概型分别计数后相加。","ans":"两红有 C(3,2)=3 种，两白有 C(2,2)=1 种，共 4 种；概率为 4/10=2/5。此结果也等于 P(X=2)+P(X=0)=3/10+1/10。"}]}]}],"physics":[{"title":"第一章 运动的描述 匀变速直线运动","items":[{"name":"匀变速直线运动规律","desc":"物体沿直线运动且加速度 a 恒定时，速度公式为 v = v0 + at，位移公式为 x = v0·t + ½at²，还有不含时间的关系式 v² − v0² = 2ax。其中 v0 为初速度，v 为末速度，a 为加速度（与初速度同向时取正），x 为位移，t 为时间。","tip":"先规定正方向；若减速到停止，要先求停止时间，不能直接把时间代入公式算出更长的时间。","ex":[{"q":"一辆汽车从静止开始做匀加速直线运动，加速度大小为 2 m/s²，经过 5 s 后，求它的速度和这 5 s 内的位移。","idea":"初速度 v0 = 0，已知 a 和 t，直接用 v = v0 + at 求速度，再用 x = v0·t + ½at² 求位移。","ans":"v = 0 + 2×5 = 10 m/s；x = 0 + ½×2×5² = 25 m。该车 5 s 末速度为 10 m/s，5 s 内位移为 25 m。"},{"q":"一辆汽车以 20 m/s 的速度匀速行驶，司机紧急刹车，车做匀减速直线运动，加速度大小为 5 m/s²。求汽车从刹车到停下所用的时间和滑行的距离。","idea":"取初速度方向为正，则 a = −5 m/s²。先由 v = v0 + at 令 v = 0 求停止时间，再用 v² − v0² = 2ax 求位移，避免把已停止后的时间代入公式。","ans":"由 0 = 20 − 5t，得 t = 4 s；由 0² − 20² = 2×(−5)×x，得 x = 40 m。汽车经 4 s 停下，滑行 40 m。"}]},{"name":"自由落体运动","desc":"物体只在重力作用下，从静止开始竖直下落，叫自由落体运动。它是初速度为零、加速度为 g 的匀加速直线运动，下落高度 h = ½gt²，速度 v = gt。取 g = 10 m/s² 时计算较简便。","tip":"自由落体是匀变速运动的特例，所有匀变速公式都适用，只需把 a 换成 g。","ex":[{"q":"一个小石块从离地高 20 m 的楼顶由静止释放，不计空气阻力，取 g = 10 m/s²。求石块落地所用的时间和落地时的速度大小。","idea":"初速度为零，加速度为 g。由 h = ½gt² 求时间，再由 v = gt 求落地速度。","ans":"由 20 = ½×10×t²，得 t = 2 s；落地速度 v = 10×2 = 20 m/s。石块落地用时 2 s，落地速度为 20 m/s，方向竖直向下。"}]}]},{"title":"第二章 相互作用 力","items":[{"name":"力的合成与分解","desc":"几个力共同作用的效果可以用一个力代替，这个力叫合力；求合力的过程叫力的合成，反过来把一个力分成几个力叫力的分解。力是矢量，合成时遵循平行四边形定则。两个分力夹角为 θ 时，合力大小 F = √(F1² + F2² + 2F1F2cosθ)。","tip":"夹角为 90° 时 cosθ = 0，合力为 √(F1² + F2²)；两个分力相等时，合力方向平分它们的夹角。","ex":[{"q":"两个大小都为 10 N 的共点力，夹角为 60°。求它们的合力大小，并说明合力方向与每个分力的夹角。","idea":"两力大小相等，代入 F = √(F1² + F2² + 2F1F2cosθ)，cos60° = ½。等大两力的合力平分它们的夹角。","ans":"F = √(100 + 100 + 2×10×10×½) = √300 = 10√3 N ≈ 17.3 N。合力方向与每个分力的夹角均为 30°。"}]},{"name":"共点力平衡与滑动摩擦力","desc":"物体受共点力作用处于静止或匀速直线运动状态时，合力为零，即平衡状态。滑动摩擦力大小为 f = μN，其中 μ 为动摩擦因数，N 为正压力，方向与相对运动方向相反。静摩擦力可在 0 到最大静摩擦力之间取值，由平衡条件决定。","tip":"先判断物体是否滑动：若外力小于最大静摩擦力，物体静止，静摩擦力大小等于外力；否则为滑动摩擦力 f = μN。","ex":[{"q":"质量为 2 kg 的物体静止在倾角为 30° 的光滑斜面上，细绳平行于斜面拉住物体。取 g = 10 m/s²，求斜面对物体的支持力和绳的拉力。","idea":"物体受重力、支持力和拉力，光滑斜面无摩擦。沿斜面和垂直斜面分别列平衡方程：拉力 T = mg sin30°，支持力 N = mg cos30°。","ans":"T = 2×10×½ = 10 N；N = 2×10×(√3/2) = 10√3 N ≈ 17.3 N。绳拉力为 10 N，支持力约为 17.3 N。"},{"q":"质量为 5 kg 的物体放在水平地面上，物体与地面间动摩擦因数 μ = 0.2，取 g = 10 m/s²。(1) 用水平向右的拉力 F = 8 N 拉物体，求物体受到的摩擦力；(2) 用 F = 15 N 拉物体，求物体的加速度。","idea":"(1) 先算最大静摩擦力近似值 μmg，若 F 小于它则物体静止，摩擦力由平衡求得。(2) 若物体滑动，摩擦力为 μmg，由牛顿第二定律求加速度。","ans":"(1) 滑动摩擦力 μmg = 0.2×5×10 = 10 N，F = 8 N 小于 10 N，物体静止，静摩擦力大小为 8 N，方向水平向左。(2) F = 15 N 大于 10 N，物体滑动，a = (F − μmg)/m = (15 − 10)/5 = 1 m/s²。"}]}]},{"title":"第三章 牛顿运动定律","items":[{"name":"牛顿第二定律与连接体","desc":"物体加速度的大小与合外力成正比，与质量成反比，方向与合外力方向相同，表达式为 F合 = ma。牛顿第三定律指出，作用力与反作用力大小相等、方向相反，作用在两个物体上。连接体问题中，可先对整体用 F = (m1 + m2)a 求加速度，再隔离其中一个物体求内力。","tip":"分析连接体时，隔离法和整体法要配合使用：求整体加速度用整体法，求绳子或弹簧的内力用隔离法。","ex":[{"q":"质量为 2 kg 的物体静止在光滑水平面上，受到水平向右的恒力 F = 10 N 作用。求物体的加速度，以及 2 s 末的速度和 2 s 内的位移。","idea":"由牛顿第二定律求 a，再用匀变速公式求速度和位移。","ans":"a = F/m = 10/2 = 5 m/s²；v = at = 5×2 = 10 m/s；x = ½at² = ½×5×4 = 10 m。"},{"q":"光滑水平面上有质量分别为 m1 = 2 kg 和 m2 = 3 kg 的两个物体，用轻绳相连。对 m1 施加水平向右的拉力 F = 10 N，求两物体的加速度和绳中的拉力。","idea":"整体法：F = (m1 + m2)a 求加速度。隔离 m2：绳的拉力 T 为其提供加速度，T = m2·a。","ans":"a = 10/(2 + 3) = 2 m/s²；T = 3×2 = 6 N。两物体加速度均为 2 m/s²，绳中拉力为 6 N。"}]},{"name":"超重与失重","desc":"物体对支持物的压力（或对悬绳的拉力）大于重力时叫超重，小于重力时叫失重。超重时加速度方向竖直向上，失重时加速度方向竖直向下，本质上物体的重力并没有改变。若竖直方向上设支持力为 N，则由 N − mg = ma 或 mg − N = ma 求出 N。","tip":"判断超重还是失重只看加速度方向：向上加速或向下减速为超重，向下加速或向上减速为失重。","ex":[{"q":"质量为 60 kg 的人站在电梯地板上，电梯以 2 m/s² 的加速度匀加速上升，取 g = 10 m/s²。求地板对人的支持力，并判断人处于超重还是失重状态。","idea":"加速度向上，取向上为正，由 N − mg = ma 求 N。N 大于 mg 为超重。","ans":"N = m(g + a) = 60×(10 + 2) = 720 N，大于重力 600 N，人处于超重状态。"},{"q":"上题中的人在电梯中，若电梯以 2 m/s² 的加速度匀加速下降，取 g = 10 m/s²，求地板对人的支持力。","idea":"加速度向下，取向下为正，由 mg − N = ma 求 N。","ans":"N = m(g − a) = 60×(10 − 2) = 480 N，小于重力，人处于失重状态。"}]}]},{"title":"第四章 曲线运动 万有引力与航天","items":[{"name":"平抛运动","desc":"物体以水平初速度抛出，只在重力作用下的运动叫平抛运动。它可以分解为水平方向的匀速直线运动和竖直方向的自由落体运动，即 vx = v0，x = v0·t，vy = gt，y = ½gt²。合速度的大小 v = √(vx² + vy²)，与水平方向夹角 θ 满足 tanθ = vy/vx。","tip":"平抛问题中，时间只由下落高度决定，t = √(2h/g)；水平位移由 v0 与 t 共同决定。","ex":[{"q":"在离地面高 h = 20 m 处，以 v0 = 10 m/s 的水平速度抛出一个小球，不计空气阻力，取 g = 10 m/s²。求小球落地时的水平位移、落地速度大小，以及速度与水平方向的夹角的正切值。","idea":"先由竖直方向的自由落体求时间 t，再由水平方向 x = v0t 求水平位移；落地时 vy = gt，合速度由勾股定理求得。","ans":"t = √(2h/g) = √4 = 2 s；x = 10×2 = 20 m；vy = 10×2 = 20 m/s，v = √(10² + 20²) = 10√5 ≈ 22.4 m/s；tanθ = vy/vx = 2。"},{"q":"从斜面顶端以 v0 = 10 m/s 水平抛出一个小球，小球恰好落在倾角为 37° 的斜面上（已知 tan37° = 0.75，取 g = 10 m/s²）。求小球从抛出到落到斜面上所用的时间。","idea":"落在斜面上时，位移方向与水平方向夹角为 37°，即 tan37° = y/x。由 y = ½gt²，x = v0t 代入求 t。","ans":"tan37° = (½gt²)/(v0t) = gt/(2v0)，即 0.75 = 10t/20，得 t = 1.5 s。"}]},{"name":"圆周运动与向心力","desc":"做匀速圆周运动的物体，合力方向始终指向圆心，叫向心力，大小为 F = mv²/r = mω²r。向心力由某个力或几个力的合力提供，不是物体额外受到的力。竖直平面内的圆周运动通常要分析最高点和最低点的受力情况。","tip":"绳模型过最高点的临界条件是重力恰好提供向心力，即 v最高 = √(gr)；由动能定理可求其他位置的速度。","ex":[{"q":"质量为 1 kg 的小球用长 r = 0.5 m 的细绳拴住，在竖直平面内做圆周运动，恰好能通过最高点，取 g = 10 m/s²。求小球通过最低点时绳的拉力大小。","idea":"最高点恰好通过时，重力提供向心力：mg = mv1²/r。从最高点到最低点由机械能守恒（或动能定理）求最低点速度，再在最低点由 T − mg = mv2²/r 求拉力。","ans":"v1² = gr = 5，最低点 v2² = v1² + 4gr = 5 + 20 = 25，即 v2 = 5 m/s；T = mg + mv2²/r = 10 + 1×25/0.5 = 60 N。"},{"q":"质量为 1000 kg 的汽车以 10 m/s 的速度驶过半径为 40 m 的圆弧形拱桥顶部，取 g = 10 m/s²。求桥面对汽车的支持力。","idea":"汽车在最高点做圆周运动，向心加速度竖直向下，合力向下：mg − N = mv²/r。","ans":"N = mg − mv²/r = 10000 − 1000×100/40 = 10000 − 2500 = 7500 N。"}]},{"name":"万有引力与航天","desc":"任意两个质点间的引力大小为 F = GMm/r²，其中 G 为引力常量。卫星绕天体做匀速圆周运动时，引力提供向心力：GMm/r² = mv²/r = mω²r = m(2π/T)²r，由此可得 v = √(GM/r)，T = 2π√(r³/GM)。在地球表面，忽略自转时 GM = gR²。","tip":"轨道半径越大，线速度越小、周期越长；地面附近的卫星速度约为第一宇宙速度，即 v = √(gR)。","ex":[{"q":"已知地球半径 R = 6400 km，地面重力加速度 g = 10 m/s²，忽略地球自转。求地球的第一宇宙速度（近地卫星的环绕速度）。","idea":"近地卫星的轨道半径近似等于 R，引力近似等于重力：mg = mv²/R。","ans":"v = √(gR) = √(10×6.4×10⁶) = √(6.4×10⁷) = 8×10³ m/s = 8 km/s。"},{"q":"一颗卫星绕某行星做匀速圆周运动，轨道半径 r = 1.0×10⁷ m，周期 T = 1.0×10⁴ s。已知引力常量 G = 6.67×10⁻¹¹ N·m²/kg²，求该行星的质量（结果保留两位有效数字）。","idea":"万有引力提供向心力：GMm/r² = m(2π/T)²r，由此解出 M = 4π²r³/(GT²)。","ans":"M = 4×3.14×(1.0×10⁷)³ / (6.67×10⁻¹¹ × (1.0×10⁴)²) ≈ 3.95×10²² / 6.67×10⁻³ ≈ 5.9×10²⁴ kg。"}]}]},{"title":"第五章 功和能","items":[{"name":"功与动能定理","desc":"恒力做功 W = Fs·cosθ，θ 为力与位移的夹角。动能 Ek = ½mv²。合外力对物体所做的总功等于物体动能的变化，即 W合 = Ek2 − Ek1，这就是动能定理。","tip":"动能定理不涉及加速度和时间，适合求速度或变力、曲线运动的问题；摩擦力做功为负，要带负号代入。","ex":[{"q":"质量为 2 kg 的物体原来静止在水平面上，受到水平向右的拉力 F = 10 N，物体与水平面间动摩擦因数 μ = 0.1，物体沿水平面运动 5 m。取 g = 10 m/s²，求此时物体的速度大小。","idea":"对物体用动能定理：拉力做正功，摩擦力做负功，初动能为零。摩擦力 f = μmg。","ans":"拉力做功 W1 = 10×5 = 50 J；摩擦力 f = 0.1×2×10 = 2 N，做功 W2 = −2×5 = −10 J；由 40 = ½×2×v²，得 v = √40 = 2√10 ≈ 6.3 m/s。"}]},{"name":"机械能守恒定律与功率","desc":"只有重力或弹力做功时，物体的动能和势能相互转化，总机械能保持不变，即 ½mv1² + mgh1 = ½mv2² + mgh2。功率表示做功快慢，平均功率 P = W/t，瞬时功率 P = Fv。机车以额定功率行驶时，达到最大速度时牵引力等于阻力，即 vm = P/f。","tip":"判断机械能是否守恒，先看是否有摩擦等其他力做功；求机车最大速度时，牵引力等于阻力。","ex":[{"q":"一个质量为 1 kg 的小物块从光滑曲面上高 h = 5 m 处由静止滑下，取 g = 10 m/s²。求物块滑到底端时的速度大小。","idea":"曲面光滑，只有重力做功，机械能守恒：mgh = ½mv²。","ans":"v = √(2gh) = √(2×10×5) = 10 m/s。"},{"q":"质量为 2000 kg 的汽车，额定功率为 60 kW，行驶时受到的阻力恒为 2000 N。求汽车能达到的最大速度；若汽车以 20 m/s 的速度匀速行驶，此时的实际功率是多少？","idea":"达到最大速度时牵引力等于阻力，由 P = Fv 得 vm = P/f。匀速时牵引力也等于阻力，实际功率 P = fv。","ans":"vm = 60000/2000 = 30 m/s；以 20 m/s 匀速时 P = 2000×20 = 40000 W = 40 kW。"}]}]},{"title":"第六章 动量","items":[{"name":"动量与动量定理","desc":"物体的质量与速度的乘积叫动量，p = mv，是矢量。合外力的冲量等于物体动量的变化，即 F·Δt = Δp = mv2 − mv1，这就是动量定理。冲量 I = FΔt 的方向与力的方向相同。","tip":"动量定理是矢量式，先规定正方向，速度方向与正方向相反时取负值；求出的平均力是合力。","ex":[{"q":"质量为 0.5 kg 的小球以 6 m/s 的速度水平撞到竖直墙上，以 4 m/s 的速度反向弹回，球与墙的作用时间为 0.1 s。求墙对球的平均作用力的大小和方向。","idea":"取初速度方向为正。由动量定理 F·Δt = mv2 − mv1，求平均作用力。","ans":"F·0.1 = 0.5×(−4) − 0.5×6 = −5 kg·m/s，得 F = −50 N。墙对球的平均作用力大小为 50 N，方向与球原来的运动方向相反。"}]},{"name":"动量守恒定律与碰撞","desc":"系统不受外力或所受合外力为零时，系统总动量保持不变，即 m1v1 + m2v2 = m1v1′ + m2v2′。碰撞分为弹性碰撞（动能不损失）和非弹性碰撞（动能有损失），完全非弹性碰撞后两物体共速。动量守恒是矢量式，计算时要注意方向。","tip":"判断碰撞类型，可比较碰前碰后的总动能：动能不增加且不超过碰前动能；若碰后共速，则损失动能最多。","ex":[{"q":"质量为 2 kg 的物体以 3 m/s 的速度在光滑水平面上运动，与静止的质量为 1 kg 的物体发生碰撞并粘在一起运动。求碰后共同速度，以及碰撞过程中损失的机械能。","idea":"碰撞过程动量守恒：2×3 = (2 + 1)v。损失的动能等于碰前动能减去碰后动能。","ans":"v = 6/3 = 2 m/s；碰前动能 ½×2×3² = 9 J，碰后动能 ½×3×2² = 6 J，损失 3 J。"},{"q":"质量为 1 kg 的小球以 4 m/s 的速度与静止的质量为 3 kg 的小球发生弹性正碰。求碰后两球的速度。","idea":"弹性碰撞同时满足动量守恒与动能守恒。设碰后速度分别为 v1′、v2′，可解得 v1′ = (m1 − m2)v1/(m1 + m2)，v2′ = 2m1v1/(m1 + m2)。","ans":"v1′ = (1 − 3)×4/4 = −2 m/s（方向与原速度相反）；v2′ = 2×1×4/4 = 2 m/s。验证：动量 1×(−2) + 3×2 = 4 kg·m/s 守恒；动能 8 J 守恒。"}]}]},{"title":"第七章 静电场","items":[{"name":"库仑定律与电场强度","desc":"真空中两个点电荷之间的库仑力大小为 F = kq1q2/r²，静电力常量 k = 9.0×10⁹ N·m²/C²，同种电荷相斥，异种电荷相吸。电场强度 E = F/q 描述电场的强弱和方向，点电荷周围的场强大小为 E = kQ/r²，正电荷的电场方向沿径向向外。","tip":"电场强度由电场本身决定，与试探电荷 q 无关；计算时要注意电荷量的单位是库仑 C，距离单位是米 m。","ex":[{"q":"真空中两个点电荷 q1 = q2 = 2×10⁻⁶ C，相距 r = 0.1 m，静电力常量 k = 9.0×10⁹ N·m²/C²。求它们之间的库仑力大小，并说明是引力还是斥力。","idea":"直接代入库仑定律 F = kq1q2/r²，两电荷同号，为斥力。","ans":"F = 9.0×10⁹×(2×10⁻⁶)²/(0.1)² = 9.0×10⁹×4×10⁻¹²/0.01 = 3.6 N，为斥力。"},{"q":"真空中有一个点电荷 Q = +4×10⁻⁸ C，求距离它 r = 0.3 m 处的电场强度大小和方向（k = 9.0×10⁹ N·m²/C²）。","idea":"点电荷场强公式 E = kQ/r²，场强方向沿径向，对正电荷来说背离电荷。","ans":"E = 9.0×10⁹×4×10⁻⁸/0.09 = 4.0×10³ N/C，方向沿两者连线背离 Q。"}]},{"name":"电势能、电势差与带电粒子加速","desc":"电场力做功只与始末位置的电势差有关，即 WAB = qUAB，UAB = φA − φB 为 A、B 两点间的电势差。电场力做正功时，电势能减少，做负功时电势能增加，即 WAB = EpA − EpB。带电粒子在电场中被加速时，可用动能定理 qU = ½mv² 求速度。","tip":"计算电场力做功时，电荷量 q 要带正负号；电子带负电，代入时取 q = −e。","ex":[{"q":"在电场中把电荷量为 1×10⁻⁶ C 的正电荷从 A 点移到 B 点，电场力做功为 3×10⁻⁵ J。求 A、B 两点间的电势差 UAB，并说明电势能的变化。","idea":"由 UAB = WAB/q 求电势差；电场力做正功，电势能减少。","ans":"UAB = 3×10⁻⁵/(1×10⁻⁶) = 30 V；电场力做正功 3×10⁻⁵ J，电荷电势能减少 3×10⁻⁵ J。"},{"q":"电子（电荷量 e = 1.6×10⁻¹⁹ C，质量 m = 9.1×10⁻³¹ kg）从静止开始，经电势差 U = 100 V 的电场加速，不计重力。求电子加速后的速度大小。","idea":"电场力做功等于动能增量：eU = ½mv²，解得 v = √(2eU/m)。","ans":"v = √(2×1.6×10⁻¹⁹×100/9.1×10⁻³¹) = √(3.5×10¹³) ≈ 5.9×10⁶ m/s。"}]}]},{"title":"第八章 恒定电流","items":[{"name":"欧姆定律、串并联电路与电功率","desc":"导体中的电流 I = U/R，其中 U 为电压，R 为电阻，单位分别为 V、Ω、A。电流做功 W = UIt，电热 Q = I²Rt，纯电阻电路中 W = Q。串联电路电流相等、电压分配与电阻成正比；并联电路各支路电压相等，总电阻的倒数等于各支路电阻倒数之和。","tip":"分析串并联电路时，先画出等效电路图，再逐步算总电阻和各处电流、电压。","ex":[{"q":"一根电阻丝的电阻为 10 Ω，两端加电压 5 V，通电 60 s。求通过电阻丝的电流，以及这段时间内电流做的功和产生的热量。","idea":"由欧姆定律求 I；电阻丝为纯电阻，W = UIt = I²Rt = Q。","ans":"I = 5/10 = 0.5 A；W = 5×0.5×60 = 150 J；Q = 150 J。"},{"q":"电源电动势 E = 6 V，内阻不计。电阻 R1 = 4 Ω 与 R2 = 12 Ω 并联后，再与 R3 = 2 Ω 串联接在电源两端。求总电流，以及通过 R1 和 R2 的电流。","idea":"先求并联电阻 R并 = R1R2/(R1 + R2)，再求总电阻；总电流 I = E/R总；并联部分电压 U并 = I·R并，再由各支路欧姆定律求分流。","ans":"R并 = 4×12/16 = 3 Ω；R总 = 3 + 2 = 5 Ω；I = 6/5 = 1.2 A；U并 = 1.2×3 = 3.6 V；I1 = 3.6/4 = 0.9 A，I2 = 3.6/12 = 0.3 A（0.9 + 0.3 = 1.2 A，与总电流相符）。"}]},{"name":"闭合电路欧姆定律","desc":"闭合电路中，电流 I = E/(R + r)，其中 E 为电源电动势，r 为电源内阻，R 为外电阻。路端电压 U = E − Ir，外电路断开时 U 等于 E。电源输出功率 P = UI，当外电阻 R = r 时输出功率最大，最大值为 E²/(4r)。","tip":"电路中电流变化时，路端电压 U = E − Ir 随 I 增大而减小；输出功率最大的条件是外电阻等于内阻。","ex":[{"q":"电源电动势 E = 12 V，内阻 r = 1 Ω，外电阻 R = 5 Ω。求电路中的电流、路端电压和电源内电压。","idea":"由闭合电路欧姆定律 I = E/(R + r)，路端电压 U = IR，内电压 U内 = Ir。","ans":"I = 12/(5 + 1) = 2 A；U = 2×5 = 10 V；U内 = 2×1 = 2 V，且 10 + 2 = 12 V。"},{"q":"电源电动势 E = 6 V，内阻 r = 2 Ω，外电阻 R 可以调节。求外电阻为多大时电源输出功率最大，并求最大输出功率。","idea":"输出功率 P = E²R/(R + r)²，当 R = r 时取最大值 E²/(4r)。","ans":"R = r = 2 Ω 时输出功率最大，Pmax = 36/(4×2) = 4.5 W。"}]}]},{"title":"第九章 磁场","items":[{"name":"磁感应强度与安培力","desc":"磁感应强度 B 描述磁场的强弱和方向，单位是特斯拉 T。通电导线在磁场中受到的安培力大小为 F = BIL·sinθ，θ 为导线方向与磁场方向的夹角，方向由左手定则判断。当导线与磁场垂直时，F = BIL。","tip":"左手定则中，磁感线穿过手心，四指指向电流方向，拇指指向安培力方向；导线与磁场平行时安培力为零。","ex":[{"q":"一段长 L = 0.2 m 的直导线，通有 I = 2 A 的电流，将它垂直放入磁感应强度 B = 0.5 T 的匀强磁场中。求导线所受安培力的大小。","idea":"导线与磁场垂直，sinθ = 1，直接用 F = BIL。","ans":"F = 0.5×2×0.2 = 0.2 N。"}]},{"name":"洛伦兹力与带电粒子在磁场中的圆周运动","desc":"运动电荷在磁场中受到的洛伦兹力大小为 f = qvB（v 与 B 垂直时），方向由左手定则判断，且始终与速度垂直，因此洛伦兹力不做功。带电粒子以速度 v 垂直进入匀强磁场时做匀速圆周运动，半径 r = mv/(qB)，周期 T = 2πm/(qB)。","tip":"洛伦兹力只改变速度方向，不改变速率；求粒子运动半径时要先判断速度与磁场是否垂直。","ex":[{"q":"质量 m = 4.0×10⁻³ kg、电荷量 q = 2.0×10⁻³ C 的带电小球，以 v = 1 m/s 的速度垂直进入磁感应强度 B = 0.5 T 的匀强磁场中做匀速圆周运动。求其轨道半径和运动周期。","idea":"速度与磁场垂直，洛伦兹力提供向心力：qvB = mv²/r，得 r = mv/(qB)；周期 T = 2πr/v = 2πm/(qB)。","ans":"r = 4.0×10⁻³×1/(2.0×10⁻³×0.5) = 4 m；T = 2π×4.0×10⁻³/(2.0×10⁻³×0.5) = 8π s ≈ 25 s。"},{"q":"在速度选择器中，匀强电场强度 E = 400 V/m，匀强磁场磁感应强度 B = 0.2 T，两者方向互相垂直。求能沿直线匀速通过选择器的带电粒子的速度大小。","idea":"粒子沿直线匀速通过时，电场力与洛伦兹力平衡：qE = qvB，故 v = E/B。","ans":"v = 400/0.2 = 2000 m/s。"}]}]},{"title":"第十章 电磁感应与交变电流","items":[{"name":"法拉第电磁感应定律","desc":"穿过闭合回路的磁通量发生变化时，回路中产生感应电动势。法拉第电磁感应定律指出 E = nΔΦ/Δt，其中 n 为线圈匝数，ΔΦ/Δt 为磁通量的变化率，单位为 Wb/s。对于长度为 L 的导体棒垂直切割磁感线的情况，E = BLv。","tip":"感应电动势与磁通量的变化快慢有关，与磁通量本身的大小无关；磁通量 Φ = BS，S 为垂直于磁场的有效面积。","ex":[{"q":"一个 100 匝的线圈，在 0.5 s 内穿过它的磁通量均匀增加了 0.02 Wb。求线圈中产生的感应电动势。","idea":"直接用 E = nΔΦ/Δt。","ans":"E = 100×0.02/0.5 = 4 V。"},{"q":"长 L = 0.5 m 的金属导体棒在磁感应强度 B = 0.4 T 的匀强磁场中，以 v = 5 m/s 的速度垂直于磁场和棒的方向匀速切割磁感线。求棒两端的感应电动势。","idea":"导体棒切割磁感线，v、B、L 两两垂直，用 E = BLv。","ans":"E = 0.4×0.5×5 = 1 V。"}]},{"name":"楞次定律与导体棒切割问题","desc":"楞次定律指出，感应电流的磁场总是阻碍引起感应电流的磁通量的变化。可用它判断感应电流的方向：磁通量增加时，感应电流的磁场与原磁场方向相反；减少时，方向相同。导体棒切割磁感线时，感应电流 I = E/R，导体棒所受安培力 F = BIL，阻碍导体棒运动。","tip":"判断感应电流方向时，先找原磁场方向，再判断磁通量是增加还是减少，最后用安培定则判断感应电流的方向。","ex":[{"q":"一个水平放置的闭合线圈处于竖直向下的匀强磁场中，磁感应强度随时间均匀增大。从上往下看，线圈中感应电流的方向是顺时针还是逆时针？","idea":"原磁场向下且增大，感应电流的磁场应阻碍增大，即方向向上。再用安培定则判断电流方向。","ans":"感应电流的磁场竖直向上；由安培定则，从上往下看感应电流为逆时针方向。"},{"q":"水平光滑导轨间距 L = 0.5 m，导轨间有竖直向下的匀强磁场 B = 0.2 T，导轨一端接电阻 R = 0.5 Ω，金属棒以 v = 10 m/s 的速度匀速向右滑动，棒与导轨电阻不计。求感应电流大小，以及维持棒匀速运动所需的水平外力大小。","idea":"先求感应电动势 E = BLv，再由 I = E/R 求电流；棒受安培力 F安 = BIL，匀速时外力与安培力平衡。","ans":"E = 0.2×0.5×10 = 1 V；I = 1/0.5 = 2 A；F = BIL = 0.2×2×0.5 = 0.2 N。"}]},{"name":"正弦交变电流与变压器","desc":"大小和方向随时间按正弦规律变化的电流叫正弦交变电流，电动势瞬时值 e = Em·sinωt，其中 Em 为峰值，ω = 2πf 为角频率。正弦交流电的有效值 E = Em/√2，由电流热效应定义。理想变压器满足 U1/U2 = n1/n2，I1/I2 = n2/n1，输入功率等于输出功率。","tip":"电表显示的交流电压、电流以及用电器的额定值都是有效值；变压器中电压比例与匝数成正比，电流比例与匝数成反比。","ex":[{"q":"某正弦交变电流的峰值为 Im = 10 A，求其有效值；若频率为 50 Hz，求角频率。","idea":"有效值 I = Im/√2；角频率 ω = 2πf。","ans":"I = 10/√2 = 5√2 ≈ 7.07 A；ω = 2π×50 = 100π rad/s ≈ 314 rad/s。"},{"q":"理想变压器原、副线圈匝数比为 n1 : n2 = 10 : 1，原线圈接 220 V 的交流电源，副线圈接一个电阻，副线圈中电流为 5 A。求副线圈两端的电压，以及原线圈中的电流。","idea":"由 U1/U2 = n1/n2 求副线圈电压；理想变压器输入功率等于输出功率，即 U1I1 = U2I2，由此求 I1。","ans":"U2 = 220×1/10 = 22 V；I1 = U2I2/U1 = 22×5/220 = 0.5 A。"}]}]},{"title":"第十一章 机械振动、机械波与光学","items":[{"name":"单摆与简谐运动","desc":"物体在回复力作用下，在平衡位置附近做往复运动，叫简谐运动。单摆在摆角很小（小于 5°）时的运动是简谐运动，其周期为 T = 2π√(L/g)，其中 L 为摆长，g 为当地重力加速度。周期只与摆长和重力加速度有关，与摆球质量和振幅无关。","tip":"摆长 L 是悬点到摆球球心的距离，不是绳长；摆长单位要换算为米后再代入公式。","ex":[{"q":"一个单摆的摆长为 L = 2.5 m，当地重力加速度 g = 10 m/s²，摆角很小。求该单摆的振动周期。","idea":"摆角很小，直接用 T = 2π√(L/g)。","ans":"T = 2π√(2.5/10) = 2π×0.5 = π s ≈ 3.14 s。"}]},{"name":"机械波的波速与传播","desc":"机械波在介质中传播的速度 v 由介质决定，与波源的频率无关。波长 λ、频率 f（或周期 T）与波速的关系为 v = λf = λ/T。质点只在各自的平衡位置附近振动，并不随波迁移，波传播的是振动形式和能量。","tip":"波速只由介质决定，波源频率改变时波长随之改变，波速保持不变。","ex":[{"q":"一列横波的波长 λ = 2 m，频率 f = 5 Hz，沿直线方向传播。求这列波的波速，以及它传播 30 m 所需的时间。","idea":"由 v = λf 求波速，再由 t = x/v 求传播时间。","ans":"v = 2×5 = 10 m/s；t = 30/10 = 3 s。"}]},{"name":"光的折射定律与全反射","desc":"光从一种介质斜射入另一种介质时，入射角 i 与折射角 r 满足折射定律 n = sini/sinr，其中 n 为折射率，n = c/v。光从光密介质射入光疏介质，入射角大于或等于临界角 C 时发生全反射，临界角满足 sinC = 1/n。","tip":"光从空气射入介质时，入射角大于折射角；发生全反射的条件是光从光密介质射向光疏介质，且入射角不小于临界角。","ex":[{"q":"一束光从空气斜射入水中，水的折射率 n = 4/3，入射角为 53°，已知 sin53° = 0.8。求折射角的正弦值及折射角大小（sin37° = 0.6）。","idea":"由折射定律 sinr = sini/n 求折射角的正弦值，再查出角度。","ans":"sinr = 0.8/(4/3) = 0.6，故 r = 37°。"},{"q":"一束光从某种玻璃射向空气，玻璃的折射率 n = √2。求该玻璃对空气的临界角 C。","idea":"临界角满足 sinC = 1/n。","ans":"sinC = 1/√2 = √2/2，故 C = 45°。当入射角大于或等于 45° 时发生全反射。"}]}]},{"title":"第十二章 热学与原子物理（简要）","items":[{"name":"气体的等温变化（玻意耳定律）","desc":"一定质量的理想气体，温度保持不变时，压强 p 与体积 V 成反比，即 p1V1 = p2V2（玻意耳定律）。压强的单位为帕斯卡 Pa，体积单位要统一后再代入。","tip":"使用 p1V1 = p2V2 时，两边的压强单位要一致，体积单位也要一致，不需要换算成国际单位。","ex":[{"q":"一定质量的理想气体，在温度不变时，压强为 1.0×10⁵ Pa，体积为 2 L。将其等温压缩到 0.5 L，求此时气体的压强。","idea":"温度不变，用玻意耳定律 p1V1 = p2V2。","ans":"p2 = p1V1/V2 = 1.0×10⁵×2/0.5 = 4.0×10⁵ Pa。"}]},{"name":"光电效应与能级跃迁","desc":"光子的能量 E = hν，其中 h 为普朗克常量，ν 为光的频率。当入射光子能量大于金属的逸出功 W0 时，会发生光电效应，光电子的最大初动能为 Ekm = hν − W0。原子只能处于一系列不连续的能量状态，从高能级 Em 跃迁到低能级 En 时，放出的光子能量为 hν = Em − En。","tip":"发生光电效应的条件是入射光子能量不小于逸出功，光强度只影响光电流大小，不影响光电子的最大初动能。","ex":[{"q":"某金属的逸出功为 W0 = 2.0 eV，用能量为 3.5 eV 的光子照射该金属。求光电子的最大初动能，以及遏止电压的大小。","idea":"由爱因斯坦光电效应方程 Ekm = hν − W0 求最大初动能；遏止电压满足 eUc = Ekm。","ans":"Ekm = 3.5 − 2.0 = 1.5 eV；遏止电压 Uc = 1.5 V。"},{"q":"氢原子能级的能量分别为 E1 = −13.6 eV，E2 = −3.4 eV。氢原子从 n = 2 能级跃迁到 n = 1 能级时，求放出的光子能量。","idea":"由能级跃迁规律，光子能量等于两能级能量之差，即 hν = E2 − E1。","ans":"hν = −3.4 − (−13.6) = 10.2 eV。"}]}]}],"chemistry":[{"title":"第一章 物质的量","items":[{"name":"物质的量、摩尔质量与阿伏加德罗常数","desc":"物质的量(n)是表示一定数目微观粒子集合体的物理量，单位是摩尔(mol)。1 mol 任何粒子约含 6.02×10²³ 个，这个数叫阿伏加德罗常数(NA)。摩尔质量(M)以 g/mol 为单位，数值上等于相对分子(原子)质量，且 n = m / M。","tip":"代入 n = m / M 时，M 的单位是 g/mol；求粒子数时注意分子中原子个数的倍数关系。","ex":[{"q":"求 36 g H2O 的物质的量，以及其中所含氧原子的个数（用 NA 表示）。","idea":"先求 M(H2O)，再用 n = m / M 求物质的量；氧原子数 = 分子数 × 每个分子中氧原子数。","ans":"M(H2O) = 2×1 + 16 = 18 g/mol，n = 36 / 18 = 2 mol。每个 H2O 含 1 个 O 原子，所以 O 原子数为 2NA（约 1.204×10²⁴ 个）。"},{"q":"求 0.5 mol Na2CO3 的质量，以及其中所含 Na⁺ 的物质的量。","idea":"先求 M(Na2CO3)，再用 m = n × M；每个 Na2CO3 含 2 个 Na⁺。","ans":"M(Na2CO3) = 2×23 + 12 + 3×16 = 106 g/mol，m = 0.5 × 106 = 53 g。Na⁺ 的物质的量为 0.5 × 2 = 1 mol。"}]},{"name":"气体摩尔体积","desc":"在标准状况（0 ℃、101 kPa）下，1 mol 任何气体的体积约为 22.4 L，即气体摩尔体积 Vm ≈ 22.4 L/mol。气体的物质的量 n = V / Vm，混合气体同样适用，但只适用于气体。","tip":"22.4 L/mol 只适用于标准状况下的气体；水、酒精、SO3 等在标准状况下不是气体，不能用此公式。","ex":[{"q":"求标准状况下 11.2 L O2 的物质的量和质量。","idea":"先用 n = V / Vm 求物质的量，再用 m = n × M 求质量；M(O2) = 32 g/mol。","ans":"n = 11.2 L / 22.4 L/mol = 0.5 mol，m = 0.5 mol × 32 g/mol = 16 g。"},{"q":"标准状况下 6.72 L NH3 含有多少个分子（用 NA 表示）？","idea":"先求 NH3 的物质的量，再乘以 NA 得到分子数。","ans":"n(NH3) = 6.72 / 22.4 = 0.3 mol，分子数为 0.3NA。"}]},{"name":"物质的量浓度","desc":"物质的量浓度 c 表示单位体积溶液中所含溶质的物质的量，c = n / V，单位为 mol/L。溶液稀释前后溶质的物质的量不变，即 c1·V1 = c2·V2。","tip":"公式中的 V 是溶液的体积，不是溶剂水的体积；溶液是均一的，取出部分溶液浓度不变。","ex":[{"q":"将 4.0 g NaOH 溶于水配成 500 mL 溶液，求其物质的量浓度；从中取出 100 mL，取出溶液的浓度是多少？","idea":"先求 NaOH 的物质的量，再用 c = n / V，V 要换算成 L；溶液的浓度与取出的体积无关。","ans":"M(NaOH) = 40 g/mol，n = 4.0 / 40 = 0.1 mol，c = 0.1 mol / 0.5 L = 0.2 mol/L。取出 100 mL 后浓度仍为 0.2 mol/L。"},{"q":"将 100 mL 2 mol/L 的 H2SO4 溶液稀释到 500 mL，所得溶液的物质的量浓度是多少？","idea":"稀释前后溶质的物质的量不变，列式 c1·V1 = c2·V2。","ans":"2 mol/L × 0.1 L = c2 × 0.5 L，c2 = 0.4 mol/L。"}]}]},{"title":"第二章 氧化还原反应","items":[{"name":"氧化还原反应的概念与判断","desc":"反应前后元素化合价有升降的反应是氧化还原反应。化合价升高、失去电子的物质被氧化，作还原剂；化合价降低、得到电子的物质被还原，作氧化剂。","tip":"可用口诀记忆：升失氧化还原剂，降得还原氧化剂。判断时先标出各元素的化合价。","ex":[{"q":"反应 Fe + CuSO4 = FeSO4 + Cu 中，哪种元素的化合价升高？哪种物质是氧化剂？","idea":"分别标出反应前后 Fe、Cu 的化合价，看升降情况。","ans":"Fe 由 0 价升到 +2 价，被氧化，Fe 是还原剂；Cu 由 CuSO4 中的 +2 价降到 0 价，CuSO4 中的 Cu²⁺ 是氧化剂。"}]},{"name":"电子转移的计算（得失电子守恒）","desc":"氧化还原反应中，氧化剂得到的电子总数等于还原剂失去的电子总数，这就是得失电子守恒。它是配平方程式和进行定量计算的依据。","tip":"计算时先找出变价元素，算出每个原子的化合价变化值，再乘以参加反应的原子个数。","ex":[{"q":"反应 Cu + 4HNO3(浓) = Cu(NO3)2 + 2NO2↑ + 2H2O 中，若有 0.1 mol Cu 参加反应，转移电子多少 mol？生成 NO2 在标准状况下的体积是多少？","idea":"Cu 从 0 价升到 +2 价，由 Cu 的物质的量算电子数；再由电子守恒求 NO2 的物质的量（N 从 +5 降到 +4，每个 NO2 得 1 个电子）。","ans":"Cu 失去电子 0.1 × 2 = 0.2 mol，即转移 0.2 mol 电子。由电子守恒，生成 NO2 为 0.2 mol，标准状况下体积为 0.2 × 22.4 = 4.48 L。"}]}]},{"title":"第三章 离子反应","items":[{"name":"电解质与非电解质","desc":"在水溶液里或熔融状态下能导电的化合物是电解质，如酸、碱、盐和金属氧化物。在上述条件下本身不能电离出离子的化合物是非电解质，如蔗糖、酒精、CO2、NH3。单质和混合物既不是电解质也不是非电解质。","tip":"能导电的不一定是电解质（如铜丝、石墨、盐酸）；电解质必须是化合物，并且是自身电离而导电。","ex":[{"q":"判断下列物质哪些是电解质：NaCl 固体、铜丝、CO2、硫酸溶液、BaSO4。","idea":"电解质必须是化合物，且在水溶液或熔融状态下能导电。","ans":"NaCl 固体（熔融或溶于水后导电）和 BaSO4（熔融时导电）是电解质。铜丝是单质，硫酸溶液是混合物，CO2 是非电解质。"}]},{"name":"离子方程式的书写与正误判断","desc":"离子方程式用实际参加反应的离子符号表示。书写步骤为：写出化学方程式，拆成离子形式，删去两边相同的离子，检查原子守恒和电荷守恒。强酸、强碱和可溶性盐要拆成离子；沉淀、气体、水、弱电解质、单质和氧化物保留化学式。","tip":"只有易溶于水的强电解质才拆分；离子方程式必须同时满足原子守恒和电荷守恒。","ex":[{"q":"写出 Ba(OH)2 溶液与稀硫酸反应的离子方程式。","idea":"拆出 Ba²⁺、OH⁻、H⁺、SO4²⁻，BaSO4 为沉淀，水是产物；检查电荷守恒。","ans":"Ba²⁺ + 2OH⁻ + 2H⁺ + SO4²⁻ = BaSO4↓ + 2H2O。左边电荷总数为 0，右边也为 0。"},{"q":"写出碳酸钙与稀盐酸反应的离子方程式。","idea":"CaCO3 是难溶物，保留化学式；HCl、CaCl2 拆成离子。","ans":"CaCO3 + 2H⁺ = Ca²⁺ + H2O + CO2↑。"}]}]},{"title":"第四章 钠、铝、铁及其化合物","items":[{"name":"钠及其化合物","desc":"钠是活泼金属，与水剧烈反应：2Na + 2H2O = 2NaOH + H2↑，通常保存在煤油中。过氧化钠与水、CO2 反应都生成氧气：2Na2O2 + 2H2O = 4NaOH + O2↑，2Na2O2 + 2CO2 = 2Na2CO3 + O2。加热碳酸氢钠分解：2NaHCO3 =(△) Na2CO3 + H2O + CO2↑。","tip":"Na2O2 中氧元素为 −1 价；Na2CO3 比 NaHCO3 稳定，可用加热法除去 Na2CO3 中的 NaHCO3 但不能用于除去 NaHCO3 中的 Na2CO3。","ex":[{"q":"将 7.8 g Na2O2 与足量水反应，标准状况下生成 O2 的体积是多少？","idea":"先求 Na2O2 的物质的量，再由方程式 2Na2O2 : O2 = 2 : 1 求 O2 的物质的量。","ans":"M(Na2O2) = 78 g/mol，n = 7.8 / 78 = 0.1 mol。2Na2O2 + 2H2O = 4NaOH + O2↑，生成 O2 为 0.05 mol，体积为 0.05 × 22.4 = 1.12 L。"},{"q":"取 Na2CO3 与 NaHCO3 的混合物 10 g，加热至质量不再变化，剩余固体 6.9 g。求原混合物中 NaHCO3 的质量。","idea":"只有 NaHCO3 分解，减少的质量就是分解放出的 H2O 和 CO2；利用 2NaHCO3 减少的质量 62 g 列比例。","ans":"2NaHCO3 = Na2CO3 + H2O + CO2↑，每 2 mol（168 g）NaHCO3 分解减少 62 g。减少质量为 10 − 6.9 = 3.1 g，则 NaHCO3 质量为 3.1 × 168 / 62 = 8.4 g。"}]},{"name":"铝及其化合物（两性）","desc":"铝是活泼金属，表面易形成致密的氧化膜。铝既能与强酸反应，也能与强碱溶液反应，都生成 H2：2Al + 6HCl = 2AlCl3 + 3H2↑，2Al + 2NaOH + 2H2O = 2NaAlO2 + 3H2↑。Al(OH)3 是两性氢氧化物，既溶于强酸也溶于强碱。","tip":"等量的铝与足量酸或碱反应，产生的 H2 一样多（2Al ~ 3H2）；Al(OH)3 不溶于弱酸和弱碱（如氨水）。","ex":[{"q":"5.4 g Al 分别与足量稀盐酸和足量 NaOH 溶液反应，相同条件下产生的 H2 体积之比是多少？","idea":"两个反应中 Al 的物质的量相同，都按 2Al ~ 3H2 计算。","ans":"n(Al) = 5.4 / 27 = 0.2 mol，两个反应都生成 0.3 mol H2，体积之比为 1 : 1（均为 6.72 L）。"},{"q":"向 100 mL 1 mol/L 的 AlCl3 溶液中加入 100 mL 1 mol/L 的 NaOH 溶液，生成 Al(OH)3 沉淀多少 mol？","idea":"Al³⁺ + 3OH⁻ = Al(OH)3↓，先算两种物质的量，比较 OH⁻ 是否足量。","ans":"n(Al³⁺) = 0.1 mol，n(OH⁻) = 0.1 mol，需要 0.3 mol OH⁻ 才能完全沉淀，OH⁻ 不足，以 OH⁻ 计算。生成 Al(OH)3 为 0.1 / 3 ≈ 0.033 mol。"}]},{"name":"铁及其化合物（Fe²⁺与Fe³⁺）","desc":"铁有 +2 和 +3 两种常见化合价。Fe³⁺ 遇 KSCN 溶液变为红色，可用于检验 Fe³⁺。Fe²⁺ 具有还原性，容易被氧化为 Fe³⁺，例如 2Fe²⁺ + Cl2 = 2Fe³⁺ + 2Cl⁻。","tip":"Fe 与氯气反应生成 FeCl3；Fe 与稀盐酸、稀硫酸或 CuSO4 溶液反应生成 Fe²⁺。FeCl2 溶液要密封保存并加少量铁粉防止氧化。","ex":[{"q":"向 FeCl2 溶液中通入足量 Cl2，写出反应的离子方程式，并说明如何检验生成的 Fe³⁺。","idea":"Fe²⁺ 被 Cl2 氧化为 Fe³⁺；检验 Fe³⁺ 用 KSCN 溶液，观察颜色变化。","ans":"2Fe²⁺ + Cl2 = 2Fe³⁺ + 2Cl⁻。取少量溶液，滴加 KSCN 溶液，若溶液变为红色，说明含有 Fe³⁺。"}]}]},{"title":"第五章 氯及其化合物","items":[{"name":"氯气与次氯酸","desc":"氯气是黄绿色、有毒的气体，溶于水后部分与水反应：Cl2 + H2O ⇌ HCl + HClO。次氯酸（HClO）具有强氧化性和漂白性，见光易分解：2HClO = 2HCl + O2↑。氯气与氢氧化钠溶液反应：Cl2 + 2NaOH = NaCl + NaClO + H2O。","tip":"氯水中含有 Cl2、HClO、H2O 等分子，久置的氯水会变成稀盐酸，失去漂白性。","ex":[{"q":"标准状况下 2.24 L Cl2 与足量 NaOH 溶液反应，生成 NaClO 的物质的量是多少？","idea":"按 Cl2 + 2NaOH = NaCl + NaClO + H2O 写出 Cl2 与 NaClO 的比例，为 1 : 1。","ans":"n(Cl2) = 2.24 / 22.4 = 0.1 mol，生成 NaClO 为 0.1 mol。"},{"q":"将标准状况下 2.24 L Cl2 通入足量 KI 溶液中，理论上可生成 I2 多少克？（I 的相对原子质量为 127）","idea":"Cl2 + 2KI = 2KCl + I2，Cl2 与 I2 的物质的量之比为 1 : 1。","ans":"n(Cl2) = 0.1 mol，生成 I2 为 0.1 mol，质量为 0.1 × 254 = 25.4 g。"}]},{"name":"氯离子的检验与氯气的实验室制取","desc":"检验 Cl⁻ 常用稀硝酸酸化的 AgNO3 溶液，生成不溶于稀硝酸的白色沉淀 AgCl。实验室用浓盐酸与二氧化锰加热制取氯气：MnO2 + 4HCl(浓) =(△) MnCl2 + Cl2↑ + 2H2O。尾气用 NaOH 溶液吸收。","tip":"稀盐酸与 MnO2 不反应，必须用浓盐酸并加热；检验时先加稀硝酸排除 CO3²⁻ 等离子的干扰。","ex":[{"q":"假设 8.7 g MnO2 完全反应，理论上可生成标准状况下 Cl2 多少升？（M(MnO2) = 87 g/mol）","idea":"由 MnO2 的物质的量，按 MnO2 : Cl2 = 1 : 1 计算。","ans":"n(MnO2) = 8.7 / 87 = 0.1 mol，生成 Cl2 为 0.1 mol，体积为 0.1 × 22.4 = 2.24 L。"}]}]},{"title":"第六章 硫和氮及其化合物","items":[{"name":"二氧化硫的性质","desc":"SO2 是无色、有刺激性气味、易溶于水的有毒气体，与水反应生成亚硫酸：SO2 + H2O ⇌ H2SO3。SO2 中硫为 +4 价，可表现还原性（如 2SO2 + O2 ⇌ 2SO3）；SO2 能与某些有色物质结合使品红褪色，加热后可恢复颜色。SO2 与 NaOH 溶液反应：SO2 + 2NaOH = Na2SO3 + H2O。","tip":"SO2 能使紫色石蕊溶液变红但不能使其褪色；SO2 的漂白是暂时性的，与次氯酸的永久性漂白不同。","ex":[{"q":"将标准状况下 4.48 L SO2 通入足量 NaOH 溶液，生成 Na2SO3 多少克？（M(Na2SO3) = 126 g/mol）","idea":"SO2 + 2NaOH = Na2SO3 + H2O，SO2 与 Na2SO3 按 1 : 1 对应。","ans":"n(SO2) = 4.48 / 22.4 = 0.2 mol，生成 Na2SO3 为 0.2 mol，质量为 0.2 × 126 = 25.2 g。"},{"q":"将标准状况下 2.24 L SO2 与足量 H2S 混合反应，生成硫单质多少克？","idea":"SO2 + 2H2S = 3S↓ + 2H2O，SO2 中 S 从 +4 降到 0，H2S 中 S 从 −2 升到 0。","ans":"n(SO2) = 0.1 mol，由方程式生成 S 为 0.1 × 3 = 0.3 mol，质量为 0.3 × 32 = 9.6 g。"}]},{"name":"浓硫酸的性质","desc":"浓硫酸具有吸水性，可干燥中性或酸性气体（不能干燥 NH3 等碱性气体，也不能干燥 H2S、HI 等还原性气体）。浓硫酸还具有脱水性（使蔗糖等炭化）和强氧化性，加热时与铜反应：Cu + 2H2SO4(浓) =(△) CuSO4 + SO2↑ + 2H2O。常温下浓硫酸使铁、铝钝化。","tip":"随着反应进行，浓硫酸变稀，稀硫酸不再与铜反应，所以参加反应的硫酸总量小于理论值。","ex":[{"q":"0.2 mol H2SO4 的浓硫酸与足量铜共热，理论上最多生成标准状况下 SO2 多少升？","idea":"Cu + 2H2SO4(浓) = CuSO4 + SO2↑ + 2H2O，每 2 mol H2SO4 生成 1 mol SO2。","ans":"理论上生成 SO2 为 0.2 / 2 = 0.1 mol，体积为 2.24 L。实际因硫酸变稀，生成的 SO2 会少于 2.24 L。"}]},{"name":"氮的氧化物、硝酸与氨","desc":"NO 为无色气体，遇空气中的 O2 被氧化为红棕色的 NO2：2NO + O2 = 2NO2。NO2 与水反应生成硝酸：3NO2 + H2O = 2HNO3 + NO。NH3 极易溶于水，溶液显碱性：NH3 + H2O ⇌ NH3·H2O。实验室用铵盐与碱加热制 NH3：2NH4Cl + Ca(OH)2 =(△) CaCl2 + 2NH3↑ + 2H2O。","tip":"稀硝酸与铜反应生成 NO，浓硝酸与铜反应生成 NO2；NH3 收集只能用向下排空气法。","ex":[{"q":"将 4 体积 NO2 与 1 体积 O2 混合通入水中，恰好被完全吸收生成 HNO3，写出总反应方程式并说明理由。","idea":"把 NO2 与 O2 的反应合并：NO2 中 N 从 +4 升到 +5（失 1 个电子），O2 每个 O 得 2 个电子，用电子守恒配平。","ans":"4NO2 + O2 + 2H2O = 4HNO3。理由：4 mol NO2 失去 4 mol 电子，1 mol O2 得到 4 mol 电子，电子守恒，无 NO 剩余。"}]}]},{"title":"第七章 元素周期律与元素周期表","items":[{"name":"元素周期表与元素周期律","desc":"元素周期表有 7 个横行（周期）和 18 个纵列（族，其中 8、9、10 三列合称第Ⅷ族）。同周期从左到右，原子半径逐渐减小，金属性减弱，非金属性增强；同主族从上到下，原子半径增大，金属性增强，非金属性减弱。","tip":"比较金属性可看单质与水或酸反应的剧烈程度，以及最高价氧化物对应水化物的碱性强弱。","ex":[{"q":"判断 Na、Mg、Al 的金属性强弱，并说明理由。","idea":"三者同周期，从左到右金属性递减；可比较最高价氧化物对应水化物的碱性。","ans":"金属性：Na > Mg > Al。理由：NaOH 是强碱，Mg(OH)2 是弱碱，Al(OH)3 是两性氢氧化物，碱性依次减弱。"}]},{"name":"卤素的性质递变规律","desc":"卤素包括 F、Cl、Br、I，同主族从上到下，单质氧化性减弱（F2 > Cl2 > Br2 > I2），与 H2 化合越来越难，氢化物的稳定性减弱。强氧化性的单质可以把弱氧化性的卤素离子氧化，如 Cl2 + 2Br⁻ = 2Cl⁻ + Br2。","tip":"判断氧化性强弱：氧化剂的氧化性强于氧化产物的氧化性。","ex":[{"q":"将 Cl2 通入 KBr 溶液中，溶液变为橙色，说明了什么？写出离子方程式。","idea":"橙色是 Br2 生成的，说明 Cl2 把 Br⁻ 氧化成了 Br2。","ans":"说明 Cl2 的氧化性强于 Br2。离子方程式：Cl2 + 2Br⁻ = 2Cl⁻ + Br2。"}]}]},{"title":"第八章 化学键","items":[{"name":"离子键与共价键","desc":"阴、阳离子之间通过静电作用形成的化学键叫离子键，如 NaCl、MgO。原子之间通过共用电子对形成的化学键叫共价键，如 H2、HCl、CO2。含有离子键的化合物是离子化合物；只含共价键的化合物是共价化合物。","tip":"NaOH、NH4Cl 等既含离子键又含共价键；只有全部由共价键结合的化合物才是共价化合物。","ex":[{"q":"判断 NaOH、H2O2、MgCl2 中含有的化学键类型。","idea":"看是否存在阴阳离子之间的作用（离子键）以及非金属原子之间的共用电子对（共价键）。","ans":"NaOH 既含离子键（Na⁺与OH⁻）又含共价键（O–H）；H2O2 只含共价键（H–O、O–O）；MgCl2 只含离子键。"}]},{"name":"键能与反应热的关系","desc":"断开化学键需要吸收能量，形成化学键会放出能量。反应热 ΔH = 反应物的键能总和 − 生成物的键能总和。ΔH < 0 为放热反应，ΔH > 0 为吸热反应。","tip":"计算时要数清每个分子中化学键的个数，如 2HCl 中有 2 个 H–Cl 键。","ex":[{"q":"已知键能：H–H 为 436 kJ/mol，Cl–Cl 为 242 kJ/mol，H–Cl 为 431 kJ/mol。计算 H2(g) + Cl2(g) = 2HCl(g) 的 ΔH。","idea":"ΔH = 反应物键能总和 − 生成物键能总和；注意 2 mol HCl 含 2 mol H–Cl 键。","ans":"ΔH = (436 + 242) − 2 × 431 = 678 − 862 = −184 kJ/mol，该反应为放热反应。"}]}]},{"title":"第九章 化学反应速率与化学平衡","items":[{"name":"化学反应速率的计算","desc":"化学反应速率 v = Δc / Δt，常用单位是 mol/(L·s) 或 mol/(L·min)。同一反应中，各物质的反应速率之比等于化学方程式中的化学计量数之比。","tip":"固体和纯液体的浓度可视为常数，不用来表示反应速率；计算时注意容器体积和时间单位。","ex":[{"q":"在 2 L 密闭容器中发生反应 N2 + 3H2 ⇌ 2NH3，5 min 内 NH3 的物质的量由 0 增加到 1.2 mol。求 v(NH3) 和 v(H2)。","idea":"先求 v(NH3) = Δn / (V·Δt)，再由 v(H2) : v(NH3) = 3 : 2 求 v(H2)。","ans":"v(NH3) = 1.2 mol / (2 L × 5 min) = 0.12 mol/(L·min)；v(H2) = 0.12 × 3/2 = 0.18 mol/(L·min)。"}]},{"name":"勒夏特列原理与平衡移动","desc":"如果改变影响平衡的一个条件（浓度、压强、温度），平衡会向着减弱这种改变的方向移动。增大反应物浓度、降低温度、增大压强（反应前后气体分子数减小的方向）等会使平衡向相应方向移动。催化剂只改变反应速率，不影响平衡位置。","tip":"恒容时充入惰性气体，各物质浓度不变，平衡不移动；恒压时充入惰性气体，相当于减小压强。","ex":[{"q":"反应 2SO2 + O2 ⇌ 2SO3 的 ΔH < 0。为提高 SO2 的转化率，可采取哪些措施？","idea":"放热反应降温平衡正向移动；正反应气体分子数减少，加压平衡正向移动；增大 O2 浓度或移走 SO3 也可使平衡正向移动。","ans":"降低温度、增大压强、增大 O2 的浓度或及时移走 SO3。使用催化剂不能提高 SO2 的转化率。"}]},{"name":"化学平衡常数 K","desc":"在一定温度下，可逆反应达到平衡时，生成物浓度幂之积与反应物浓度幂之积的比值是一个常数，称为平衡常数 K。对于 aA + bB ⇌ cC + dD，K = c(C)^c · c(D)^d / (c(A)^a · c(B)^b)。固体和纯液体不写入表达式。K 只随温度变化。","tip":"K 越大，反应进行得越彻底；用浓度商 Q 与 K 比较，可判断反应进行的方向。","ex":[{"q":"某温度下，在 1 L 密闭容器中反应 CO(g) + H2O(g) ⇌ CO2(g) + H2(g) 达到平衡，测得 c(CO) = 0.2 mol/L，c(H2O) = 0.3 mol/L，c(CO2) = 0.3 mol/L，c(H2) = 0.3 mol/L。求该温度下的平衡常数 K。","idea":"K = 生成物浓度幂之积 / 反应物浓度幂之积，各物质化学计量数均为 1。","ans":"K = c(CO2)·c(H2) / (c(CO)·c(H2O)) = (0.3 × 0.3) / (0.2 × 0.3) = 1.5。"}]}]},{"title":"第十章 水溶液中的离子平衡","items":[{"name":"弱电解质的电离与溶液的pH","desc":"弱电解质（如 CH3COOH、NH3·H2O）在水中只部分电离，存在电离平衡，如 CH3COOH ⇌ CH3COO⁻ + H⁺。pH = −lg c(H⁺)。25 ℃ 时，水的离子积 Kw = c(H⁺)·c(OH⁻) = 1×10⁻¹⁴；pH < 7 为酸性，pH = 7 为中性，pH > 7 为碱性。","tip":"强酸、强碱溶液可直接由浓度求 c(H⁺) 或 c(OH⁻)；弱酸、弱碱溶液中 c(H⁺) 远小于酸的浓度，不能直接用酸的浓度计算。","ex":[{"q":"分别求 0.01 mol/L HCl 溶液和 0.01 mol/L NaOH 溶液的 pH（25 ℃）。","idea":"HCl 是强酸，c(H⁺) = 0.01 mol/L；NaOH 是强碱，先求 c(OH⁻)，再由 Kw 求 c(H⁺)。","ans":"HCl：c(H⁺) = 10⁻² mol/L，pH = 2。NaOH：c(OH⁻) = 10⁻² mol/L，c(H⁺) = 10⁻¹² mol/L，pH = 12。"}]},{"name":"盐类的水解","desc":"盐电离出的离子与水电离出的 H⁺ 或 OH⁻ 结合生成弱电解质，从而促进水的电离。强碱弱酸盐（如 CH3COONa、Na2CO3）溶液显碱性，强酸弱碱盐（如 NH4Cl）溶液显酸性，强酸强碱盐（如 NaCl）溶液显中性。水解是可逆的，程度通常很小。","tip":"多元弱酸盐分步水解，以第一步为主，如 CO3²⁻ + H2O ⇌ HCO3⁻ + OH⁻；记住“谁弱谁水解，谁强显谁性”。","ex":[{"q":"判断 NH4Cl、Na2CO3、NaCl 水溶液的酸碱性，并写出 NH4Cl 水解的离子方程式。","idea":"看盐由哪种酸、哪种碱生成：弱碱阳离子水解显酸性，弱酸阴离子水解显碱性。","ans":"NH4Cl 溶液显酸性；Na2CO3 溶液显碱性；NaCl 溶液显中性。NH4Cl 水解：NH4⁺ + H2O ⇌ NH3·H2O + H⁺。"}]}]},{"title":"第十一章 电化学","items":[{"name":"原电池","desc":"原电池是把化学能转化为电能的装置。负极发生氧化反应，失去电子；正极发生还原反应，得到电子；电子由负极经外电路流向正极。以稀硫酸为电解质的锌铜原电池为例：负极 Zn − 2e⁻ = Zn²⁺，正极 2H⁺ + 2e⁻ = H2↑。","tip":"电子只经过外电路，不经过电解质溶液；电流方向与电子流动方向相反。","ex":[{"q":"稀硫酸为电解质的锌铜原电池工作时，外电路通过 0.2 mol 电子，求正极生成的 H2 体积（标准状况）和负极溶解的 Zn 质量。（Zn 的相对原子质量为 65）","idea":"由电子守恒：Zn 失 2 个电子，2H⁺ 得 2 个电子生成 1 个 H2。","ans":"溶解 Zn 为 0.1 mol，质量为 6.5 g；正极生成 H2 为 0.1 mol，体积为 2.24 L。"}]},{"name":"电解池","desc":"电解池把电能转化为化学能。与电源负极相连的是阴极，发生还原反应；与电源正极相连的是阳极，发生氧化反应。电解饱和食盐水的总反应为：2NaCl + 2H2O =(通电) 2NaOH + H2↑ + Cl2↑。","tip":"惰性电极（如石墨、Pt）只让溶液中的离子放电；活性电极（如 Cu）在阳极本身被氧化。","ex":[{"q":"用石墨电极电解 CuSO4 溶液，写出阴极反应、阳极反应和总反应方程式。","idea":"阴极上 Cu²⁺ 得电子；阳极上溶液中的 OH⁻（来自水）失电子生成 O2。","ans":"阴极：Cu²⁺ + 2e⁻ = Cu；阳极：2H2O − 4e⁻ = O2↑ + 4H⁺；总反应：2CuSO4 + 2H2O =(通电) 2Cu + O2↑ + 2H2SO4。"}]}]},{"title":"第十二章 有机化学基础","items":[{"name":"烃的结构与性质","desc":"烃是只含碳、氢两种元素的有机物。烷烃（如 CH4）只含 C–C 单键，性质稳定，在光照下可与 Cl2 发生取代反应。烯烃含有碳碳双键 C=C（如 CH2=CH2），能与 Br2 发生加成反应，使溴水褪色。","tip":"官能团决定有机物的主要性质，如碳碳双键、羟基、羧基等；烷烃的取代反应在光照下进行。","ex":[{"q":"写出乙烯与溴水反应的化学方程式，并说明实验现象。","idea":"碳碳双键断开一个键，两个 Br 原子分别加在两个碳原子上，属于加成反应。","ans":"CH2=CH2 + Br2 → CH2Br–CH2Br（1,2-二溴乙烷）。现象：溴水的橙色褪去。"}]},{"name":"同分异构体","desc":"分子式相同而结构不同的化合物互为同分异构体。例如 C4H10 有两种：正丁烷 CH3CH2CH2CH3 和异丁烷 CH3CH(CH3)CH3。同分异构现象包括碳链异构、位置异构和官能团异构。","tip":"书写同分异构体时，先写碳链异构，再移动官能团或双键的位置，最后检查是否重复。","ex":[{"q":"分子式为 C4H8 的烯烃有几种？（不考虑顺反异构）写出它们的结构简式。","idea":"先写出 C4 的碳链，再在链上放置碳碳双键，注意去除重复结构。","ans":"共 3 种：CH2=CHCH2CH3（1-丁烯）、CH3CH=CHCH3（2-丁烯）、CH2=C(CH3)2（2-甲基丙烯）。"}]},{"name":"乙醇、乙酸与酯化反应","desc":"乙醇含有羟基（−OH），可与金属钠反应放出 H2。乙酸含有羧基（−COOH），具有弱酸性。在浓硫酸作用下加热，乙酸与乙醇发生酯化反应生成乙酸乙酯：CH3COOH + CH3CH2OH ⇌ CH3COOCH2CH3 + H2O。","tip":"酯化反应是可逆反应；浓硫酸作催化剂和吸水剂；饱和碳酸钠溶液用于收集乙酸乙酯并除去乙酸和乙醇。","ex":[{"q":"用 6 g 乙酸与足量乙醇反应，假设产率为 100%，理论上可生成乙酸乙酯多少克？（M(CH3COOH) = 60 g/mol，M(CH3COOCH2CH3) = 88 g/mol）","idea":"酯化反应中乙酸与乙酸乙酯的物质的量之比为 1 : 1，乙醇过量，以乙酸计算。","ans":"n(CH3COOH) = 6 / 60 = 0.1 mol，生成乙酸乙酯 0.1 mol，质量为 0.1 × 88 = 8.8 g。"}]}]}],"biology":[{"title":"第一章 细胞的分子组成","items":[{"name":"蛋白质的结构与功能","desc":"蛋白质的基本单位是氨基酸，氨基酸之间通过脱水缩合形成肽键连接成肽链，肽链盘曲折叠形成具有一定空间结构的蛋白质。蛋白质的功能多样，如催化（酶）、运输（血红蛋白）、免疫（抗体）、调节（部分激素）和结构支持等。结构决定功能，蛋白质结构改变（如高温变性）会导致其功能丧失。","tip":"脱水缩合时，肽键数 = 氨基酸数 - 肽链数，失去的水分子数与肽键数相等。","ex":[{"q":"某蛋白质由2条肽链组成，共含100个氨基酸，氨基酸的平均相对分子质量为128，求该蛋白质的相对分子质量。（水的相对分子质量为18）","idea":"先求肽键数（或失去的水分子数）= 氨基酸数 - 肽链数，再用“氨基酸总质量 - 失去水的质量”计算。","ans":"肽键数 = 100 - 2 = 98，失去水分子数 = 98。蛋白质相对分子质量 = 100 × 128 - 98 × 18 = 12800 - 1764 = 11036。"}]},{"name":"核酸的组成与遗传信息","desc":"核酸包括DNA和RNA，它们的基本单位是核苷酸，每个核苷酸由一分子磷酸、一分子五碳糖和一分子含氮碱基组成。DNA含有脱氧核糖和碱基A、T、G、C，通常为双链；RNA含有核糖和碱基A、U、G、C，通常为单链。核酸是储存和传递遗传信息的生物大分子。","tip":"判断核酸种类时，看五碳糖是脱氧核糖还是核糖，看碱基中是否含T（有T为DNA，有U为RNA）。","ex":[{"q":"某双链DNA分子中腺嘌呤（A）占全部碱基的20%，求该DNA分子中鸟嘌呤（G）所占的比例。","idea":"依据碱基互补配对原则，A = T，G = C，且A + G = 50%。","ans":"A = T = 20%，所以G = C = 50% - 20% = 30%。鸟嘌呤占全部碱基的30%。"}]},{"name":"糖类与脂质的种类和功能","desc":"糖类是主要的能源物质，单糖如葡萄糖是细胞的重要能源，淀粉和糖原分别是植物和动物细胞的储能多糖，纤维素是植物细胞壁的主要成分。脂质包括脂肪、磷脂和固醇等：脂肪是良好的储能物质，磷脂是构成细胞膜的重要成分，胆固醇参与构成动物细胞膜并参与血液中脂质的运输。","tip":"等质量的脂肪与糖类相比，脂肪含氢多、含氧少，氧化分解时释放的能量更多。","ex":[{"q":"等质量的脂肪和葡萄糖彻底氧化分解，哪种释放的能量更多？请说明原因。","idea":"比较两者的元素组成：脂肪含C、H较多而O较少，糖类含O较多。","ans":"脂肪释放的能量更多。原因是脂肪中氢的比例高、氧的比例低，氧化分解时需要消耗更多的氧，释放的能量也更多。"}]}]},{"title":"第二章 细胞的结构","items":[{"name":"细胞膜的结构与功能","desc":"细胞膜的基本支架是磷脂双分子层，蛋白质以不同方式镶嵌、贯穿或覆盖在磷脂双分子层中，糖蛋白位于细胞膜外侧，这就是流动镶嵌模型的主要内容。细胞膜具有控制物质进出、进行细胞间信息交流和分隔细胞与外界环境的功能。细胞膜的结构特点是具有一定的流动性。","tip":"糖蛋白只分布在细胞膜外侧，常与细胞识别有关；哺乳动物成熟红细胞没有细胞核和细胞器，常用来制备纯净的细胞膜。","ex":[{"q":"用哺乳动物成熟的红细胞制备细胞膜，选择该材料的主要原因是什么？","idea":"考虑成熟红细胞的结构特点，判断哪些膜性结构会干扰细胞膜的提取。","ans":"成熟的哺乳动物红细胞没有细胞核和众多细胞器，只有细胞膜，在低渗溶液中吸水涨破后容易得到较纯净的细胞膜。"}]},{"name":"细胞器的分工与协作","desc":"线粒体是有氧呼吸的主要场所，叶绿体是光合作用的场所，二者都含有少量DNA。内质网是蛋白质合成和加工以及脂质合成的车间，高尔基体对蛋白质进行加工、分类和包装。核糖体是合成蛋白质的场所，溶酶体含有多种水解酶，能分解衰老、损伤的细胞器和侵入细胞的病菌。","tip":"分泌蛋白的合成与运输路径是：核糖体、内质网、高尔基体、细胞膜，整个过程需要线粒体提供能量。","ex":[{"q":"胰腺细胞合成并分泌消化酶（分泌蛋白）时，依次经过的主要细胞结构是什么？哪种细胞器为该过程提供能量？","idea":"沿分泌蛋白的合成、加工、运输和分泌路径梳理；能量由有氧呼吸提供。","ans":"核糖体（合成肽链）、内质网（初步加工、运输）、高尔基体（进一步加工、分类包装）、囊泡、细胞膜（胞吐分泌）。线粒体提供能量。"}]},{"name":"细胞核的结构与功能","desc":"细胞核主要由核膜、核仁、染色质和核孔构成。细胞核是遗传信息库，是细胞代谢和遗传的控制中心。核仁与某种RNA的合成以及核糖体的形成有关，核孔是大分子物质进出细胞核的通道。","tip":"蛋白质合成旺盛的细胞，核仁通常较大；核孔具有选择性，并非所有物质都能自由通过。","ex":[{"q":"将变形虫切成有核和无核两部分，无核部分不能长时间生存且不能正常摄食和分裂，这一实验结果说明了什么？","idea":"比较有核部分与无核部分在生命活动上的差异，得出细胞核的功能。","ans":"说明细胞核是细胞代谢和遗传的控制中心，细胞核对于细胞的生存和正常生命活动是不可缺少的。"}]}]},{"title":"第三章 细胞的物质输入与输出","items":[{"name":"被动运输","desc":"被动运输是物质顺浓度梯度进行的跨膜运输，不需要消耗细胞内化学反应释放的能量。自由扩散的物质（如O2、CO2、甘油、乙醇）直接穿过磷脂双分子层；协助扩散需要转运蛋白（载体蛋白或通道蛋白）的协助，如葡萄糖进入红细胞、水借助水通道蛋白进出细胞。","tip":"运输速率与浓度差有关：自由扩散速率与浓度差成正比；协助扩散在载体饱和后速率不再增加。","ex":[{"q":"将成熟植物细胞放入高浓度的蔗糖溶液中，细胞发生质壁分离。请分析细胞失水的原因，并说明发生的是哪种运输方式。","idea":"比较外界溶液与细胞液的浓度大小，判断水分的移动方向；水分子通过渗透作用（属于被动运输）移动。","ans":"外界蔗糖溶液浓度高于细胞液浓度，细胞通过渗透作用失水，原生质层收缩与细胞壁分离。水分跨膜运输属于被动运输。"}]},{"name":"主动运输与胞吞胞吐","desc":"主动运输是物质逆浓度梯度进行的跨膜运输，需要载体蛋白的协助，并消耗细胞内化学反应释放的能量（ATP）。例如小肠上皮细胞吸收葡萄糖、氨基酸，以及钠钾泵维持细胞内外的离子浓度差。大分子物质通过胞吞和胞吐进出细胞，同样需要消耗能量。","tip":"判断运输方式可抓住三点：是否逆浓度梯度、是否需要载体、是否消耗能量。","ex":[{"q":"用呼吸抑制剂处理小肠绒毛上皮细胞，会使其吸收葡萄糖的速率明显下降，而对水分子的吸收速率影响很小。请分析原因。","idea":"主动运输需要能量，呼吸抑制剂会减少ATP的供应；水分子通过自由扩散或协助扩散进入细胞，不需要能量。","ans":"呼吸抑制剂减少了细胞内ATP的产生，主动运输（如葡萄糖的吸收）需要能量，因此吸收速率下降；水分子的运输属于被动运输，不消耗能量，所以几乎不受影响。"}]}]},{"title":"第四章 酶与ATP","items":[{"name":"酶的特性与影响因素","desc":"酶是活细胞产生的具有催化作用的有机物，绝大多数是蛋白质，少数是RNA。酶具有高效性、专一性，且作用条件较温和，过酸、过碱或高温会使酶的空间结构被破坏而失活。酶通过降低化学反应的活化能来加快反应速率。","tip":"探究温度对酶活性的影响时，不宜用过氧化氢作底物，因为加热本身会使过氧化氢分解；通常选用淀粉和淀粉酶。","ex":[{"q":"某同学用淀粉、淀粉酶和碘液探究温度对酶活性的影响，将淀粉与淀粉酶分别在不同温度下保温后再混合，一段时间后加碘液。若某组溶液不变蓝，说明什么？","idea":"碘液遇淀粉变蓝，不变蓝说明淀粉已被分解，即酶催化了反应；对应温度为酶的较适温度。","ans":"说明该温度下淀粉酶活性较高，将淀粉完全分解，使淀粉遇碘液不再显蓝色。"}]},{"name":"ATP的结构与作用","desc":"ATP即三磷酸腺苷，结构简式为A-P~P~P，其中A代表腺苷，~代表高能磷酸键，末端的高能磷酸键容易断裂和重新形成。ATP是细胞内直接的能源物质，ATP与ADP可以迅速相互转化，实现能量的快速供应与利用。","tip":"ATP不是细胞内储存能量的主要物质，细胞中的能量储存主要靠脂肪等有机物，ATP只是能量的直接供应者。","ex":[{"q":"一个ATP分子中含有几个磷酸基团和几个高能磷酸键？ATP水解去掉两个磷酸基团后的产物是什么？","idea":"回忆ATP的结构简式A-P~P~P，逐一数出磷酸基团与高能磷酸键；去掉两个磷酸基团后剩下的是腺嘌呤核糖核苷酸。","ans":"一个ATP分子含有3个磷酸基团和2个高能磷酸键；去掉两个磷酸基团后形成的产物是腺嘌呤核糖核苷酸（AMP），是RNA的基本单位之一。"}]}]},{"title":"第五章 细胞呼吸与光合作用","items":[{"name":"有氧呼吸与无氧呼吸","desc":"有氧呼吸在氧气的参与下，将葡萄糖彻底氧化分解为二氧化碳和水，释放大量能量，主要在细胞质基质和线粒体中进行。无氧呼吸在无氧条件下进行，不彻底分解有机物，如酵母菌产生酒精和二氧化碳，人和动物骨骼肌细胞产生乳酸，两者都只在第一阶段释放少量能量。","tip":"只进行有氧呼吸时，消耗的O2量等于释放的CO2量；若CO2释放量大于O2消耗量，说明同时存在无氧呼吸。","ex":[{"q":"酵母菌在一定条件下同时进行有氧呼吸和无氧呼吸，消耗O2为3 mol，释放CO2为8 mol。求无氧呼吸消耗的葡萄糖的物质的量。","idea":"有氧呼吸中葡萄糖：O2 = 1：6，CO2 = O2；无氧呼吸中葡萄糖：CO2 = 1：2。先算有氧呼吸部分，再由总CO2量减去有氧部分得到无氧呼吸的CO2。","ans":"有氧呼吸释放的CO2 = 3 mol，消耗葡萄糖 = 3 ÷ 6 = 0.5 mol。无氧呼吸释放的CO2 = 8 - 3 = 5 mol，消耗葡萄糖 = 5 ÷ 2 = 2.5 mol。"}]},{"name":"光合作用的过程与影响因素","desc":"光合作用分为光反应和暗反应两个阶段。光反应在叶绿体类囊体薄膜上进行，水光解产生氧气，并形成ATP和NADPH；暗反应在叶绿体基质中进行，CO2被C5固定形成C3，C3在ATP和NADPH的作用下被还原为糖类，同时再生C5。光照强度、CO2浓度和温度等都会影响光合作用速率。","tip":"光反应为暗反应提供ATP和NADPH，暗反应为光反应提供ADP、Pi和NADP+，二者相互依存。","ex":[{"q":"某植物在适宜光照下，突然停止光照而其他条件不变，细胞内C3和C5的含量如何变化？请说明原因。","idea":"光照停止后光反应减弱，ATP和NADPH的生成减少，C3的还原受阻，而CO2的固定仍在进行。","ans":"C3含量增多，C5含量减少。原因是光反应产物ATP和NADPH减少，C3还原减慢，C3积累，C5的消耗减少而生成减少。"}]}]},{"title":"第六章 细胞的增殖","items":[{"name":"有丝分裂的过程与特点","desc":"有丝分裂是真核细胞分裂的主要方式，分为间期、前期、中期、后期和末期。间期完成DNA的复制和有关蛋白质的合成；后期着丝粒分裂，姐妹染色单体分开，形成两条子染色体并移向两极。有丝分裂保证了亲代和子代细胞之间遗传物质的稳定性。","tip":"染色体数目在后期因着丝粒分裂而暂时加倍，核DNA数目在间期复制后加倍，二者的变化时间不同。","ex":[{"q":"某生物体细胞中染色体数目为2n = 8，在有丝分裂的前期和后期，细胞中的染色体数与核DNA分子数分别是多少？","idea":"间期DNA复制后，每条染色体含两个染色单体、两个DNA分子，直到后期着丝粒分裂。","ans":"前期：染色体数为8，核DNA数为16；后期：着丝粒分裂，染色体数为16，核DNA数为16。"}]},{"name":"减数分裂与受精作用","desc":"减数分裂是进行有性生殖的生物在产生成熟生殖细胞时发生的分裂方式，细胞连续分裂两次，而染色体只复制一次，因此成熟生殖细胞中的染色体数目是体细胞的一半。减数第一次分裂前期同源染色体联会并可能发生非姐妹染色单体的交叉互换，后期同源染色体分离，非同源染色体自由组合。受精作用使染色体数目恢复到体细胞水平。","tip":"一个精原细胞能产生4个精子，但只有2种类型（两两相同）；一个卵原细胞只产生1个卵细胞。","ex":[{"q":"一个基因型为AaBb（两对基因独立遗传）的精原细胞，不考虑交叉互换，经减数分裂能产生几种类型的精子？一个卵原细胞能产生几种类型的卵细胞？","idea":"不考虑交叉互换时，一个精原细胞减数分裂只产生2种精子（两两相同）；一个卵原细胞只能产生1个卵细胞。","ans":"一个精原细胞产生4个精子，但只有2种类型（如AB和ab，或Ab和aB）；一个卵原细胞只产生1种类型的1个卵细胞。"}]}]},{"title":"第七章 遗传的分子基础","items":[{"name":"DNA的结构与半保留复制","desc":"DNA是由两条反向平行的脱氧核苷酸链组成的双螺旋结构，外侧为磷酸和脱氧核糖交替连接，内侧碱基通过氢键按照A与T、G与C互补配对。DNA复制以亲代DNA的两条链为模板，遵循碱基互补配对原则，且每个子代DNA分子中都保留一条亲代链，这种复制方式称为半保留复制。","tip":"DNA双链中A = T、G = C，因此A + G = T + C = 50%，这是解题的重要依据。","ex":[{"q":"将DNA被15N标记的大肠杆菌，转移到含14N的培养基中培养，经过2次分裂后，含15N的DNA分子占总DNA分子的比例是多少？只含14N的DNA分子占比例是多少？","idea":"半保留复制：亲代DNA只有两条链含15N，经过2次复制后形成4个DNA分子，共8条链，其中只有2条链含15N，这2条链分别位于2个DNA中。","ans":"4个DNA分子中，含15N的DNA分子有2个，占100%；只含14N的DNA分子有2个，占50%。"}]},{"name":"基因的表达：转录与翻译","desc":"基因的表达包括转录和翻译两个过程。转录是以DNA的一条链为模板，在RNA聚合酶作用下合成mRNA的过程，主要在细胞核中进行。翻译是以mRNA为模板，在核糖体上，以tRNA转运氨基酸，按照密码子与反密码子互补配对的原则合成多肽链的过程。","tip":"mRNA上相邻的3个碱基构成一个密码子，决定一个氨基酸；DNA模板链与mRNA的碱基互补，但RNA中没有T，而是U。","ex":[{"q":"已知DNA的一条模板链局部碱基序列为3′-TACGGC-5′，求其转录形成的mRNA序列，并写出对应的氨基酸（已知AUG编码甲硫氨酸，CCG编码脯氨酸）。","idea":"转录时模板链与mRNA互补配对，并注意A配U、T配A、G配C、C配G；再按密码子表找出氨基酸。","ans":"mRNA序列为5′-AUGCCG-3′，依次编码甲硫氨酸和脯氨酸。"}]}]},{"title":"第八章 遗传的基本规律","items":[{"name":"基因的分离定律","desc":"在生物的体细胞中，控制同一性状的成对遗传因子彼此分离，分别进入不同的配子中，随配子遗传给后代。杂合子（Aa）自交后代中，显性性状与隐性性状的比例约为3：1；测交后代的比例为1：1。判断显隐性和纯合子、杂合子是解题的基础。","tip":"亲代是显性性状，子代出现隐性性状，则亲代一定是杂合子；利用测交可以检验某显性个体的基因型。","ex":[{"q":"一对表现型正常的夫妇生了一个白化病（隐性遗传病，由基因a控制）的孩子。若他们再生育两个孩子，求两个孩子都正常的概率。","idea":"先确定夫妇的基因型均为Aa，再计算单个孩子正常的概率为3/4，两个孩子都正常的概率为两次独立事件概率的乘积。","ans":"夫妇基因型均为Aa，单个孩子正常的概率为3/4，两个孩子都正常的概率为3/4 × 3/4 = 9/16。"}]},{"name":"基因的自由组合定律","desc":"控制不同性状的非同源染色体上的非等位基因，在减数分裂形成配子时，同源染色体上的等位基因彼此分离，非同源染色体上的非等位基因自由组合。两对相对性状的杂合子（AaBb）自交，后代表现型比例为9：3：3：1。解题时可把每对基因单独分析，再用乘法原理组合。","tip":"解自由组合题常用“分解组合法”：每对基因单独按分离定律计算，再将结果相乘。","ex":[{"q":"基因型为AaBbCc与AaBbCc的两个个体（三对基因分别位于三对同源染色体上，完全显性）杂交，求子代中表现型与亲本相同的个体所占的比例，以及子代中基因型为aabbcc的比例。","idea":"每对基因单独分析：Aa × Aa 后代中A_ 占3/4，aa占1/4；再将三对基因的概率相乘。","ans":"表现型与亲本相同（A_B_C_）的比例为3/4 × 3/4 × 3/4 = 27/64；基因型为aabbcc的比例为1/4 × 1/4 × 1/4 = 1/64。"}]},{"name":"伴性遗传与人类遗传病","desc":"位于性染色体上的基因控制的性状，遗传上与性别相关联，称为伴性遗传。红绿色盲是典型的伴X隐性遗传病，其特点是男性患者多于女性，男性的致病基因只能从母亲传来，只能传给女儿。人类遗传病包括单基因遗传病、多基因遗传病和染色体异常遗传病，可通过遗传咨询和产前诊断等手段预防。","tip":"伴X隐性遗传病的特点：男患者多于女患者；女患者的父亲和儿子一定患病；交叉遗传（男传女、女传男）。","ex":[{"q":"一对表现型正常的夫妇（红绿色盲基因用b表示，正常基因用B表示），生了一个患红绿色盲的儿子。求这对夫妇再生一个孩子患红绿色盲的概率，以及生一个患病儿子的概率。","idea":"儿子患病，说明母亲是携带者XBXb，父亲XBY；再分别计算孩子患病与儿子患病的概率。","ans":"夫妇基因型为XBXb与XBY。生孩子患病（XbXb或XbY）的概率为1/4；生孩子是男孩的概率为1/2，男孩患病的概率为1/2，因此患病儿子的概率为1/4。"}]}]},{"title":"第九章 生物的变异、育种与进化","items":[{"name":"基因突变与染色体变异","desc":"基因突变是DNA分子中碱基对的增添、缺失或替换，导致基因结构的改变，是生物变异的根本来源。染色体变异包括染色体结构变异（缺失、重复、倒位、易位）和染色体数目变异（个别染色体或染色体组成倍增减）。基因突变一般是不定向的，多数对生物有害。","tip":"基因突变不一定改变生物的性状：如密码子的简并性可能使氨基酸不变，杂合子中隐性基因突变后也可能不表现出来。","ex":[{"q":"镰刀型细胞贫血症的根本原因是血红蛋白β链上一个谷氨酸被缬氨酸替换。已知谷氨酸的密码子为GAA或GAG，缬氨酸的密码子为GUU、GUC、GUA或GUG。请分析发生的基因突变类型。","idea":"对比两种密码子的碱基，判断是否只有一个碱基被替换，以及替换后氨基酸是否改变。","ans":"GAA（或GAG）变为GUA（或GUG），第二个碱基由A（或G）替换为U（即T），属于碱基对的替换，导致氨基酸改变。"}]},{"name":"育种方法","desc":"杂交育种利用基因重组，将两个亲本的优良性状集中到同一个个体上，常用于获得纯合优良品种。诱变育种利用物理或化学因素诱发基因突变，获得新性状。单倍体育种先通过花药离体培养获得单倍体，再用秋水仙素处理使染色体数目加倍，可快速获得纯合体。多倍体育种利用秋水仙素等处理萌发的种子或幼苗，获得如无子西瓜等。","tip":"杂交育种中，要选出纯合子，需要通过连续自交逐代淘汰隐性或杂合个体；单倍体育种可明显缩短育种年限。","ex":[{"q":"小麦的抗病（B）与高产（A）两对基因分别位于两对同源染色体上，现有基因型为AAbb与aaBB的两个纯合品种，要获得能稳定遗传的aaBB新品种，应如何设计杂交育种方案？F2中aaB_个体中纯合子所占的比例是多少？","idea":"先杂交得F1（AaBb），再自交得F2，选出aaB_个体，再用自交的方法逐代选纯合子。","ans":"方案：AAbb × aaBB得F1（AaBb），F1自交得F2，在F2中选择aaB_的个体，连续自交并选出性状稳定的个体。F2中aaB_个体的基因型为aaBB和aaBb，其中纯合子aaBB占1/3。"}]},{"name":"现代生物进化理论要点","desc":"现代生物进化理论认为，种群是生物进化的基本单位，突变和基因重组产生进化的原材料，自然选择决定进化的方向，隔离是物种形成的必要条件。进化的实质是种群基因频率的定向改变。生物与生物、生物与无机环境之间在相互影响中共同进化。","tip":"基因频率 = 某基因的数目 ÷ 该基因及其等位基因的总数；基因型频率与基因频率不同，要注意区分。","ex":[{"q":"某种群中基因型AA的个体占30%，Aa占60%，aa占10%。求A基因和a基因的基因频率。","idea":"每个AA个体含2个A，Aa个体含1个A；将基因总数（种群中每个个体含2个基因）作为分母。","ans":"A的基因频率 = (30% × 2 + 60% × 1) ÷ 2 = (0.6 + 0.6) ÷ 2 = 60%；a的基因频率 = 1 - 60% = 40%。"}]}]},{"title":"第十章 人体的内环境与稳态","items":[{"name":"内环境与稳态","desc":"由细胞外液构成的液体环境叫做内环境，主要包括血浆、组织液和淋巴。内环境是细胞与外界环境进行物质交换的媒介。稳态是指正常机体通过调节作用，使各个器官、系统协调活动，共同维持内环境的相对稳定状态，是机体进行正常生命活动的必要条件。","tip":"血红蛋白位于红细胞内，呼吸酶位于细胞内，它们都不属于内环境的成分；消化道、呼吸道等直接与外界相通的管腔不属于内环境。","ex":[{"q":"下列物质中，属于内环境成分的是哪些？①血红蛋白 ②葡萄糖 ③呼吸酶 ④抗体 ⑤尿素","idea":"判断物质是否位于细胞外液中：细胞内的物质和直接与外界相通的物质都不属于内环境。","ans":"②④⑤。血红蛋白在红细胞内，呼吸酶在细胞内，均不属于内环境；葡萄糖、抗体和尿素可存在于血浆或组织液中。"}]},{"name":"神经调节与反射","desc":"神经调节的基本方式是反射，反射的结构基础是反射弧，由感受器、传入神经、神经中枢、传出神经和效应器五部分组成。兴奋在神经纤维上以电信号（局部电流）的形式双向传导，在神经元之间通过突触以化学信号（神经递质）的形式单向传递。静息时膜外为正电位、膜内为负电位，兴奋时膜电位变为外负内正。","tip":"反射必须依赖完整的反射弧；兴奋在突触处单向传递，原因是神经递质只能由突触前膜释放，作用于突触后膜。","ex":[{"q":"若切断某反射弧中的传入神经，刺激感受器，效应器是否会产生反应？刺激传出神经，效应器是否会产生反应？请分别说明理由。","idea":"反射弧的完整性是产生反射的条件，兴奋必须经过传入神经、神经中枢、传出神经才能到达效应器。","ans":"切断传入神经后，刺激感受器，兴奋无法传到神经中枢，效应器不产生反应（反射不能发生）。刺激传出神经，兴奋可直接传到效应器，效应器会产生反应，但这不属于完整的反射。"}]},{"name":"激素调节与免疫调节","desc":"激素通过体液运输，作用于靶器官或靶细胞，具有微量高效的特点，并存在分级调节和反馈调节。胰岛素能降低血糖，胰高血糖素能升高血糖，二者相互拮抗，共同维持血糖稳定。免疫系统具有防御、自稳和监视功能；特异性免疫包括体液免疫和细胞免疫，记忆细胞使机体对再次入侵的同种抗原产生更快、更强的二次免疫应答。艾滋病病毒（HIV）主要攻击辅助性T细胞，导致免疫功能严重缺陷。","tip":"抗原在体液免疫中由B细胞识别，浆细胞不能识别抗原，但能分泌抗体；二次免疫反应快而强，是因为有记忆细胞。","ex":[{"q":"某人接种了某种疫苗，一段时间后再次接触相应病原体时，体内抗体的产生速度和数量与第一次相比有何不同？请说明原因。","idea":"回忆初次免疫和二次免疫的区别：二次免疫时记忆细胞迅速增殖分化为浆细胞。","ans":"二次免疫反应更快、产生的抗体数量更多。原因是初次免疫后体内产生了记忆细胞，再次接触抗原时，记忆细胞迅速增殖分化为浆细胞，快速分泌大量抗体。"}]}]},{"title":"第十一章 植物的激素调节","items":[{"name":"生长素的作用与两重性","desc":"生长素主要在幼嫩的芽、叶和发育中的种子中合成，在植物体内进行极性运输。生长素能促进细胞伸长生长，在一定浓度范围内促进生长，浓度过高则抑制生长，这体现了生长素作用的两重性。顶端优势是顶芽产生的生长素向下运输积累在侧芽，抑制侧芽生长的现象。","tip":"生长素的两重性指“低浓度促进、高浓度抑制”，同一器官对生长素的敏感性不同，根比芽敏感，芽比茎敏感。","ex":[{"q":"在棉花栽培中，常摘除顶芽以促进侧芽发育，从而增加棉花的产量。请用生长素的作用原理解释这一做法。","idea":"顶端优势是顶芽合成的生长素向下运输并积累在侧芽，使侧芽生长受抑制；去掉顶芽后，侧芽附近生长素浓度降低。","ans":"去掉顶芽后，减少了向侧芽运输的生长素，侧芽部位的生长素浓度降低，抑制作用解除，侧芽得以发育，从而增加分枝和棉花产量。"}]},{"name":"其他植物激素及其作用","desc":"赤霉素能促进细胞伸长，从而引起植株增高，还能促进种子萌发。细胞分裂素主要在根尖合成，能促进细胞分裂。脱落酸能抑制细胞分裂，促进叶和果实的衰老与脱落，并促进种子休眠。乙烯主要存在于植物的成熟果实中，能促进果实成熟。植物生长发育是多种激素相互作用、共同调节的结果。","tip":"记忆时可抓住：赤霉素促长和萌发，细胞分裂素促分裂，脱落酸促休眠和脱落，乙烯促果实成熟。","ex":[{"q":"某农民想使水果提前成熟，应选用下列哪种植物激素？为什么？若想打破种子休眠促进萌发，应选用哪种激素？","idea":"回忆各种激素的主要作用：乙烯促进果实成熟；赤霉素可以解除种子休眠、促进萌发。","ans":"应选用乙烯，因为乙烯能促进果实成熟。打破种子休眠、促进萌发可选用赤霉素（与脱落酸的作用相反）。"}]}]},{"title":"第十二章 种群、群落与生态系统","items":[{"name":"种群数量的变化与调查","desc":"种群是在一定区域内同种生物的全部个体，种群数量受出生率、死亡率、迁入率和迁出率影响。在资源和空间无限的理想条件下，种群呈“J”型增长；在资源有限的条件下，种群呈“S”型增长，种群数量达到环境容纳量（K值）后基本稳定。种群密度的调查方法有样方法和标志重捕法。","tip":"K/2时种群增长速率最大，渔业捕捞应使剩余量维持在K/2左右，以便种群快速恢复；标志重捕法的估算公式为：种群总数 = 第一次捕获标记数 × 第二次捕获数 ÷ 第二次捕获中标记数。","ex":[{"q":"为调查某草原上田鼠的种群密度，第一次捕获并标记了60只田鼠，第二次捕获了50只，其中有10只带有标记。求该田鼠种群的估算数量。","idea":"标志重捕法：种群数量 ÷ 第一次标记数 = 第二次捕获数 ÷ 第二次捕获中的标记数，即N = 第一次标记数 × 第二次捕获数 ÷ 重捕标记数。","ans":"N = 60 × 50 ÷ 10 = 300（只）。"}]},{"name":"群落的演替","desc":"随着时间的推移，一个群落被另一个群落代替的过程称为演替。初生演替是在从来没有被植物覆盖的地面，或者原来存在过植被、但被彻底消灭了的地方发生的演替，如裸岩上的演替；次生演替是在原有植被虽已不存在，但土壤条件基本保留，甚至还保留了植物的种子或其他繁殖体的地方发生的演替，如弃耕农田上的演替。","tip":"次生演替比初生演替速度快，因为原有的土壤条件和繁殖体得以保留。","ex":[{"q":"一片弃耕的农田经过数十年后，逐渐发展为灌木丛和森林，这种演替属于哪种类型？请说明原因。","idea":"判断原有土壤条件和繁殖体是否保留：弃耕农田保留了土壤和种子，属于原有植被被破坏但条件保留的情形。","ans":"属于次生演替。因为弃耕农田原有的土壤条件基本保留，还保留了植物的种子和其他繁殖体，所以演替速度较快。"}]},{"name":"生态系统的能量流动与物质循环","desc":"生态系统中能量沿食物链和食物网单向流动、逐级递减，相邻两个营养级之间的能量传递效率一般为10%～20%。物质循环是指组成生物体的化学元素在生物群落与无机环境之间循环往复，如碳元素主要以CO2的形式在生物群落与无机环境之间循环。碳主要通过生产者的光合作用进入生物群落，通过各种生物的呼吸作用和分解者的分解作用返回无机环境。能量是单向流动的，而物质是循环往复的，二者同时进行、相互依存。","tip":"能量传递效率是相邻营养级之间同化量的比值，不是个体之间的比值；能量流动的起点是生产者固定的太阳能。","ex":[{"q":"某生态系统中生产者固定的太阳能总量为10000 kJ，若能量传递效率按最大值20%计算，求次级消费者（第三营养级）最多能获得多少能量？","idea":"能量沿食物链逐级传递，每一营养级之间的传递效率相乘：第一营养级到第二营养级，再到第三营养级。","ans":"第二营养级最多获得10000 × 20% = 2000 kJ，第三营养级最多获得2000 × 20% = 400 kJ。"}]}]}]};
const TAB_HASH = { grammar: "g", math: "math", physics: "physics", chemistry: "chem", biology: "bio" };
const TAB_FROM_HASH = Object.fromEntries(Object.entries(TAB_HASH).map(([k, v]) => [v, k]));
const PER_PAGE = 30;
const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("").concat(["#"]);

const state = { tab: "vocab", letter: "all", q: "", page: 1 };
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const counts = {};
DATA.forEach((r) => { counts[r.l] = (counts[r.l] || 0) + 1; });

/* ---------- speech ---------- */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice() {
  return voices.find((v) => /en[-_]GB/i.test(v.lang))
    || voices.find((v) => /^en/i.test(v.lang))
    || null;
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function speak(text, btn) {
  if (!window.speechSynthesis) { toast("当前浏览器不支持语音朗读"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = v ? v.lang : "en-GB";
  u.rate = 0.9;
  if (btn) {
    btn.classList.add("playing");
    u.onend = u.onerror = () => btn.classList.remove("playing");
  }
  speechSynthesis.speak(u);
}

/* ---------- filtering ---------- */
function matches(r, q) {
  if (!q) return true;
  const hit = (s) => s && s.toLowerCase().includes(q);
  if (hit(r.w) || hit(r.zh) || hit(r.en)) return true;
  return r.d.some((d) => hit(d.w) || hit(d.zh) || hit(d.en));
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.filter((r) => (state.letter === "all" || r.l === state.letter) && matches(r, q));
}

/* ---------- rendering ---------- */
function renderAlpha() {
  const html = [`<button data-l="all" class="${state.letter === "all" ? "active" : ""}">
    <span class="letter">全部</span><span class="num">${DATA.length}</span></button><hr>`];
  LETTERS.forEach((l) => {
    const n = counts[l] || 0;
    html.push(`<button data-l="${l}" ${n ? "" : "disabled"} class="${state.letter === l ? "active" : ""}">
      <span class="letter">${l === "#" ? "#" : l.toUpperCase()}</span><span class="num">${n}</span></button>`);
  });
  $("alpha").innerHTML = html.join("");
}

function entryHTML(r) {
  const derived = r.d.length
    ? `<ul class="derived">${r.d.map((d) => `
        <li>
          <span class="dw" data-speak="${esc(d.w)}">${esc(d.w)}</span>
          <span class="ipa">${esc(d.ipa)}</span>
          <span class="dpos">${esc(d.pos)}</span>
          <span class="dzh">${esc(d.zh)}</span>
          <span class="den">${esc(d.en)}</span>
        </li>`).join("")}</ul>`
    : "";
  return `
    <article class="entry">
      <div class="head">
        <span class="word" data-speak="${esc(r.w)}">${esc(r.w)}</span>
        <button class="spk" data-speak="${esc(r.w)}" title="朗读">🔊</button>
        <span class="ipa">${esc(r.ipa)}</span>
        <span class="pos">${esc(r.pos)}</span>
      </div>
      <div class="meaning">${esc(r.zh)}</div>
      <div class="en">${esc(r.en)}</div>
      ${derived}
    </article>`;
}

function pageItems(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const set = new Set([1, total, cur, cur - 1, cur + 1]);
  if (cur <= 3) [2, 3, 4].forEach((x) => set.add(x));
  if (cur >= total - 2) [total - 1, total - 2, total - 3].forEach((x) => set.add(x));
  const pages = [...set].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);
  const out = [];
  pages.forEach((p, i) => {
    if (i && p - pages[i - 1] > 1) out.push("…");
    out.push(p);
  });
  return out;
}

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  const cur = state.page;
  if (pages <= 1) { $("pager").innerHTML = ""; return; }
  const items = pageItems(cur, pages).map((p) =>
    p === "…" ? `<span>…</span>` : `<button data-page="${p}" class="${p === cur ? "cur" : ""}">${p}</button>`
  );
  $("pager").innerHTML = `
    <button data-page="${cur - 1}" ${cur <= 1 ? "disabled" : ""}>‹ 上一页</button>
    ${items.join("")}
    <button data-page="${cur + 1}" ${cur >= pages ? "disabled" : ""}>下一页 ›</button>`;
}

function render() {
  const rows = filtered();
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;

  const start = (state.page - 1) * PER_PAGE;
  const slice = rows.slice(start, start + PER_PAGE);

  renderAlpha();
  $("count").textContent = `共 ${rows.length} 个词条` + (state.letter !== "all" ? `（${state.letter.toUpperCase()}）` : "");
  $("list").innerHTML = slice.length ? slice.map(entryHTML).join("") : `<div class="empty">没有找到匹配的单词</div>`;
  renderPager(rows.length);
  saveHash();
}

/* ---------- state in URL hash ---------- */
function saveHash() {
  const parts = [];
  if (state.tab !== "vocab") {
    parts.push("t=" + TAB_HASH[state.tab]);
  } else {
    if (state.letter !== "all") parts.push("l=" + state.letter);
    if (state.q) parts.push("q=" + encodeURIComponent(state.q));
    if (state.page > 1) parts.push("p=" + state.page);
  }
  history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname + location.search);
}

function loadHash() {
  const h = location.hash.replace(/^#/, "");
  const p = new URLSearchParams(h);
  state.tab = TAB_FROM_HASH[p.get("t")] || "vocab";
  if (!h) return;
  if (p.get("l") && LETTERS.includes(p.get("l"))) state.letter = p.get("l");
  if (p.get("q")) { state.q = p.get("q"); $("q").value = state.q; }
  if (p.get("p")) state.page = parseInt(p.get("p"), 10) || 1;
}

/* ---------- grammar tab ---------- */
let gramRendered = false;
function grammarHTML(it) {
  return `
    <article class="gcard">
      <h3>${esc(it.name)}</h3>
      <p class="gdesc">${esc(it.desc)}</p>
      ${it.tip ? `<p class="gtip">💡 ${esc(it.tip)}</p>` : ""}
      <ul class="gex">${it.ex.map(([en, zh]) => `
        <li>
          <span class="en">${esc(en)}</span>
          <span class="zh">${esc(zh)}</span>
          <button class="spk" data-speak="${esc(en)}" title="朗读">🔊</button>
        </li>`).join("")}</ul>
    </article>`;
}

function renderGrammar() {
  if (gramRendered) return;
  const toc = GRAMMAR.map((s, i) => `<button type="button" data-sec="${i}">${esc(s.title)}</button>`).join("");
  const body = GRAMMAR.map((s, i) => `
    <section class="gsec" id="gs${i}">
      <h2>${esc(s.title)}</h2>
      ${s.items.map(grammarHTML).join("")}
    </section>`).join("");
  $("grammar").innerHTML = `<div class="gtoc">${toc}</div>${body}`;
  gramRendered = true;
}

function showTab() {
  setHeaderVar();
  const t = state.tab;
  document.body.classList.toggle("nonvocab", t !== "vocab");
  document.body.classList.toggle("grammar", t === "grammar");
  document.body.classList.toggle("subject", !!SUBJECTS[t]);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  if (t === "vocab") {
    render();
  } else {
    if (t === "grammar") renderGrammar();
    else renderSubject(t);
    saveHash();
  }
}

function setTab(t) {
  state.tab = t;
  showTab();
  window.scrollTo(0, 0);
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});

$("grammar").addEventListener("click", (e) => {
  const sec = e.target.closest("button[data-sec]");
  if (sec) {
    $("gs" + sec.dataset.sec).scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const el = e.target.closest("[data-speak]");
  if (el) speak(el.dataset.speak, el.classList.contains("spk") ? el : null);
});

/* ---------- events ---------- */
function scrollTop() {
  const hdr = document.querySelector("header").offsetHeight;
  const y = $("list").getBoundingClientRect().top + window.scrollY - hdr - 16;
  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}

function setHeaderVar() {
  document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
}
setHeaderVar();
window.addEventListener("resize", setHeaderVar);

$("alpha").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-l]");
  if (!b || b.disabled) return;
  state.letter = b.dataset.l;
  state.page = 1;
  render();
  scrollTop();
});

$("pager").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-page]");
  if (!b || b.disabled) return;
  state.page = parseInt(b.dataset.page, 10);
  render();
  scrollTop();
});

$("list").addEventListener("click", (e) => {
  const el = e.target.closest("[data-speak]");
  if (!el) return;
  speak(el.dataset.speak, el.classList.contains("spk") ? el : null);
});

let qTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.q = e.target.value;
    state.page = 1;
    render();
  }, 150);
});
$("clear").addEventListener("click", () => {
  $("q").value = "";
  state.q = "";
  state.page = 1;
  render();
});

/* ---------- subject tabs (数学/物理/化学/生物) ---------- */
let subjKey = null;
function subjItemHTML(it) {
  const exs = (it.ex || []).map((x, n) => `
    <div class="qx">
      <div class="q"><span class="qn">例${n + 1}</span>${esc(x.q)}</div>
      <details>
        <summary>查看思路与解答</summary>
        <p class="idea"><b>思路：</b>${esc(x.idea)}</p>
        <p class="ans"><b>解答：</b>${esc(x.ans)}</p>
      </details>
    </div>`).join("");
  return `
    <article class="gcard">
      <h3>${esc(it.name)}</h3>
      <p class="gdesc">${esc(it.desc)}</p>
      ${it.tip ? `<p class="gtip">💡 ${esc(it.tip)}</p>` : ""}
      ${exs}
    </article>`;
}

function renderSubject(key) {
  if (subjKey === key) return;
  subjKey = key;
  const chapters = SUBJECTS[key];
  const toc = chapters.map((c, i) => `<button type="button" data-sec="${i}">${esc(c.title)}</button>`).join("");
  const body = chapters.map((c, i) => `
    <section class="gsec" id="ks-${key}-${i}">
      <h2>${esc(c.title)}</h2>
      ${c.items.map(subjItemHTML).join("")}
    </section>`).join("");
  $("subject").innerHTML = `<div class="gtoc">${toc}</div>${body}`;
}

$("subject").addEventListener("click", (e) => {
  const sec = e.target.closest("button[data-sec]");
  if (!sec) return;
  document.getElementById(`ks-${state.tab}-${sec.dataset.sec}`).scrollIntoView({ behavior: "smooth", block: "start" });
});

window.addEventListener("hashchange", () => { loadHash(); showTab(); });

loadHash();
showTab();
</script>
</body>
</html>
