细胞没有成形的细胞核，DNA集中分布的区域称为拟核。","ans":"拟核（环状DNA分子所在区域）。"}]},{"name":"细胞膜的结构与功能","desc":"细胞膜主要由脂质（磷脂最丰富）和蛋白质组成，还有少量糖类。糖类通常与蛋白质或脂质结合，形成糖蛋白或糖脂，位于细胞膜外侧，与细胞识别、保护和润滑有关。流动镶嵌模型认为：磷脂双分子层构成膜的基本骨架，蛋白质或镶嵌、或覆盖、或贯穿于其中，磷脂分子和大多数蛋白质分子可以运动。细胞膜的功能包括：将细胞与外界环境分隔开，控制物质进出细胞（选择透过性），进行细胞间的信息交流。","tip":"糖蛋白只分布在细胞膜的外侧，这是判断细胞膜内外侧的重要标志。","ex":[{"q":"判断：功能越复杂的细胞膜，其上蛋白质的种类和数量通常越多。","idea":"蛋白质是细胞膜功能的主要承担者，功能越复杂，蛋白质越多。","ans":"正确。"},{"q":"用台盼蓝染液可将死细胞染成蓝色，而活细胞不被染色，这体现了细胞膜的什么功能？","idea":"活细胞的细胞膜能控制物质进出，台盼蓝不能进入活细胞。","ans":"控制物质进出细胞的功能（选择透过性）。"},{"q":"细胞间进行识别、进行信息交流时起重要作用的结构是什么？","idea":"细胞膜外侧的糖蛋白具有识别作用。","ans":"糖蛋白（位于细胞膜外侧的糖类与蛋白质结合形成的物质）。"}]},{"name":"细胞器的分工与协作","desc":"线粒体是双层膜结构，内膜向内折叠形成嵴，是有氧呼吸的主要场所。叶绿体是双层膜结构，类囊体堆叠形成基粒，是光合作用的场所。内质网是单层膜网状结构，是蛋白质加工和脂质合成的场所。高尔基体是单层膜囊状结构，对蛋白质进行加工、分类和包装，在植物细胞中与细胞壁的形成有关。核糖体无膜，是合成蛋白质的场所。溶酶体含多种水解酶，可分解衰老、损伤的细胞器。液泡主要存在于植物细胞中，内含细胞液，可调节细胞渗透压。中心体无膜，见于动物和低等植物细胞，与纺锤体的形成有关。细胞膜、细胞器膜和核膜共同构成生物膜系统，使细胞区室化，保证各项生命活动有序进行。","tip":"无膜细胞器有核糖体和中心体；原核细胞唯一的细胞器是核糖体。","ex":[{"q":"下列细胞器中不具有膜结构的是（ ）A.线粒体 B.高尔基体 C.核糖体 D.内质网","idea":"线粒体、高尔基体、内质网都具有膜，核糖体无膜。","ans":"C。"},{"q":"分泌蛋白从合成到分泌出细胞，依次经过的细胞器（结构）是什么？","idea":"分泌蛋白在核糖体上合成，经内质网加工，高尔基体进一步加工包装，最后通过细胞膜分泌，线粒体提供能量。","ans":"核糖体→内质网→高尔基体→细胞膜（外排）；线粒体提供能量。"},{"q":"动物细胞有丝分裂前期纺锤体的形成与哪一种细胞器有关？","idea":"中心体在动物细胞分裂前期发出星射线形成纺锤体。","ans":"中心体。"}]},{"name":"细胞核的结构与功能","desc":"细胞核主要由核膜、染色质、核仁和核基质组成。核膜为双层膜，其上有核孔，是细胞核与细胞质之间大分子物质交换的通道。染色质由DNA和蛋白质组成，是遗传物质的主要载体。核仁与核糖体RNA的合成以及核糖体的形成有关。细胞核是遗传信息库，是细胞代谢和遗传的控制中心。蛋白质合成旺盛的细胞中，核仁通常较大，核孔数目较多。","tip":"核孔具有选择性，DNA不能通过核孔，而mRNA等可以通过核孔进入细胞质。","ex":[{"q":"下列关于细胞核的叙述，错误的是（ ）A.核仁与核糖体的形成有关 B.染色质主要由DNA和蛋白质组成 C.DNA可以通过核孔进入细胞质 D.核膜是双层膜","idea":"DNA不能通过核孔，核孔对大分子物质具有选择性。","ans":"C。"},{"q":"美西螈伞藻嫁接实验中，细胞核对伞帽形态的决定作用说明了细胞核的什么功能？","idea":"伞帽的形态由细胞核所在的假根细胞决定。","ans":"细胞核是细胞遗传和代谢的控制中心。"},{"q":"与蛋白质合成旺盛的细胞相比，蛋白质合成较少的细胞中核仁通常怎样？","idea":"核仁与核糖体的形成有关，蛋白质合成旺盛需要更多核糖体。","ans":"核仁较小。"}]}]},{"title":"第三章 细胞的物质输入和输出（必修一）","items":[{"name":"渗透作用与原生质层","desc":"渗透作用是指水分子或其他溶剂分子通过半透膜的扩散，水分子从单位体积内水分子多（溶质浓度低）的一侧向少（溶质浓度高）的一侧扩散。原生质层由细胞膜、液泡膜以及两层膜之间的细胞质组成，具有选择透过性，相当于一层半透膜。当外界溶液浓度大于细胞液浓度时，成熟植物细胞失水，发生质壁分离；当外界溶液浓度小于细胞液浓度时，发生质壁分离复原。","tip":"质壁分离中“质”指原生质层，“壁”指细胞壁，原生质层的伸缩性比细胞壁大，这是质壁分离的前提。","ex":[{"q":"紫色洋葱外表皮细胞发生质壁分离时，外界溶液浓度与细胞液浓度的关系是什么？","idea":"发生质壁分离的条件是细胞失水，即外界溶液浓度大于细胞液浓度。","ans":"外界溶液浓度大于细胞液浓度。"},{"q":"原生质层包括哪些结构？","idea":"原生质层是活细胞中具有选择透过性的结构。","ans":"细胞膜、液泡膜以及两层膜之间的细胞质。"},{"q":"在质壁分离的过程中，细胞的吸水能力如何变化？","idea":"随着失水，细胞液浓度升高，细胞吸水能力增强。","ans":"逐渐增强。"}]},{"name":"被动运输","desc":"被动运输是顺浓度梯度的运输，不需要消耗细胞代谢释放的能量。自由扩散的物质通过磷脂双分子层进出细胞，如O2、CO2、甘油、乙醇、苯等脂溶性小分子，运输速率与浓度差成正比。协助扩散需要载体蛋白或通道蛋白的协助，如葡萄糖进入红细胞、水通过水通道蛋白进出细胞，运输速率在一定范围内随浓度差增大而增大，达到饱和后受载体数量限制。","tip":"判断自由扩散与协助扩散的关键是看是否需要膜上的转运蛋白。","ex":[{"q":"下列物质中，通过自由扩散进入细胞的是（ ）A.葡萄糖进入红细胞 B.K+进入神经细胞 C.O2进入肺泡上皮细胞 D.Na+进入神经细胞","idea":"自由扩散适用于O2、CO2等脂溶性小分子；葡萄糖进入红细胞是协助扩散，K+、Na+进入细胞属于主动运输或协助扩散。","ans":"C。"},{"q":"某物质运输速率随细胞外浓度增大而增加，达到一定程度后不再增加，该运输方式最可能是什么？","idea":"速率不再增加，说明运输受载体数量限制。","ans":"协助扩散。"},{"q":"水分子进入细胞的方式有哪些？","idea":"水可以通过磷脂双分子层自由扩散，也可通过水通道蛋白进行协助扩散。","ans":"自由扩散和协助扩散（通过水通道蛋白）。"}]},{"name":"主动运输与胞吞胞吐","desc":"主动运输是从低浓度向高浓度一侧运输，需要载体蛋白的协助，并消耗细胞代谢释放的能量（ATP），如小肠上皮细胞吸收葡萄糖和氨基酸、根细胞吸收矿质离子、钠钾泵维持细胞内外的离子梯度。胞吞和胞吐是大分子或颗粒物质进出细胞的方式，通过形成囊泡完成，需要消耗能量，依赖细胞膜的流动性，如白细胞吞噬细菌、胰岛素等分泌蛋白的排出。","tip":"胞吞胞吐不需要载体蛋白，但需要能量；主动运输需要载体和能量。","ex":[{"q":"根细胞吸收矿质离子时，需要依赖的条件是什么？","idea":"矿质离子的吸收是逆浓度梯度进行的主动运输。","ans":"需要载体蛋白和细胞呼吸提供的能量（ATP）。"},{"q":"判断：小肠上皮细胞吸收葡萄糖的方式为主动运输，其影响因素包括载体数量和氧气浓度。","idea":"主动运输需要能量，氧气影响有氧呼吸，进而影响能量供应；载体数量也影响运输速率。","ans":"正确。"},{"q":"若用呼吸抑制剂处理细胞，下列物质进入细胞的速率会明显下降的是（ ）A.O2 B.甘油 C.K+ D.水","idea":"呼吸抑制剂使细胞供能减少，主动运输受影响；O2、甘油、水以自由扩散为主。","ans":"C。"}]}]},{"title":"第四章 酶与ATP（必修一）","items":[{"name":"酶的本质与特性","desc":"酶是活细胞产生的具有催化作用的有机物，绝大多数是蛋白质，少数是RNA。酶的作用机理是降低化学反应的活化能。酶具有高效性（催化效率远高于无机催化剂）、专一性（一种酶只能催化一种或一类化学反应）和作用条件温和的特点。过酸、过碱或高温会使酶的空间结构被破坏而永久失活，低温则只抑制酶的活性，不破坏其结构。","tip":"酶只能加快反应速率，不改变化学反应的平衡点，反应前后自身的质和量都不变。","ex":[{"q":"探究淀粉酶的专一性时，若用淀粉酶分别催化淀粉和蔗糖，能否只用碘液检测结果？为什么？","idea":"碘液只能检测淀粉是否被分解，无法检测蔗糖是否被水解，需要用斐林试剂检测还原糖。","ans":"不能只用碘液。碘液只能说明淀粉是否被分解，无法判断蔗糖是否被水解，应用斐林试剂检测还原糖的生成。"},{"q":"酶催化作用的实质是什么？","idea":"酶通过降低化学反应所需的活化能来加快反应速率。","ans":"降低化学反应的活化能。"},{"q":"某酶在pH=7时活性最高，pH=3时几乎失活，把pH恢复到7时活性也不能恢复，原因是什么？","idea":"强酸使酶的空间结构被破坏，属于不可逆的变性。","ans":"过酸使酶的空间结构被破坏，酶变性失活，且这种破坏是不可逆的。"}]},{"name":"影响酶活性的因素","desc":"温度影响酶活性：在最适温度前，随温度升高，酶促反应速率加快；超过最适温度后，酶活性下降，高温使酶变性失活。pH同样存在最适值。在酶量一定时，底物浓度增大，反应速率先加快，达到饱和后不再增加；在底物充足时，酶浓度增大，反应速率加快。探究温度对酶活性的影响时，不宜选用过氧化氢作为底物，因为过氧化氢受热会自行分解，干扰实验结果。","tip":"低温保存酶制剂是为了抑制酶活性并维持其结构稳定，而不是使其达到最适状态。","ex":[{"q":"在探究温度对酶活性影响的实验中，为什么不宜用过氧化氢和过氧化氢酶做实验材料？","idea":"过氧化氢受热会分解，温度本身就会改变底物的量。","ans":"过氧化氢在加热时会自行分解，干扰了温度对酶活性影响的观察。"},{"q":"某酶促反应中，底物浓度增大到一定程度后反应速率不再变化，此时限制反应速率的主要因素是什么？","idea":"底物已经饱和，此时酶的数量或活性成为限制因素。","ans":"酶的数量（或酶的活性）。"},{"q":"为什么酶制剂一般在低温条件下保存？","idea":"低温降低酶的活性，并能保持酶的空间结构稳定。","ans":"低温抑制酶的活性，并使酶的空间结构保持稳定，延长保存时间。"}]},{"name":"ATP的结构与作用","desc":"ATP即三磷酸腺苷，结构简式为A-P~P~P，其中A代表腺苷（由腺嘌呤和核糖组成），P代表磷酸基团，“~”代表高能磷酸键。ATP中远离A的高能磷酸键易断裂，释放大量能量，同时形成ADP。ATP是细胞内直接的能源物质，其来源有细胞呼吸和光合作用，去路是用于各项生命活动。ATP与ADP的相互转化处于动态平衡，保证了细胞对能量的持续需求。","tip":"ATP是直接能源物质，葡萄糖是主要能源物质，细胞内的储能物质包括脂肪、糖原和淀粉等。","ex":[{"q":"一分子ATP中含有几个高能磷酸键？","idea":"ATP的结构简式为A-P~P~P，含两个高能磷酸键。","ans":"2个。"},{"q":"ATP中的A代表什么？","idea":"ATP中的A与核糖和腺嘌呤有关。","ans":"腺苷（由腺嘌呤和核糖组成）。"},{"q":"细胞内ATP与ADP相互转化的意义是什么？","idea":"ATP与ADP快速转化，使细胞内ATP含量保持相对稳定。","ans":"使细胞内ATP的含量保持相对稳定，满足细胞持续进行生命活动对能量的需求。"}]}]},{"title":"第五章 细胞呼吸（必修一）","items":[{"name":"有氧呼吸的过程","desc":"有氧呼吸分为三个阶段。第一阶段在细胞质基质中进行，1分子葡萄糖分解为2分子丙酮酸和[H]，释放少量能量。第二阶段在线粒体基质中进行，丙酮酸与水反应生成CO2和[H]，释放少量能量。第三阶段在线粒体内膜上进行，[H]与O2结合生成水，释放大量能量。总反应式为C6H12O6+6O2+6H2O→6CO2+12H2O+能量。O2只参与第三阶段；生成的水中的氧来自O2，生成的CO2中的氧来自葡萄糖和水。","tip":"有氧呼吸的第三阶段产能最多，约占有氧呼吸总能量的绝大部分。","ex":[{"q":"用18O标记O2，它的放射性最先出现在哪种产物中？","idea":"O2在第三阶段与[H]结合生成水，因此最先出现在H2O中。","ans":"H2O（水），经有氧呼吸第三阶段生成。"},{"q":"1 mol葡萄糖彻底氧化分解，释放的CO2与消耗的O2的物质的量之比是多少？","idea":"总反应式中6CO2与6O2之比。","ans":"1∶1。"},{"q":"有氧呼吸的三个阶段中，产生ATP最多的是哪一阶段？","idea":"第三阶段[H]与O2结合，释放的能量最多。","ans":"第三阶段，在线粒体内膜上进行。"}]},{"name":"无氧呼吸与细胞呼吸的应用","desc":"无氧呼吸在细胞质基质中进行，葡萄糖不彻底分解，只释放少量能量。酒精发酵：C6H12O6→2C2H5OH+2CO2+少量能量，见于酵母菌和部分植物细胞。乳酸发酵：C6H12O6→2C3H6O3+少量能量，见于人和动物的骨骼肌细胞、乳酸菌。无氧呼吸的第一阶段与有氧呼吸相同。细胞呼吸原理应用：粮食储藏应在低温、低氧、干燥条件下进行；酵母菌可用于酿酒，乳酸菌用于制作酸奶；松土可增加氧气供应，促进根系有氧呼吸；伤口包扎用透气纱布，防止厌氧菌繁殖。","tip":"人体剧烈运动时骨骼肌无氧呼吸产生乳酸，不产生CO2。","ex":[{"q":"人在剧烈运动时，骨骼肌细胞进行无氧呼吸，产生的物质是什么？是否产生CO2？","idea":"人体骨骼肌无氧呼吸产生乳酸，不产生CO2。","ans":"产生乳酸，不产生CO2。"},{"q":"酵母菌消耗1 mol葡萄糖进行有氧呼吸，释放CO2 6 mol；若进行酒精发酵，释放CO2多少mol？","idea":"酒精发酵中每分子葡萄糖产生2分子CO2。","ans":"2 mol。"},{"q":"储存水果、蔬菜时，为什么要降低氧气浓度但不能使氧气浓度为零？","idea":"氧浓度过低则有机物会通过无氧呼吸大量分解，氧为零则产生更多酒精，不利于保鲜。","ans":"降低氧浓度可抑制有氧呼吸，减少有机物消耗；氧浓度为零时会进行无氧呼吸，产生酒精等有害物质，不利于保鲜。"}]}]},{"title":"第六章 光合作用（必修一）","items":[{"name":"光合色素与光反应","desc":"叶绿体中的色素包括叶绿素（叶绿素a、叶绿素b，主要吸收红光和蓝紫光）和类胡萝卜素（胡萝卜素、叶黄素，主要吸收蓝紫光）。叶片呈绿色是因为叶绿素对绿光吸收最少而反射较多。光反应在类囊体薄膜上进行：色素吸收光能，将水分解为O2和[H]，同时将光能转化为ATP中的化学能，O2释放到大气中。提取色素用无水乙醇，分离色素用纸层析法，溶解度最大的胡萝卜素扩散最快。","tip":"光反应中O2来自水的光解，而不是CO2。","ex":[{"q":"用18O标记H2O，进行光合作用后释放的O2中含有18O，这说明O2来自什么？","idea":"光反应中水光解产生O2。","ans":"O2来自水的光解。"},{"q":"在纸层析法分离叶绿体色素的实验结果中，扩散速度最快的色素是什么？","idea":"溶解度越大，随层析液扩散越快。","ans":"胡萝卜素（溶解度最大）。"},{"q":"叶片呈绿色的原因是什么？","idea":"叶绿素主要吸收红光和蓝紫光，对绿光吸收最少。","ans":"叶绿素对绿光吸收最少，绿光被反射，因此叶片呈绿色。"}]},{"name":"暗反应的过程","desc":"暗反应在叶绿体基质中进行，不直接需要光，但依赖光反应提供的ATP和[H]。包括二氧化碳的固定（CO2与C5结合形成2分子C3）和C3的还原（C3在ATP和[H]的作用下被还原为糖类，同时部分C3再生为C5）。光反应与暗反应相互依存，光反应为暗反应提供物质和能量，暗反应为光反应提供ADP、Pi和NADP+。","tip":"暗反应并非“黑暗中”进行，在有光时也能进行。","ex":[{"q":"突然停止光照，短时间内叶绿体中C3的含量如何变化？","idea":"光照停止，光反应减弱，ATP和[H]减少，C3还原受阻，而CO2固定仍在进行。","ans":"C3含量增加。"},{"q":"突然降低CO2浓度，短时间内叶绿体中C5的含量如何变化？","idea":"CO2减少，CO2固定减弱，C5消耗减少而继续生成，因此C5增多。","ans":"C5含量增加。"},{"q":"光合作用中，C3还原需要光反应提供哪两种物质？","idea":"C3还原需要ATP提供能量，需要[H]作为还原剂。","ans":"ATP和[H]。"}]},{"name":"影响光合作用的因素","desc":"影响光合速率的主要因素包括光照强度、CO2浓度、温度、水和矿质元素等。在一定范围内，光照强度增加，光合速率增大，达到光饱和点后不再增加。光补偿点是指光合速率与呼吸速率相等时的光照强度。CO2浓度增加，光合速率增大，达到饱和后不再增加。温度通过影响酶的活性影响光合速率。夏季中午光照过强、温度过高，植物气孔部分关闭，CO2摄入减少，光合作用会出现“午休”现象。","tip":"光补偿点时，植物叶肉细胞光合速率等于呼吸速率，但整个植株中有机物总量可能仍减少。","ex":[{"q":"某植物在光照强度为x时，光合速率与呼吸速率相等，该光照强度称为什么？","idea":"光合速率等于呼吸速率时的光照强度称为光补偿点。","ans":"光补偿点。"},{"q":"夏季中午，植物光合作用强度下降，即“午休”现象，主要原因是什么？","idea":"中午光照过强、温度过高，植物为减少水分散失，部分气孔关闭，CO2进入减少。","ans":"气孔部分关闭，CO2吸收量减少，暗反应减弱。"},{"q":"在其他条件适宜的情况下，CO2浓度持续增加，光合速率会一直增大吗？为什么？","idea":"CO2浓度过高时，受光照强度、酶数量和色素含量等因素限制，光合速率不再增加。","ans":"不会。CO2达到一定浓度后，光合速率不再随其增加，此时受光照、温度或酶等其他因素限制。"}]}]},{"title":"第七章 细胞的生命历程（必修一）","items":[{"name":"细胞周期与有丝分裂","desc":"连续分裂的细胞从一次分裂完成开始到下一次分裂完成为止称为一个细胞周期，分为分裂间期（主要完成DNA复制和蛋白质合成）和分裂期。有丝分裂分为前期（染色质螺旋化为染色体，核膜、核仁消失，纺锤体形成）、中期（染色体的着丝粒排列在赤道板上，形态数目最清晰）、后期（着丝粒分裂，姐妹染色单体分开，染色体数目暂时加倍）、末期（染色体变为染色质，核膜、核仁重现，植物细胞形成细胞板，动物细胞细胞膜向内凹陷缢裂）。有丝分裂的意义在于将亲代细胞的染色体经复制后平均分配到两个子细胞中，保持遗传性状的稳定。","tip":"分裂后期染色体数目加倍，但DNA数目不变；间期时间最长，因此观察到的细胞大多处于间期。","ex":[{"q":"某生物体细胞有4条染色体，有丝分裂后期细胞中染色体数与核DNA分子数分别是多少？","idea":"后期着丝粒分裂，染色体数加倍为8，每条染色体含1个DNA分子，DNA总数为8。","ans":"染色体数为8条，DNA分子数为8个。"},{"q":"动物细胞与高等植物细胞有丝分裂的主要区别有哪些？","idea":"区别主要体现在纺锤体形成方式和细胞质分裂方式上。","ans":"前期纺锤体形成方式不同（动物由中心体发出星射线，植物由细胞两极发出纺锤丝）；末期细胞质分裂方式不同（动物细胞膜向内凹陷，植物形成细胞板）。"},{"q":"在观察根尖分生区细胞有丝分裂的装片中，视野中大多数细胞处于哪个时期？为什么？","idea":"间期时间最长，所以处于间期的细胞数量最多。","ans":"分裂间期，因为间期在细胞周期中所占时间最长。"}]},{"name":"细胞的分化与全能性","desc":"细胞分化是指同一来源的细胞在形态、结构和生理功能上发生稳定性差异的过程。细胞分化的实质是基因的选择性表达，遗传物质不变。细胞全能性是指已经分化的细胞仍然具有发育成完整个体或分化成其他各种细胞的潜能。受精卵的全能性最高；植物细胞全能性易于表现，植物组织培养是其典型应用；动物细胞的细胞核具有全能性，如克隆羊多莉的培育。","tip":"细胞分化后，细胞内的遗传物质一般不发生改变，但蛋白质种类和数量会有所不同。","ex":[{"q":"同一个体内不同细胞的形态结构和功能各不相同，其根本原因是什么？","idea":"分化的实质是基因的选择性表达，遗传物质相同。","ans":"基因的选择性表达。"},{"q":"胡萝卜韧皮部细胞能培养成完整植株，说明了什么？","idea":"已分化的植物细胞发育成完整个体，体现了细胞的全能性。","ans":"已分化的植物细胞具有全能性。"},{"q":"下列细胞中全能性最高的是（ ）A.造血干细胞 B.受精卵 C.叶肉细胞 D.神经细胞","idea":"受精卵是全能性最高的细胞。","ans":"B。"}]},{"name":"细胞的衰老与凋亡","desc":"衰老细胞的主要特征有：水分减少，细胞体积变小，新陈代谢速率减慢；多种酶活性降低；色素逐渐积累；细胞核体积增大，染色质收缩，染色加深；细胞膜通透性改变，物质运输功能降低。细胞凋亡是由基因决定的细胞自动结束生命的过程，又称细胞编程性死亡，如蝌蚪发育过程中尾部细胞的消失、人胚胎发育中手指间细胞的凋亡。细胞凋亡对于个体发育、维持内部环境稳定及抵御外界各种因素的干扰都起着关键作用。","tip":"细胞凋亡是正常的生理过程，而由病原体感染或外界因素引起的细胞损伤和死亡称为细胞坏死。","ex":[{"q":"下列不属于细胞凋亡实例的是（ ）A.蝌蚪发育过程中尾部消失 B.被病原体感染的细胞被清除 C.手指发育过程中指间细胞的死亡 D.被病毒感染后细胞因损伤而死亡","idea":"细胞凋亡是由基因决定的程序性死亡，D选项是病毒感染导致的细胞损伤死亡，属于坏死。","ans":"D。"},{"q":"衰老的细胞中，细胞核的体积会发生怎样的变化？","idea":"回忆衰老细胞的主要特征。","ans":"细胞核体积增大。"},{"q":"老年人头发变白的原因是什么？","idea":"头发基部的黑色素细胞衰老后，酪氨酸酶活性降低，黑色素合成减少。","ans":"头发基部的黑色素细胞衰老，酪氨酸酶活性降低，黑色素合成减少。"}]},{"name":"细胞的癌变","desc":"致癌因子包括物理致癌因子（紫外线、X射线等）、化学致癌因子（亚硝酸盐、黄曲霉毒素、苯、烟草焦油等）和病毒致癌因子。细胞癌变是原癌基因和抑癌基因发生突变的结果。原癌基因主要负责调节细胞周期，控制细胞生长和分裂进程；抑癌基因主要阻止细胞不正常的增殖。癌细胞具有无限增殖、形态结构显著改变（如由扁平变为球形）、细胞膜上糖蛋白减少、细胞间黏着性降低，易在体内扩散转移的特点。","tip":"癌细胞细胞膜上的糖蛋白减少，这是癌细胞易分散转移的直接原因。","ex":[{"q":"癌细胞易在体内分散和转移，主要原因是什么？","idea":"癌细胞膜上糖蛋白减少，细胞间黏着性降低。","ans":"癌细胞膜上的糖蛋白减少，细胞间的黏着性降低。"},{"q":"下列关于癌细胞的叙述，错误的是（ ）A.能无限增殖 B.形态结构发生显著变化 C.细胞膜上糖蛋白增加 D.可由基因突变引起","idea":"癌细胞膜上糖蛋白减少，而非增加。","ans":"C。"},{"q":"长期吸烟的人易患肺癌，说明烟草中含有哪类致癌因子？","idea":"烟草焦油等成分属于化学致癌因子。","ans":"化学致癌因子。"}]}]},{"title":"第八章 减数分裂与受精作用（必修二）","items":[{"name":"减数分裂的过程","desc":"减数分裂是进行有性生殖的生物在产生成熟生殖细胞时进行的染色体数目减半的分裂方式，染色体只复制一次，细胞连续分裂两次。减数第一次分裂：同源染色体联会形成四分体，非姐妹染色单体之间可能发生交叉互换；后期同源染色体分离，非同源染色体自由组合，结束时染色体数目减半。减数第二次分裂：类似有丝分裂，着丝粒分裂，姐妹染色单体分开，分别进入子细胞，无同源染色体。一个精原细胞经减数分裂形成4个精子；一个卵原细胞形成1个卵细胞和3个极体。","tip":"同源染色体的分离发生在减数第一次分裂后期，减数第二次分裂后期无同源染色体。","ex":[{"q":"某动物体细胞中有2对同源染色体，不考虑交叉互换，一个精原细胞经减数分裂产生的4个精子中，染色体组合类型有几种？该动物产生的全部配子共有几种染色体组合？","idea":"一个精原细胞减数分裂只产生2种类型的精子（两两相同）；而该动物所有配子的组合数为2的2次方。","ans":"一个精原细胞产生的精子只有2种类型；该动物产生的全部配子组合数为2²=4种。"},{"q":"体细胞中染色体数为2n=8的生物，在减数第一次分裂中期，细胞中的同源染色体对数和四分体数分别是多少？","idea":"2n=8即有4对同源染色体，每对同源染色体联会形成1个四分体。","ans":"同源染色体4对，四分体4个。"},{"q":"精原细胞进行减数分裂时，细胞中DNA数目第一次减半发生在哪个时期？","idea":"减数第一次分裂末期，同源染色体分离并进入两个子细胞，细胞内DNA减半。","ans":"减数第一次分裂末期。"}]},{"name":"受精作用与配子的多样性","desc":"受精作用是精子与卵细胞融合形成受精卵的过程。受精卵中的核染色体一半来自父方，一半来自母方，使体细胞染色体数目恢复到亲代的水平。减数分裂和受精作用对于维持生物亲子代之间染色体数目的稳定，以及遗传和变异具有重要意义。配子多样性的原因包括：减数第一次分裂后期非同源染色体自由组合；四分体时期非姐妹染色单体间交叉互换；受精时卵细胞与精子结合的随机性。","tip":"受精卵的细胞质遗传物质几乎全部来自卵细胞，而细胞核中的遗传物质则父母各提供一半。","ex":[{"q":"某生物体细胞中有3对同源染色体，不考虑交叉互换，产生配子时非同源染色体的组合方式有几种？","idea":"非同源染色体自由组合的组合数为2的3次方。","ans":"8种。"},{"q":"判断：受精卵细胞质中的遗传物质几乎全部来自卵细胞。","idea":"精子主要提供细胞核，细胞质几乎全部来自卵细胞。","ans":"正确。"},{"q":"一个基因型为AaBb的精原细胞（两对基因分别位于两对同源染色体上），不考虑交叉互换，形成的精子有几种基因型？","idea":"一个精原细胞减数分裂只产生2种精子类型，每种两个。","ans":"2种（如AB、ab，或Ab、aB）。"}]}]},{"title":"第九章 遗传物质的探索与DNA复制（必修二）","items":[{"name":"肺炎链球菌的转化实验","desc":"格里菲思实验：将无毒的R型活菌与加热杀死的有毒S型菌混合注射到小鼠体内，小鼠死亡，从死亡小鼠体内分离出了活的S型菌，说明加热杀死的S型菌中存在某种“转化因子”，能使R型菌转化为S型菌。艾弗里实验：将S型菌的DNA、蛋白质、多糖、DNA水解酶等分别与R型菌混合培养，只有加入DNA的一组出现了S型菌，说明DNA是遗传物质，而蛋白质、多糖等不是遗传物质。","tip":"艾弗里实验运用了“减法原理”，逐一去除S型菌的某类物质，观察转化是否发生。","ex":[{"q":"艾弗里实验中，用DNA水解酶处理S型菌提取物后再与R型菌混合培养，结果是什么？为什么？","idea":"DNA被水解后失去转化作用，无法使R型菌转化。","ans":"只有R型菌生长，没有S型菌出现，因为DNA被水解，失去了转化作用。"},{"q":"格里菲思的实验结论是什么？","idea":"回忆格里菲思的实验现象与推论。","ans":"加热杀死的S型菌中存在某种转化因子，能使R型活菌转化为S型活菌。"},{"q":"在肺炎链球菌转化实验中，最终被证明是遗传物质的物质是什么？","idea":"艾弗里通过分别去除各类物质，证明只有DNA能转化。","ans":"DNA。"}]},{"name":"噬菌体侵染细菌的实验","desc":"赫尔希和蔡斯用35S标记噬菌体的蛋白质，用32P标记噬菌体的DNA，分别侵染未被标记的大肠杆菌。经过搅拌、离心后，35S主要分布在上清液中，32P主要分布在沉淀物中，说明DNA进入了细菌，而蛋白质外壳留在细菌外，从而证明DNA是遗传物质。噬菌体增殖时，以自身的DNA为模板，利用细菌内的脱氧核苷酸和氨基酸等原料合成子代噬菌体的DNA和蛋白质。","tip":"搅拌的目的是使噬菌体外壳与细菌分离；保温时间过长或过短，都会使上清液或沉淀物中的放射性出现异常。","ex":[{"q":"用32P标记的噬菌体侵染未被标记的大肠杆菌，产生100个子代噬菌体，其中含32P的噬菌体有几个？","idea":"DNA的复制是半保留复制，亲代DNA的两条链分别进入两个子代DNA中。","ans":"2个。"},{"q":"用35S标记的噬菌体侵染大肠杆菌，经搅拌离心后，放射性主要存在于哪一部分？","idea":"35S标记的是蛋白质外壳，蛋白质未进入细菌，随噬菌体外壳留在上清液。","ans":"上清液。"},{"q":"噬菌体在合成子代DNA时，所用的模板和原料分别来自哪里？","idea":"模板来自噬菌体自身的DNA，原料来自细菌。","ans":"模板来自噬菌体自身的DNA，原料来自大肠杆菌。"}]},{"name":"DNA的结构与半保留复制","desc":"DNA双螺旋结构：两条反向平行的脱氧核苷酸链，脱氧核糖与磷酸交替排列构成基本骨架，碱基排列在内侧。A与T之间形成两个氢键，G与C之间形成三个氢键，遵循碱基互补配对原则。DNA复制是以解开的两条母链为模板，按照碱基互补配对原则合成子链，每个子代DNA分子都含有一条母链和一条新链，称为半保留复制。复制需要模板、原料、能量和酶（解旋酶、DNA聚合酶等）。","tip":"无论复制多少次，含母链的子代DNA分子始终只有2个，但含新链的DNA分子数目不断增加。","ex":[{"q":"某DNA片段含100个碱基对，其中A有40个，该DNA复制3次，需要游离的胞嘧啶脱氧核苷酸多少个？","idea":"A=T=40，则G=C=60。复制3次共得到8个DNA，新合成了7个DNA，每个需要C 60个。","ans":"7×60=420个。"},{"q":"将一个全部被15N标记的DNA分子放在14N的培养基中复制3次，含15N的DNA分子占全部子代DNA分子的比例是多少？","idea":"半保留复制，子代共8个DNA，其中含15N的只有2个。","ans":"2/8=1/4。"},{"q":"DNA分子具有特异性，其主要原因是什么？","idea":"特异性由每种DNA特定的碱基对排列顺序决定。","ans":"每种DNA分子都有特定的碱基对排列顺序。"}]}]},{"title":"第十章 基因的表达（必修二）","items":[{"name":"遗传信息的转录与翻译","desc":"转录是以DNA的一条链为模板，在RNA聚合酶的作用下合成RNA的过程，主要发生在细胞核中，碱基配对方式为A-U、T-A、G-C、C-G。翻译是以mRNA为模板，在核糖体上，以氨基酸为原料，tRNA转运氨基酸，按照密码子与反密码子互补配对的原则，合成具有一定氨基酸序列的蛋白质的过程。mRNA上决定一个氨基酸的3个相邻碱基称为一个密码子，共64种，其中61种编码氨基酸，3种为终止密码子。","tip":"密码子位于mRNA上，反密码子位于tRNA上；非模板链的序列与转录出的mRNA序列相同，只是T换成U。","ex":[{"q":"已知某DNA的一条非模板链序列为5'-ATGCGT-3'，转录出的mRNA序列是什么？","idea":"mRNA与非模板链序列一致，只需把T换成U。","ans":"5'-AUGCGU-3'。"},{"q":"某mRNA上的一段序列为5'-AUG GCU UAA-3'，其翻译合成的肽链含有几个氨基酸？","idea":"UAA是终止密码子，不编码氨基酸，AUG和GCU各编码一个氨基酸。","ans":"2个。"},{"q":"某tRNA的反密码子为3'-UAC-5'，它所转运的氨基酸对应的密码子是什么？","idea":"反密码子与密码子反向互补，3'-UAC-5'对应的密码子为5'-AUG-3'。","ans":"5'-AUG-3'，即甲硫氨酸的密码子。"}]},{"name":"中心法则与基因、性状的关系","desc":"中心法则描述了遗传信息的传递规律：DNA可以自我复制，遗传信息从DNA流向DNA；通过转录，遗传信息从DNA流向RNA；通过翻译，遗传信息从RNA流向蛋白质。后来发现，某些RNA病毒可以进行RNA复制，逆转录病毒（如HIV）可以通过逆转录，将遗传信息从RNA流向DNA。基因控制性状的途径有两条：一是通过控制酶的合成控制代谢过程，进而间接控制性状，如白化病；二是通过控制蛋白质的结构直接控制性状，如囊性纤维化。","tip":"逆转录需要逆转录酶，发生在某些病毒的增殖过程中；正常细胞中不发生逆转录。","ex":[{"q":"HIV的遗传物质是RNA，侵入宿主细胞后，其遗传信息的传递方向是什么？","idea":"HIV通过逆转录将RNA转变为DNA，再通过转录和翻译合成病毒蛋白。","ans":"RNA→DNA（逆转录）→RNA（转录）→蛋白质（翻译）。"},{"q":"白化病是由于控制酪氨酸酶合成的基因异常导致酪氨酸酶不能合成，黑色素无法形成。这说明基因控制性状的途径是什么？","idea":"基因通过控制酶的合成影响代谢，进而影响性状。","ans":"基因通过控制酶的合成来控制代谢过程，进而间接控制生物性状。"},{"q":"囊性纤维化是由于CFTR蛋白的结构异常引起的，这说明基因控制性状的途径是什么？","idea":"基因通过控制蛋白质的结构直接影响性状。","ans":"基因通过控制蛋白质的结构直接控制生物体的性状。"}]},{"name":"表观遗传与基因表达调控","desc":"表观遗传是指DNA的碱基序列不变，但基因的表达和表型发生了可遗传的变化。常见机制包括DNA甲基化（甲基基团结合到DNA上，影响RNA聚合酶与启动子的结合，从而抑制转录）和组蛋白修饰等。表观遗传现象说明，基因表达会受到环境和发育阶段的调控。同卵双胞胎性状存在差异，部分原因即在于表观遗传的差异。细胞分化的过程也与基因的选择性表达和表观遗传调控密切相关。","tip":"表观遗传不改变碱基序列，但可以遗传给后代。","ex":[{"q":"DNA甲基化是否改变了基因的碱基序列？","idea":"甲基化只是在DNA上添加了甲基基团，碱基序列不变。","ans":"没有改变碱基序列，只是影响基因的表达。"},{"q":"同卵双胞胎的遗传物质基本相同，但在性状上存在差异，主要原因之一是什么？","idea":"遗传物质相同，差异来自环境和表观遗传的影响。","ans":"表观遗传（基因表达调控的差异，如DNA甲基化的差异）以及环境因素的影响。"},{"q":"判断：表观遗传现象中，基因的碱基序列发生了改变。","idea":"表观遗传的定义是碱基序列不变而表型可遗传地改变。","ans":"错误。"}]}]},{"title":"第十一章 遗传的基本规律（必修二）","items":[{"name":"分离定律","desc":"孟德尔选用豌豆作为实验材料，因为豌豆是严格的自花传粉、闭花受粉植物，自然状态下一般为纯种，且具有易于区分的相对性状。在一对相对性状的杂交实验中，F1全部表现为显性性状，F2中显性性状与隐性性状的比例约为3∶1。分离定律的实质是：等位基因随同源染色体的分开而分离，产生配子时，成对的遗传因子彼此分离，分别进入不同的配子中。测交是让F1与隐性纯合子杂交，后代显隐性比例为1∶1，可用于检验F1的基因型。","tip":"判断显隐性时，若亲本杂交后子代只表现出一种性状，则该性状为显性；若某性状的个体自交后出现性状分离，则亲本为杂合子，且所表现的性状为显性。","ex":[{"q":"一对杂合的黑毛豚鼠（Aa）交配，生育的第3只小豚鼠为白毛（aa）的概率是多少？","idea":"每次生育的基因型独立，Aa×Aa后代中aa的概率为1/4。","ans":"1/4。"},{"q":"基因型为Aa的个体连续自交，F2中纯合子所占的比例是多少？","idea":"F2中Aa占1/2，AA和aa各占1/4，纯合子为AA和aa之和。","ans":"1/2。"},{"q":"高茎（D）对矮茎（d）为显性，若让杂合高茎豌豆（Dd）与矮茎豌豆（dd）杂交（测交），后代高茎与矮茎的比例是多少？","idea":"Dd产生D、d两种配子，dd只产生d，后代Dd∶dd=1∶1。","ans":"高茎∶矮茎=1∶1。"}]},{"name":"自由组合定律","desc":"当两对或多对相对性状分别由位于非同源染色体上的非等位基因控制时，在F1形成配子的过程中，同源染色体上的等位基因彼此分离，非同源染色体上的非等位基因自由组合。以黄色圆粒豌豆（YyRr）自交为例，F2中出现黄圆∶黄皱∶绿圆∶绿皱=9∶3∶3∶1的性状分离比。自由组合定律可以分解为多个分离定律分别计算，再用乘法原理进行组合。","tip":"9∶3∶3∶1是两对基因独立遗传、完全显性的典型比例；出现9∶7、9∶6∶1、15∶1等比例时，说明为特殊的基因互作情况。","ex":[{"q":"基因型为AaBbCc的个体（三对基因独立遗传），能产生几种配子？","idea":"每对基因产生2种配子，三对基因的配子种类数为2×2×2。","ans":"8种。"},{"q":"基因型为AaBb的个体自交，后代中表现型为一显一隐（A_bb或aaB_）的比例是多少？","idea":"A_bb的概率为3/4×1/4=3/16，aaB_的概率同样为3/16，两者相加。","ans":"3/16+3/16=3/8。"},{"q":"基因型为AaBbCc×AaBbCc的两个亲本杂交，子代中基因型为AaBbcc的概率是多少？","idea":"分别计算Aa（1/2）、Bb（1/2）、cc（1/4），再相乘。","ans":"1/2×1/2×1/4=1/16。"}]},{"name":"伴性遗传","desc":"位于性染色体上的基因控制的性状，在遗传上总是与性别相关联，这种现象称为伴性遗传。X染色体隐性遗传（如红绿色盲、血友病）的特点是男性患者多于女性，具有隔代交叉遗传的特点，女患者的父亲和儿子一定患病。X染色体显性遗传（如抗维生素D佝偻病）的特点是女性患者多于男性，具有连续遗传的特点，男患者的母亲和女儿一定患病。伴Y遗传（如外耳道多毛症）的特点是父传子、子传孙，只在男性中出现。","tip":"判断遗传方式时，先看是否“无中生有”或“有中生无”判断显隐性，再看是否与性别相关联，判断是否位于X染色体上。","ex":[{"q":"一对表现正常的夫妇生了一个患红绿色盲的儿子，则该妻子的基因型是什么？","idea":"儿子的X^b必然来自母亲，母亲正常但携带致病基因。","ans":"X^B X^b（携带者）。"},{"q":"红绿色盲男性（X^bY）与正常女性（X^BX^B）婚配，子代女儿的基因型和表现型分别是什么？","idea":"女儿从父亲获得X^b，从母亲获得X^B。","ans":"基因型为X^BX^b，表现型正常（携带者）。"},{"q":"女性患X染色体显性遗传病（杂合子X^DX^d），与正常男性（X^dY）结婚，生育患病孩子的概率是多少？","idea":"后代中X^DX^d和X^DY患病，各占1/4，合计1/2。","ans":"1/2。"}]},{"name":"人类遗传病与遗传系谱图分析","desc":"人类遗传病分为单基因遗传病（如白化病、苯丙酮尿症为常染色体隐性遗传病，多指、并指为常染色体显性遗传病，红绿色盲为X染色体隐性遗传病）、多基因遗传病（如冠心病、哮喘，易受环境影响，在群体中发病率较高）和染色体异常遗传病（如21三体综合征）。遗传系谱图分析的一般思路：先看“无中生有”（隐性）或“有中生无”（显性）判断显隐性；再看女患者的父亲或儿子是否患病（隐性）或男患者的母亲或女儿是否患病（显性）判断是否位于X染色体上。","tip":"无病的双亲生出有病的孩子，该病一定为隐性遗传病，即“无中生有为隐性”。","ex":[{"q":"某家族中父母表现正常，生了一个患白化病的女儿，该病的遗传方式是什么？","idea":"无中生有为隐性，女儿患病，父亲正常，可排除X染色体隐性遗传。","ans":"常染色体隐性遗传。"},{"q":"某常染色体隐性遗传病，双方均为携带者，生出患病孩子的概率是多少？","idea":"双方均为Aa，aa的概率为1/4。","ans":"1/4。"},{"q":"一位女性患某常染色体显性遗传病（杂合子），与正常男性结婚，子女患病的概率是多少？","idea":"杂合子Aa与正常aa婚配，子代中Aa概率为1/2。","ans":"1/2。"}]}]},{"title":"第十二章 生物的变异（必修二）","items":[{"name":"基因突变","desc":"基因突变是指DNA分子中发生碱基对的增添、缺失或替换，从而导致基因结构的改变。基因突变具有普遍性、随机性、不定向性、低频性和多害少利性等特点。基因突变可以自发产生，也可由物理因素（如紫外线、X射线）、化学因素（如亚硝酸、硫酸二乙酯）或生物因素诱发产生。基因突变是新基因产生的途径，是生物变异的根本来源。","tip":"基因突变不一定引起生物性状的改变，原因包括密码子的简并性、隐性突变在杂合子中不表现等。","ex":[{"q":"基因中一个碱基对发生替换，使mRNA中的一个密码子发生改变，但翻译出的蛋白质中氨基酸没有改变，原因是什么？","idea":"同一种氨基酸可以由多个密码子编码，这一特性称为密码子的简并性。","ans":"密码子具有简并性，改变后的密码子与原密码子仍编码同一种氨基酸。"},{"q":"镰刀型细胞贫血症是由于基因中一个碱基对替换（A→T）引起的，该变异属于哪一类？","idea":"碱基对的替换属于基因突变。","ans":"基因突变（碱基对替换）。"},{"q":"基因突变若发生在体细胞中，能否通过有性生殖传给后代？","idea":"有性生殖传递的是生殖细胞中的遗传物质，体细胞突变一般不会传给后代。","ans":"一般不能通过有性生殖传给后代，但可能通过无性繁殖（如植物的芽变）传递。"}]},{"name":"染色体结构与数目变异","desc":"染色体结构变异包括缺失、重复、倒位和易位，会使染色体上基因的数目或排列顺序发生改变。染色体数目变异包括个别染色体的增加或减少（如21三体综合征），以及以染色体组形式成套地增加或减少（如多倍体）。染色体组是指细胞中的一组非同源染色体，形态、大小和功能各不相同，携带控制生物性状的一整套基因。染色体变异在光学显微镜下可以观察到，而基因突变则不能。","tip":"判断染色体组数目时，看同一形态的染色体有几条：若每种形态的染色体有n条，则染色体组数为n。","ex":[{"q":"某果蝇体细胞中有8条染色体，形态共4种，每种2条，则该果蝇体细胞含几个染色体组？","idea":"每个染色体组内各种形态的染色体各一条，有4种形态2条即为2个染色体组。","ans":"2个。"},{"q":"21三体综合征患者比正常人多一条21号染色体，该变异属于哪一类？","idea":"个别染色体增加属于染色体数目变异。","ans":"染色体数目变异（个别染色体增加）。"},{"q":"与基因突变相比，染色体结构变异的显著特点是什么？","idea":"染色体结构变异涉及较多基因，可在显微镜下观察。","ans":"可在光学显微镜下观察到。"}]},{"name":"基因重组","desc":"基因重组是指在生物体进行有性生殖的过程中，控制不同性状的基因重新组合。主要有两种类型：一是减数第一次分裂后期，非同源染色体上的非等位基因自由组合；二是减数第一次分裂四分体时期，同源染色体的非姐妹染色单体之间发生交叉互换。基因重组能产生多样化的基因型，为生物进化提供原材料。基因重组只改变基因的组合，不产生新基因。","tip":"只有一对等位基因的个体自交不发生基因重组；基因重组不能产生新基因。","ex":[{"q":"下列变异中属于基因重组的是（ ）A.高茎豌豆自交后代出现矮茎 B.同源染色体的非姐妹染色单体交叉互换 C.21三体综合征 D.猫叫综合征","idea":"基因重组包括自由组合和交叉互换；C、D属于染色体数目或结构变异。","ans":"B。"},{"q":"只含一对等位基因的个体自交，能否发生基因重组？为什么？","idea":"基因重组需要两对或以上的非等位基因，或同源染色体的交叉互换。","ans":"不能。只含一对等位基因，不存在非同源染色体上的非等位基因的自由组合，也不能在两对同源染色体之间重组。"},{"q":"一个基因型为AaBb的精原细胞，若发生了一次交叉互换（发生在A、a所在染色体的一个位点），则其形成的4个精子的基因型种类数是多少？","idea":"一个精原细胞发生一次交叉互换后，4条染色单体各不相同，产生4种精子。","ans":"4种。"}]},{"name":"人类遗传病的检测与预防","desc":"预防遗传病的主要措施有：遗传咨询、产前诊断（如羊水检查、B超检查、孕妇血细胞检查、基因诊断等）、禁止近亲结婚、提倡适龄生育。近亲结婚会使双方从共同祖先获得相同隐性致病基因的概率大大增加，子代患隐性遗传病的风险显著升高。产前诊断可以在一定程度上检测胎儿是否患有某些遗传病或先天性疾病。","tip":"近亲结婚增加的是隐性遗传病的风险，而非所有遗传病的风险。","ex":[{"q":"近亲结婚导致后代患隐性遗传病的风险增加，原因是什么？","idea":"近亲双方携带相同隐性致病基因的概率高，子代隐性纯合的概率增加。","ans":"近亲双方从共同祖先获得相同隐性致病基因的概率大，子代中隐性纯合体的概率增加。"},{"q":"列举两种产前诊断的手段。","idea":"回忆产前诊断的常用方法。","ans":"羊水检查、B超检查（或孕妇血细胞检查、基因诊断）。"},{"q":"表现正常的一对夫妇生育了一个白化病孩子，他们再生一个患白化病孩子的概率是多少？","idea":"双方均为携带者（Aa），子代患病概率为1/4。","ans":"1/4。"}]}]},{"title":"第十三章 育种（必修二）","items":[{"name":"杂交育种与诱变育种","desc":"杂交育种的原理是基因重组，过程为：杂交→自交→选优→连续自交至不再发生性状分离，获得纯合品种。其优点是操作简单，缺点是周期较长，只能利用已有的基因组合。诱变育种的原理是基因突变，用物理因素（如X射线、紫外线、激光）或化学因素（如亚硝酸、硫酸二乙酯）处理生物，可提高突变率，产生新基因，但突变具有不定向性，且多数突变为有害突变，需要大量处理和筛选。","tip":"诱变育种可以产生新基因，而杂交育种只能重新组合已有基因。","ex":[{"q":"用纯合矮秆抗病小麦（ddTT）与纯合高秆不抗病小麦（DDtt）杂交培育矮秆抗病品种。F1自交，F2中矮秆抗病（ddT_）所占的比例是多少？","idea":"F1为DdTt，F2中dd占1/4，T_占3/4，两者相乘。","ans":"1/4×3/4=3/16。"},{"q":"要在杂交育种中获得能稳定遗传的显性纯合个体，在F2中选出目标性状后还需要怎样处理？","idea":"显性个体中可能存在杂合子，需要通过自交筛选纯合子。","ans":"让其连续自交，逐代淘汰发生性状分离的个体，直至不再发生性状分离。"},{"q":"与杂交育种相比，诱变育种的主要优点是什么？","idea":"诱变育种的原理是基因突变，能产生新基因。","ans":"能提高突变率，产生新基因，从而加快育种进程。"}]},{"name":"单倍体育种与多倍体育种","desc":"单倍体育种：先对花药进行离体培养得到单倍体幼苗，再用秋水仙素处理单倍体幼苗，使染色体数目加倍，得到纯合的二倍体植株，明显缩短育种年限。多倍体育种：用秋水仙素或低温处理萌发的种子或幼苗，抑制纺锤体的形成，使染色体数目加倍，得到多倍体植株，如三倍体无子西瓜的培育：四倍体西瓜与二倍体西瓜杂交获得三倍体种子，三倍体在减数分裂时联会紊乱，不能产生正常配子，因此无子。","tip":"秋水仙素的作用是抑制纺锤体形成，使染色体不能移向细胞两极，从而使染色体数目加倍。","ex":[{"q":"基因型为AaBb的植株，经花药离体培养后，再用秋水仙素处理，获得的植株基因型有几种？","idea":"花药离体培养得到AB、Ab、aB、ab四种单倍体，加倍后分别为AABB、AAbb、aaBB、aabb。","ans":"4种。"},{"q":"三倍体无子西瓜无法产生种子，原因是什么？","idea":"三倍体的染色体组为奇数，减数分裂时联会紊乱。","ans":"三倍体减数分裂时联会紊乱，无法产生可育的正常配子。"},{"q":"秋水仙素诱导染色体数目加倍的作用机理是什么？","idea":"回忆秋水仙素对细胞分裂过程的作用。","ans":"抑制纺锤体的形成，使已加倍的染色体不能移向细胞两极，从而使染色体数目加倍。"}]},{"name":"基因工程育种简介","desc":"基因工程是指按照人们的意愿，把一种生物的目的基因通过载体导入另一种生物的细胞中，并使其表达，从而产生新的性状。基因工程的基本工具包括限制酶、DNA连接酶和载体。其优点是能够定向改造生物性状，并可以克服远缘杂交不亲和的障碍。转基因抗虫棉就是将苏云金芽孢杆菌的抗虫基因导入棉花细胞后培育出的新品种。","tip":"基因工程的原理是基因重组，但它与自然的基因重组不同，属于人为的定向操作。","ex":[{"q":"基因工程中常用的工具有哪些？","idea":"回忆基因工程的三种基本工具。","ans":"限制酶、DNA连接酶和载体。"},{"q":"转基因抗虫棉的培育利用了什么变异原理？","idea":"外源基因导入改变了基因的组合，属于基因重组。","ans":"基因重组。"},{"q":"与杂交育种相比，基因工程育种的主要优点是什么？","idea":"基因工程可以跨物种转移基因。","ans":"可以定向改造生物的性状，并能克服远缘杂交不亲和的障碍。"}]}]},{"title":"第十四章 生物进化（必修二）","items":[{"name":"自然选择与适应的形成","desc":"达尔文自然选择学说的主要内容包括过度繁殖、生存斗争、遗传变异和适者生存。现代生物进化理论认为：种群是生物进化的基本单位，突变和基因重组提供进化的原材料，自然选择决定生物进化的方向，隔离是物种形成的必要条件。适应是自然选择的结果，具有相对性。变异是不定向的，而自然选择是定向的，它决定生物进化的方向。","tip":"生物进化的单位是种群，不是个体；突变和基因重组是不定向的，自然选择才是定向的。","ex":[{"q":"使用抗生素后细菌的耐药性增强，用自然选择的观点解释，关键是什么？","idea":"抗药性变异在使用抗生素前已经存在，抗生素对细菌起选择作用。","ans":"抗药性变异在使用抗生素之前就已存在，抗生素对细菌进行选择，抗药性个体生存和繁殖的机会增加，并不断积累。"},{"q":"判断：生物进化的基本单位是个体。","idea":"现代生物进化理论认为种群是进化的基本单位。","ans":"错误，应为种群。"},{"q":"下列关于生物进化的叙述，正确的是（ ）A.突变和基因重组是定向的 B.自然选择决定生物进化的方向 C.隔离是生物进化的原材料 D.生物进化一定产生新物种","idea":"突变和基因重组是不定向的，隔离不是原材料，进化不一定形成新物种。","ans":"B。"}]},{"name":"基因频率与基因型频率的计算","desc":"基因频率是指某基因在种群全部等位基因中所占的比例；基因型频率是指某基因型个体在种群中所占的比例。计算时，常染色体上的基因频率=（该基因纯合子个体数×2+杂合子个体数）÷（个体总数×2）×100%。在理想种群中（无突变、无选择、无迁移、随机交配、种群很大），若A基因频率为p，a基因频率为q，则AA=p²，Aa=2pq，aa=q²，且基因频率在世代间保持不变，即哈迪-温伯格平衡。","tip":"计算基因频率时，每个个体含有两个等位基因，别漏乘2。","ex":[{"q":"某种群中AA个体30个，Aa个体60个，aa个体10个，求A基因的频率。","idea":"A基因总数=30×2+60=120，等位基因总数=100×2=200。","ans":"120/200=60%。"},{"q":"某理想种群中aa个体占1%，求该种群中a基因频率和Aa基因型频率。","idea":"q²=1%，则q=0.1，p=0.9，Aa=2pq。","ans":"a基因频率为10%，Aa基因型频率为2×0.9×0.1=18%。"},{"q":"在上述理想种群中，经过一代随机交配后，基因频率会发生怎样的变化？","idea":"理想种群中基因频率在世代间保持不变。","ans":"基因频率保持不变。"}]},{"name":"物种的形成与隔离","desc":"隔离包括地理隔离和生殖隔离。地理隔离指同一物种的不同种群因地理障碍而不能相遇、交配；生殖隔离指不同种群间不能相互交配，或交配后不能产生可育后代。生殖隔离是新物种形成的标志。新物种形成的常见过程是：突变和基因重组产生进化的原材料，自然选择使种群基因频率定向改变，长期的地理隔离最终导致生殖隔离，从而形成新物种，如加拉帕戈斯群岛上的地雀。不同物种之间、生物与无机环境之间在相互影响中不断进化和发展，称为共同进化。","tip":"地理隔离不一定产生新物种，只有生殖隔离才是物种形成的标志。","ex":[{"q":"马与驴交配产生的骡子不能繁殖，说明马和驴之间存在什么隔离？","idea":"交配后不能产生可育后代，属于生殖隔离。","ans":"生殖隔离。"},{"q":"判断：两个种群间存在地理隔离，就一定形成了不同的物种。","idea":"地理隔离只是物种形成的条件，需要进一步产生生殖隔离。","ans":"错误。地理隔离不一定导致生殖隔离，新物种的标志是生殖隔离。"},{"q":"捕食者与被捕食者在长期的相互选择中共同进化，这种现象称为什么？","idea":"不同物种之间在相互影响中共同发展，称为共同进化。","ans":"共同进化。"}]}]},{"title":"第十五章 人体的内环境与稳态（必修三）","items":[{"name":"内环境的组成与稳态","desc":"体内的液体包括细胞内液和细胞外液，细胞外液即内环境，主要由血浆、组织液和淋巴液组成。血浆与组织液之间可以相互渗透，组织液可以进入淋巴液，淋巴液最终汇入血浆。内环境是细胞与外界环境进行物质交换的媒介。内环境稳态是指正常机体通过调节作用，使各个器官、系统协调活动，共同维持内环境理化性质（温度、pH、渗透压）和化学成分的相对稳定状态，是机体进行正常生命活动的必要条件。血浆pH能保持相对稳定，依靠HCO3-/H2CO3、NaH2PO4/Na2HPO4等缓冲对。","tip":"消化道、呼吸道、泌尿道等与外界相通的管腔中的液体不属于内环境，细胞内液也不属于内环境。","ex":[{"q":"下列属于内环境的是（ ）A.胃液 B.血浆 C.尿液 D.细胞内液","idea":"内环境由血浆、组织液和淋巴液组成；胃液、尿液属于与外界相通的管腔液，细胞内液属于细胞内。","ans":"B。"},{"q":"引起组织水肿的原因有哪些？（至少答出两点）","idea":"组织液的生成增多或回流减少，都会导致组织水肿。","ans":"例如血浆蛋白减少导致血浆渗透压降低；淋巴循环受阻；毛细血管壁通透性增大；过敏等导致组织液增多。"},{"q":"判断：内环境稳态就是指内环境的成分和理化性质恒定不变。","idea":"稳态是指动态的相对稳定，而非恒定不变。","ans":"错误，稳态是相对稳定的动态平衡。"}]},{"name":"体温与水盐平衡的调节","desc":"人体体温的相对稳定是产热与散热动态平衡的结果，体温调节中枢位于下丘脑。寒冷环境中，皮肤毛细血管收缩、汗腺分泌减少，骨骼肌战栗，甲状腺激素和肾上腺素分泌增加，产热增多；炎热环境中，皮肤血管舒张，汗液分泌增加，散热增多。水盐平衡调节中，细胞外液渗透压升高时，下丘脑渗透压感受器兴奋，并将信号传至大脑皮层产生渴觉，同时促使垂体释放抗利尿激素增多，肾小管和集合管对水的重吸收增强，尿量减少；醛固酮可促进肾小管和集合管对Na+的重吸收。","tip":"抗利尿激素由下丘脑合成，经垂体释放；醛固酮由肾上腺皮质分泌。","ex":[{"q":"一个人从寒冷的室外进入温暖的房间，其皮肤血管和汗腺的变化分别是什么？","idea":"温暖环境散热增加，皮肤血管舒张、汗腺分泌增加。","ans":"皮肤血管舒张，汗腺分泌增加。"},{"q":"大量饮用清水后，尿量增多，抗利尿激素的分泌量会如何变化？","idea":"细胞外液渗透压下降，抗利尿激素分泌减少，肾小管对水的重吸收减弱。","ans":"抗利尿激素分泌减少。"},{"q":"严重腹泻后只补充水分而不补充无机盐，为什么不合理？","idea":"腹泻丢失的水和无机盐都较多，单纯补水会影响细胞外液的渗透压平衡。","ans":"腹泻丢失的是水和无机盐，只补水会使细胞外液渗透压降低，应同时补充适量的无机盐。"}]},{"name":"内环境稳态失调的常见实例","desc":"内环境稳态一旦失调，机体的正常生命活动就会受到影响。例如血糖浓度过高或过低，会引起糖尿病或低血糖症状；肾功能障碍导致代谢废物不能排出，会引起尿毒症；血浆蛋白含量降低会引起组织水肿；pH严重偏离正常范围会影响酶的活性和细胞代谢。通过了解稳态失调的原因和表现，有助于理解疾病的发生机制，并指导健康生活。","tip":"组织水肿是血浆与组织液间水分平衡失调的典型表现，常见原因是血浆蛋白降低或淋巴回流受阻。","ex":[{"q":"肾炎导致血浆蛋白大量随尿液丢失，会出现怎样的症状？为什么？","idea":"血浆蛋白减少，血浆渗透压下降，水分从血浆进入组织液。","ans":"会出现组织水肿；血浆渗透压降低，水分更多地进入组织液。"},{"q":"尿毒症患者需要进行血液透析，其原因是什么？","idea":"肾功能障碍使代谢废物无法通过尿液排出，积累在内环境中。","ans":"肾脏功能障碍，代谢废物不能及时排出，在内环境中积累，透析可清除这些废物。"},{"q":"在高原地区，部分人会出现高原反应，其主要原因之一是什么？","idea":"高原空气稀薄，氧气不足，内环境稳态受到影响，细胞供氧不足。","ans":"氧气供应不足，内环境稳态失调，机体细胞缺氧（如血浆渗透压改变、组织水肿等）。"}]}]},{"title":"第十六章 神经调节（必修三）","items":[{"name":"反射与反射弧","desc":"神经调节的基本方式是反射，结构基础是反射弧，由感受器、传入神经、神经中枢、传出神经和效应器五部分组成。反射分为非条件反射（生来就有，低级神经中枢即可完成，如缩手反射）和条件反射（后天经学习形成，需要大脑皮层参与，如望梅止渴）。只有完整的反射弧才能完成反射，缺少任何一个环节，反射都不能发生。","tip":"判断反射是否发生，要看是否有完整的反射弧参与；刺激效应器引起的收缩不属于反射。","ex":[{"q":"缩手反射中，若剪断传入神经，刺激手指后人能否缩手？能否产生痛觉？","idea":"传入神经被切断，感受器产生的兴奋无法传入神经中枢，反射弧不完整。","ans":"不能缩手，也不能产生痛觉。"},{"q":"条件反射与非条件反射的主要区别是什么？","idea":"从形成方式和神经中枢的级别进行比较。","ans":"条件反射是后天学习形成的，需要大脑皮层参与；非条件反射生来就有，由低级中枢即可完成。"},{"q":"在反射弧中，神经冲动只能单向传递，原因是什么？","idea":"兴奋在突触处只能由突触前膜向突触后膜传递。","ans":"兴奋在突触处只能由突触前膜传递到突触后膜，而不能反向传递。"}]},{"name":"兴奋的产生与传导","desc":"神经纤维未受刺激时，膜电位表现为外正内负，即静息电位，主要由K+外流形成。受到刺激后，细胞膜对Na+的通透性增加，Na+内流，膜电位变为外负内正，形成动作电位。兴奋以电信号（局部电流）的形式在神经纤维上双向传导，兴奋部位与相邻未兴奋部位之间形成局部电流，使兴奋不断向前传导。","tip":"静息电位主要是K+外流形成，动作电位主要是Na+内流形成，二者都依赖离子的跨膜运输。","ex":[{"q":"神经纤维未受刺激时，膜内外电位的状态及其主要原因是什么？","idea":"静息时膜对K+通透性大，K+外流，使膜外为正电位。","ans":"膜外正电位、膜内负电位，主要由K+外流形成。"},{"q":"在神经纤维上刺激某一点，兴奋的传导方向是怎样的？","idea":"兴奋在神经纤维上可以双向传导。","ans":"双向传导。"},{"q":"若某药物阻断了神经细胞膜上的Na+通道，神经纤维受刺激后会出现什么现象？","idea":"Na+内流受阻，无法形成动作电位。","ans":"无法产生动作电位，兴奋不能传导。"}]},{"name":"突触与兴奋的传递","desc":"突触由突触前膜、突触间隙和突触后膜组成。兴奋传到突触前膜时，突触小泡与前膜融合，释放神经递质，神经递质通过扩散到达突触间隙，与突触后膜上的特异性受体结合，引起突触后膜兴奋或抑制。因此，兴奋在突触处的信号转换为电信号→化学信号→电信号，传递速度比在神经纤维上慢，存在突触延搁。神经递质发挥作用后会被降解或回收，使突触后膜恢复正常状态。常见的神经递质有乙酰胆碱、多巴胺、去甲肾上腺素、甘氨酸等。","tip":"神经递质有兴奋性和抑制性两类，它们作用于突触后膜后分别引起兴奋或抑制。","ex":[{"q":"兴奋在突触处传递时，信号的转换过程是怎样的？","idea":"兴奋在突触前膜是电信号，释放递质后转为化学信号，递质作用于突触后膜又转为电信号。","ans":"电信号→化学信号→电信号。"},{"q":"某药物能抑制突触间隙中乙酰胆碱酯酶的活性，会导致什么结果？","idea":"乙酰胆碱酯酶可分解乙酰胆碱，其活性被抑制后，递质不能及时被清除。","ans":"乙酰胆碱不能被及时分解，突触后膜持续兴奋。"},{"q":"兴奋在突触处的传递速度比在神经纤维上慢，原因是什么？","idea":"突触处需要经历递质释放、扩散和作用于受体的过程。","ans":"兴奋在突触处需要经历电信号到化学信号再到电信号的转换过程，存在突触延搁。"}]}]},{"title":"第十七章 体液调节（必修三）","items":[{"name":"激素调节的特点与分级调节","desc":"激素是由内分泌腺或内分泌细胞分泌的化学物质，通过体液运输，作用于靶细胞或靶器官，具有微量高效的特点。在下丘脑-垂体-靶腺轴中，下丘脑分泌促激素释放激素作用于垂体，垂体分泌促激素作用于靶腺，靶腺分泌相应激素，这种多级调节称为分级调节。当靶腺激素含量过多时，会反过来抑制下丘脑和垂体的分泌活动，这种调节称为负反馈调节。","tip":"分级调节能放大激素的调节效应，负反馈调节有利于维持激素含量的相对稳定。","ex":[{"q":"甲状腺激素分泌过多时，它对下丘脑和垂体分泌相关激素的影响是什么？","idea":"甲状腺激素增多会通过负反馈抑制下丘脑和垂体的分泌活动。","ans":"抑制下丘脑分泌促甲状腺激素释放激素，抑制垂体分泌促甲状腺激素（负反馈）。"},{"q":"分级调节的意义是什么？","idea":"从放大效应和精细调控两方面回答。","ans":"分级调节可以放大激素的调节效应，形成多级反馈调节，有利于精细调控，维持机体的稳态。"},{"q":"切除动物的垂体后，血液中甲状腺激素和促甲状腺激素的含量会发生怎样的变化？","idea":"垂体分泌促甲状腺激素，切除后该激素减少，进而甲状腺激素也减少。","ans":"促甲状腺激素和甲状腺激素的含量都会减少。"}]},{"name":"血糖平衡的调节","desc":"正常人的空腹血糖浓度约为3.9~6.1 mmol/L。血糖升高时，胰岛B细胞分泌胰岛素，胰岛素促进组织细胞摄取、利用和储存葡萄糖（如合成肝糖原、肌糖原），并促进葡萄糖转化为非糖物质，同时抑制肝糖原分解和非糖物质转化为葡萄糖，使血糖降低。血糖降低时，胰岛A细胞分泌胰高血糖素，促进肝糖原分解和非糖物质转化为葡萄糖，使血糖升高；肾上腺素也能促进肝糖原分解，升高血糖。","tip":"胰岛素是体内唯一降低血糖的激素；胰高血糖素主要作用于肝脏细胞。","ex":[{"q":"饭后血糖升高，胰岛素分泌增加，其作用不包括（ ）A.促进肝糖原合成 B.促进葡萄糖氧化分解 C.促进肝糖原分解 D.促进葡萄糖转化为脂肪","idea":"胰岛素降低血糖，应抑制肝糖原分解，而非促进。","ans":"C。"},{"q":"血糖降低时，能够升高血糖的激素有哪些？","idea":"回忆能升高血糖的激素。","ans":"胰高血糖素、肾上腺素（及糖皮质激素等）。"},{"q":"糖尿病患者常出现多饮、多尿、多食和体重下降，其主要原因是什么？","idea":"胰岛素分泌不足或作用受阻，细胞无法充分利用葡萄糖，血糖升高，部分葡萄糖随尿排出，细胞供能不足。","ans":"胰岛素分泌不足或作用受阻，血糖无法被充分利用，导致高血糖和尿糖，细胞供能不足，机体出现上述症状。"}]},{"name":"甲状腺激素与下丘脑、垂体的作用","desc":"甲状腺激素的主要作用是促进新陈代谢，提高神经系统的兴奋性，并促进生长发育，尤其对神经系统的发育至关重要。甲状腺激素的合成需要碘。缺碘时，甲状腺激素合成减少，血液中甲状腺激素浓度降低，对垂体的负反馈作用减弱，垂体分泌的促甲状腺激素增多，甲状腺因代偿性增生而肿大，即地方性甲状腺肿（大脖子病）。幼年时甲状腺激素分泌不足会导致呆小症。下丘脑和垂体既受甲状腺激素的反馈调节，也受神经调节。","tip":"甲状腺激素和生长激素都能促进生长，但甲状腺激素对神经系统发育尤为关键。","ex":[{"q":"幼年时期甲状腺激素分泌不足，会导致什么病症？","idea":"甲状腺激素对神经系统的发育至关重要。","ans":"呆小症。"},{"q":"缺碘引起的地方性甲状腺肿患者，血液中促甲状腺激素的含量如何变化？为什么？","idea":"甲状腺激素减少，负反馈减弱，垂体分泌的促甲状腺激素增多。","ans":"促甲状腺激素含量升高，因为甲状腺激素减少，对垂体的负反馈作用减弱。"},{"q":"判断：激素调节的反应速度通常比神经调节慢，作用范围更广泛。","idea":"激素通过体液运输，需要一定时间，作用范围广。","ans":"正确。"}]}]},{"title":"第十八章 免疫调节（必修三）","items":[{"name":"免疫系统的组成与功能","desc":"免疫系统由免疫器官（胸腺、骨髓、脾、淋巴结等）、免疫细胞（吞噬细胞、T细胞、B细胞等）和免疫活性物质（抗体、细胞因子、溶菌酶等）组成。免疫系统具有防卫、监控和清除功能。非特异性免疫（第一、二道防线）先天就有，作用范围广：第一道防线是皮肤和黏膜，第二道防线是体液中的杀菌物质和吞噬细胞。特异性免疫（第三道防线）是后天获得的，包括体液免疫和细胞免疫：体液免疫中，B细胞增殖分化为浆细胞，分泌抗体与抗原结合；细胞免疫中，效应T细胞与被病原体感染的靶细胞密切接触，使其裂解死亡，释放病原体。","tip":"抗体只能作用于体液中的抗原；效应T细胞作用于靶细胞；吞噬细胞既参与非特异性免疫，也参与特异性免疫。","ex":[{"q":"人体的第一道防线主要由哪些结构构成？","idea":"第一道防线是皮肤和黏膜的屏障作用。","ans":"皮肤和黏膜。"},{"q":"体液免疫中，能够产生并分泌抗体的细胞是什么？","idea":"B细胞在抗原刺激下增殖分化为浆细胞，由浆细胞分泌抗体。","ans":"浆细胞。"},{"q":"在细胞免疫中，效应T细胞发挥作用的方式是什么？","idea":"效应T细胞与靶细胞密切接触，使靶细胞裂解。","ans":"与被病原体感染的靶细胞密切接触，使靶细胞裂解死亡，释放出病原体。"}]},{"name":"免疫失调","desc":"免疫失调包括过敏反应、自身免疫病和免疫缺陷病。过敏反应是已免疫的机体再次接触相同过敏原时，产生的组织损伤或功能紊乱，其特点是发作迅速、反应强烈、消退较快，一般不会破坏组织细胞，有明显的个体差异和遗传倾向。自身免疫病是免疫系统错误地攻击自身组织和器官而引起的疾病，如类风湿性关节炎、系统性红斑狼疮。免疫缺陷病分为先天性免疫缺陷病（如先天性胸腺发育不良）和获得性免疫缺陷病（如艾滋病）。","tip":"过敏反应发生在机体再次接触过敏原时，初次接触一般不发生过敏反应。","ex":[{"q":"花粉过敏引起的过敏反应有哪些特点？","idea":"过敏反应的特点是发作迅速、反应强烈、消退较快，一般不破坏组织细胞。","ans":"发作迅速、反应强烈、消退较快，一般不破坏组织细胞，有明显的个体差异和遗传倾向。"},{"q":"判断：过敏反应是机体第一次接触过敏原时就会发生的反应。","idea":"过敏反应发生在再次接触过敏原时。","ans":"错误，过敏反应发生在再次接触相同过敏原时。"},{"q":"类风湿性关节炎是免疫系统错误攻击自身关节组织引起的，它属于哪一类免疫失调病？","idea":"免疫系统攻击自身组织属于自身免疫病。","ans":"自身免疫病。"}]},{"name":"艾滋病与免疫学的应用","desc":"艾滋病（获得性免疫缺陷综合征）由人类免疫缺陷病毒（HIV）引起。HIV是一种RNA病毒，能通过逆转录形成DNA并整合到宿主细胞的DNA中，主要攻击人体的辅助性T细胞，使机体的细胞免疫和体液免疫功能逐渐丧失。艾滋病主要通过性接触、血液和母婴三种途径传播。免疫学原理在医学中有广泛应用：接种疫苗可预防传染病；器官移植前需要进行组织相容性检测，移植后常用免疫抑制剂防止排斥反应；利用抗原与抗体特异性结合的原理进行免疫检测和诊断。","tip":"艾滋病患者的直接死因通常是严重感染或恶性肿瘤，而非HIV病毒本身直接导致的器官损伤。","ex":[{"q":"艾滋病患者死亡的直接原因通常是什么？","idea":"免疫功能严重缺陷，机体无法抵御病原体和肿瘤细胞。","ans":"因免疫功能严重缺陷，易被各种病原体感染或发生恶性肿瘤。"},{"q":"接种疫苗预防传染病，使机体产生的免疫属于哪一类？","idea":"疫苗诱导机体产生抗体和记忆细胞，属于后天获得的特异性免疫。","ans":"特异性免疫（获得性免疫）。"},{"q":"器官移植后，为防止发生免疫排斥反应，常使用哪类药物？","idea":"抑制免疫系统的活性可以减轻排斥。","ans":"免疫抑制剂。"}]}]},{"title":"第十九章 植物的激素调节（必修三）","items":[{"name":"生长素的发现与两重性","desc":"达尔文通过实验证明，胚芽鞘尖端受单侧光刺激后会产生某种影响，并传递到下部使其弯曲生长；拜尔、温特等人进一步证明这种影响是一种化学物质，后被命名为生长素，其化学本质是吲哚乙酸。生长素主要在幼嫩的芽、叶和发育中的种子中合成，在植物体内进行极性运输，即从形态学上端向形态学下端运输。生长素的生理作用具有两重性：低浓度促进生长，高浓度抑制生长。顶端优势和根的向地性都体现了生长素的两重性。","tip":"根的向地性中，近地侧生长素浓度高，抑制根的生长，远地侧浓度低，促进生长，因此根向地弯曲。","ex":[{"q":"植物顶端优势现象中，顶芽产生的生长素向下运输，积累在侧芽处，其结果是什么？","idea":"侧芽处生长素浓度过高，对侧芽的生长产生抑制作用。","ans":"抑制侧芽的生长。"},{"q":"根的向地性生长中，近地侧与远地侧生长素浓度和生长状况分别如何？","idea":"重力使生长素在近地侧积累，根对生长素敏感，高浓度抑制生长。","ans":"近地侧浓度高，抑制生长；远地侧浓度低，促进生长。"},{"q":"生长素的极性运输是指什么？","idea":"极性运输与形态学方向有关。","ans":"生长素只能从形态学上端向形态学下端运输。"}]},{"name":"其他植物激素","desc":"赤霉素能促进细胞伸长，从而引起植株增高，还能促进种子萌发和果实发育。细胞分裂素主要促进细胞分裂，延缓叶片衰老。脱落酸抑制细胞分裂，促进叶和果实的衰老和脱落，促进种子休眠，与赤霉素在种子萌发中作用相互拮抗。乙烯主要作用是促进果实成熟，也能促进器官脱落。植物的生长发育是多种激素相互作用、共同调节的结果。","tip":"赤霉素促进种子萌发，脱落酸促进种子休眠，二者作用相反；乙烯的主要作用是促进果实成熟。","ex":[{"q":"下列植物激素中，能促进果实成熟的是（ ）A.赤霉素 B.脱落酸 C.乙烯 D.细胞分裂素","idea":"乙烯的主要生理作用是促进果实成熟。","ans":"C。"},{"q":"脱落酸的生理作用之一是促进种子休眠，它在种子萌发中与哪种激素作用相互拮抗？","idea":"赤霉素促进种子萌发，与脱落酸作用相反。","ans":"赤霉素。"},{"q":"用赤霉素处理水稻幼苗，植株明显增高，其原因是什么？","idea":"赤霉素促进细胞伸长。","ans":"赤霉素促进细胞伸长，从而使植株增高。"}]},{"name":"植物生长调节剂与探究实验","desc":"植物生长调节剂是人工合成的、对植物的生长发育有调节作用的化学物质，如萘乙酸、2,4-D、乙烯利，具有原料广泛、容易合成、效果稳定等优点。在农业生产中，如用2,4-D防止落花落果、用乙烯利催熟水果。探究生长素类似物促进插条生根的最适浓度时，应先做预实验，确定大致的浓度范围，再设置一系列浓度梯度进行正式实验；每组选取生理状况相似的插条，并设置用清水处理的对照组，每组插条数量要足够，以减小误差。","tip":"预实验的目的是为正式实验摸索条件，减少盲目性和浪费；浓度过高时生长素类似物也可能抑制生根。","ex":[{"q":"用适宜浓度的2,4-D处理未受粉的番茄花蕾，可以获得无子番茄，原因是什么？","idea":"生长素类似物可以促进子房发育成果实，但没有完成受精，因而无种子。","ans":"2,4-D能促进子房发育成果实，而没有经过受精，所以果实中无种子。"},{"q":"探究生长素类似物促进插条生根的最适浓度，为什么要先做预实验？","idea":"预实验可以确定大致浓度范围，为正式实验提供依据。","ans":"预实验可以初步确定有效的浓度范围，避免盲目性，减少人力物力的浪费，并为正式实验提供依据。"},{"q":"植物生长调节剂与植物激素相比，最突出的优点是什么？","idea":"与植物激素相比，人工合成的调节剂原料广、易合成、效果稳定。","ans":"原料广泛、容易合成、效果稳定。"}]}]},{"title":"第二十章 种群（选择性必修二）","items":[{"name":"种群的数量特征","desc":"种群密度是种群最基本的数量特征。出生率和死亡率、迁入率和迁出率直接决定种群数量的变化。年龄结构可预测种群未来的数量变化趋势，分为增长型、稳定型和衰退型。性别比例通过影响出生率间接影响种群密度。种群的空间特征包括均匀分布、随机分布和集群分布。调查种群密度的方法：样方法适用于植物和活动范围小、活动能力弱的动物（常用五点取样法或等距取样法）；标志重捕法适用于活动能力强、活动范围大的动物，种群数量N=M×n÷m（M为第一次标记数，n为第二次捕获数，m为第二次捕获中被标记数）。","tip":"标志重捕法中，若标记物脱落，会导致计算结果偏大。","ex":[{"q":"用标志重捕法调查某动物种群密度，第一次捕获并标记30只，第二次捕获40只，其中有标记的为10只，则该种群大约有多少只？","idea":"N=M×n÷m=30×40÷10。","ans":"120只。"},{"q":"年龄结构为增长型的种群，其未来数量的变化趋势是什么？","idea":"增长型年龄结构中幼年个体多，出生率大于死亡率。","ans":"数量将会增加。"},{"q":"调查植物种群密度时，通常采用哪种方法？","idea":"植物活动能力弱，适合用样方法。","ans":"样方法。"}]},{"name":"种群数量的变化","desc":"在食物和空间充裕、气候适宜、没有敌害等理想条件下，种群数量呈“J”形增长，增长率保持不变。在资源和空间有限的条件下，种群数量呈“S”形增长：种群增长速率先增大后减小，在K/2时增长速率最大，种群数量达到环境容纳量（K值）时，增长速率为0，种群数量保持相对稳定。影响种群数量变化的因素包括非生物因素（气温、降水等）和生物因素（食物、天敌、竞争等）。其中食物、天敌等对种群数量的影响程度与种群密度相关，称为密度制约因素。","tip":"K/2时种群增长速率最大，是捕捞或防治害虫时的重要参考点；捕捞后剩余量应维持在K/2左右。","ex":[{"q":"种群数量达到K值时，其增长速率是多少？","idea":"K值时种群数量稳定，净增长为0。","ans":"0。"},{"q":"为实现可持续捕捞，鱼类种群数量应维持在什么水平？为什么？","idea":"K/2时增长速率最大，种群恢复能力最强。","ans":"维持在K/2左右，此时种群增长速率最大，有利于种群的快速恢复。"},{"q":"下列因素中，属于密度制约因素的是（ ）A.气温 B.降水量 C.食物 D.光照","idea":"食物的多少与种群密度相关，属于密度制约因素；其余为非密度制约因素。","ans":"C。"}]},{"name":"探究培养液中酵母菌种群数量的变化","desc":"本实验用血细胞计数板对酵母菌计数，酵母菌在有限的培养液中数量变化呈“S”形增长。操作要点：取样前应将试管轻轻振荡，使酵母菌均匀分布；计数时先盖上盖玻片，再将培养液滴于盖玻片边缘，让其自行渗入计数室，多余培养液用滤纸吸去。对压在方格界线上的酵母菌，遵循“计上不计下，计左不计右”的原则。样液浓度过高时需稀释后再计数，每天在相同时间取样，并重复实验取平均值。","tip":"计算时应乘以稀释倍数；一个计数室的体积计算要注意单位换算。","ex":[{"q":"用血细胞计数板计数时，压在方格界线上的酵母菌应如何计数？","idea":"这是血细胞计数的统一计数原则。","ans":"计上不计下，计左不计右（即计相邻两边及其顶角）。"},{"q":"取样前为什么要将试管轻轻振荡？","idea":"振荡可使酵母菌在培养液中分布均匀。","ans":"使酵母菌在培养液中分布均匀，减小取样误差。"},{"q":"某次计数中，每个中方格平均有酵母菌24个，计数室共25个中方格，计数室体积为0.1 mm³，稀释10倍，则每毫升培养液中酵母菌约为多少个？","idea":"0.1 mm³=1×10⁻⁴ mL；每个计数室总数为24×25=600；600÷(1×10⁻⁴)=6×10⁶；再乘稀释倍数10。","ans":"约6×10⁷个/mL。"}]}]},{"title":"第二十一章 群落（选择性必修二）","items":[{"name":"群落的种间关系","desc":"群落是同一时间内聚集在一定区域中各种生物种群的集合。群落中不同物种之间的关系主要有：互利共生（如地衣中真菌与藻类、根瘤菌与豆科植物），彼此依赖，分开后双方都不能很好生存；捕食（如狼捕鹿）；竞争（如水稻与稗草争夺阳光、水分和无机盐）；寄生（如蛔虫寄生于人体）；原始合作（如海葵与寄居蟹，分开后双方仍能独立生活）。这些种间关系使群落的结构和物种组成保持相对稳定。","tip":"互利共生与原始合作的区别在于分开后双方是否都不能很好生存。","ex":[{"q":"根瘤菌与豆科植物之间的种间关系属于哪一类？","idea":"根瘤菌为植物提供氮素，植物为根瘤菌提供有机物，二者彼此依赖。","ans":"互利共生。"},{"q":"“螳螂捕蝉，黄雀在后”中，黄雀与蝉之间的种间关系是什么？","idea":"黄雀吃蝉，属于捕食关系。","ans":"捕食。"},{"q":"水稻与稗草争夺阳光、水分和无机盐，二者的种间关系是什么？","idea":"两种生物争夺共同资源，属于竞争。","ans":"竞争。"}]},{"name":"群落的演替","desc":"随着时间的推移，一个群落被另一个群落代替的过程称为群落演替。初生演替是在从来没有被植物覆盖的地面，或原来存在植被但被彻底消灭了的地方发生的演替，如裸岩上的演替。次生演替是在原有植被虽已不存在，但保留了土壤条件和繁殖体的地方发生的演替，如弃耕农田上的演替、火灾后森林的演替。演替过程中，物种丰富度增加，群落结构趋于复杂，生态系统的稳定性逐渐增强。","tip":"次生演替比初生演替速度快，因为土壤条件和繁殖体已被保留。","ex":[{"q":"下列属于初生演替的是（ ）A.弃耕农田上的演替 B.火灾后森林的演替 C.裸岩上的演替 D.过量砍伐后林地的演替","idea":"初生演替发生在从未有植被或植被被彻底消灭的地方，裸岩符合条件。","ans":"C。"},{"q":"次生演替比初生演替速度快，主要原因是什么？","idea":"次生演替保留了土壤条件和繁殖体。","ans":"原有的土壤条件基本保留，甚至保留了植物的种子或其他繁殖体。"},{"q":"一般来说，群落演替过程中，生态系统的抵抗力稳定性会怎样变化？","idea":"演替使生物种类增多、营养结构复杂，自我调节能力增强。","ans":"逐渐增强。"}]},{"name":"土壤中小动物类群丰富度的调查","desc":"许多土壤小动物身体微小，活动能力较强，不适宜用样方法或标志重捕法调查，常用取样器取样法调查其丰富度。利用土壤小动物趋湿、趋暗、避高温的特性，可以设计诱虫器进行采集，如在采集装置上方安装带灯罩的热光源。采集到的小动物可放入体积分数为70%的酒精溶液中保存。统计丰富度的方法有记名计算法（适用于个体较大、种群数量有限的群落）和目测估计法（按预先设定的多度等级估计个体数量）。丰富度指群落中物种数目的多少。","tip":"丰富度是指物种数目，不是种群密度，统计时要注意区分。","ex":[{"q":"调查土壤中小动物丰富度时，为什么不宜采用样方法？","idea":"土壤小动物身体微小，活动能力强，难以用样方法准确统计。","ans":"土壤小动物身体微小，活动能力强，活动范围不固定，样方法难以准确统计其数量。"},{"q":"诱虫器利用了土壤小动物的什么特性？","idea":"诱虫器中的热光源会驱使小动物向下移动并被收集。","ans":"趋湿、趋暗、避高温的特性。"},{"q":"群落丰富度指的是什么？","idea":"丰富度的定义。","ans":"群落中物种数目的多少。"}]}]},{"title":"第二十二章 生态系统的结构与功能（选择性必修二）","items":[{"name":"生态系统的组成成分与营养结构","desc":"生态系统由非生物的物质和能量、生产者、消费者、分解者四类成分组成。生产者主要是绿色植物（也包括化能合成细菌），是生态系统的基石；消费者包括各类动物和寄生生物，能加快物质循环；分解者（细菌、真菌及蚯蚓、蜣螂等腐食动物）把动植物遗体和排遗物分解为无机物。营养结构由食物链和食物网构成，食物链的起点是生产者，每一个营养级是食物链中同一环节生物的总和，食物网越复杂，生态系统的自我调节能力越强。","tip":"分解者不一定都是微生物，蚯蚓、蜣螂等腐食性动物也属于分解者；食物链只包含生产者和消费者，不包含分解者和非生物成分。","ex":[{"q":"下列生物中属于生态系统分解者的是（）A. 蚯蚓 B. 硝化细菌 C. 大象 D. 菟丝子","idea":"分解者靠分解动植物遗体或排遗物获取能量，硝化细菌是化能合成的生产者，大象和菟丝子都是消费者。","ans":"A。蚯蚓以腐殖质为食，将有机物分解为无机物，属于分解者；B 硝化细菌属于生产者；C 大象、D 菟丝子属于消费者。"},{"q":"某草原生态系统的食物链为：草→鼠→猫头鹰，则猫头鹰属于第几营养级？它属于哪类消费者？","idea":"营养级按照食物链中生产者的位置计数：草为第一营养级，鼠为第二营养级，猫头鹰为第三营养级。","ans":"猫头鹰位于第三营养级，属于次级消费者。"}]},{"name":"生态系统的能量流动","desc":"能量流动从生产者固定太阳能开始，沿食物链和食物网单向流动、逐级递减。相邻两个营养级之间的能量传递效率一般为10%～20%，计算公式为：传递效率 = 下一营养级同化量 ÷ 上一营养级同化量 × 100%。每个营养级同化的能量去向包括呼吸作用以热能形式散失、流入下一营养级、被分解者利用以及未被利用的部分。能量只能单向流动、不能循环。","tip":"同化量不等于摄入量，粪便中的能量属于上一营养级同化量的一部分，不计入本营养级的同化量。","ex":[{"q":"某食物链甲→乙→丙中，甲的同化量为2000 kJ，乙的同化量为300 kJ，丙的同化量为30 kJ。甲到乙、乙到丙的能量传递效率分别是多少？","idea":"按公式计算：下一营养级同化量除以上一营养级同化量。","ans":"甲到乙：300÷2000×100%=15%；乙到丙：30÷300×100%=10%。两者均在10%～20%范围内。"},{"q":"某生态系统中生产者固定的太阳能为10000 kJ，若各营养级间的能量传递效率在10%～20%之间，则次级消费者最多和最少分别能获得多少能量？","idea":"求最多时取20%，求最少时取10%，沿食物链逐级相乘（生产者→初级消费者→次级消费者）。","ans":"最多：10000×20%×20%=400 kJ；最少：10000×10%×10%=100 kJ。"}]},{"name":"能量流动的调整与应用","desc":"研究能量流动的意义在于设法调整生态系统的能量流动关系，使能量持续高效地流向对人类最有益的部分。农田中定期除草、除虫，就是让能量更多地流向农作物；能量多级利用（如桑基鱼塘、稻田养鸭）可以提高能量的利用率，但不能提高相邻营养级之间的能量传递效率。","tip":"能量多级利用提高的是能量利用率，而不是能量传递效率，二者不能混淆。","ex":[{"q":"农田中定期除草、除虫的主要目的是什么？","idea":"杂草和害虫会与农作物竞争或取食农作物，消耗原本应流向人类的能量。","ans":"调整能量流动关系，使能量更多地流向农作物，从而提高农产品产量。"},{"q":"桑基鱼塘模式体现了哪些生态学原理？","idea":"桑叶喂蚕、蚕粪和蚕蛹喂鱼、塘泥肥桑，是有机物的多级利用与废物再利用。","ans":"体现了能量的多级利用和物质的循环利用，提高了能量利用率，减少了环境污染。"}]},{"name":"生态系统的物质循环","desc":"物质循环是指组成生物体的C、H、O、N、P等元素，在生物群落与无机环境之间反复循环的过程，具有全球性和循环性。以碳循环为例：碳在无机环境与生物群落之间主要以CO2形式循环，在生物群落内部则以含碳有机物的形式沿食物链传递；碳进入生物群落主要靠光合作用和化能合成作用，返回无机环境主要靠生产者、消费者的呼吸作用和分解者的分解作用，以及化石燃料的燃烧。","tip":"物质循环中的“循环”是针对全球范围而言的，能量流动是单向的，二者不可混淆；碳在群落内部以有机物形式传递，而非CO2。","ex":[{"q":"碳元素在生物群落内部是以什么形式传递的？碳进入生物群落主要通过什么过程？","idea":"区分碳在生物群落之间和群落与无机环境之间的存在形式及转化途径。","ans":"在生物群落内部以含碳有机物的形式沿食物链传递；碳进入生物群落主要通过生产者的光合作用（部分细菌通过化能合成作用）完成。"},{"q":"导致温室效应加剧的主要原因是什么？","idea":"温室效应来源于大气中CO2等温室气体含量增加，从碳循环的角度分析排放与吸收的变化。","ans":"化石燃料的大量燃烧使CO2排放增加，同时森林被大量砍伐使光合作用吸收的CO2减少，导致大气中CO2浓度升高。"}]},{"name":"生态系统的信息传递","desc":"信息传递是指生态系统中生物之间、生物与环境之间传递信息的过程。信息类型包括物理信息（如光、声、温度、湿度、磁场）、化学信息（如植物的生物碱、动物的性外激素）和行为信息（如蜜蜂的舞蹈、孔雀开屏）。信息传递能保证生物正常的生命活动，有利于种群的繁衍，调节生物的种间关系，维持生态系统的稳定。","tip":"信息的来源可以是非生物环境，也可以是生物本身；行为信息是通过动物的特定行为传递的，不一定是有声的。","ex":[{"q":"雌蛾通过释放性外激素吸引雄蛾，这属于哪类信息？萤火虫通过发光求偶，又属于哪类信息？","idea":"性外激素是化学物质，发光是光这一物理现象。","ans":"性外激素属于化学信息；萤火虫发出的光属于物理信息。"},{"q":"信息传递在生态系统中的作用有哪些？请举一例说明。","idea":"从生命活动、种群繁衍和种间关系三个方面概括。","ans":"作用包括：保证生命活动正常进行、有利于种群繁衍、调节种间关系以维持生态系统稳定。例如狼通过尿液等化学信息标记领地，调节种间关系。"}]}]},{"title":"第二十三章 生态系统的稳定与保护（选择性必修二）","items":[{"name":"生态系统的稳定性","desc":"生态系统的稳定性包括抵抗力稳定性和恢复力稳定性。抵抗力稳定性是指生态系统抵抗外界干扰、使自身结构和功能保持原状的能力，营养结构越复杂，抵抗力稳定性越高；恢复力稳定性是指生态系统受到干扰后恢复到原状的能力，营养结构越简单，恢复力稳定性一般越高。一般来说，二者往往呈负相关。","tip":"抵抗力稳定性和恢复力稳定性并非所有生态系统都同时很强，如苔原、荒漠生态系统的恢复力稳定性较高，而抵抗力稳定性较低。","ex":[{"q":"热带雨林与北极苔原相比，哪个生态系统的抵抗力稳定性更高？哪个的恢复力稳定性更高？","idea":"根据营养结构的复杂程度判断：热带雨林物种丰富、营养结构复杂；苔原营养结构简单，环境恶劣。","ans":"热带雨林的抵抗力稳定性更高；北极苔原的恢复力稳定性更高。"},{"q":"某池塘因污染导致鱼类大量死亡，经治理后鱼类数量逐渐恢复，这体现的是哪种稳定性？","idea":"受到干扰后恢复原状的能力属于恢复力稳定性。","ans":"恢复力稳定性。"}]},{"name":"生物多样性及其价值","desc":"生物多样性包括遗传多样性、物种多样性和生态系统多样性。生物多样性的价值包括：直接价值（如药用、食用、观赏、旅游）、间接价值（如调节气候、涵养水源、保持水土，即生态功能）和潜在价值（目前尚不清楚的价值）。一般来说，间接价值远大于直接价值。","tip":"直接价值与间接价值的区分关键看是否直接被人利用，调节气候、保持水土属于间接价值。","ex":[{"q":"下列属于生物多样性间接价值的是（）A. 药用价值 B. 调节气候 C. 观赏价值 D. 旅游价值","idea":"间接价值指对生态系统起重要调节作用的价值，直接价值指直接被人类利用的价值。","ans":"B。调节气候属于生态功能，体现间接价值；A、C、D均属于直接价值。"}]},{"name":"生物多样性的保护","desc":"保护生物多样性的措施分为就地保护和迁地保护两类。就地保护是在原地建立自然保护区、国家公园等，保护生态系统和物种的原有环境，是保护生物多样性最有效的措施；迁地保护是将物种迁出原地，在动物园、植物园、种子库等地进行保护和繁育，是就地保护的补充。此外还需要加强立法管理、科普教育，合理利用生物资源。","tip":"就地保护是最有效的措施，迁地保护是对就地保护的补充，不能用迁地保护代替就地保护。","ex":[{"q":"建立国家公园、自然保护区属于哪种保护措施？建立种子库属于哪种保护措施？","idea":"是否在原地保护是区分二者的关键。","ans":"建立国家公园、自然保护区属于就地保护；建立种子库属于迁地保护。"}]},{"name":"生态工程与生态环境的保护","desc":"生态工程是指人类应用生态学和系统工程的原理，设计、建造和调控人工生态系统，以促进人与自然和谐发展的工程。生态工程遵循物质循环再生、物种多样性、协调与平衡、整体性和系统学与工程学原理。典型实例包括无废弃物农业、林业生态工程（如三北防护林）、矿区生态修复和湿地生态恢复等。全球性环境问题包括温室效应、臭氧层破坏、酸雨、水体富营养化、生物多样性锐减、外来物种入侵和土地荒漠化等。","tip":"温室效应主要由CO2等引起，臭氧层破坏主要由氟利昂引起，酸雨主要由SO2和氮氧化物引起，水体富营养化主要由N、P等污染物引起。","ex":[{"q":"“无废弃物农业”中用秸秆培养食用菌、菌渣再作为饲料或肥料，主要体现了生态工程的哪一原理？","idea":"农业废弃物被逐级利用并回到生产环节，属于物质在系统内的循环利用。","ans":"物质循环再生原理。"},{"q":"导致水体富营养化的主要原因是什么？","idea":"富营养化是水体中N、P等营养元素过多，导致藻类等大量繁殖的现象。","ans":"生活污水和工业废水中含大量N、P等营养物质排入水体，导致藻类等浮游生物大量繁殖。"}]}]},{"title":"第二十四章 发酵工程与细胞工程（选择性必修三）","items":[{"name":"传统发酵技术","desc":"果酒制作利用酵母菌在无氧条件下产生酒精，适宜温度18～25℃，发酵后期需防止杂菌污染；果醋制作利用醋酸菌，在氧气充足时将糖分解为醋酸，缺糖时可将酒精转化为乙醛再变为醋酸，适宜温度30～35℃；腐乳制作利用毛霉等真菌产生的蛋白酶和脂肪酶，将蛋白质和脂肪分解；泡菜制作利用乳酸菌无氧发酵产生乳酸，发酵过程中需要水封坛口，并注意亚硝酸盐含量的变化。","tip":"果醋制作需要持续通入无菌空气，醋酸菌是好氧菌；果酒、泡菜制作都要保证无氧环境。","ex":[{"q":"制作泡菜时，为什么要用水封坛口？","idea":"乳酸菌是厌氧菌，水封可以隔绝空气，同时防止外界杂菌进入。","ans":"水封形成无氧环境，有利于乳酸菌进行无氧发酵，同时防止杂菌污染和氧气进入。"},{"q":"在果酒发酵后期，用什么试剂检测培养液中是否产生了酒精？出现什么颜色？","idea":"酸性条件下，重铬酸钾与酒精反应呈现特定颜色变化。","ans":"在酸性条件下用重铬酸钾检测，若出现灰绿色，说明有酒精产生。"}]},{"name":"微生物的培养与分离计数","desc":"培养基一般包括水、碳源、氮源、无机盐，并满足微生物对pH、氧气及特殊营养物质的需要。无菌技术包括消毒（如煮沸消毒、巴氏消毒）和灭菌（如干热灭菌、高压蒸汽灭菌）。常用的分离纯化方法有平板划线法和稀释涂布平板法。稀释涂布平板法既能分离单菌落，也能用于活菌计数，计数公式为：每毫升样品中的活菌数 = 平板上的平均菌落数 ÷ 涂布的体积 × 稀释倍数。","tip":"稀释涂布平板计数的结果往往比实际值偏低，因为两个或多个细胞连在一起时只形成一个菌落。","ex":[{"q":"用稀释涂布平板法统计某样品活菌数，稀释倍数为10⁵，取0.1 mL涂布于三个平板，菌落数分别为52、48、49。求每毫升样品中的活菌数。","idea":"先求三个平板菌落数的平均值，再代入计数公式：平均菌落数 ÷ 涂布体积 × 稀释倍数。","ans":"平均菌落数=(52+48+49)÷3≈50；每毫升活菌数≈50÷0.1×10⁵=5×10⁷个。"},{"q":"用平板划线法纯化菌种时，每次划线前都要灼烧接种环，其目的是什么？","idea":"灼烧能够杀死接种环上的微生物，划线结束时也需灼烧。","ans":"杀死接种环上残留的菌种，使每次划线的菌种都来自上一次划线的末端，从而使菌种逐步稀释、获得单个菌落。"}]},{"name":"植物细胞工程","desc":"植物组织培养的原理是植物细胞的全能性。基本过程为：离体的外植体经脱分化形成愈伤组织，再经再分化形成根、芽等器官，最终发育为完整植株。培养基中生长素与细胞分裂素的比例影响分化方向：生长素比例高时有利于生根，细胞分裂素比例高时有利于生芽，二者比例适中时促进愈伤组织形成。人工种子是用人工种皮包裹胚状体、不定芽等制成的种子。","tip":"脱分化阶段一般不需要光照，再分化阶段需要光照（形成叶绿素）。","ex":[{"q":"在植物组织培养中，培养基中生长素与细胞分裂素的比值较高时，有利于诱导什么？","idea":"生长素比例高时有利于根的分化，细胞分裂素比例高时有利于芽的分化。","ans":"有利于诱导生根（根的分化）。"},{"q":"利用植物组织培养技术获得的胚状体，用人工种皮包裹后形成的种子称为什么？其优点是什么？","idea":"人工种子保留了植物的优良性状，并能像种子一样播种。","ans":"称为人工种子；优点是能保持优良性状、繁殖速度快、不受季节限制。"}]},{"name":"动物细胞培养与单克隆抗体","desc":"动物细胞培养需要无菌、无毒的环境，适宜的温度（约36.5±0.5℃）和pH（7.2～7.4），并需要一定的气体环境（95%空气加5%CO2）。CO2的作用是维持培养液的pH。动物细胞在培养过程中表现出贴壁生长和接触抑制的特点。单克隆抗体是利用B淋巴细胞与骨髓瘤细胞融合形成杂交瘤细胞，经筛选后获得的，杂交瘤细胞既能无限增殖，又能产生特定的抗体。核移植技术通过将供体细胞核移入去核卵母细胞中，获得克隆动物。","tip":"杂交瘤细胞的两个特点缺一不可：既能无限增殖，又能分泌特异性抗体。","ex":[{"q":"制备单克隆抗体时，为什么要用杂交瘤细胞而不是直接用B淋巴细胞？","idea":"B淋巴细胞能产生抗体但不能无限增殖，骨髓瘤细胞能无限增殖但不产生抗体。","ans":"杂交瘤细胞既能产生特异性抗体，又能无限增殖，能够持续大量获得单一抗体；而B淋巴细胞不能无限增殖。"},{"q":"动物细胞培养过程中，培养箱中通入5%CO2的主要作用是什么？","idea":"CO2溶于培养液后形成碳酸，有助于维持培养液的pH。","ans":"维持培养液的pH稳定。"}]}]},{"title":"第二十五章 胚胎工程与基因工程（选择性必修三）","items":[{"name":"胚胎工程","desc":"胚胎工程包括体外受精、早期胚胎培养、胚胎移植和胚胎分割等技术。体外受精需要获能的精子和成熟的卵母细胞（减数第二次分裂中期）。胚胎移植是指将早期胚胎移植到同种的、生理状态相同的雌性动物体内，使其继续发育。胚胎分割一般在囊胚期进行，分割时要注意将内细胞团均等分割，否则会影响胚胎的发育。","tip":"胚胎移植的实质是早期胚胎在相同生理环境条件下空间位置的转移，供体与受体需生理状态相同，但遗传物质并不一定相同。","ex":[{"q":"胚胎分割时，为什么要将内细胞团均等分割？","idea":"内细胞团将来发育成胎儿的各种组织，将分割后各部分内细胞团的数量保持均等才能保证发育正常。","ans":"内细胞团将来发育为胎儿的各种组织，均等分割可以保证分割后的胚胎都能正常发育。"},{"q":"在哺乳动物受精过程中，判断卵子已经受精的重要标志是什么？","idea":"卵子受精的标志包括在透明带与卵细胞膜之间观察到两个极体，以及雌雄原核的形成。","ans":"在卵细胞膜和透明带的间隙观察到两个极体（或雌、雄原核形成）。"}]},{"name":"基因工程的工具","desc":"基因工程的三种基本工具是限制酶、DNA连接酶和运载体。限制酶能够识别特定的核苷酸序列，并在特定位点切割磷酸二酯键。DNA连接酶用于连接DNA片段之间的磷酸二酯键，E. coli DNA连接酶只能连接黏性末端，T4 DNA连接酶还能连接平末端。运载体常用质粒、噬菌体和动植物病毒，应具备复制原点、标记基因和限制酶切割位点等条件。标记基因用于鉴定和筛选含有目的基因的受体细胞。","tip":"限制酶和DNA连接酶作用的都是磷酸二酯键，而不是氢键；标记基因的作用是筛选，而不是促进目的基因表达。","ex":[{"q":"限制酶切割DNA时，断裂的是哪种化学键？","idea":"基因工程中的酶作用于DNA的主链，需要区分主链化学键与碱基之间的氢键。","ans":"磷酸二酯键。"},{"q":"运载体上的标记基因（如抗性基因）的作用是什么？","idea":"标记基因可以使带有该基因的受体细胞在含有相应抗生素的培养基上存活，从而筛选出导入了重组质粒的细胞。","ans":"用于鉴定和筛选含有目的基因的受体细胞。"}]},{"name":"基因工程的基本操作步骤","desc":"基因工程的基本步骤包括：目的基因的获取（如从基因文库中获取、通过PCR扩增或人工合成）、基因表达载体的构建（目的基因、启动子、终止子、标记基因、复制原点）、将基因表达载体导入受体细胞（植物常用农杆菌转化法，动物常用显微注射法，微生物常用Ca²⁺处理法）、目的基因的检测与鉴定（分子水平上常用DNA分子杂交、抗原-抗体杂交，个体水平上进行抗性或性状鉴定）。","tip":"农杆菌转化法适用于双子叶植物和裸子植物，单子叶植物一般不用此法；显微注射法是动物细胞中最有效的导入方法。","ex":[{"q":"将目的基因导入双子叶植物细胞，最常用的方法是什么？","idea":"农杆菌能够侵染双子叶植物，并把其Ti质粒上的T-DNA整合到植物染色体DNA上。","ans":"农杆菌转化法。"},{"q":"检测转基因生物染色体的DNA上是否插入了目的基因，应采用什么技术？","idea":"检测DNA上是否有目的基因，需要用带标记的目的基因探针进行分子水平的检测。","ans":"DNA分子杂交技术。"}]},{"name":"PCR技术","desc":"PCR（聚合酶链式反应）是一种体外扩增DNA的技术，原理是DNA双链复制。每次循环包括三步：变性（约90～95℃，双链DNA解链为单链）、复性（约55～60℃，引物与单链DNA结合）、延伸（约72℃，在TaqDNA聚合酶作用下，从引物的3′端开始合成子链）。PCR需要引物，因为DNA聚合酶只能从3′端延伸，不能从头合成DNA。","tip":"PCR过程中每次循环DNA数量加倍，经n次循环理论上得到2ⁿ个DNA分子，但目的片段的数量计算需要单独考虑引物的位置。","ex":[{"q":"以一个DNA分子为模板进行PCR，经过4次循环后，理论上共得到多少个DNA分子？","idea":"每次循环DNA分子数加倍，经n次循环得到2ⁿ个DNA分子。","ans":"2⁴=16个。"},{"q":"PCR反应中为什么需要加入引物？","idea":"DNA聚合酶只能将脱氧核苷酸连接到已有核苷酸链的3′端。","ans":"因为DNA聚合酶不能从头开始合成DNA，只能从引物的3′端开始延伸子链。"}]},{"name":"蛋白质工程与生物安全","desc":"蛋白质工程是通过基因修饰或基因合成，对现有蛋白质进行改造，或制造新的蛋白质，以满足人类生产和生活需要的技术。其基本流程为：从预期的蛋白质功能出发，设计预期的蛋白质结构，推测应有的氨基酸序列，找到相对应的脱氧核苷酸序列（基因）。生物安全问题主要包括转基因生物的食用安全和环境安全、克隆人的伦理问题以及生物武器等，我国对转基因食品实行标识制度。","tip":"蛋白质工程的起点是预期蛋白质的功能，而不是直接修改DNA；流程是从功能到结构、再到序列、最后到基因。","ex":[{"q":"蛋白质工程的正确操作顺序是什么？","idea":"蛋白质工程从功能出发，逐步推导出结构、氨基酸序列和基因序列，最后通过基因工程实现。","ans":"预期蛋白质功能→设计预期的蛋白质结构→推测应有的氨基酸序列→找到对应的脱氧核苷酸序列（基因）。"},{"q":"我国对转基因食品采取的主要管理措施是什么？","idea":"转基因产品的安全性关系到消费者的知情权和选择权。","ans":"实行严格的安全评价和标识制度，即对转基因食品进行安全性评价，并在产品上标注。"}]}]}]};
const TAB_HASH = { grammar: "g", math: "math", physics: "physics", chemistry: "chem", biology: "bio" };
const TAB_FROM_HASH = Object.fromEntries(Object.entries(TAB_HASH).map(([k, v]) => [v, k]));
const PER_PAGE = 30;
const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("").concat(["#"]);

const state = { tab: "vocab", letter: "all", q: "", page: 1 };
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const counts = {};
DATA.forEach((r) => { counts[r.l] = (counts[r.l] || 0) + 1; });

/* ---------- speech ---------- */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice() {
  return voices.find((v) => /en[-_]GB/i.test(v.lang))
    || voices.find((v) => /^en/i.test(v.lang))
    || null;
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function speak(text, btn) {
  if (!window.speechSynthesis) { toast("当前浏览器不支持语音朗读"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = v ? v.lang : "en-GB";
  u.rate = 0.9;
  if (btn) {
    btn.classList.add("playing");
    u.onend = u.onerror = () => btn.classList.remove("playing");
  }
  speechSynthesis.speak(u);
}

/* ---------- filtering ---------- */
function matches(r, q) {
  if (!q) return true;
  const hit = (s) => s && s.toLowerCase().includes(q);
  if (hit(r.w) || hit(r.zh) || hit(r.en)) return true;
  return r.d.some((d) => hit(d.w) || hit(d.zh) || hit(d.en));
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.filter((r) => (state.letter === "all" || r.l === state.letter) && matches(r, q));
}

/* ---------- rendering ---------- */
function renderAlpha() {
  const html = [`<button data-l="all" class="${state.letter === "all" ? "active" : ""}">
    <span class="letter">全部</span><span class="num">${DATA.length}</span></button><hr>`];
  LETTERS.forEach((l) => {
    const n = counts[l] || 0;
    html.push(`<button data-l="${l}" ${n ? "" : "disabled"} class="${state.letter === l ? "active" : ""}">
      <span class="letter">${l === "#" ? "#" : l.toUpperCase()}</span><span class="num">${n}</span></button>`);
  });
  $("alpha").innerHTML = html.join("");
}

function entryHTML(r) {
  const derived = r.d.length
    ? `<ul class="derived">${r.d.map((d) => `
        <li>
          <span class="dw" data-speak="${esc(d.w)}">${esc(d.w)}</span>
          <span class="ipa">${esc(d.ipa)}</span>
          <span class="dpos">${esc(d.pos)}</span>
          <span class="dzh">${esc(d.zh)}</span>
          <span class="den">${esc(d.en)}</span>
        </li>`).join("")}</ul>`
    : "";
  return `
    <article class="entry">
      <div class="head">
        <span class="word" data-speak="${esc(r.w)}">${esc(r.w)}</span>
        <button class="spk" data-speak="${esc(r.w)}" title="朗读">🔊</button>
        <span class="ipa">${esc(r.ipa)}</span>
        <span class="pos">${esc(r.pos)}</span>
      </div>
      <div class="meaning">${esc(r.zh)}</div>
      <div class="en">${esc(r.en)}</div>
      ${derived}
    </article>`;
}

function pageItems(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const set = new Set([1, total, cur, cur - 1, cur + 1]);
  if (cur <= 3) [2, 3, 4].forEach((x) => set.add(x));
  if (cur >= total - 2) [total - 1, total - 2, total - 3].forEach((x) => set.add(x));
  const pages = [...set].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);
  const out = [];
  pages.forEach((p, i) => {
    if (i && p - pages[i - 1] > 1) out.push("…");
    out.push(p);
  });
  return out;
}

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  const cur = state.page;
  if (pages <= 1) { $("pager").innerHTML = ""; return; }
  const items = pageItems(cur, pages).map((p) =>
    p === "…" ? `<span>…</span>` : `<button data-page="${p}" class="${p === cur ? "cur" : ""}">${p}</button>`
  );
  $("pager").innerHTML = `
    <button data-page="${cur - 1}" ${cur <= 1 ? "disabled" : ""}>‹ 上一页</button>
    ${items.join("")}
    <button data-page="${cur + 1}" ${cur >= pages ? "disabled" : ""}>下一页 ›</button>`;
}

function render() {
  const rows = filtered();
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;

  const start = (state.page - 1) * PER_PAGE;
  const slice = rows.slice(start, start + PER_PAGE);

  renderAlpha();
  $("count").textContent = `共 ${rows.length} 个词条` + (state.letter !== "all" ? `（${state.letter.toUpperCase()}）` : "");
  $("list").innerHTML = slice.length ? slice.map(entryHTML).join("") : `<div class="empty">没有找到匹配的单词</div>`;
  renderPager(rows.length);
  saveHash();
}

/* ---------- state in URL hash ---------- */
function saveHash() {
  const parts = [];
  if (state.tab !== "vocab") {
    parts.push("t=" + TAB_HASH[state.tab]);
  } else {
    if (state.letter !== "all") parts.push("l=" + state.letter);
    if (state.q) parts.push("q=" + encodeURIComponent(state.q));
    if (state.page > 1) parts.push("p=" + state.page);
  }
  history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname + location.search);
}

function loadHash() {
  const h = location.hash.replace(/^#/, "");
  const p = new URLSearchParams(h);
  state.tab = TAB_FROM_HASH[p.get("t")] || "vocab";
  if (!h) return;
  if (p.get("l") && LETTERS.includes(p.get("l"))) state.letter = p.get("l");
  if (p.get("q")) { state.q = p.get("q"); $("q").value = state.q; }
  if (p.get("p")) state.page = parseInt(p.get("p"), 10) || 1;
}

/* ---------- grammar tab ---------- */
let gramRendered = false;
function grammarHTML(it) {
  return `
    <article class="gcard">
      <h3>${esc(it.name)}</h3>
      <p class="gdesc">${esc(it.desc)}</p>
      ${it.tip ? `<p class="gtip">💡 ${esc(it.tip)}</p>` : ""}
      <ul class="gex">${it.ex.map(([en, zh]) => `
        <li>
          <span class="en">${esc(en)}</span>
          <span class="zh">${esc(zh)}</span>
          <button class="spk" data-speak="${esc(en)}" title="朗读">🔊</button>
        </li>`).join("")}</ul>
    </article>`;
}

function renderGrammar() {
  if (gramRendered) return;
  const toc = GRAMMAR.map((s, i) => `<button type="button" data-sec="${i}">${esc(s.title)}</button>`).join("");
  const body = GRAMMAR.map((s, i) => `
    <section class="gsec" id="gs${i}">
      <h2>${esc(s.title)}</h2>
      ${s.items.map(grammarHTML).join("")}
    </section>`).join("");
  $("grammar").innerHTML = `<div class="gtoc">${toc}</div>${body}`;
  gramRendered = true;
}

function showTab() {
  setHeaderVar();
  const t = state.tab;
  document.body.classList.toggle("nonvocab", t !== "vocab");
  document.body.classList.toggle("grammar", t === "grammar");
  document.body.classList.toggle("subject", !!SUBJECTS[t]);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  if (t === "vocab") {
    render();
  } else {
    if (t === "grammar") renderGrammar();
    else renderSubject(t);
    saveHash();
  }
}

function setTab(t) {
  state.tab = t;
  showTab();
  window.scrollTo(0, 0);
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});

$("grammar").addEventListener("click", (e) => {
  const sec = e.target.closest("button[data-sec]");
  if (sec) {
    $("gs" + sec.dataset.sec).scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const el = e.target.closest("[data-speak]");
  if (el) speak(el.dataset.speak, el.classList.contains("spk") ? el : null);
});

/* ---------- events ---------- */
function scrollTop() {
  const hdr = document.querySelector("header").offsetHeight;
  const y = $("list").getBoundingClientRect().top + window.scrollY - hdr - 16;
  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}

function setHeaderVar() {
  document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
}
setHeaderVar();
window.addEventListener("resize", setHeaderVar);

$("alpha").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-l]");
  if (!b || b.disabled) return;
  state.letter = b.dataset.l;
  state.page = 1;
  render();
  scrollTop();
});

$("pager").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-page]");
  if (!b || b.disabled) return;
  state.page = parseInt(b.dataset.page, 10);
  render();
  scrollTop();
});

$("list").addEventListener("click", (e) => {
  const el = e.target.closest("[data-speak]");
  if (!el) return;
  speak(el.dataset.speak, el.classList.contains("spk") ? el : null);
});

let qTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.q = e.target.value;
    state.page = 1;
    render();
  }, 150);
});
$("clear").addEventListener("click", () => {
  $("q").value = "";
  state.q = "";
  state.page = 1;
  render();
});

/* ---------- subject tabs (数学/物理/化学/生物) ---------- */
let subjKey = null;
function subjItemHTML(it) {
  const exs = (it.ex || []).map((x, n) => `
    <div class="qx">
      <div class="q"><span class="qn">例${n + 1}</span>${esc(x.q)}</div>
      <details>
        <summary>查看思路与解答</summary>
        <p class="idea"><b>思路：</b>${esc(x.idea)}</p>
        <p class="ans"><b>解答：</b>${esc(x.ans)}</p>
      </details>
    </div>`).join("");
  return `
    <article class="gcard">
      <h3>${esc(it.name)}</h3>
      <p class="gdesc">${esc(it.desc)}</p>
      ${it.tip ? `<p class="gtip">💡 ${esc(it.tip)}</p>` : ""}
      ${exs}
    </article>`;
}

function renderSubject(key) {
  if (subjKey === key) return;
  subjKey = key;
  const chapters = SUBJECTS[key];
  const toc = chapters.map((c, i) => `<button type="button" data-sec="${i}">${esc(c.title)}</button>`).join("");
  const body = chapters.map((c, i) => `
    <section class="gsec" id="ks-${key}-${i}">
      <h2>${esc(c.title)}</h2>
      ${c.items.map(subjItemHTML).join("")}
    </section>`).join("");
  $("subject").innerHTML = `<div class="gtoc">${toc}</div>${body}`;
}

$("subject").addEventListener("click", (e) => {
  const sec = e.target.closest("button[data-sec]");
  if (!sec) return;
  document.getElementById(`ks-${state.tab}-${sec.dataset.sec}`).scrollIntoView({ behavior: "smooth", block: "start" });
});

window.addEventListener("hashchange", () => { loadHash(); showTab(); });

loadHash();
showTab();
</script>
</body>
</html>
