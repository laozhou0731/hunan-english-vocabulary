<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中英语课标核心词汇 3500</title>
<style>
  :root {
    --bg: #f7f5ef;
    --paper: #ffffff;
    --ink: #1d2433;
    --muted: #6b7280;
    --line: #e5e1d6;
    --accent: #2f4a6d;
    --accent-soft: #e8eef6;
    --gold: #b98b3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(247,245,239,.94);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding-top: 16px; flex-wrap: wrap; }
  h1 { font-family: Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 22px; margin: 0; letter-spacing: .5px; }
  .count { color: var(--muted); font-size: 13px; }
  .search { margin: 12px 0; display: flex; gap: 10px; }
  .search input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,74,109,.12); }
  .search button { padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
    color: var(--muted); cursor: pointer; font-size: 14px; }
  .search button:hover { color: var(--accent); border-color: var(--accent); }

  .layout { max-width: 1120px; margin: 0 auto; padding: 18px 20px 40px; display: flex; gap: 24px; align-items: flex-start; }
  .alpha { width: 150px; flex: 0 0 150px; position: sticky; top: calc(var(--hdr, 120px) + 12px);
    max-height: calc(100vh - var(--hdr, 120px) - 30px); overflow-y: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .alpha button { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 34px;
    padding: 0 12px; margin-bottom: 2px; border-radius: 9px; border: 1px solid transparent; background: none;
    color: var(--ink); cursor: pointer; font-size: 14px; transition: background .15s, color .15s; }
  .alpha button .letter { font: 700 15px Georgia, serif; }
  .alpha button .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alpha button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .alpha button.active { background: var(--accent); color: #fff; }
  .alpha button.active .num { color: rgba(255,255,255,.8); }
  .alpha button:disabled { opacity: .35; cursor: default; }
  .alpha hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }

  main { flex: 1; min-width: 0; }
  .entry { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px;
    margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: box-shadow .2s; }
  .entry:hover { box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .word { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; color: var(--accent);
    cursor: pointer; }
  .word:hover { text-decoration: underline; text-underline-offset: 3px; }
  .ipa { font-family: "Doulos SIL", "Lucida Sans Unicode", "DejaVu Sans", serif; color: var(--muted); font-size: 15px; }
  .pos { font-size: 12px; color: #fff; background: var(--gold); border-radius: 6px; padding: 1px 7px; }
  .spk { border: none; background: var(--accent-soft); color: var(--accent); width: 32px; height: 32px;
    border-radius: 50%; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
    transition: transform .1s, background .2s; }
  .spk:hover { background: var(--accent); color: #fff; }
  .spk:active { transform: scale(.92); }
  .spk.playing { background: var(--gold); color: #fff; }
  .meaning { margin-top: 8px; font-size: 16px; }
  .en { margin-top: 4px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .derived { margin: 12px 0 0; padding: 10px 0 0 14px; border-left: 2px solid var(--accent-soft); list-style: none; }
  .derived li { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 4px 0; font-size: 14px; }
  .derived .dw { font-weight: 600; cursor: pointer; color: var(--ink); }
  .derived .dw:hover { color: var(--accent); }
  .derived .dpos { color: var(--gold); font-size: 12px; }
  .derived .dzh { color: var(--ink); }
  .derived .den { color: var(--muted); font-size: 13px; width: 100%; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  nav.pager { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
  nav.pager button { min-width: 36px; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); cursor: pointer; font-size: 14px; }
  nav.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  nav.pager button.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
  nav.pager button:disabled { opacity: .35; cursor: default; }
  nav.pager span { color: var(--muted); padding: 0 4px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 20px 30px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .toast.show { opacity: .95; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; gap: 12px; }
    .alpha { width: 100%; flex: none; position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
    .alpha button { width: auto; min-width: 58px; height: 30px; padding: 0 8px; gap: 6px; }
    .alpha hr { display: none; }
  }
  @media (max-width: 600px) {
    .word { font-size: 19px; }
    .entry { padding: 14px; }
  }

  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tabs button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
    color: var(--muted); cursor: pointer; font-size: 14px; }
  .tabs button:hover { color: var(--accent); border-color: var(--accent); }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  body.grammar .layout, body.grammar .search, body.grammar #count { display: none; }
  #grammar { display: none; padding: 8px 0 24px; }
  body.grammar #grammar { display: block; }

  .gtoc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
  .gtoc button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
    color: var(--muted); cursor: pointer; font-size: 13px; }
  .gtoc button:hover { color: var(--accent); border-color: var(--accent); }
  .gsec { scroll-margin-top: calc(var(--hdr, 120px) + 16px); margin-top: 28px; }
  .gsec > h2 { font-family: Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 19px; margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--accent); }
  .gcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .gcard h3 { margin: 0 0 6px; font-size: 16px; }
  .gcard .gdesc { color: var(--ink); line-height: 1.75; font-size: 14.5px; margin: 0; }
  .gcard .gtip { margin: 8px 0 0; padding: 8px 12px; background: #fbf6ec; border-left: 3px solid var(--gold);
    border-radius: 6px; font-size: 13.5px; color: #5b4a2b; line-height: 1.7; }
  .gex { list-style: none; margin: 10px 0 0; padding: 0; }
  .gex li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--line); }
  .gex li:first-child { border-top: none; }
  .gex .en { flex: 1; font-size: 15px; }
  .gex .zh { flex: 1; color: var(--muted); font-size: 14px; }
  .gex .spk { border: none; background: none; cursor: pointer; font-size: 14px; padding: 0 2px; opacity: .7; }
  .gex .spk:hover { opacity: 1; }
  @media (max-width: 600px) {
    .gex li { flex-direction: column; gap: 2px; }
  }
</style>
</head>

 v.","en":"an injury to the body; to injure","zh":"伤口；伤害","w":"wound","l":"w","d":[]},{"ipa":"/ræp/","pos":"v. / n.","en":"to cover with paper or cloth; a covering","zh":"包裹；披上","w":"wrap","l":"w","d":[]},{"ipa":"/rɪst/","pos":"n.","en":"the joint between the hand and the arm","zh":"手腕","w":"wrist","l":"w","d":[]},{"ipa":"/raɪt/","pos":"v.","en":"to produce words or text on paper or a screen","zh":"写；写作","w":"write","l":"w","d":[{"ipa":"/ˈraɪtə(r)/","pos":"n.","en":"a person who writes books or articles","zh":"作家；作者","w":"writer"},{"ipa":"/ˈraɪtɪŋ/","pos":"n.","en":"written words; the activity of writing","zh":"书面文字；写作","w":"writing"}]},{"ipa":"/rɒŋ/","pos":"adj. / adv. / v.","en":"not correct; not right; to treat unfairly","zh":"错误的；不对；冤枉","w":"wrong","l":"w","d":[]},{"ipa":"/jɑːd/","pos":"n.","en":"a unit of length; an enclosed area next to a building","zh":"码；院子","w":"yard","l":"y","d":[]},{"ipa":"/jɪə(r)/","pos":"n.","en":"a period of twelve months","zh":"年","w":"year","l":"y","d":[]},{"ipa":"/jel/","pos":"v. / n.","en":"to shout loudly","zh":"大叫；喊叫","w":"yell","l":"y","d":[]},{"ipa":"/ˈjeləʊ/","pos":"n. / adj.","en":"the colour of lemons or sunshine","zh":"黄色；黄色的","w":"yellow","l":"y","d":[]},{"ipa":"/jes/","pos":"int.","en":"used to agree or accept","zh":"是；对","w":"yes","l":"y","d":[]},{"ipa":"/ˈjestədeɪ/","pos":"n. / adv.","en":"the day before today","zh":"昨天","w":"yesterday","l":"y","d":[]},{"ipa":"/jet/","pos":"adv. / conj.","en":"up to now; but","zh":"还；仍然；然而","w":"yet","l":"y","d":[]},{"ipa":"/jiːld/","pos":"v. / n.","en":"to produce; to give way; a quantity produced","zh":"产出；屈服；产量","w":"yield","l":"y","d":[]},{"ipa":"/juː/","pos":"pron.","en":"the person or people being addressed","zh":"你；你们","w":"you","l":"y","d":[]},{"ipa":"/jʌŋ/","pos":"adj. / n.","en":"having lived only a short time; young people","zh":"年轻的；年轻人","w":"young","l":"y","d":[]},{"ipa":"/juːθ/","pos":"n.","en":"the period of being young; young people","zh":"青年时期；青年","w":"youth","l":"y","d const GRAMMAR = [{"title":"一、动词时态","items":[{"name":"一般现在时","desc":"表示经常性、习惯性的动作，或客观事实与真理。结构：主语 + 动词原形（第三人称单数加 -s / -es）。","tip":"常与 always, usually, often, every day 等连用。","ex":[["She reads English every morning.","她每天早上读英语。"],["The earth goes around the sun.","地球绕着太阳转。"]]},{"name":"一般过去时","desc":"表示过去某个时间发生的动作或存在的状态。结构：动词过去式（be 动词用 was / were）。","tip":"常与 yesterday, last week, in 2008, just now 等过去时间状语连用。","ex":[["I visited my grandma last weekend.","我上个周末去看望了奶奶。"],["He was ill yesterday.","他昨天生病了。"]]},{"name":"一般将来时","desc":"表示将来要发生的动作。结构：will / shall + 动词原形；be going to + 动词原形 表示计划或有迹象的将来；be about to 表示即将发生。","ex":[["We will hold a sports meeting next month.","我们下个月将举行运动会。"],["It is going to rain soon.","天快要下雨了。"]]},{"name":"现在进行时","desc":"表示说话时正在进行的动作，也可表示最近一段时间内的动作，或按计划将要发生的安排。结构：am / is / are + doing。","ex":[["They are playing football now.","他们现在正在踢足球。"],["I am meeting Tom tomorrow.","我明天要和汤姆见面。"]]},{"name":"现在完成时","desc":"表示过去发生的动作对现在造成影响，或动作从过去持续到现在。结构：have / has + 过去分词。","tip":"常与 already, yet, just, ever, never, for, since 连用。for 后接时间段，since 后接时间点。","ex":[["I have finished my homework.","我已经做完作业了。"],["She has lived here for ten years.","她在这里住了十年。"]]},{"name":"过去完成时","desc":"表示过去某一时间或动作之前已经完成的动作。结构：had + 过去分词。","ex":[["When I arrived, the film had already started.","我到的时候，电影已经开始了。"]]},{"name":"现在完成进行时","desc":"强调动作从过去开始、一直持续到现在，并可能继续下去。结构：have / has been + doing。","ex":[["I have been studying for three hours.","我已经学习三个小时了。"]]}]},{"title":"二、被动语态","items":[{"name":"被动语态的基本形式","desc":"主语是动作的承受者。结构：be + 过去分词（by 引出动作的执行者）。时态变化通过 be 动词体现。","ex":[["The window was broken last night.","窗户昨晚被打破了。"],["English is spoken in many countries.","许多国家都说英语。"]]},{"name":"含情态动词的被动语态","desc":"结构：情态动词 + be + 过去分词。","ex":[["The problem can be solved easily.","这个问题很容易解决。"],["The homework must be finished today.","作业必须今天完成。"]]}]},{"title":"三、非谓语动词","items":[{"name":"不定式（to do）","desc":"可在句中作主语、宾语、宾语补足语，也可作目的状语。","ex":[["To learn English well takes time.","学好英语需要时间。"],["She came here to help us.","她来这里是为了帮助我们。"]]},{"name":"动名词（doing）","desc":"具有名词性质，可作主语、宾语、表语。常接动名词作宾语的动词有 enjoy, finish, mind, consider, suggest, practise 等。","ex":[["Reading is my favourite hobby.","阅读是我最喜欢的爱好。"],["She enjoys swimming in summer.","她喜欢在夏天游泳。"]]},{"name":"现在分词与过去分词","desc":"现在分词（doing）表示主动或进行；过去分词（done）表示被动或完成。可作定语、状语等。","ex":[["The boy running over there is my brother.","那边跑着的男孩是我弟弟。"],["The letter written in English was from Tom.","那封用英语写的信是汤姆寄来的。"],["Walking along the street, I met my teacher.","沿着街道走的时候，我遇到了我的老师。"]]},{"name":"stop 等动词后接 to do 与 doing 的区别","desc":"stop to do 表示停下来去做另一件事；stop doing 表示停止正在做的事。","ex":[["He stopped to smoke.","他停下来抽烟。（停下手中的事去抽烟）"],["He stopped smoking.","他戒烟了。（停止抽烟）"]]}]},{"title":"四、情态动词","items":[{"name":"常用情态动词","desc":"can / could 表示能力或可能；may / might 表示允许或可能性；must 表示必须；should / ought to 表示建议或义务；need 表示需要。情态动词后接动词原形，没有人称和时态变化。","ex":[["You must finish it today.","你今天必须完成它。"],["You don't have to come.","你不必来。"],["You mustn't smoke here.","你不准在这里抽烟。"]]},{"name":"情态动词 + have done","desc":"should have done 表示本应该做而没做；needn't have done 表示本不必做却做了；must have done 表示对过去的推测。","ex":[["You should have called me.","你本该给我打电话的。"],["He must have forgotten it.","他一定是忘了。"]]}]},{"title":"五、虚拟语气","items":[{"name":"与现在事实相反","desc":"结构：If + 主语 + 动词过去式（be 动词多用 were），主句 would / could / might + 动词原形。","ex":[["If I were you, I would take the bus.","如果我是你，我会坐公交车。"]]},{"name":"与过去事实相反","desc":"结构：If + 主语 + had done，主句 would / could / might + have done。","ex":[["If we had left earlier, we would have caught the train.","如果我们早点出发，就能赶上火车了。"]]},{"name":"wish 后的虚拟语气","desc":"wish 后的从句表示与现在或过去事实相反的愿望：表示现在用过去式，表示过去用 had done。","ex":[["I wish I knew the answer.","我真希望我知道答案。（实际不知道）"],["I wish I had listened to you.","我真希望当初听了你的话。（实际没听）"]]}]},{"title":"六、从句","items":[{"name":"定语从句","desc":"修饰名词或代词，由关系代词 who / whom / whose / which / that 或关系副词 when / where / why 引导。","tip":"先行词指人用 who / whom / that；指物用 which / that；先行词是时间、地点用 when / where。","ex":[["The girl who is standing there is my sister.","站在那里的女孩是我的妹妹。"],["This is the place where we first met.","这是我们第一次见面的地方。"]]},{"name":"名词性从句","desc":"在句中充当主语、宾语、表语或同位语。常由 that, whether, if, what, when, who 等引导。","ex":[["What he said is true.","他说的话是真的。（主语从句）"],["I don't know whether he will come.","我不知道他会不会来。（宾语从句）"],["The question is when we'll start.","问题是我们什么时候出发。（表语从句）"],["The news that our team won spread quickly.","我们队获胜的消息很快传开了。（同位语从句）"]]},{"name":"状语从句","desc":"修饰主句的动词、形容词或副词，表示时间、条件、原因、让步、目的、结果等。","tip":"时间：when, as soon as, until；条件：if, unless；原因：because, since, as；让步：although, though；目的：so that；结果：so ... that。","ex":[["I will call you as soon as I arrive.","我一到就给你打电话。（时间）"],["You will fail unless you work harder.","除非你更加努力，否则你会失败。（条件）"],["Although it was raining, they went out.","尽管下着雨，他们还是出去了。（让步）"]]}]},{"title":"七、倒装与强调","items":[{"name":"部分倒装","desc":"否定副词（never, seldom, hardly, rarely, little 等）或 only + 状语位于句首时，句子要部分倒装：助动词或情态动词提前到主语前。","ex":[["Never have I seen such a beautiful view.","我从未见过如此美丽的景色。"],["Hardly had I got home when it started to rain.","我刚到家，天就开始下雨了。"],["Only then did I understand the problem.","直到那时我才明白这个问题。"]]},{"name":"强调句型","desc":"结构：It is / was + 被强调部分 + that / who + 其余部分。被强调部分可以是主语、宾语或状语。去掉 It is ... that 后句子仍然完整。","ex":[["It was in 2008 that he joined the army.","他是在2008年参军的。（强调时间）"],["It is Tom who broke the vase.","打碎花瓶的是汤姆。（强调主语）"]]}]},{"title":"八、主谓一致","items":[{"name":"常见主谓一致规则","desc":"谓语动词的人称和数要与主语一致。Neither ... nor / either ... or / not only ... but also 连接主语时，谓语与靠近它的主语一致。a number of 表示复数，the number of 表示单数。","ex":[["Neither he nor I am wrong.","他和我都没错。"],["A number of students are waiting outside.","很多学生正在外面等候。"],["The number of students is increasing.","学生人数正在增加。"]]}]},{"title":"九、冠词、介词与比较级","items":[{"name":"冠词 a / an / the","desc":"a / an 表示泛指“一个”，元音音素前用 an；the 表示特指或双方都知道的人或事物，也用于世界上独一无二的事物。","ex":[["I have a pen and an eraser.","我有一支钢笔和一块橡皮。"],["The sun rises in the east.","太阳从东方升起。"]]},{"name":"时间介词 in / on / at","desc":"at 用于具体时刻；on 用于具体日期和星期；in 用于月份、季节、年份及较长的时间段。","ex":[["We have class at 8 o'clock.","我们八点上课。"],["I was born on May 5th.","我出生于5月5日。"],["She was born in 2008.","她出生于2008年。"]]},{"name":"形容词和副词的比较级与最高级","desc":"单音节和部分双音节词加 -er / -est；多音节词前加 more / most。少数词不规则变化，如 good–better–best，bad–worse–worst。","ex":[["This book is more interesting than that one.","这本书比那本更有趣。"],["He is the tallest boy in our class.","他是我们班最高的男生。"],["She runs as fast as her brother.","她跑得和她哥哥一样快。"]]}]}];
const PER_PAGE = 30;
const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("").concat(["#"]);

const state = { tab: "vocab", letter: "all", q: "", page: 1 };
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const counts = {};
DATA.forEach((r) => { counts[r.l] = (counts[r.l] || 0) + 1; });

/* ---------- speech ---------- */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice() {
  return voices.find((v) => /en[-_]GB/i.test(v.lang))
    || voices.find((v) => /^en/i.test(v.lang))
    || null;
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function speak(text, btn) {
  if (!window.speechSynthesis) { toast("当前浏览器不支持语音朗读"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = v ? v.lang : "en-GB";
  u.rate = 0.9;
  if (btn) {
    btn.classList.add("playing");
    u.onend = u.onerror = () => btn.classList.remove("playing");
  }
  speechSynthesis.speak(u);
}

/* ---------- filtering ---------- */
function matches(r, q) {
  if (!q) return true;
  const hit = (s) => s && s.toLowerCase().includes(q);
  if (hit(r.w) || hit(r.zh) || hit(r.en)) return true;
  return r.d.some((d) => hit(d.w) || hit(d.zh) || hit(d.en));
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.filter((r) => (state.letter === "all" || r.l === state.letter) && matches(r, q));
}

/* ---------- rendering ---------- */
function renderAlpha() {
  const html = [`<button data-l="all" class="${state.letter === "all" ? "active" : ""}">
    <span class="letter">全部</span><span class="num">${DATA.length}</span></button><hr>`];
  LETTERS.forEach((l) => {
    const n = counts[l] || 0;
    html.push(`<button data-l="${l}" ${n ? "" : "disabled"} class="${state.letter === l ? "active" : ""}">
      <span class="letter">${l === "#" ? "#" : l.toUpperCase()}</span><span class="num">${n}</span></button>`);
  });
  $("alpha").innerHTML = html.join("");
}

function entryHTML(r) {
  const derived = r.d.length
    ? `<ul class="derived">${r.d.map((d) => `
        <li>
          <span class="dw" data-speak="${esc(d.w)}">${esc(d.w)}</span>
          <span class="ipa">${esc(d.ipa)}</span>
          <span class="dpos">${esc(d.pos)}</span>
          <span class="dzh">${esc(d.zh)}</span>
          <span class="den">${esc(d.en)}</span>
        </li>`).join("")}</ul>`
    : "";
  return `
    <article class="entry">
      <div class="head">
        <span class="word" data-speak="${esc(r.w)}">${esc(r.w)}</span>
        <button class="spk" data-speak="${esc(r.w)}" title="朗读">🔊</button>
        <span class="ipa">${esc(r.ipa)}</span>
        <span class="pos">${esc(r.pos)}</span>
      </div>
      <div class="meaning">${esc(r.zh)}</div>
      <div class="en">${esc(r.en)}</div>
      ${derived}
    </article>`;
}

function pageItems(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const set = new Set([1, total, cur, cur - 1, cur + 1]);
  if (cur <= 3) [2, 3, 4].forEach((x) => set.add(x));
  if (cur >= total - 2) [total - 1, total - 2, total - 3].forEach((x) => set.add(x));
  const pages = [...set].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);
  const out = [];
  pages.forEach((p, i) => {
    if (i && p - pages[i - 1] > 1) out.push("…");
    out.push(p);
  });
  return out;
}

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  const cur = state.page;
  if (pages <= 1) { $("pager").innerHTML = ""; return; }
  const items = pageItems(cur, pages).map((p) =>
    p === "…" ? `<span>…</span>` : `<button data-page="${p}" class="${p === cur ? "cur" : ""}">${p}</button>`
  );
  $("pager").innerHTML = `
    <button data-page="${cur - 1}" ${cur <= 1 ? "disabled" : ""}>‹ 上一页</button>
    ${items.join("")}
    <button data-page="${cur + 1}" ${cur >= pages ? "disabled" : ""}>下一页 ›</button>`;
}

function render() {
  const rows = filtered();
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;

  const start = (state.page - 1) * PER_PAGE;
  const slice = rows.slice(start, start + PER_PAGE);

  renderAlpha();
  $("count").textContent = `共 ${rows.length} 个词条` + (state.letter !== "all" ? `（${state.letter.toUpperCase()}）` : "");
  $("list").innerHTML = slice.length ? slice.map(entryHTML).join("") : `<div class="empty">没有找到匹配的单词</div>`;
  renderPager(rows.length);
  saveHash();
}

/* ---------- state in URL hash ---------- */
function saveHash() {
  const parts = [];
  if (state.tab === "grammar") {
    parts.push("t=g");
  } else {
    if (state.letter !== "all") parts.push("l=" + state.letter);
    if (state.q) parts.push("q=" + encodeURIComponent(state.q));
    if (state.page > 1) parts.push("p=" + state.page);
  }
  history.replaceState(null, "", parts.length ? "#" + parts.join("&") : location.pathname + location.search);
}

function loadHash() {
  const h = location.hash.replace(/^#/, "");
  const p = new URLSearchParams(h);
  state.tab = p.get("t") === "g" ? "grammar" : "vocab";
  if (!h) return;
  if (p.get("l") && LETTERS.includes(p.get("l"))) state.letter = p.get("l");
  if (p.get("q")) { state.q = p.get("q"); $("q").value = state.q; }
  if (p.get("p")) state.page = parseInt(p.get("p"), 10) || 1;
}

/* ---------- grammar tab ---------- */
let gramRendered = false;
function grammarHTML(it) {
  return `
    <article class="gcard">
      <h3>${esc(it.name)}</h3>
      <p class="gdesc">${esc(it.desc)}</p>
      ${it.tip ? `<p class="gtip">💡 ${esc(it.tip)}</p>` : ""}
      <ul class="gex">${it.ex.map(([en, zh]) => `
        <li>
          <span class="en">${esc(en)}</span>
          <span class="zh">${esc(zh)}</span>
          <button class="spk" data-speak="${esc(en)}" title="朗读">🔊</button>
        </li>`).join("")}</ul>
    </article>`;
}

function renderGrammar() {
  if (gramRendered) return;
  const toc = GRAMMAR.map((s, i) => `<button type="button" data-sec="${i}">${esc(s.title)}</button>`).join("");
  const body = GRAMMAR.map((s, i) => `
    <section class="gsec" id="gs${i}">
      <h2>${esc(s.title)}</h2>
      ${s.items.map(grammarHTML).join("")}
    </section>`).join("");
  $("grammar").innerHTML = `<div class="gtoc">${toc}</div>${body}`;
  gramRendered = true;
}

function showTab() {
  setHeaderVar();
  const g = state.tab === "grammar";
  document.body.classList.toggle("grammar", g);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === state.tab));
  if (g) { renderGrammar(); saveHash(); } else render();
}

function setTab(t) {
  state.tab = t;
  showTab();
  window.scrollTo(0, 0);
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});

$("grammar").addEventListener("click", (e) => {
  const sec = e.target.closest("button[data-sec]");
  if (sec) {
    $("gs" + sec.dataset.sec).scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const el = e.target.closest("[data-speak]");
  if (el) speak(el.dataset.speak, el.classList.contains("spk") ? el : null);
});

/* ---------- events ---------- */
function scrollTop() {
  const hdr = document.querySelector("header").offsetHeight;
  const y = $("list").getBoundingClientRect().top + window.scrollY - hdr - 16;
  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}

function setHeaderVar() {
  document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
}
setHeaderVar();
window.addEventListener("resize", setHeaderVar);

$("alpha").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-l]");
  if (!b || b.disabled) return;
  state.letter = b.dataset.l;
  state.page = 1;
  render();
  scrollTop();
});

$("pager").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-page]");
  if (!b || b.disabled) return;
  state.page = parseInt(b.dataset.page, 10);
  render();
  scrollTop();
});

$("list").addEventListener("click", (e) => {
  const el = e.target.closest("[data-speak]");
  if (!el) return;
  speak(el.dataset.speak, el.classList.contains("spk") ? el : null);
});

let qTimer;
$("q").addEventListener("input", (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.q = e.target.value;
    state.page = 1;
    render();
  }, 150);
});
$("clear").addEventListener("click", () => {
  $("q").value = "";
  state.q = "";
  state.page = 1;
  render();
});

window.addEventListener("hashchange", () => { loadHash(); showTab(); });

loadHash();
showTab();
</script>
</body>
</html>
