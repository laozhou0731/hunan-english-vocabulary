 Rx 与 √(RA·RV) 比较，Rx 较大用内接，较小用外接。内接法测量值为 Rx 与 RA 之和，外接法测量值小于 Rx。滑动变阻器有限流和分压两种接法，要求电压从零开始调节时用分压接法。","tip":"电流表内接偏大，外接偏小；选择接法时先估算待测电阻的大致阻值。","ex":[{"q":"用伏安法测得某电阻两端电压 U = 2.4 V，电流 I = 0.40 A。若电流表内阻 RA = 1 Ω，且采用电流表内接法，求该电阻的真实值。","idea":"内接时测量值 R测 = U / I = Rx + RA。","ans":"R测 = 2.4 / 0.40 = 6 Ω，Rx = 6 − 1 = 5 Ω。"},{"q":"待测电阻约为 5 Ω，电压表内阻 RV = 3 kΩ，电流表内阻 RA = 0.5 Ω，应选择电流表内接还是外接？","idea":"比较 Rx 与 √(RA·RV)，√(0.5×3000) ≈ 38.7 Ω。","ans":"Rx ≈ 5 Ω 小于 38.7 Ω，应选择电流表外接法。"}]}]},{"title":"第十三章 磁场（必修第三册）","items":[{"name":"磁感应强度与安培力","desc":"磁感应强度 B 描述磁场的强弱和方向，单位是特斯拉（T）。通电导线与磁场垂直时，安培力 F = BIL；与磁场夹角为 θ 时，F = BIL sin θ。安培力方向由左手定则判断：磁感线穿入手心，四指指向电流方向，拇指所指为安培力方向。","tip":"当导线与磁场平行时安培力为零，此时 B 的大小仍不为零，不能认为磁感应强度为零。","ex":[{"q":"长 L = 0.2 m 的直导线中通有 I = 2 A 的电流，导线与磁感应强度 B = 0.5 T 的匀强磁场垂直，求导线受到的安培力。若导线与磁场成 30° 角，安培力为多大？","idea":"垂直时 F = BIL；夹角 30° 时 F = BIL sin 30°。","ans":"F = 0.5×2×0.2 = 0.2 N；夹角 30° 时 F = 0.2×0.5 = 0.1 N。"},{"q":"在磁感应强度为 0.1 T 的匀强磁场中，一段通电导线受到的安培力为 0.05 N，导线长 0.5 m，且与磁场垂直。求导线中的电流大小。","idea":"由 F = BIL 变形得 I = F / (BL)。","ans":"I = 0.05 / (0.1×0.5) = 1 A。"}]},{"name":"洛伦兹力与带电粒子在磁场中的圆周运动","desc":"运动电荷在磁场中受到的洛伦兹力 f = qvB（v 与 B 垂直时），方向由左手定则判断（正电荷沿四指方向）。洛伦兹力始终与速度垂直，不做功，只改变速度方向。带电粒子垂直磁场进入时做匀速圆周运动，轨道半径 r = mv / (qB)，周期 T = 2πm / (qB)，与速度无关。","tip":"洛伦兹力不改变速度大小，因此粒子在磁场中的动能不变；求圆心时，过入射点作速度的垂线与弦的中垂线交点即为圆心。","ex":[{"q":"质子（质量 1.67×10⁻²⁷ kg，电荷量 1.6×10⁻¹⁹ C）以 v = 1×10⁶ m/s 的速度垂直进入 B = 0.1 T 的匀强磁场，求其轨道半径和运动周期。","idea":"r = mv / (qB)，T = 2πm / (qB)。","ans":"r = 1.67×10⁻²⁷×1×10⁶ / (1.6×10⁻¹⁹×0.1) ≈ 0.10 m；T = 2π×1.67×10⁻²⁷ / (1.6×10⁻²⁰) ≈ 6.6×10⁻⁷ s。"},{"q":"上题中的质子若从宽度 d = 0.05 m 的磁场区域左边界垂直进入，求质子穿出磁场时速度方向偏转的角度（取 r ≈ 0.10 m）。","idea":"几何关系 sin θ = d / r。","ans":"sin θ = 0.05 / 0.10 = 0.5，θ = 30°。"}]},{"name":"质谱仪与回旋加速器","desc":"质谱仪先用电场加速离子 qU = ½mv²，再进入磁场做圆周运动 r = mv / (qB)，由 r 可求出离子的质量或比荷。回旋加速器利用磁场使粒子回旋、电场使粒子加速，粒子最大动能 Ekm = q²B²R² / (2m)，由 D 形盒半径 R 决定，与加速电压无关。","tip":"回旋加速器中交变电场的周期必须与粒子在磁场中的回旋周期相等。","ex":[{"q":"质谱仪中，离子经 U = 1000 V 的电压加速后，进入磁感应强度 B = 0.1 T 的磁场。已知离子质量 m = 3.2×10⁻²⁶ kg，电荷量 q = 1.6×10⁻¹⁹ C，求离子在磁场中做圆周运动的半径。","idea":"由 qU = ½mv² 得 v = √(2qU/m)，再由 r = mv / (qB)，即 r = √(2mU/q) / B。","ans":"r = √(2×3.2×10⁻²⁶×1000 / 1.6×10⁻¹⁹) / 0.1 = √(4×10⁻⁴) / 0.1 = 0.02 / 0.1 = 0.2 m。"},{"q":"回旋加速器的 D 形盒半径 R = 0.5 m，磁感应强度 B = 1.0 T，用它加速质子（q = 1.6×10⁻¹⁹ C，m = 1.67×10⁻²⁷ kg），求质子能获得的最大动能（用 J 和 MeV 表示）。","idea":"Ekm = q²B²R² / (2m)。","ans":"Ekm = (1.6×10⁻¹⁹)² × 1 × 0.25 / (2×1.67×10⁻²⁷) ≈ 1.9×10⁻¹² J，约合 12 MeV。"}]}]},{"title":"第十四章 动量（选择性必修第一册）","items":[{"name":"动量与动量定理","desc":"动量 p = mv，是矢量，方向与速度相同。动量定理：合外力的冲量等于物体动量的变化，即 F·t = mv2 − mv1，冲量 I = Ft。动量定理适用于变力，常用来求平均作用力。","tip":"列动量定理时先规定正方向，速度方向与正方向相反时用负号代入。","ex":[{"q":"质量 0.2 kg 的小球以 5 m/s 的速度水平撞墙，又以 3 m/s 的速度反弹，接触时间为 0.1 s。求墙对球的平均作用力。","idea":"取反弹方向为正，v1 = −5 m/s，v2 = 3 m/s，由 F·t = m(v2 − v1) 求平均力。","ans":"F = 0.2×(3 + 5) / 0.1 = 16 N，方向与反弹方向相同。"},{"q":"质量 60 kg 的人从高 h = 3.2 m 处自由落下，脚接触地面后经 0.4 s 停止运动，取 g = 10 m/s²。求地面对人的平均作用力。","idea":"落地速度 v = √(2gh)；取向上为正，(F − mg)·t = 0 − (−mv)。","ans":"v = √(2×10×3.2) = 8 m/s；(F − 600)×0.4 = 60×8，F = 1200 + 600 = 1800 N。"}]},{"name":"动量守恒定律","desc":"系统不受外力或所受合外力为零时，系统的总动量守恒，即 m1v1 + m2v2 = m1v1' + m2v2'。在某一方向上合外力为零时，该方向动量守恒。碰撞过程中若动能不变，为弹性碰撞；若碰后粘在一起，为完全非弹性碰撞，动能有损失。","tip":"动量守恒列式时速度必须是相对于同一惯性参考系（通常是地面）的速度，且要考虑方向。","ex":[{"q":"甲物体质量 m1 = 2 kg，速度 v1 = 3 m/s；乙物体质量 m2 = 3 kg，速度 v2 = −1 m/s，二者正碰后粘在一起。求碰后共同速度。","idea":"总动量守恒：m1v1 + m2v2 = (m1 + m2)v。","ans":"6 − 3 = 5v，v = 0.6 m/s，方向与甲原来的运动方向相同。"},{"q":"质量 m1 = 1 kg 的小球以 4 m/s 的速度与静止的质量 m2 = 3 kg 的小球发生弹性正碰，求碰后两球的速度。","idea":"弹性碰撞：v1' = (m1 − m2)v1 / (m1 + m2)，v2' = 2m1v1 / (m1 + m2)。","ans":"v1' = (1 − 3)×4 / 4 = −2 m/s，v2' = 2×1×4 / 4 = 2 m/s。验证：动能前后均为 8 J，动量前后均为 4 kg·m/s。"}]},{"name":"碰撞、爆炸与反冲","desc":"碰撞、爆炸、反冲过程内力远大于外力，可近似认为动量守恒。反冲运动是系统内一部分向某一方向运动时，另一部分向相反方向运动，如火箭、喷气式飞机。非弹性碰撞中机械能有损失，损失的机械能转化为内能。","tip":"爆炸或反冲时，系统内各部分速度通常取相对于地面的速度，且方向相反。","ex":[{"q":"质量 M = 2 kg 的炮车静止在水平地面上，水平射出质量 m = 0.05 kg 的炮弹，炮弹对地速度为 600 m/s。求炮车后退的速度大小。","idea":"发射前后系统动量为零：0 = mv − MV。","ans":"V = 0.05×600 / 2 = 15 m/s。"},{"q":"质量 m = 1 kg 的子弹以 v0 = 100 m/s 水平射入静止在光滑水平面上、质量 M = 1 kg 的木块并留在其中，求共同速度及损失的机械能。","idea":"由动量守恒求共同速度；损失的机械能等于初动能减去末动能。","ans":"v = 1×100 / 2 = 50 m/s；ΔE = ½×1×100² − ½×2×50² = 5000 − 2500 = 2500 J。"}]}]},{"title":"第十五章 机械振动（选择性必修第一册）","items":[{"name":"简谐运动的描述","desc":"物体在跟位移大小成正比、方向相反的回复力 F = −kx 作用下的振动，叫简谐运动。振幅 A 是离开平衡位置的最大距离，周期 T 完成一次全振动所用的时间，频率 f = 1/T。弹簧振子的周期 T = 2π√(m / k)。在平衡位置速度最大、加速度为零；在最大位移处速度为零、加速度最大。","tip":"回复力是效果力，由振动系统所受的合力提供，不是一种新的性质力。","ex":[{"q":"弹簧振子的劲度系数 k = 100 N/m，质量 m = 1 kg，振幅 A = 0.1 m。求振子的周期、最大速度和最大加速度。","idea":"T = 2π√(m/k)；最大速度 vmax = ωA；最大加速度 amax = kA / m。","ans":"T = 2π×0.1 ≈ 0.63 s；ω = 10 rad/s，vmax = 10×0.1 = 1 m/s；amax = 100×0.1 / 1 = 10 m/s²。"},{"q":"上述振子在位移 x = 0.05 m 处，求回复力和加速度的大小和方向。","idea":"F = −kx，a = F / m。","ans":"F = −100×0.05 = −5 N，即大小 5 N，方向指向平衡位置；a = −5 m/s²。"}]},{"name":"单摆","desc":"细线下悬挂一个质点，摆角很小（小于 5°）时的运动是简谐运动，周期 T = 2π√(L / g)，与摆球质量和振幅无关。L 为摆长（悬点到摆球重心的距离），g 为当地重力加速度。","tip":"摆长是悬点到摆球重心的距离，不是绳长；周期与摆球质量无关。","ex":[{"q":"摆长 L = 0.98 m 的单摆，在 g = 9.8 m/s² 的地方振动，求其周期。","idea":"T = 2π√(L/g)。","ans":"T = 2π√(0.98/9.8) = 2π×0.316 ≈ 1.99 s ≈ 2.0 s。"},{"q":"某单摆周期为 2 s，若取 g = π² m/s²，求该单摆的摆长。","idea":"由 T = 2π√(L/g) 得 L = gT² / (4π²)。","ans":"L = π²×2² / (4π²) = 1 m。"}]},{"name":"受迫振动与共振","desc":"物体在周期性驱动力作用下的振动叫受迫振动，其振动频率等于驱动力的频率，与物体的固有频率无关。当驱动力频率等于固有频率时，振幅最大，这种现象叫共振。共振的应用如共振筛、转速计；危害如机器共振损坏。","tip":"受迫振动的频率由驱动力决定；振幅大小取决于驱动力频率与固有频率的接近程度。","ex":[{"q":"某振动系统的固有频率为 2 Hz，若驱动力频率为 2.5 Hz，求系统稳定时的振动频率，并判断振幅与驱动力频率为 2 Hz 时相比的大小。","idea":"受迫振动频率等于驱动力频率；驱动力频率越接近固有频率，振幅越大。","ans":"稳定振动频率为 2.5 Hz；驱动频率 2.5 Hz 偏离固有频率 2 Hz，振幅小于驱动频率为 2 Hz 时的振幅（即共振时的振幅）。"},{"q":"某洗衣机固有频率为 4 Hz，脱水时转速为 240 r/min，判断脱水时是否会发生共振。","idea":"240 r/min = 4 r/s，即驱动频率 4 Hz，与固有频率相等。","ans":"驱动频率等于固有频率，会发生共振，机身剧烈振动，需要调整使转速偏离固有频率。"}]}]},{"title":"第十六章 机械波（选择性必修第一册）","items":[{"name":"机械波的描述与传播","desc":"机械波是机械振动在介质中的传播，传播的是振动形式和能量，质点不随波迁移。波长 λ 是相邻两个振动相位相同的质点间的距离，波速 v = λf = λ / T。横波的质点振动方向与波的传播方向垂直；纵波的质点振动方向与传播方向平行。","tip":"波速由介质决定，与波源频率无关；同一列波从一种介质进入另一种介质时，频率不变，波长和波速改变。","ex":[{"q":"一列波的频率为 5 Hz，波长为 0.4 m，求波速。经 0.5 s 后，该波向前传播的距离是多少？","idea":"v = λf；x = vt。","ans":"v = 0.4×5 = 2 m/s；x = 2×0.5 = 1 m。"},{"q":"一列沿 x 轴正方向传播的横波，波长 λ = 4 m，振幅 A = 5 cm，波速 v = 2 m/s。求周期，并求质点在 1 s 内通过的路程。","idea":"T = λ / v；1 s 是半个周期，一个周期内路程为 4A，半个周期为 2A。","ans":"T = 4 / 2 = 2 s；1 s = T/2，路程 s = 2A = 10 cm。"}]},{"name":"波的图像","desc":"波的图像表示某一时刻各质点的位移随平衡位置坐标的分布。判断质点振动方向与波的传播方向的关系，可用“同侧法”或“平移法”：若波沿 x 轴正方向传播，则波峰前面的质点向上振动，后面的质点向下振动。质点从平衡位置运动到最大位移处的最短时间为 T/4。","tip":"图像中质点的振动方向与波的传播方向有关，判断时一定要看清波的传播方向。","ex":[{"q":"一列沿 x 轴正方向传播的简谐横波，某时刻的波形图上，x = 1 m 处的质点恰好位于平衡位置且向上运动，求该时刻前后质点的振动特征；若该波周期为 2 s，求质点从平衡位置运动到波峰所需的最短时间。","idea":"由“同侧法”，正方向传播时向上振动的质点位于波形的后侧下坡处；从平衡位置到波峰的最短时间为 T/4。","ans":"该质点此时正沿 y 轴正方向运动，周期 T = 2 s，从平衡位置运动到波峰最短需要 T/4 = 0.5 s。"},{"q":"上题中，若波速为 2 m/s，求从 t = 0 到 t = 3 s 时间内，波向前传播的距离。","idea":"x = vt。","ans":"x = 2×3 = 6 m。"}]},{"name":"波的干涉、衍射与多普勒效应","desc":"两列频率相同、相位差恒定的相干波相遇时，某点到两波源的路程差为波长整数倍时，该点振动加强；路程差为半波长奇数倍时，振动减弱。衍射是波绕过障碍物继续传播的现象，孔或障碍物的尺寸与波长相差不多或更小时衍射明显。波源与观察者相对运动时，接收频率发生变化，靠近时频率变高，远离时频率变低，即多普勒效应。","tip":"判断加强或减弱时比较的是路程差，而不是位移的大小；振动加强点的振幅最大，但位移也会随时间变化。","ex":[{"q":"两相干波源 S1、S2 的振动步调一致，波长 λ = 1 m。某点 P 到 S1 的距离为 3.5 m，到 S2 的距离为 1.5 m，判断 P 点振动是加强还是减弱。","idea":"计算路程差 |PS1 − PS2| 并与 λ 比较。","ans":"路程差为 2 m = 2λ，为波长整数倍，P 点振动加强。"},{"q":"一列波长为 2 m 的声波，遇到宽为 1 m 的狭缝，能否发生明显衍射？若鸣笛的救护车向你驶近，你听到的音调会如何变化？","idea":"狭缝宽度与波长接近，衍射明显；波源靠近观察者时接收频率增大。","ans":"狭缝宽度 1 m 与波长 2 m 相差不大，衍射明显；救护车驶近时接收频率升高，音调变高。"}]}]},{"title":"第十七章 光（选择性必修第一册）","items":[{"name":"光的折射定律与全反射","desc":"光从一种介质射入另一种介质时，入射角 i 与折射角 r 满足 sin i / sin r = n，n 为介质的折射率，n = c / v。光从光密介质射向光疏介质时，若入射角大于或等于临界角 C，发生全反射，且 sin C = 1 / n。","tip":"全反射只能发生在光从光密介质射向光疏介质的情况下；折射率越大，临界角越小。","ex":[{"q":"光从空气射入某介质，入射角为 60°，折射角为 30°。求该介质的折射率和光在其中的传播速度（c = 3×10⁸ m/s）。","idea":"n = sin i / sin r；v = c / n。","ans":"n = sin 60° / sin 30° = √3 ≈ 1.73；v = 3×10⁸ / 1.73 ≈ 1.73×10⁸ m/s。"},{"q":"某玻璃的折射率 n = 1.5，求光从玻璃射向空气时的临界角。","idea":"sin C = 1 / n。","ans":"sin C = 1/1.5 ≈ 0.667，C ≈ 42°。"}]},{"name":"光的干涉与衍射","desc":"双缝干涉中，相邻亮纹（或暗纹）间距 Δx = Lλ / d，其中 L 为双缝到屏的距离，d 为双缝间距，λ 为光的波长。白光的干涉条纹为彩色条纹，中央为白色亮条纹。单缝衍射条纹中央亮纹最宽最亮，两侧亮纹迅速变暗。","tip":"增大双缝间距会使条纹间距变小，增大屏距或波长则使条纹间距变大。","ex":[{"q":"双缝间距 d = 0.2 mm，双缝到屏的距离 L = 1.0 m，测得相邻亮纹间距 Δx = 3.0 mm，求单色光的波长。","idea":"λ = dΔx / L。","ans":"λ = (0.2×10⁻³ × 3.0×10⁻³) / 1.0 = 6×10⁻⁷ m = 600 nm。"},{"q":"在上述装置中，若将双缝间距减半（其余条件不变），相邻亮纹间距变为多少？","idea":"Δx 与 d 成反比。","ans":"Δx' = 2Δx = 6.0 mm。"}]},{"name":"测量玻璃的折射率与用双缝干涉测光的波长","desc":"插针法测玻璃折射率：将玻璃砖放在白纸上，画出界面，沿直线插两枚大头针 P1、P2，再在另一侧插 P3、P4 使其挡住 P1、P2 的像，画出光路。测出入射角 i 和折射角 r，由 n = sin i / sin r 求折射率。用双缝干涉测光的波长时，先测出 n 个条纹间距的总长度，求出相邻条纹间距 Δx，再由 λ = dΔx / L 求波长。","tip":"玻璃砖的界面要画准，大头针应竖直插且距离适当远，以减小角度测量误差。","ex":[{"q":"用插针法测玻璃砖的折射率，测得入射角 i = 45°，折射角 r = 30°，求该玻璃的折射率（sin 45° ≈ 0.71）。","idea":"n = sin i / sin r。","ans":"n = 0.71 / 0.5 ≈ 1.4。"},{"q":"用双缝干涉测光波长时，测得第 1 条亮纹到第 6 条亮纹中心的距离 x = 10.0 mm，双缝间距 d = 0.25 mm，双缝到屏的距离 L = 0.8 m，求光的波长。","idea":"5 个间距为 x，Δx = x / 5；λ = dΔx / L。","ans":"Δx = 2.0 mm，λ = 0.25×10⁻³ × 2.0×10⁻³ / 0.8 = 6.25×10⁻⁷ m = 625 nm。"}]}]},{"title":"第十八章 电磁感应（选择性必修第二册）","items":[{"name":"楞次定律","desc":"感应电流的磁场总要阻碍引起感应电流的磁通量的变化，这就是楞次定律。应用步骤：明确原磁场方向及磁通量的变化趋势；由楞次定律判断感应电流磁场的方向；由安培定则判断感应电流的方向。导体切割磁感线时可用右手定则判断。","tip":"“阻碍”不是“阻止”，感应电流的磁场只是减缓磁通量的变化，磁通量仍在变化。","ex":[{"q":"条形磁铁的 N 极朝下，竖直向下插入一个闭合线圈，从上往下看，线圈中感应电流的方向如何？","idea":"原磁场方向向下，磁通量增加，感应磁场应向上；由安培定则判断电流方向。","ans":"感应磁场方向向上，从上往下看感应电流沿逆时针方向。"},{"q":"一个矩形闭合线圈向右离开垂直纸面向里的匀强磁场，判断线圈中感应电流的方向（从纸外向纸内看，即从前面看）。","idea":"磁通量（向里）减少，感应磁场应向里，由安培定则判断电流方向。","ans":"感应磁场方向垂直纸面向里，感应电流为顺时针方向。"}]},{"name":"法拉第电磁感应定律","desc":"感应电动势的大小与磁通量的变化率成正比，E = nΔΦ / Δt，n 为线圈匝数。若磁场随时间均匀变化，ΔΦ = SΔB，则 E = nSΔB / Δt。感应电流 I = E / (R + r)，其中 r 为电源内阻。","tip":"磁通量变化率与磁通量本身无关；磁通量为零时，其变化率不一定为零。","ex":[{"q":"匝数 n = 100 的线圈，面积 S = 0.02 m²，磁感应强度在 0.5 s 内由 0 均匀增大到 0.4 T，且线圈平面与磁场垂直。求线圈中的感应电动势。","idea":"E = nS·ΔB / Δt。","ans":"E = 100×0.02×0.4 / 0.5 = 1.6 V。"},{"q":"匝数 n = 50 的线圈，面积 S = 0.1 m²，磁场随时间变化规律为 B = 2 + 3t（T），求线圈中的感应电动势。","idea":"ΔB / Δt 为 B-t 图线的斜率，即 3 T/s。","ans":"E = 50×0.1×3 = 15 V。"}]},{"name":"导体棒切割磁感线","desc":"导体棒垂直切割匀强磁场时，感应电动势 E = BLv。若回路总电阻为 R，感应电流 I = BLv / R，导体棒受到的安培力 F = B²L²v / R，方向与运动方向相反。要使棒匀速运动，外力必须与安培力大小相等，外力的功率 P = Fv 等于电路的电功率。","tip":"切割公式中的 L 是有效长度（与速度和磁场都垂直的长度），v 是与磁场垂直的速度分量。","ex":[{"q":"长 L = 0.5 m 的导体棒以 v = 4 m/s 的速度垂直于磁感应强度 B = 0.2 T 的匀强磁场运动，回路总电阻 R = 0.2 Ω，求感应电动势、感应电流和棒受到的安培力。","idea":"E = BLv；I = E / R；F = BIL。","ans":"E = 0.2×0.5×4 = 0.4 V；I = 0.4 / 0.2 = 2 A；F = 0.2×2×0.5 = 0.2 N，方向与运动方向相反。"},{"q":"在上题中，若导体棒匀速运动，求外力的功率，并验证其等于电路的热功率。","idea":"匀速时外力 F = 0.2 N，P = Fv；热功率 P热 = I²R。","ans":"P = 0.2×4 = 0.8 W；P热 = 2²×0.2 = 0.8 W，二者相等，符合能量守恒。"}]},{"name":"自感与涡流","desc":"当线圈中的电流发生变化时，线圈自身产生的感应电动势阻碍原电流的变化，这种现象叫自感。自感电动势 E = L·ΔI / Δt，L 为自感系数，单位是亨利（H），与线圈的匝数、形状及是否有铁芯有关。块状金属在变化的磁场中会产生感应电流，即涡流，可用于电磁炉、金属探测器，也可用硅钢片叠压来减小涡流损耗。","tip":"自感电动势阻碍的是电流的变化，而不是阻碍电流本身；断电瞬间自感电动势与原电流方向相同。","ex":[{"q":"自感系数 L = 0.5 H 的线圈中，电流在 0.2 s 内由 2 A 均匀减小到 0，求线圈中产生的自感电动势。","idea":"E = L·ΔI / Δt，取绝对值。","ans":"E = 0.5×2 / 0.2 = 5 V。"},{"q":"开关断开瞬间，线圈中的自感电动势的方向与原电流的方向相同还是相反？","idea":"自感电动势阻碍电流的减小。","ans":"与原电流方向相同，即阻碍电流减小，使电流在线圈中逐渐减小，而不是突然消失。"}]}]},{"title":"第十九章 交变电流（选择性必修第二册）","items":[{"name":"正弦交变电流的描述","desc":"线圈在匀强磁场中绕垂直于磁场的轴匀速转动，产生正弦交变电流，最大感应电动势 Em = nBSω，瞬时值 e = Em sin ωt。有效值是根据电流热效应定义的，正弦交流的有效值 E = Em / √2。周期 T = 2π / ω，频率 f = 1 / T。我国民用电压 220 V 指的是有效值。","tip":"电容器的耐压值指的是最大值；用电器的额定电压、交流电表的示数均为有效值。","ex":[{"q":"线圈匝数 n = 100，面积 S = 0.05 m²，磁感应强度 B = 0.2 T，角速度 ω = 100π rad/s，求最大感应电动势和有效值。","idea":"Em = nBSω；E = Em / √2。","ans":"Em = 100×0.2×0.05×100π ≈ 314 V；E = 314 / √2 ≈ 222 V。"},{"q":"某交变电压的瞬时值表达式为 u = 311 sin(100πt) V，求其频率和有效值。","idea":"ω = 2πf，有效值 U = Um / √2。","ans":"f = 100π / (2π) = 50 Hz；有效值 U = 311 / √2 ≈ 220 V。"}]},{"name":"变压器","desc":"理想变压器的电压与匝数成正比，U1 / U2 = n1 / n2；电流与匝数成反比，I1 / I2 = n2 / n1；输入功率等于输出功率，P1 = P2。变压器只能改变交变电流的电压和电流，不能改变频率。","tip":"变压器的输出电压由输入电压和匝数比决定，与负载无关；输出电流由负载决定。","ex":[{"q":"理想变压器原线圈匝数 n1 = 1100，副线圈匝数 n2 = 55，原线圈接 220 V 交流电，求副线圈输出电压。","idea":"U2 = U1 · n2 / n1。","ans":"U2 = 220 × 55 / 1100 = 11 V。"},{"q":"在上题中，副线圈接一个 11 Ω 的电阻，求原、副线圈中的电流和输入功率。","idea":"I2 = U2 / R；I1 = I2 · n2 / n1；P1 = U1I1。","ans":"I2 = 11 / 11 = 1 A；I1 = 1 × 55 / 1100 = 0.05 A；P1 = 220 × 0.05 = 11 W，与输出功率 P2 = 11 W 相等。"}]},{"name":"远距离输电","desc":"输送电功率 P = UI，输电线上的电流 I = P / U，线路损失的功率 ΔP = I²R，线路损失的电压 ΔU = IR。在输送功率一定的条件下，提高输电电压可以减小电流，从而大大减小线路损失。用户得到的电压 U用 = U − ΔU。","tip":"计算线路损失时，要用输电线上的电流和输电线的电阻，而不是用用户端的电压。","ex":[{"q":"输送功率 P = 100 kW，输电电压 U = 10 kV，输电线总电阻 R = 10 Ω，求输电线上的电流和线路损失的功率。","idea":"I = P / U；ΔP = I²R。","ans":"I = 100×10³ / (10×10³) = 10 A；ΔP = 10²×10 = 1000 W = 1 kW。"},{"q":"保持输送功率和输电线电阻不变，将输电电压提高到 100 kV，求此时线路损失的功率。","idea":"I' = P / U'，再求 ΔP' = I'²R。","ans":"I' = 100×10³ / (100×10³) = 1 A；ΔP' = 1²×10 = 10 W，为原来的 1/100。"}]},{"name":"传感器","desc":"传感器是将非电学量（如温度、光照、压力、磁场）转换为电学量（如电压、电流、电阻）的元件。热敏电阻：半导体热敏电阻温度升高时阻值减小，金属热电阻温度升高时阻值增大。光敏电阻：光照增强时阻值减小。霍尔元件可将磁感应强度转换为电压。","tip":"传感器的工作原理是把被测量的变化转化为电路中电阻、电压或电流的变化，再通过电路进行控制或显示。","ex":[{"q":"常用的 NTC 热敏电阻，当温度升高时其阻值如何变化？","idea":"NTC 是负温度系数热敏电阻，电阻随温度升高而减小。","ans":"阻值减小，因此可用来测量温度或作为温度控制元件。"},{"q":"光敏电阻与电流表串联接入电路，随着光照增强，电流表的示数如何变化？（其他条件不变）","idea":"光照增强时光敏电阻阻值减小，由 I = U / R 分析。","ans":"光敏电阻阻值减小，电路总电阻减小，电流增大，电流表示数增大。"}]}]},{"title":"第二十章 分子动理论（选择性必修第三册）","items":[{"name":"分子大小与布朗运动","desc":"分子非常小，直径数量级约为 10⁻¹⁰ m。阿伏伽德罗常数 NA ≈ 6.02×10²³ mol⁻¹，是 1 mol 物质所含的粒子数。油膜法估测分子直径：油酸在水面上形成单分子油膜，d = V / S。布朗运动是悬浮在液体中的固体颗粒的无规则运动，反映了液体分子的无规则热运动，颗粒越小、温度越高，布朗运动越明显。","tip":"布朗运动不是分子的运动，而是由液体分子撞击的不平衡引起的颗粒运动，颗粒本身不是分子。","ex":[{"q":"用油膜法估测分子直径，一滴油酸酒精溶液中纯油酸的体积为 V = 5×10⁻¹² m³，形成的单分子油膜面积为 S = 0.2 m²，求油酸分子的直径。","idea":"单分子油膜的厚度即分子直径，d = V / S。","ans":"d = 5×10⁻¹² / 0.2 = 2.5×10⁻¹¹ m。"},{"q":"水的摩尔质量为 18 g/mol，阿伏伽德罗常数 NA = 6.0×10²³ mol⁻¹，求 1 g 水中所含的水分子数。","idea":"1 g 水的物质的量 n = 1/18 mol，分子数 N = n·NA。","ans":"N = (1/18) × 6.0×10²³ ≈ 3.3×10²² 个。"}]},{"name":"分子力与分子势能","desc":"分子间同时存在引力和斥力，且都随分子间距离增大而减小，但斥力减小得更快。当分子间距离 r = r0（约 10⁻¹⁰ m）时，引力与斥力大小相等，分子力为零，分子势能最小。r > r0 时分子力表现为引力，r < r0 时表现为斥力。取分子相距无穷远时分子势能为零。","tip":"分子力做正功，分子势能减小；克服分子力做功，分子势能增大。分子势能最小值在 r = r0 处取得。","ex":[{"q":"两个分子从相距较远（r > r0）开始逐渐靠近，直到 r = r0，分子力做正功还是负功？分子势能如何变化？","idea":"在 r > r0 区域分子力为引力，引力与位移方向相同，做正功。","ans":"分子力做正功，分子势能减小。"},{"q":"两个分子继续从 r = r0 靠近到 r < r0，分子势能如何变化？","idea":"此时分子力为斥力，靠近时斥力做负功。","ans":"斥力做负功，分子势能增大。"}]}]},{"title":"第二十一章 气体（选择性必修第三册）","items":[{"name":"气体的等温变化（玻意耳定律）","desc":"一定质量的理想气体，温度不变时，压强 p 与体积 V 成反比，pV = 常量，即 p1V1 = p2V2。压强单位常用帕（Pa）、标准大气压（atm），1 atm = 1.013×10⁵ Pa。等温过程中，体积减小时压强增大，体积增大时压强减小。","tip":"应用玻意耳定律时，两端的压强要用相同单位，体积可用相同单位的数值直接代入。","ex":[{"q":"一定质量的理想气体，压强为 1 atm 时体积为 10 L，保持温度不变，将其压缩到 4 L，求此时的压强。","idea":"p1V1 = p2V2。","ans":"p2 = 1×10 / 4 = 2.5 atm。"},{"q":"注射器内封闭着体积为 20 mL、压强为 1.0×10⁵ Pa 的空气，保持温度不变，将体积压缩为 16 mL，求此时的压强。","idea":"等温过程 p1V1 = p2V2。","ans":"p2 = 1.0×10⁵ × 20 / 16 = 1.25×10⁵ Pa。"}]},{"name":"气体的等压与等容变化（盖-吕萨克定律与查理定律）","desc":"等压变化：一定质量的理想气体，压强不变时，V/T = 常量，即 V1/T1 = V2/T2。等容变化：体积不变时，p/T = 常量，即 p1/T1 = p2/T2。温度必须用热力学温度 T（单位 K）计算，T = t + 273。","tip":"代入公式时温度一定要用开尔文温度，不能直接用摄氏温度。","ex":[{"q":"一定质量的气体在等压下，温度从 300 K 升高到 360 K，体积原来为 300 mL，求变化后的体积。","idea":"等压过程 V1/T1 = V2/T2。","ans":"V2 = 300×360 / 300 = 360 mL。"},{"q":"一瓶气体在 27 ℃ 时压强为 1.0×10⁵ Pa，保持体积不变，升温到 57 ℃，求此时的压强。","idea":"T1 = 300 K，T2 = 330 K，等容 p1/T1 = p2/T2。","ans":"p2 = 1.0×10⁵ × 330 / 300 = 1.1×10⁵ Pa。"}]},{"name":"理想气体状态方程与气体压强的微观解释","desc":"一定质量理想气体的状态方程为 pV/T = 常量，即 p1V1/T1 = p2V2/T2。气体压强是大量气体分子频繁撞击器壁产生的持续作用力的平均效果，与分子的平均动能（由温度决定）和单位体积内的分子数（由体积决定）有关。","tip":"微观解释中，温度升高指分子平均动能增大，撞击力增大；体积减小指单位体积内分子数增多，碰撞频率增大。","ex":[{"q":"一定质量的理想气体，初态 p1 = 1.0×10⁵ Pa，V1 = 2 L，T1 = 300 K；末态 p2 = 2.0×10⁵ Pa，V2 = 3 L，求末态温度。","idea":"由 p1V1/T1 = p2V2/T2 得 T2 = p2V2T1 / (p1V1)。","ans":"T2 = 2×3×300 / (1×2) = 900 K。"},{"q":"竖直放置的气缸内用活塞封闭一定质量的气体，活塞质量不计、可自由滑动，缸内气柱长 h1 = 20 cm，温度为 300 K。对气体缓慢加热到 360 K，求活塞上升后的气柱长度（压强保持不变）。","idea":"活塞质量不计，缸内压强始终等于大气压，属于等压变化。","ans":"h2 = 20 × 360 / 300 = 24 cm。"}]}]},{"title":"第二十二章 热力学定律（选择性必修第三册）","items":[{"name":"内能与热力学第一定律","desc":"物体内所有分子的动能与势能之和叫内能，理想气体的内能只与温度有关。热力学第一定律：ΔU = W + Q，其中 W 为外界对系统做的功，Q 为系统吸收的热量，ΔU 为内能的变化量。系统对外做功时 W 为负，放热时 Q 为负。","tip":"各个符号的正负不能弄错：外界对气体做功取正，气体对外做功取负；吸热取正，放热取负。","ex":[{"q":"一定质量的气体，外界对其做功 W = 300 J，同时气体向外放出热量 100 J，求气体内能的变化量。","idea":"W = +300 J，Q = −100 J，ΔU = W + Q。","ans":"ΔU = 300 + (−100) = 200 J，内能增加 200 J。"},{"q":"气体膨胀对外界做功 200 J，同时从外界吸收热量 300 J，求其内能的变化量。","idea":"对外做功 W = −200 J，吸热 Q = +300 J。","ans":"ΔU = −200 + 300 = 100 J，内能增加 100 J。"}]},{"name":"热力学第二定律与能量守恒","desc":"能量守恒定律是自然界普遍遵循的规律。热力学第二定律有多种表述：热量不能自发地从低温物体传到高温物体；不可能从单一热源吸热全部用来做功而不产生其他影响；第二类永动机不可能制成。热机效率 η = W / Q1 = (Q1 − Q2) / Q1，卡诺热机的最大效率 η = 1 − T2 / T1（T 为热力学温度）。","tip":"热机效率永远小于 1；第一类永动机违背能量守恒，第二类永动机违背热力学第二定律。","ex":[{"q":"某热机从高温热源吸收热量 Q1 = 1000 J，向低温热源放出热量 Q2 = 600 J，求该热机的效率。","idea":"对外做功 W = Q1 − Q2，η = W / Q1。","ans":"W = 400 J，η = 400 / 1000 = 40%。"},{"q":"一卡诺热机工作于高温热源 T1 = 500 K 与低温热源 T2 = 300 K 之间，求它的最大效率。","idea":"η = 1 − T2 / T1。","ans":"η = 1 − 300 / 500 = 40%。"}]}]},{"title":"第二十三章 原子结构与波粒二象性（选择性必修第三册）","items":[{"name":"光电效应与光子说","desc":"光照射金属时，电子从金属表面逸出，称为光电效应。光子能量 E = hν，h 为普朗克常量，约为 6.63×10⁻³⁴ J·s。爱因斯坦光电效应方程：Ekm = hν − W0，W0 为逸出功。截止频率 ν0 = W0 / h，入射光频率低于截止频率时不能发生光电效应。","tip":"光电效应的瞬时性、截止频率和光电子最大初动能与光强无关，光强只影响饱和光电流的大小。","ex":[{"q":"某金属的逸出功 W0 = 2.0 eV，用能量为 3.5 eV 的光子照射，求光电子的最大初动能和该金属的截止频率（h = 4.14×10⁻¹⁵ eV·s）。","idea":"Ekm = hν − W0；ν0 = W0 / h。","ans":"Ekm = 3.5 − 2.0 = 1.5 eV；ν0 = 2.0 / (4.14×10⁻¹⁵) ≈ 4.8×10¹⁴ Hz。"},{"q":"上述金属用波长为 300 nm 的紫外光照射，求光电子的最大初动能（取 hc = 1240 eV·nm）。","idea":"光子能量 E = hc / λ，再由 Ekm = E − W0。","ans":"E = 1240 / 300 ≈ 4.13 eV，Ekm = 4.13 − 2.0 ≈ 2.1 eV。"}]},{"name":"玻尔理论与能级跃迁","desc":"玻尔理论的要点：原子只能处于一系列不连续的能量状态（定态）；电子从高能级 Em 跃迁到低能级 En 时放出光子，hν = Em − En；反之吸收光子。氢原子能级 En = −13.6 / n² eV，基态 n = 1 能量为 −13.6 eV。大量处于 n 能级的氢原子向低能级跃迁时，最多可辐射 n(n−1)/2 种频率的光子。","tip":"电离是指电子跃迁到 n = ∞ 能级，基态电离需要吸收 13.6 eV 的能量；吸收光子能量必须恰好等于能级差，而电子碰撞则不受此限制。","ex":[{"q":"氢原子从 n = 3 能级跃迁到 n = 2 能级时，放出光子的能量为多少？（E2 = −3.4 eV，E3 = −1.51 eV）","idea":"hν = E3 − E2。","ans":"hν = −1.51 − (−3.4) = 1.89 eV。"},{"q":"一群处于 n = 4 能级的氢原子向低能级跃迁，最多能发出几种不同频率的光？基态氢原子至少吸收多少能量才能电离？","idea":"大量原子的辐射种数为 C(4,2) = 6；电离需要吸收的能量等于 0 − E1。","ans":"最多发出 6 种不同频率的光；电离能为 13.6 eV。"}]},{"name":"康普顿效应与物质波","desc":"康普顿效应：X 射线或伽马射线被物质散射后，波长变长，证明光子具有动量。光子动量 p = h / λ。法国物理学家德布罗意提出实物粒子也具有波动性，其物质波波长 λ = h / p。电子衍射实验证实了物质波的存在。","tip":"光的波动性和粒子性是统一的，光子的能量和动量与波长、频率相联系，但不要把光子当作经典粒子。","ex":[{"q":"电子的动量 p = 1.0×10⁻²⁴ kg·m/s，求其德布罗意波长（h = 6.63×10⁻³⁴ J·s）。","idea":"λ = h / p。","ans":"λ = 6.63×10⁻³⁴ / 1.0×10⁻²⁴ = 6.63×10⁻¹⁰ m。"},{"q":"波长为 500 nm 的光子，其动量为多少？","idea":"p = h / λ，注意 500 nm = 5×10⁻⁷ m。","ans":"p = 6.63×10⁻³⁴ / (5×10⁻⁷) ≈ 1.3×10⁻²⁷ kg·m/s。"}]}]},{"title":"第二十四章 原子核（选择性必修第三册）","items":[{"name":"天然放射现象与衰变","desc":"天然放射现象说明原子核具有复杂结构。α 衰变放出氦核，质量数减少 4，电荷数减少 2；β 衰变放出电子，质量数不变，电荷数增加 1；γ 射线是伴随衰变放出的光子，不改变原子核的质量数和电荷数。衰变过程遵循质量数守恒和电荷数守恒。","tip":"写衰变方程时，上下标分别守恒；β 粒子是电子，写作 0 −1 e，注意不要和中子 1 0 n 混淆。","ex":[{"q":"写出 238 92 U 经一次 α 衰变的核反应方程。","idea":"质量数减 4，电荷数减 2，α 粒子为 4 2 He。","ans":"238 92 U → 234 90 Th + 4 2 He。"},{"q":"写出 234 90 Th 经一次 β 衰变的核反应方程。","idea":"质量数不变，电荷数加 1，β 粒子为电子 0 −1 e。","ans":"234 90 Th → 234 91 Pa + 0 −1 e。"}]},{"name":"半衰期","desc":"放射性元素的原子核有半数发生衰变所需的时间，叫半衰期 T。剩余质量 m = m0 (1/2)^(t/T)。半衰期由原子核内部结构决定，与温度、压强以及是否形成化合物无关。对大量原子核，半衰期是统计规律，对个别原子核没有意义。","tip":"计算时要先确定经历了几个半衰期，t/T 为整数时最简单；不要把半衰期与衰变时间混淆。","ex":[{"q":"某放射性元素的半衰期为 3.8 天，初始质量为 80 g，经过 7.6 天后剩余多少克？","idea":"7.6 天为 2 个半衰期，m = m0 (1/2)²。","ans":"m = 80 × 1/4 = 20 g。"},{"q":"碳-14 的半衰期为 5730 年，某古木样品中碳-14 的含量为原来的 25%，求该古木距今的年代。","idea":"25% = (1/2)²，即经过 2 个半衰期。","ans":"t = 2 × 5730 = 11460 年。"}]},{"name":"核反应方程与质能方程","desc":"核反应过程中质量数与电荷数守恒。质能方程 E = mc²，核反应释放的能量 ΔE = Δm c²，质量亏损 Δm 为反应前后质量之差。在原子物理中常用 1 u = 931.5 MeV/c² 的关系，即质量亏损 1 u 对应释放约 931.5 MeV 的能量。","tip":"核能计算中注意单位：用 u 时直接乘以 931.5 MeV；用 kg 时要用 c = 3×10⁸ m/s 计算 J。","ex":[{"q":"核反应 2 1 H + 3 1 H → 4 2 He + 1 0 n 中，已知质量分别为 m(H-2) = 2.0141 u，m(H-3) = 3.0161 u，m(He-4) = 4.0026 u，m(n) = 1.0087 u，求该反应释放的能量。","idea":"Δm = 反应前质量之和 − 反应后质量之和；ΔE = Δm × 931.5 MeV。","ans":"Δm = (2.0141 + 3.0161) − (4.0026 + 1.0087) = 0.0189 u，ΔE = 0.0189 × 931.5 ≈ 17.6 MeV。"},{"q":"某核反应释放的能量为 2.0 MeV，求对应的质量亏损（以 u 表示）。","idea":"Δm = ΔE / 931.5 MeV/u。","ans":"Δm = 2.0 / 931.5 ≈ 2.1×10⁻³ u。"}]},{"name":"核裂变与核聚变","desc":"重核裂变：重核（如 235 92 U）俘获中子后分裂为两个中等质量的核，并释放中子和大量能量，每个铀核裂变释放约 200 MeV 能量，可实现链式反应，用于核电站和原子弹。轻核聚变：两个轻核结合成质量较大的核，并释放大量能量，如氘氚聚变，是太阳能量的来源，目前受控热核聚变仍在研究中。","tip":"裂变与聚变都释放能量，原因都是核子的平均结合能增大、发生质量亏损；区分二者要看反应物是重核还是轻核。","ex":[{"q":"1 kg 的 235 92 U 全部发生裂变，每个铀核裂变释放约 200 MeV 能量，阿伏伽德罗常数 NA = 6.02×10²³ mol⁻¹，求释放的总能量（1 eV = 1.6×10⁻¹⁹ J）。","idea":"原子数 N = (1000 / 235) × NA，总能量 E = N × 200 MeV。","ans":"N ≈ 2.56×10²⁴，E = 2.56×10²⁴ × 2.0×10⁸ × 1.6×10⁻¹⁹ ≈ 8.2×10¹³ J。"},{"q":"写出 235 92 U 俘获一个中子后发生裂变，生成 141 56 Ba 和 92 36 Kr 并放出 3 个中子的核反应方程。","idea":"质量数 235 + 1 = 141 + 92 + 3，电荷数 92 = 56 + 36。","ans":"235 92 U + 1 0 n → 141 56 Ba + 92 36 Kr + 3 1 0 n。"}]}]}],"chemistry":[{"title":"第一章 物质及其变化","items":[{"name":"物质的分类","desc":"物质可按组成和性质分类。纯净物由一种成分组成，混合物由两种或两种以上物质混合而成。纯净物分为单质（如 O2、Fe）和化合物（如 H2O、NaCl）；化合物又可分为氧化物、酸、碱、盐。氧化物按性质可分为酸性氧化物（如 CO2、SO3，与碱反应生成盐和水）、碱性氧化物（如 Na2O、CaO，与酸反应生成盐和水）、两性氧化物（如 Al2O3）和不成盐氧化物（如 CO、NO）。常用树状分类法和交叉分类法进行分类。","tip":"酸性氧化物不一定是非金属氧化物（如 Mn2O7），碱性氧化物一定是金属氧化物。","ex":[{"q":"下列各组物质中，前者属于纯净物、后者属于混合物的是（ ）A. 胆矾、空气 B. 生铁、氧化铁 C. 氯水、液氯 D. 盐酸、冰醋酸","idea":"纯净物只含一种成分，混合物含多种成分。胆矾是 CuSO4·5H2O，属于纯净物。","ans":"选 A。胆矾为纯净物，空气为混合物，符合题意。B 中生铁是混合物、氧化铁是纯净物，前后顺序颠倒；C 中氯水是混合物、液氯是纯净物，顺序颠倒；D 中盐酸是混合物、冰醋酸是纯净物，顺序颠倒。"},{"q":"Na2O、CO2、Al2O3 分别属于哪类氧化物？写出 Na2O 与盐酸反应的化学方程式。","idea":"根据氧化物与酸、碱反应的性质分类；碱性氧化物与酸反应生成盐和水。","ans":"Na2O 为碱性氧化物，CO2 为酸性氧化物，Al2O3 为两性氧化物。Na2O + 2HCl = 2NaCl + H2O。"}]},{"name":"分散系与胶体","desc":"一种或几种物质分散到另一种物质中形成的体系称为分散系，被分散的物质是分散质，容纳分散质的物质是分散剂。按分散质粒子直径可分为溶液（<1 nm）、胶体（1–100 nm）和浊液（>100 nm）。胶体具有丁达尔效应、电泳现象，遇电解质或加热可聚沉。实验室制备 Fe(OH)3 胶体：向沸水中逐滴加入饱和 FeCl3 溶液，煮沸至溶液呈红褐色即停止加热，化学方程式为 FeCl3 + 3H2O =（△）Fe(OH)3（胶体）+ 3HCl。","tip":"制备 Fe(OH)3 胶体时不能长时间加热，否则胶体会聚沉生成 Fe(OH)3 沉淀；不能用 FeCl3 与 NaOH 溶液直接混合制备胶体。","ex":[{"q":"如何用简单方法区分 FeCl3 溶液与 Fe(OH)3 胶体？","idea":"胶体具有丁达尔效应，溶液没有。","ans":"用一束光分别照射两种液体，能观察到光亮通路（丁达尔效应）的是 Fe(OH)3 胶体，无此现象的是 FeCl3 溶液。"},{"q":"向 Fe(OH)3 胶体中逐滴加入稀硫酸，观察到的现象是什么？请解释。","idea":"电解质使胶体聚沉，随后 H2SO4 溶解 Fe(OH)3 沉淀。","ans":"先出现红褐色沉淀，继续滴加稀硫酸，沉淀溶解，溶液变为棕黄色。原因：硫酸电离出的离子使胶体聚沉；随后 Fe(OH)3 + 3H+ = Fe3+ + 3H2O，沉淀溶解。"}]},{"name":"电解质与非电解质","desc":"在水溶液中或熔融状态下能导电的化合物称为电解质，如酸、碱、盐和金属氧化物；在上述两种状态下都不能导电的化合物称为非电解质，如蔗糖、酒精、CO2、NH3。单质和混合物既不是电解质也不是非电解质。电解质导电的前提是电离出自由移动的离子，电离方程式如 NaCl = Na+ + Cl-。","tip":"CO2、NH3、SO2 本身不电离，属于非电解质；它们的水溶液导电是因为生成了 H2CO3、NH3·H2O、H2SO3 等电解质。BaSO4 难溶但熔融时能完全电离，属于强电解质。","ex":[{"q":"下列物质中属于电解质的是（ ）A. 铜 B. 二氧化碳 C. 硫酸钡 D. 盐酸","idea":"电解质必须是化合物，且自身能电离出离子。","ans":"选 C。铜是单质，既非电解质也非非电解质；CO2 是非电解质；硫酸钡熔融时能导电，属于电解质；盐酸是混合物。"},{"q":"写出下列物质在水溶液中的电离方程式：（1）Ba(OH)2（2）NaHSO4（3）NaHCO3。","idea":"强酸的酸式盐在水溶液中完全电离出 H+；弱酸的酸式酸根不完全拆分。","ans":"（1）Ba(OH)2 = Ba2+ + 2OH-；（2）NaHSO4 = Na+ + H+ + SO4^2-；（3）NaHCO3 = Na+ + HCO3-。"}]},{"name":"离子方程式的书写与正误判断","desc":"离子方程式用实际参加反应的离子符号表示。书写步骤为：写出化学方程式，拆成离子形式，删去两边相同的离子，检查原子守恒和电荷守恒。强酸、强碱和可溶性盐要拆成离子；沉淀、气体、水、弱电解质、单质和氧化物保留化学式。","tip":"只有易溶于水的强电解质才拆分；离子方程式必须同时满足原子守恒和电荷守恒。","ex":[{"q":"写出 Ba(OH)2 溶液与稀硫酸反应的离子方程式。","idea":"拆出 Ba²⁺、OH⁻、H⁺、SO4²⁻，BaSO4 为沉淀，水是产物；检查电荷守恒。","ans":"Ba²⁺ + 2OH⁻ + 2H⁺ + SO4²⁻ = BaSO4↓ + 2H2O。左边电荷总数为 0，右边也为 0。"},{"q":"写出碳酸钙与稀盐酸反应的离子方程式。","idea":"CaCO3 是难溶物，保留化学式；HCl、CaCl2 拆成离子。","ans":"CaCO3 + 2H⁺ = Ca²⁺ + H2O + CO2↑。"}]},{"name":"氧化还原反应的概念与判断","desc":"反应前后元素化合价有升降的反应是氧化还原反应。化合价升高、失去电子的物质被氧化，作还原剂；化合价降低、得到电子的物质被还原，作氧化剂。","tip":"可用口诀记忆：升失氧化还原剂，降得还原氧化剂。判断时先标出各元素的化合价。","ex":[{"q":"反应 Fe + CuSO4 = FeSO4 + Cu 中，哪种元素的化合价升高？哪种物质是氧化剂？","idea":"分别标出反应前后 Fe、Cu 的化合价，看升降情况。","ans":"Fe 由 0 价升到 +2 价，被氧化，Fe 是还原剂；Cu 由 CuSO4 中的 +2 价降到 0 价，CuSO4 中的 Cu²⁺ 是氧化剂。"},{"q":"在反应 2KMnO4 + 16HCl(浓) = 2KCl + 2MnCl2 + 5Cl2↑ + 8H2O 中，氧化剂与还原剂的物质的量之比是多少？","idea":"氧化剂是得电子的 KMnO4，还原剂是失电子的 HCl；但参与反应的 16 个 HCl 中只有 10 个被氧化。","ans":"KMnO4 为氧化剂，2 mol 被还原；HCl 中 10 mol 被氧化为 Cl2，为还原剂。氧化剂与还原剂物质的量之比为 2:10 = 1:5。"}]},{"name":"电子转移的计算（得失电子守恒）","desc":"氧化还原反应中，氧化剂得到的电子总数等于还原剂失去的电子总数，这就是得失电子守恒。它是配平方程式和进行定量计算的依据。","tip":"计算时先找出变价元素，算出每个原子的化合价变化值，再乘以参加反应的原子个数。","ex":[{"q":"反应 Cu + 4HNO3(浓) = Cu(NO3)2 + 2NO2↑ + 2H2O 中，若有 0.1 mol Cu 参加反应，转移电子多少 mol？生成 NO2 在标准状况下的体积是多少？","idea":"Cu 从 0 价升到 +2 价，由 Cu 的物质的量算电子数；再由电子守恒求 NO2 的物质的量（N 从 +5 降到 +4，每个 NO2 得 1 个电子）。","ans":"Cu 失去电子 0.1 × 2 = 0.2 mol，即转移 0.2 mol 电子。由电子守恒，生成 NO2 为 0.2 mol，标准状况下体积为 0.2 × 22.4 = 4.48 L。"},{"q":"用单线桥表示 Cu + 4HNO3(浓) = Cu(NO3)2 + 2NO2↑ + 2H2O 的电子转移情况，并计算生成 0.2 mol NO2 时转移的电子数。","idea":"Cu 从 0 价升到 +2 价，每个 Cu 失去 2 个电子；N 从 +5 降到 +4，每个 NO2 得到 1 个电子。","ans":"电子由 Cu 指向 HNO3 中的 N，共转移 2e-。生成 0.2 mol NO2 时，转移电子 0.2 mol。"}]}]},{"title":"第二章 钠及其化合物与焰色试验","items":[{"name":"钠及其化合物","desc":"钠是活泼金属，与水剧烈反应：2Na + 2H2O = 2NaOH + H2↑，通常保存在煤油中。过氧化钠与水、CO2 反应都生成氧气：2Na2O2 + 2H2O = 4NaOH + O2↑，2Na2O2 + 2CO2 = 2Na2CO3 + O2。加热碳酸氢钠分解：2NaHCO3 =(△) Na2CO3 + H2O + CO2↑。","tip":"Na2O2 中氧元素为 −1 价；Na2CO3 比 NaHCO3 稳定，可用加热法除去 Na2CO3 中的 NaHCO3 但不能用于除去 NaHCO3 中的 Na2CO3。","ex":[{"q":"将 7.8 g Na2O2 与足量水反应，标准状况下生成 O2 的体积是多少？","idea":"先求 Na2O2 的物质的量，再由方程式 2Na2O2 : O2 = 2 : 1 求 O2 的物质的量。","ans":"M(Na2O2) = 78 g/mol，n = 7.8 / 78 = 0.1 mol。2Na2O2 + 2H2O = 4NaOH + O2↑，生成 O2 为 0.05 mol，体积为 0.05 × 22.4 = 1.12 L。"},{"q":"取 Na2CO3 与 NaHCO3 的混合物 10 g，加热至质量不再变化，剩余固体 6.9 g。求原混合物中 NaHCO3 的质量。","idea":"只有 NaHCO3 分解，减少的质量就是分解放出的 H2O 和 CO2；利用 2NaHCO3 减少的质量 62 g 列比例。","ans":"2NaHCO3 = Na2CO3 + H2O + CO2↑，每 2 mol（168 g）NaHCO3 分解减少 62 g。减少质量为 10 − 6.9 = 3.1 g，则 NaHCO3 质量为 3.1 × 168 / 62 = 8.4 g。"}]},{"name":"焰色试验","desc":"许多金属或它们的化合物灼烧时火焰呈现特征颜色，称为焰色试验，属于物理变化。钠呈黄色，钾呈紫色（需透过蓝色钴玻璃观察，以滤去钠的黄光）。操作步骤：洗（用稀盐酸洗涤铂丝或铁丝）→烧（灼烧至与原火焰颜色相同）→蘸（蘸取待测物）→烧（观察火焰颜色）。焰色试验用于检验元素的存在。","tip":"洗涤铂丝应使用盐酸而不用硫酸，因为盐酸的氯化物易挥发；观察钾元素必须透过蓝色钴玻璃。","ex":[{"q":"某溶液做焰色试验时火焰呈黄色，能否确定该溶液中一定含有 K+？","idea":"钠的黄色火焰会遮盖钾的紫色火焰，需透过蓝色钴玻璃才能观察钾。","ans":"不能确定。黄色火焰说明含有 Na+，若要检验 K+，需透过蓝色钴玻璃观察火焰是否呈紫色。"},{"q":"下列关于焰色试验的说法正确的是（ ）A. 焰色试验属于化学变化 B. 观察钾的焰色需透过蓝色钴玻璃 C. 可用稀硫酸洗涤铂丝 D. 焰色试验只能检验金属单质","idea":"焰色试验是元素的性质，属于物理变化；需要滤去钠的干扰；洗涤铂丝用盐酸。","ans":"选 B。焰色试验是物理变化（A 错）；钾的紫色需透过蓝色钴玻璃观察（B 对）；应使用盐酸洗涤（C 错）；焰色试验可检验金属元素的化合物（D 错）。"}]},{"name":"碳酸钠与碳酸氢钠","desc":"Na2CO3 俗称纯碱或苏打，NaHCO3 俗称小苏打，二者均易溶于水，但 NaHCO3 的溶解度小于 Na2CO3。热稳定性：Na2CO3 > NaHCO3，2NaHCO3 =（△）Na2CO3 + H2O + CO2↑。与盐酸反应：Na2CO3 + 2HCl = 2NaCl + H2O + CO2↑；NaHCO3 + HCl = NaCl + H2O + CO2↑，NaHCO3 反应更剧烈。二者水溶液都呈碱性，Na2CO3 溶液碱性更强。","tip":"与盐酸反应时，向 Na2CO3 中滴加盐酸先生成 NaHCO3，盐酸过量后才放出 CO2；而将 Na2CO3 滴入盐酸则立即放出 CO2。","ex":[{"q":"如何鉴别 Na2CO3 与 NaHCO3 固体？写出有关化学方程式。","idea":"利用 NaHCO3 受热分解生成 CO2 的性质，并利用澄清石灰水检验 CO2。","ans":"将固体加热，能使澄清石灰水变浑浊的是 NaHCO3：2NaHCO3 =（△）Na2CO3 + H2O + CO2↑，CO2 + Ca(OH)2 = CaCO3↓ + H2O；加热无变化的是 Na2CO3。"},{"q":"向 100 mL 1 mol/L Na2CO3 溶液中逐滴加入 1 mol/L 盐酸 150 mL，计算标准状况下产生 CO2 的体积。","idea":"分两步反应：先 CO3^2- + H+ = HCO3-，再 HCO3- + H+ = H2O + CO2↑。先算 H+ 与 CO3^2- 的量。","ans":"n(Na2CO3) = 0.1 mol，n(HCl) = 0.15 mol。第一步消耗 0.1 mol HCl 生成 0.1 mol NaHCO3，剩余 0.05 mol HCl 与 NaHCO3 反应生成 0.05 mol CO2。V = 0.05 × 22.4 = 1.12 L。"}]}]},{"title":"第三章 铝、铁及其化合物","items":[{"name":"铝及其化合物（两性）","desc":"铝是活泼金属，表面易形成致密的氧化膜。铝既能与强酸反应，也能与强碱溶液反应，都生成 H2：2Al + 6HCl = 2AlCl3 + 3H2↑，2Al + 2NaOH + 2H2O = 2NaAlO2 + 3H2↑。Al(OH)3 是两性氢氧化物，既溶于强酸也溶于强碱。","tip":"等量的铝与足量酸或碱反应，产生的 H2 一样多（2Al ~ 3H2）；Al(OH)3 不溶于弱酸和弱碱（如氨水）。","ex":[{"q":"5.4 g Al 分别与足量稀盐酸和足量 NaOH 溶液反应，相同条件下产生的 H2 体积之比是多少？","idea":"两个反应中 Al 的物质的量相同，都按 2Al ~ 3H2 计算。","ans":"n(Al) = 5.4 / 27 = 0.2 mol，两个反应都生成 0.3 mol H2，体积之比为 1 : 1（均为 6.72 L）。"},{"q":"向 100 mL 1 mol/L 的 AlCl3 溶液中加入 100 mL 1 mol/L 的 NaOH 溶液，生成 Al(OH)3 沉淀多少 mol？","idea":"Al³⁺ + 3OH⁻ = Al(OH)3↓，先算两种物质的量，比较 OH⁻ 是否足量。","ans":"n(Al³⁺) = 0.1 mol，n(OH⁻) = 0.1 mol，需要 0.3 mol OH⁻ 才能完全沉淀，OH⁻ 不足，以 OH⁻ 计算。生成 Al(OH)3 为 0.1 / 3 ≈ 0.033 mol。"},{"q":"用铝粉分别与等体积、等浓度的 NaOH 溶液和盐酸反应，若产生 H2 的体积之比为 1:1（同温同压），则两反应中铝粉的质量之比是多少？","idea":"2Al + 6HCl = 2AlCl3 + 3H2↑，2Al + 2NaOH + 2H2O = 2NaAlO2 + 3H2↑；产生氢气相等时，两反应中 Al 的物质的量相等，与酸碱的量无关。","ans":"若产生 H2 体积相同，则两反应中 Al 的物质的量相同，质量之比为 1:1。该题也说明，等量铝与足量酸、碱反应产生 H2 相同。"}]},{"name":"铁及其化合物（Fe²⁺与Fe³⁺）","desc":"铁有 +2 和 +3 两种常见化合价。Fe³⁺ 遇 KSCN 溶液变为红色，可用于检验 Fe³⁺。Fe²⁺ 具有还原性，容易被氧化为 Fe³⁺，例如 2Fe²⁺ + Cl2 = 2Fe³⁺ + 2Cl⁻。","tip":"Fe 与氯气反应生成 FeCl3；Fe 与稀盐酸、稀硫酸或 CuSO4 溶液反应生成 Fe²⁺。FeCl2 溶液要密封保存并加少量铁粉防止氧化。","ex":[{"q":"向 FeCl2 溶液中通入足量 Cl2，写出反应的离子方程式，并说明如何检验生成的 Fe³⁺。","idea":"Fe²⁺ 被 Cl2 氧化为 Fe³⁺；检验 Fe³⁺ 用 KSCN 溶液，观察颜色变化。","ans":"2Fe²⁺ + Cl2 = 2Fe³⁺ + 2Cl⁻。取少量溶液，滴加 KSCN 溶液，若溶液变为红色，说明含有 Fe³⁺。"},{"q":"写出 FeCl2 溶液中通入 Cl2 的离子方程式，并说明 Fe2+ 与 Fe3+ 的相互转化条件。","idea":"Fe2+ 具有还原性，Cl2 为氧化剂；Fe3+ 具有氧化性，可被 Fe、Cu 等还原。","ans":"2Fe2+ + Cl2 = 2Fe3+ + 2Cl-。Fe3+ 转化为 Fe2+ 需加入还原剂，如 2Fe3+ + Fe = 3Fe2+、2Fe3+ + Cu = 2Fe2+ + Cu2+。"}]},{"name":"铁的氢氧化物与 Fe²⁺ 的制备","desc":"Fe(OH)2 为白色沉淀，极易被空气中的 O2 氧化：4Fe(OH)2 + O2 + 2H2O = 4Fe(OH)3，现象是白色沉淀迅速变为灰绿色，最终变为红褐色。实验室制备 Fe(OH)2 需隔绝空气，如将胶头滴管伸入液面以下滴加 NaOH 溶液、在液面上覆盖植物油或煤油、使用还原性铁粉防氧化。Fe(OH)3 为红褐色沉淀，受热分解为 Fe2O3 与水。","tip":"保存 FeSO4 溶液时要加入少量铁粉以防止 Fe2+ 被氧化，同时加入少量稀硫酸抑制 Fe2+ 水解。","ex":[{"q":"写出制备 Fe(OH)2 白色沉淀的实验中，观察到的现象及有关反应的化学方程式。","idea":"Fe(OH)2 易被氧化，需要关注沉淀颜色变化。","ans":"现象：先生成白色沉淀，迅速变为灰绿色，最后变为红褐色。化学方程式：Fe2+ + 2OH- = Fe(OH)2↓；4Fe(OH)2 + O2 + 2H2O = 4Fe(OH)3。"},{"q":"要使 FeSO4 溶液长期保存而不变质，应采取哪些措施？","idea":"防止 Fe2+ 被氧化与水解。","ans":"加入少量铁粉（Fe + 2Fe3+ = 3Fe2+ 可还原 Fe3+）以防氧化；加入少量稀硫酸抑制 Fe2+ 水解；同时密封保存。"}]},{"name":"铝热反应","desc":"铝粉与某些金属氧化物（如 Fe2O3、Cr2O3、MnO2）在高温下发生置换反应，放出大量热，生成熔融金属单质，称为铝热反应。例如 Fe2O3 + 2Al =（高温）Al2O3 + 2Fe。该反应可用于焊接钢轨、冶炼难熔金属（如 Cr、Mn）。实验中常用镁条和氯酸钾作引燃剂。","tip":"铝热反应属于置换反应，铝作还原剂；反应需要高温，实验时要在沙子上进行以防熔融物溅出。","ex":[{"q":"写出 Al 与 Fe3O4 发生铝热反应的化学方程式，若要还原 1 mol Fe3O4，需要 Al 多少摩尔？","idea":"Fe3O4 中铁的平均化合价为 +8/3，每摩尔 Fe3O4 得到 8 mol 电子；Al 每摩尔失去 3 mol 电子。","ans":"8Al + 3Fe3O4 =（高温）4Al2O3 + 9Fe。得失电子守恒：8 × 3 = 24 = 3 × 8。由方程式可知 3 mol Fe3O4 需 8 mol Al，因此 1 mol Fe3O4 需要 8/3 mol（约 2.67 mol）Al。"},{"q":"将 5.4 g Al 与足量 Fe2O3 混合后高温充分反应，理论上可生成 Fe 的质量是多少？","idea":"先求 Al 的物质的量，再按 2Al ~ 2Fe 计算。","ans":"n(Al) = 5.4 / 27 = 0.2 mol，由 2Al + Fe2O3 =（高温）Al2O3 + 2Fe，生成 n(Fe) = 0.2 mol，m(Fe) = 0.2 × 56 = 11.2 g。"}]},{"name":"Fe³⁺ 与 Fe²⁺ 的检验","desc":"Fe3+ 遇 KSCN 溶液生成血红色的 Fe(SCN)3，离子方程式为 Fe3+ + 3SCN- = Fe(SCN)3，常用于检验 Fe3+。Fe2+ 遇 KSCN 溶液无明显现象，但加入氧化剂（如氯水）后变为血红色，即 2Fe2+ + Cl2 = 2Fe3+ + 2Cl-。Fe2+ 还可用 K3[Fe(CN)6]（铁氰化钾）检验，生成蓝色沉淀。","tip":"检验 Fe2+ 时，应先加 KSCN 溶液排除 Fe3+ 的干扰，再加入氧化剂，否则无法判断原溶液中是否含 Fe2+。","ex":[{"q":"如何检验 FeCl2 溶液是否已部分变质（含有 Fe3+）？","idea":"Fe3+ 与 KSCN 显血红色。","ans":"取少量溶液于试管中，滴加 KSCN 溶液，若溶液变为血红色，说明已有 Fe3+ 生成，即部分被氧化。"},{"q":"某溶液中加入 KSCN 溶液无明显现象，再加入少量氯水后溶液变为血红色，则原溶液中一定含有哪种离子？","idea":"先排除 Fe3+，再由氯水氧化 Fe2+ 生成 Fe3+ 判断。","ans":"原溶液中不含 Fe3+（加 KSCN 无现象），加入氯水后变红，说明 Fe2+ 被氧化为 Fe3+，因此原溶液中一定含有 Fe2+。"}]}]},{"title":"第四章 氯、溴、碘及其化合物","items":[{"name":"氯气与次氯酸","desc":"氯气是黄绿色、有毒的气体，溶于水后部分与水反应：Cl2 + H2O ⇌ HCl + HClO。次氯酸（HClO）具有强氧化性和漂白性，见光易分解：2HClO = 2HCl + O2↑。氯气与氢氧化钠溶液反应：Cl2 + 2NaOH = NaCl + NaClO + H2O。","tip":"氯水中含有 Cl2、HClO、H2O 等分子，久置的氯水会变成稀盐酸，失去漂白性。","ex":[{"q":"标准状况下 2.24 L Cl2 与足量 NaOH 溶液反应，生成 NaClO 的物质的量是多少？","idea":"按 Cl2 + 2NaOH = NaCl + NaClO + H2O 写出 Cl2 与 NaClO 的比例，为 1 : 1。","ans":"n(Cl2) = 2.24 / 22.4 = 0.1 mol，生成 NaClO 为 0.1 mol。"},{"q":"将标准状况下 2.24 L Cl2 通入足量 KI 溶液中，理论上可生成 I2 多少克？（I 的相对原子质量为 127）","idea":"Cl2 + 2KI = 2KCl + I2，Cl2 与 I2 的物质的量之比为 1 : 1。","ans":"n(Cl2) = 0.1 mol，生成 I2 为 0.1 mol，质量为 0.1 × 254 = 25.4 g。"}]},{"name":"氯离子的检验与氯气的实验室制取","desc":"检验 Cl⁻ 常用稀硝酸酸化的 AgNO3 溶液，生成不溶于稀硝酸的白色沉淀 AgCl。实验室用浓盐酸与二氧化锰加热制取氯气：MnO2 + 4HCl(浓) =(△) MnCl2 + Cl2↑ + 2H2O。尾气用 NaOH 溶液吸收。","tip":"稀盐酸与 MnO2 不反应，必须用浓盐酸并加热；检验时先加稀硝酸排除 CO3²⁻ 等离子的干扰。","ex":[{"q":"假设 8.7 g MnO2 完全反应，理论上可生成标准状况下 Cl2 多少升？（M(MnO2) = 87 g/mol）","idea":"由 MnO2 的物质的量，按 MnO2 : Cl2 = 1 : 1 计算。","ans":"n(MnO2) = 8.7 / 87 = 0.1 mol，生成 Cl2 为 0.1 mol，体积为 0.1 × 22.4 = 2.24 L。"},{"q":"实验室用 MnO2 与浓盐酸反应制取 Cl2，若用 8.7 g MnO2 与足量浓盐酸反应，理论上可得到标准状况下 Cl2 的体积是多少？","idea":"MnO2 + 4HCl(浓) =（△）MnCl2 + Cl2↑ + 2H2O，按 MnO2 的物质的量计算。","ans":"M(MnO2) = 87 g/mol，n(MnO2) = 8.7 / 87 = 0.1 mol，生成 n(Cl2) = 0.1 mol，V = 0.1 × 22.4 = 2.24 L。"}]},{"name":"漂白粉与次氯酸盐","desc":"工业上用氯气与石灰乳反应制取漂白粉：2Cl2 + 2Ca(OH)2 = CaCl2 + Ca(ClO)2 + 2H2O。漂白粉的有效成分是 Ca(ClO)2。漂白原理是 Ca(ClO)2 与空气中的 CO2 和水反应生成 HClO：Ca(ClO)2 + CO2 + H2O = CaCO3↓ + 2HClO。因此漂白粉需密封保存，且久置会失效；HClO 见光分解：2HClO =（光照）2HCl + O2↑。","tip":"漂白粉的有效成分是 Ca(ClO)2 而非 CaCl2；漂白粉与浓盐酸混合会生成 Cl2，故不能混用。","ex":[{"q":"写出漂白粉在空气中失效的化学方程式。","idea":"漂白粉的有效成分与 CO2、H2O 反应生成 HClO，HClO 再分解。","ans":"Ca(ClO)2 + CO2 + H2O = CaCO3↓ + 2HClO；2HClO =（光照）2HCl + O2↑。"},{"q":"工业上用 0.2 mol Cl2 与足量石灰乳反应，理论上可生成 Ca(ClO)2 多少摩尔？","idea":"2Cl2 对应 1 mol Ca(ClO)2。","ans":"由 2Cl2 + 2Ca(OH)2 = CaCl2 + Ca(ClO)2 + 2H2O 可知，2 mol Cl2 生成 1 mol Ca(ClO)2，因此 0.2 mol Cl2 生成 0.1 mol Ca(ClO)2。"}]},{"name":"卤素的性质递变规律","desc":"卤素包括 F、Cl、Br、I，同主族从上到下，单质氧化性减弱（F2 > Cl2 > Br2 > I2），与 H2 化合越来越难，氢化物的稳定性减弱。强氧化性的单质可以把弱氧化性的卤素离子氧化，如 Cl2 + 2Br⁻ = 2Cl⁻ + Br2。","tip":"判断氧化性强弱：氧化剂的氧化性强于氧化产物的氧化性。","ex":[{"q":"将 Cl2 通入 KBr 溶液中，溶液变为橙色，说明了什么？写出离子方程式。","idea":"橙色是 Br2 生成的，说明 Cl2 把 Br⁻ 氧化成了 Br2。","ans":"说明 Cl2 的氧化性强于 Br2。离子方程式：Cl2 + 2Br⁻ = 2Cl⁻ + Br2。"},{"q":"向 NaBr 与 NaI 的混合溶液中通入足量 Cl2，充分反应后蒸干溶液，得到的固体是什么？写出有关离子方程式。","idea":"还原性 I- > Br- > Cl-，Cl2 先氧化 I-，再氧化 Br-；蒸干时 Br2、I2 逸出或升华（Br2 挥发，I2 升华），最终只剩 NaCl。","ans":"2I- + Cl2 = I2 + 2Cl-；2Br- + Cl2 = Br2 + 2Cl-。Cl2 过量时，最终溶液中只剩 NaCl，蒸干得到 NaCl 固体（Br2、I2 挥发或升华）。"}]}]},{"title":"第五章 硫、氮、硅及其化合物","items":[{"name":"二氧化硫的性质","desc":"SO2 是无色、有刺激性气味、易溶于水的有毒气体，与水反应生成亚硫酸：SO2 + H2O ⇌ H2SO3。SO2 中硫为 +4 价，可表现还原性（如 2SO2 + O2 ⇌ 2SO3）；SO2 能与某些有色物质结合使品红褪色，加热后可恢复颜色。SO2 与 NaOH 溶液反应：SO2 + 2NaOH = Na2SO3 + H2O。","tip":"SO2 能使紫色石蕊溶液变红但不能使其褪色；SO2 的漂白是暂时性的，与次氯酸的永久性漂白不同。","ex":[{"q":"将标准状况下 4.48 L SO2 通入足量 NaOH 溶液，生成 Na2SO3 多少克？（M(Na2SO3) = 126 g/mol）","idea":"SO2 + 2NaOH = Na2SO3 + H2O，SO2 与 Na2SO3 按 1 : 1 对应。","ans":"n(SO2) = 4.48 / 22.4 = 0.2 mol，生成 Na2SO3 为 0.2 mol，质量为 0.2 × 126 = 25.2 g。"},{"q":"将标准状况下 2.24 L SO2 与足量 H2S 混合反应，生成硫单质多少克？","idea":"SO2 + 2H2S = 3S↓ + 2H2O，SO2 中 S 从 +4 降到 0，H2S 中 S 从 −2 升到 0。","ans":"n(SO2) = 0.1 mol，由方程式生成 S 为 0.1 × 3 = 0.3 mol，质量为 0.3 × 32 = 9.6 g。"}]},{"name":"浓硫酸的性质","desc":"浓硫酸具有吸水性，可干燥中性或酸性气体（不能干燥 NH3 等碱性气体，也不能干燥 H2S、HI 等还原性气体）。浓硫酸还具有脱水性（使蔗糖等炭化）和强氧化性，加热时与铜反应：Cu + 2H2SO4(浓) =(△) CuSO4 + SO2↑ + 2H2O。常温下浓硫酸使铁、铝钝化。","tip":"随着反应进行，浓硫酸变稀，稀硫酸不再与铜反应，所以参加反应的硫酸总量小于理论值。","ex":[{"q":"0.2 mol H2SO4 的浓硫酸与足量铜共热，理论上最多生成标准状况下 SO2 多少升？","idea":"Cu + 2H2SO4(浓) = CuSO4 + SO2↑ + 2H2O，每 2 mol H2SO4 生成 1 mol SO2。","ans":"理论上生成 SO2 为 0.2 / 2 = 0.1 mol，体积为 2.24 L。实际因硫酸变稀，生成的 SO2 会少于 2.24 L。"}]},{"name":"氮的氧化物、硝酸与氨","desc":"NO 为无色气体，遇空气中的 O2 被氧化为红棕色的 NO2：2NO + O2 = 2NO2。NO2 与水反应生成硝酸：3NO2 + H2O = 2HNO3 + NO。NH3 极易溶于水，溶液显碱性：NH3 + H2O ⇌ NH3·H2O。实验室用铵盐与碱加热制 NH3：2NH4Cl + Ca(OH)2 =(△) CaCl2 + 2NH3↑ + 2H2O。","tip":"稀硝酸与铜反应生成 NO，浓硝酸与铜反应生成 NO2；NH3 收集只能用向下排空气法。","ex":[{"q":"将 4 体积 NO2 与 1 体积 O2 混合通入水中，恰好被完全吸收生成 HNO3，写出总反应方程式并说明理由。","idea":"把 NO2 与 O2 的反应合并：NO2 中 N 从 +4 升到 +5（失 1 个电子），O2 每个 O 得 2 个电子，用电子守恒配平。","ans":"4NO2 + O2 + 2H2O = 4HNO3。理由：4 mol NO2 失去 4 mol 电子，1 mol O2 得到 4 mol 电子，电子守恒，无 NO 剩余。"},{"q":"NO 与 O2 按物质的量之比 4:3 同时通入水中，恰好完全被吸收生成 HNO3（4NO + 3O2 + 2H2O = 4HNO3）。若 NO 为 0.4 mol，求生成 HNO3 的物质的量及消耗 O2 在标准状况下的体积。","idea":"按方程式中的化学计量数对应关系计算：4NO 生成 4HNO3，3O2 与 4NO 对应。","ans":"n(HNO3) = n(NO) = 0.4 mol；n(O2) = 0.4 × 3/4 = 0.3 mol，V(O2) = 0.3 × 22.4 = 6.72 L。"}]},{"name":"氨与铵盐","desc":"NH3 是无色、有刺激性气味的气体，极易溶于水（常温下 1 体积水溶解约 700 体积 NH3），水溶液称为氨水，呈碱性：NH3 + H2O ⇌ NH3·H2O ⇌ NH4+ + OH-。实验室用 Ca(OH)2 与 NH4Cl 固体加热制取：2NH4Cl + Ca(OH)2 =（△）CaCl2 + 2NH3↑ + 2H2O，用向下排空气法收集，用湿润的红色石蕊试纸检验。NH3 与 HCl 相遇产生白烟（NH3 + HCl = NH4Cl）。铵盐受热易分解，NH4+ 的检验方法是加入浓 NaOH 溶液并加热，生成使湿润红色石蕊试纸变蓝的气体。","tip":"制取 NH3 时不能用 NH4Cl 固体加热分解，因为会生成 NH3 与 HCl，遇冷又结合为 NH4Cl，得不到 NH3。","ex":[{"q":"如何检验某固体样品中是否含有 NH4+？写出有关离子方程式。","idea":"利用 NH4+ 与碱加热生成 NH3 的性质。","ans":"取少量样品于试管中，加入浓 NaOH 溶液并加热，将湿润的红色石蕊试纸靠近试管口，若试纸变蓝，说明含有 NH4+。离子方程式：NH4+ + OH-  =（△）NH3↑ + H2O。"},{"q":"标准状况下将 2.24 L NH3 完全溶于水配成 500 mL 溶液（以 NH3 计算溶质），求该溶液的物质的量浓度。","idea":"先求 NH3 的物质的量，再用 c = n / V。","ans":"n(NH3) = 2.24 / 22.4 = 0.1 mol，V = 0.5 L，c = 0.1 / 0.5 = 0.2 mol/L。"}]},{"name":"硅与二氧化硅","desc":"硅位于元素周期表第三周期ⅣA 族，晶体硅具有金属光泽，是良好的半导体材料，用于制造芯片和太阳能电池。工业制粗硅：SiO2 + 2C =（高温）Si + 2CO↑。SiO2 是酸性氧化物，但不溶于水，也不与水反应；它能与 NaOH 反应：SiO2 + 2NaOH = Na2SiO3 + H2O（Na2SiO3 的水溶液俗称水玻璃）；能与氢氟酸反应：SiO2 + 4HF = SiF4↑ + 2H2O，因此氢氟酸要保存在塑料瓶中。","tip":"SiO2 不能直接与水反应制备 H2SiO3，可用 Na2SiO3 溶液与盐酸反应制取 H2SiO3：Na2SiO3 + 2HCl = 2NaCl + H2SiO3↓。","ex":[{"q":"工业制取粗硅时，为什么生成的是 CO 而不是 CO2？写出化学方程式。","idea":"高温下碳过量，CO 为气体，会离开反应体系。","ans":"SiO2 + 2C =（高温）Si + 2CO↑。焦炭过量时 C 只被氧化为 CO，且 CO 为气体逸出，使反应持续进行。若生成 CO2，则会与碳继续反应生成 CO。"},{"q":"盛放 NaOH 溶液的试剂瓶应选择哪种瓶塞？为什么？","idea":"NaOH 能与 SiO2 反应生成 Na2SiO3，会使玻璃瓶塞与瓶口粘结。","ans":"应选用橡胶塞。NaOH 与玻璃中的 SiO2 反应生成具有黏性的 Na2SiO3，会使玻璃塞与瓶口粘在一起，因此不能用玻璃塞。"}]}]},{"title":"第六章 物质的量","items":[{"name":"物质的量、摩尔质量与阿伏加德罗常数","desc":"物质的量(n)是表示一定数目微观粒子集合体的物理量，单位是摩尔(mol)。1 mol 任何粒子约含 6.02×10²³ 个，这个数叫阿伏加德罗常数(NA)。摩尔质量(M)以 g/mol 为单位，数值上等于相对分子(原子)质量，且 n = m / M。","tip":"代入 n = m / M 时，M 的单位是 g/mol；求粒子数时注意分子中原子个数的倍数关系。","ex":[{"q":"求 36 g H2O 的物质的量，以及其中所含氧原子的个数（用 NA 表示）。","idea":"先求 M(H2O)，再用 n = m / M 求物质的量；氧原子数 = 分子数 × 每个分子中氧原子数。","ans":"M(H2O) = 2×1 + 16 = 18 g/mol，n = 36 / 18 = 2 mol。每个 H2O 含 1 个 O 原子，所以 O 原子数为 2NA（约 1.204×10²⁴ 个）。"},{"q":"求 0.5 mol Na2CO3 的质量，以及其中所含 Na⁺ 的物质的量。","idea":"先求 M(Na2CO3)，再用 m = n × M；每个 Na2CO3 含 2 个 Na⁺。","ans":"M(Na2CO3) = 2×23 + 12 + 3×16 = 106 g/mol，m = 0.5 × 106 = 53 g。Na⁺ 的物质的量为 0.5 × 2 = 1 mol。"}]},{"name":"气体摩尔体积","desc":"在标准状况（0 ℃、101 kPa）下，1 mol 任何气体的体积约为 22.4 L，即气体摩尔体积 Vm ≈ 22.4 L/mol。气体的物质的量 n = V / Vm，混合气体同样适用，但只适用于气体。","tip":"22.4 L/mol 只适用于标准状况下的气体；水、酒精、SO3 等在标准状况下不是气体，不能用此公式。","ex":[{"q":"求标准状况下 11.2 L O2 的物质的量和质量。","idea":"先用 n = V / Vm 求物质的量，再用 m = n × M 求质量；M(O2) = 32 g/mol。","ans":"n = 11.2 L / 22.4 L/mol = 0.5 mol，m = 0.5 mol × 32 g/mol = 16 g。"},{"q":"标准状况下 6.72 L NH3 含有多少个分子（用 NA 表示）？","idea":"先求 NH3 的物质的量，再乘以 NA 得到分子数。","ans":"n(NH3) = 6.72 / 22.4 = 0.3 mol，分子数为 0.3NA。"}]},{"name":"阿伏加德罗定律及其推论","desc":"在同温同压下，相同体积的任何气体都含有相同数目的分子，这就是阿伏加德罗定律。由 pV = nRT 可推出：同温同压下，V1/V2 = n1/n2 = N1/N2；同温同体积下，p1/p2 = n1/n2；同温同压下，ρ1/ρ2 = M1/M2；气体的相对密度 D = M1/M2。标准状况下，气体密度 ρ = M / 22.4 g/L。","tip":"阿伏加德罗定律适用于气体，可以是混合气体；使用推论时要明确“同温同压”或“同温同体积”的条件。","ex":[{"q":"同温同压下，等质量的 O2 与 CH4 的体积之比是多少？","idea":"同温同压下体积之比等于物质的量之比，n = m / M。","ans":"n(O2) = m / 32，n(CH4) = m / 16，V(O2) : V(CH4) = (m/32) : (m/16) = 1 : 2。"},{"q":"在标准状况下，某气体的密度为 1.25 g/L，求该气体的摩尔质量，并判断可能是哪种气体。","idea":"M = ρ × Vm。","ans":"M = 1.25 g/L × 22.4 L/mol = 28 g/mol，可能是 N2 或 CO 等。"}]},{"name":"物质的量浓度","desc":"物质的量浓度 c 表示单位体积溶液中所含溶质的物质的量，c = n / V，单位为 mol/L。溶液稀释前后溶质的物质的量不变，即 c1·V1 = c2·V2。","tip":"公式中的 V 是溶液的体积，不是溶剂水的体积；溶液是均一的，取出部分溶液浓度不变。","ex":[{"q":"将 4.0 g NaOH 溶于水配成 500 mL 溶液，求其物质的量浓度；从中取出 100 mL，取出溶液的浓度是多少？","idea":"先求 NaOH 的物质的量，再用 c = n / V，V 要换算成 L；溶液的浓度与取出的体积无关。","ans":"M(NaOH) = 40 g/mol，n = 4.0 / 40 = 0.1 mol，c = 0.1 mol / 0.5 L = 0.2 mol/L。取出 100 mL 后浓度仍为 0.2 mol/L。"},{"q":"将 100 mL 2 mol/L 的 H2SO4 溶液稀释到 500 mL，所得溶液的物质的量浓度是多少？","idea":"稀释前后溶质的物质的量不变，列式 c1·V1 = c2·V2。","ans":"2 mol/L × 0.1 L = c2 × 0.5 L，c2 = 0.4 mol/L。"}]},{"name":"一定物质的量浓度溶液的配制","desc":"以配制 500 mL 1.0 mol/L NaCl 溶液为例，步骤为：计算（需 NaCl 0.5 mol，即 29.25 g）→称量（托盘天平精确到 0.1 g，故称取 29.3 g 或用更精确仪器）→溶解（在烧杯中溶解，冷却至室温）→转移（用玻璃棒引流至 500 mL 容量瓶）→洗涤（洗涤烧杯和玻璃棒 2–3 次，洗液一并转入容量瓶）→定容（加水至距刻度线 1–2 cm 时改用胶头滴管，使凹液面与刻度线相切）→摇匀、装瓶贴标签。","tip":"容量瓶使用前要检漏；容量瓶不能用于溶解、稀释或长期储存溶液，也不能加热。误差分析：定容时仰视，溶液体积偏大，浓度偏低；俯视则浓度偏高；未洗涤烧杯会使浓度偏低。","ex":[{"q":"欲配制 480 mL 0.1 mol/L NaCl 溶液，应选用多大规格的容量瓶？需要称取 NaCl 的质量是多少？","idea":"实验室没有 480 mL 容量瓶，应选略大于所需体积的 500 mL 规格；m = c × V × M。","ans":"选用 500 mL 容量瓶。n(NaCl) = 0.1 mol/L × 0.5 L = 0.05 mol，m = 0.05 × 58.5 = 2.925 g，用托盘天平应称取 2.9 g（或用分析天平称取 2.925 g）。"},{"q":"用容量瓶配制溶液时，定容时俯视刻度线，所配溶液的浓度偏高还是偏低？为什么？","idea":"俯视时液面低于刻度线，实际溶液体积偏小。","ans":"偏高。俯视时实际加入的水偏少，溶液体积 V 偏小，由 c = n / V 可知浓度偏高。"}]},{"name":"溶液稀释、混合与以物质的量为中心的计算","desc":"溶液稀释时溶质的物质的量不变，即 c1·V1 = c2·V2。两种同溶质溶液混合后，溶质总物质的量等于两者之和：c混·V混 = c1V1 + c2V2，若题目未给出混合后体积，一般近似认为 V混 = V1 + V2（忽略体积变化）。以物质的量为中心的换算关系：n = m / M = V(气) / Vm = c·V(aq) = N / NA。","tip":"混合后的溶液体积不能简单相加时（如酒精与水混合），需要题目给出混合后的体积或密度，不可随意假设。","ex":[{"q":"将 100 mL 2 mol/L 的 H2SO4 加水稀释至 500 mL，求稀释后的物质的量浓度。","idea":"稀释前后溶质的物质的量不变，用 c1V1 = c2V2。","ans":"c2 = c1V1 / V2 = 2 × 0.1 / 0.5 = 0.4 mol/L。"},{"q":"将 100 mL 0.1 mol/L NaCl 溶液与 50 mL 0.2 mol/L MgCl2 溶液混合，忽略体积变化，求混合溶液中 Cl- 的物质的量浓度。","idea":"分别求两溶液中 Cl- 的物质的量，相加后除以总体积。","ans":"n(Cl-) = 0.1 × 0.1 + 0.05 × 0.2 × 2 = 0.01 + 0.02 = 0.03 mol；V = 0.15 L；c(Cl-) = 0.03 / 0.15 = 0.2 mol/L。"}]}]},{"title":"第七章 元素周期律与元素周期表","items":[{"name":"元素周期表与元素周期律","desc":"元素周期表有 7 个横行（周期）和 18 个纵列（族，其中 8、9、10 三列合称第Ⅷ族）。同周期从左到右，原子半径逐渐减小，金属性减弱，非金属性增强；同主族从上到下，原子半径增大，金属性增强，非金属性减弱。","tip":"比较金属性可看单质与水或酸反应的剧烈程度，以及最高价氧化物对应水化物的碱性强弱。","ex":[{"q":"判断 Na、Mg、Al 的金属性强弱，并说明理由。","idea":"三者同周期，从左到右金属性递减；可比较最高价氧化物对应水化物的碱性。","ans":"金属性：Na > Mg > Al。理由：NaOH 是强碱，Mg(OH)2 是弱碱，Al(OH)3 是两性氢氧化物，碱性依次减弱。"},{"q":"比较下列微粒半径大小：Na、Mg、Cl、Na+、Cl-。","idea":"先比较电子层数，电子层数相同时比较核电荷数；同种元素阴离子半径大于原子，阳离子半径小于原子。","ans":"Na > Mg > Cl；Cl- > Cl；Na+ < Na；综合得 Cl- > Na > Mg > Cl > Na+。"}]},{"name":"元素位置与原子结构的推断","desc":"原子序数 = 核电荷数 = 质子数 = 核外电子数。周期序数 = 电子层数；主族序数 = 最外层电子数。元素的最高正化合价（主族）= 族序数（O、F 除外），最低负化合价 = 族序数 − 8；最高正化合价与最低负化合价绝对值之和为 8（非金属元素）。同主族相邻周期元素原子序数之差，取决于前一周期元素种类数：2、8、8、18、18、32。","tip":"推断元素位置时，先由电子层数确定周期，再由最外层电子数确定族；注意 0 族元素的原子序数可用周期表中周期的元素数累加得到。","ex":[{"q":"X 元素原子的最外层有 6 个电子，位于第三周期，写出 X 元素的名称、原子序数及在周期表中的位置。","idea":"第三周期有 3 个电子层，最外层 6 个电子为ⅥA 族。","ans":"X 为硫（S），原子序数 16，位于第三周期ⅥA 族。"},{"q":"某元素原子核外有 3 个电子层，最外层有 5 个电子，写出该元素的原子序数，并写出其最高价氧化物对应水化物的化学式。","idea":"第三周期、ⅤA 族为磷；最高正价为 +5，对应 H3PO4。","ans":"该元素为磷（P），原子序数 15。最高价氧化物为 P2O5，对应水化物为 H3PO4。"}]},{"name":"同周期、同主族元素性质的递变规律","desc":"同周期从左到右（稀有气体除外）：原子半径逐渐减小，失电子能力减弱（金属性减弱），得电子能力增强（非金属性增强），最高价氧化物对应水化物的碱性减弱、酸性增强，气态氢化物稳定性增强。同主族从上到下：电子层数增多，原子半径增大，金属性增强，非金属性减弱，气态氢化物稳定性减弱，还原性增强。","tip":"比较原子半径时先看电子层数，电子层数相同时再看核电荷数；比较金属性或非金属性不能只看原子半径，应以失得电子能力为标准。","ex":[{"q":"比较 HF、HCl、HBr 的热稳定性和还原性强弱。","idea":"同主族从上到下，非金属性减弱，气态氢化物稳定性减弱，还原性增强。","ans":"稳定性：HF > HCl > HBr；还原性：HBr > HCl > HF。"},{"q":"下列关于 Na、Mg、Al 的说法正确的是（ ）A. 原子半径：Na < Mg < Al B. 金属性：Na > Mg > Al C. 最高价氧化物对应水化物的碱性：Al(OH)3 > Mg(OH)2 D. 还原性：Mg > Na","idea":"同周期从左到右，原子半径减小，金属性减弱，碱性减弱。","ans":"选 B。同周期从左到右原子半径减小，故原子半径 Na > Mg > Al（A 错）；金属性 Na > Mg > Al（B 对）；碱性 Mg(OH)2 > Al(OH)3（C 错）；还原性 Na > Mg（D 错）。"}]}]},{"title":"第八章 化学键","items":[{"name":"离子键与共价键","desc":"阴、阳离子之间通过静电作用形成的化学键叫离子键，如 NaCl、MgO。原子之间通过共用电子对形成的化学键叫共价键，如 H2、HCl、CO2。含有离子键的化合物是离子化合物；只含共价键的化合物是共价化合物。","tip":"NaOH、NH4Cl 等既含离子键又含共价键；只有全部由共价键结合的化合物才是共价化合物。","ex":[{"q":"判断 NaOH、H2O2、MgCl2 中含有的化学键类型。","idea":"看是否存在阴阳离子之间的作用（离子键）以及非金属原子之间的共用电子对（共价键）。","ans":"NaOH 既含离子键（Na⁺与OH⁻）又含共价键（O–H）；H2O2 只含共价键（H–O、O–O）；MgCl2 只含离子键。"}]},{"name":"电子式的书写","desc":"电子式是在元素符号周围用小黑点（或叉）表示最外层电子的式子。简单阳离子用离子符号表示（如 Na+）；阴离子和复杂离子要加方括号并标明电荷（如 [:Cl:]-）。离子化合物如 NaCl 写作 Na+[:Cl:]-，MgCl2 写作 [:Cl:]- Mg2+ [:Cl:]-。共价化合物如 HCl 写作 H:Cl:，H2O 写作 H:O:H，CO2 写作 :O::C::O:。用电子式表示物质形成过程时，左边写原子的电子式，右边写化合物的电子式，中间用箭头连接。","tip":"共价化合物的电子式中不能出现电荷，也不能写成离子形式；离子化合物中每个离子要单独书写，不能合并共用电子对。","ex":[{"q":"写出 NH4Cl、N2、H2O2 的电子式。","idea":"NH4+ 为复杂阳离子，要加方括号和电荷；N2 为三键；H2O2 中两个 O 之间共用一对电子。","ans":"NH4Cl：[H:N:H]+[:Cl:]-（N 周围为 8 电子，H 连接 N，整体加方括号标 +）；N2：:N:::N:；H2O2：H:O:O:H。"},{"q":"用电子式表示 MgCl2 的形成过程。","idea":"Mg 失去 2 个电子，每个 Cl 得到 1 个电子。","ans":"·Mg· + 2·Cl: → [:Cl:]- Mg2+ [:Cl:]-，其中 Mg 原子失去两个电子，两个 Cl 原子各得到一个电子。"}]},{"name":"化学键与物质类别的关系","desc":"离子化合物中一定含有离子键，可能还含有共价键（如 NaOH、Na2O2、NH4Cl）。共价化合物中只含共价键（如 HCl、H2SO4、CO2）。非金属单质（稀有气体除外）中含非极性共价键（如 Cl2、N2）。稀有气体为单原子分子，不含化学键。离子化合物在熔融状态下能导电，共价化合物在熔融状态下不能导电。","tip":"判断化学键类型时，应看是否有金属阳离子或铵根离子（有则含离子键）；同种原子间是非极性键，不同种原子间是极性键。","ex":[{"q":"下列物质中既含有离子键又含有共价键的是（ ）A. NaCl B. H2O C. NaOH D. MgO","idea":"NaOH 中 Na+ 与 OH- 之间为离子键，O-H 为共价键。","ans":"选 C。NaCl 只含离子键，H2O 只含共价键，MgO 只含离子键，NaOH 既含离子键又含共价键。"},{"q":"下列关于化学键的说法正确的是（ ）A. 稀有气体分子中存在共价键 B. 离子化合物中一定不含共价键 C. 熔融 HCl 能导电 D. Na2O2 中既有离子键又有非极性共价键","idea":"逐项判断化学键类型与导电条件。","ans":"选 D。稀有气体为单原子分子，无共价键（A 错）；NaOH、Na2O2 等离子化合物可含共价键（B 错）；HCl 是共价化合物，熔融时不电离，不导电（C 错）；Na2O2 中 O-O 为非极性共价键，与 Na+ 之间为离子键（D 对）。"}]}]},{"title":"第九章 化学反应与能量","items":[{"name":"化学能与热能（放热反应与吸热反应）","desc":"化学反应伴随能量变化，通常表现为热量的释放或吸收。反应物总能量大于生成物总能量时为放热反应（ΔH < 0），如燃烧、中和反应、活泼金属与酸的反应、大多数化合反应。反应物总能量小于生成物总能量时为吸热反应（ΔH > 0），如 Ba(OH)2·8H2O 与 NH4Cl 的反应、C 与 CO2 高温反应、大多数分解反应。","tip":"放热、吸热与反应条件（是否加热）没有必然联系：需要加热的反应不一定吸热，如 C 燃烧需要点燃却是放热反应。","ex":[{"q":"Ba(OH)2·8H2O 与 NH4Cl 在烧杯中混合搅拌，发生反应：Ba(OH)2·8H2O + 2NH4Cl = BaCl2 + 2NH3↑ + 10H2O，实验中观察到烧杯变凉、玻璃片与烧杯底粘在一起。请解释原因。","idea":"吸热反应使体系温度降低，吸收周围热量。","ans":"该反应为吸热反应，反应吸收周围环境的热量，使烧杯温度降低，水结冰导致玻璃片与烧杯粘连。"},{"q":"下列变化属于放热反应的是（ ）A. 碳与二氧化碳高温反应 B. 氢氧化钡晶体与氯化铵反应 C. 铝与盐酸反应 D. 碳酸钙高温分解","idea":"常见放热反应：燃烧、金属与酸、中和反应。","ans":"选 C。铝与盐酸反应放出热量；A、D 为吸热反应，B 也是吸热反应。"}]},{"name":"键能与反应热的关系","desc":"断开化学键需要吸收能量，形成化学键会放出能量。反应热 ΔH = 反应物的键能总和 − 生成物的键能总和。ΔH < 0 为放热反应，ΔH > 0 为吸热反应。","tip":"计算时要数清每个分子中化学键的个数，如 2HCl 中有 2 个 H–Cl 键。","ex":[{"q":"已知键能：H–H 为 436 kJ/mol，Cl–Cl 为 242 kJ/mol，H–Cl 为 431 kJ/mol。计算 H2(g) + Cl2(g) = 2HCl(g) 的 ΔH。","idea":"ΔH = 反应物键能总和 − 生成物键能总和；注意 2 mol HCl 含 2 mol H–Cl 键。","ans":"ΔH = (436 + 242) − 2 × 431 = 678 − 862 = −184 kJ/mol，该反应为放热反应。"},{"q":"已知 H-H 键能为 436 kJ/mol，Cl-Cl 键能为 243 kJ/mol，H-Cl 键能为 431 kJ/mol，计算 H2(g) + Cl2(g) = 2HCl(g) 的反应热 ΔH。","idea":"ΔH = 反应物键能之和 − 生成物键能之和。","ans":"ΔH = (436 + 243) − 2 × 431 = 679 − 862 = −183 kJ/mol，为放热反应。"}]},{"name":"原电池","desc":"原电池是把化学能转化为电能的装置。负极发生氧化反应，失去电子；正极发生还原反应，得到电子；电子由负极经外电路流向正极。以稀硫酸为电解质的锌铜原电池为例：负极 Zn − 2e⁻ = Zn²⁺，正极 2H⁺ + 2e⁻ = H2↑。","tip":"电子只经过外电路，不经过电解质溶液；电流方向与电子流动方向相反。","ex":[{"q":"稀硫酸为电解质的锌铜原电池工作时，外电路通过 0.2 mol 电子，求正极生成的 H2 体积（标准状况）和负极溶解的 Zn 质量。（Zn 的相对原子质量为 65）","idea":"由电子守恒：Zn 失 2 个电子，2H⁺ 得 2 个电子生成 1 个 H2。","ans":"溶解 Zn 为 0.1 mol，质量为 6.5 g；正极生成 H2 为 0.1 mol，体积为 2.24 L。"},{"q":"将锌片与铜片用导线连接后插入稀硫酸中，写出负极与正极的电极反应式，并说明电子流动方向。","idea":"较活泼的 Zn 为负极，失电子；Cu 为正极，溶液中的 H+ 得电子。电子由负极经导线流向正极。","ans":"负极：Zn - 2e- = Zn2+；正极：2H+ + 2e- = H2↑；总反应：Zn + H2SO4 = ZnSO4 + H2↑。电子由 Zn 经导线流向 Cu。"}]},{"name":"化学电源与燃料电池","desc":"化学电源是将化学能转化为电能的装置，分为一次电池、二次电池（可充电）和燃料电池。碱性锌锰干电池：负极 Zn + 2OH- - 2e- = Zn(OH)2，正极 2MnO2 + 2H2O + 2e- = 2MnOOH + 2OH-。铅酸蓄电池（放电）：负极 Pb + SO4^2- - 2e- = PbSO4，正极 PbO2 + 4H+ + SO4^2- + 2e- = PbSO4 + 2H2O，总反应 Pb + PbO2 + 2H2SO4 = 2PbSO4 + 2H2O。燃料电池以可燃物为负极燃料、以 O2 为正极反应物。","tip":"书写燃料电池电极反应时，要根据电解质的酸碱性决定反应中是 H+ 还是 OH- 参与；总反应等于燃料燃烧的化学方程式。","ex":[{"q":"以 KOH 溶液为电解质的氢氧燃料电池，写出负极和正极的电极反应式及总反应式。","idea":"碱性电解质中，负极 H2 失电子生成的 H+ 与 OH- 结合为 H2O；正极 O2 得电子生成 OH-。","ans":"负极：2H2 + 4OH- - 4e- = 4H2O；正极：O2 + 2H2O + 4e- = 4OH-；总反应：2H2 + O2 = 2H2O。"},{"q":"放电时铅酸蓄电池的正极质量如何变化？电解质溶液的 pH 如何变化？","idea":"正极 PbO2 生成 PbSO4，质量增加；放电消耗 H2SO4，生成水。","ans":"正极 PbO2（M = 239）转化为 PbSO4（M = 303），质量增加；放电过程消耗 H2SO4 并生成 H2O，溶液酸性减弱，pH 增大。"}]}]},{"title":"第十章 化学反应速率与化学平衡（必修）","items":[{"name":"化学反应速率的计算","desc":"化学反应速率 v = Δc / Δt，常用单位是 mol/(L·s) 或 mol/(L·min)。同一反应中，各物质的反应速率之比等于化学方程式中的化学计量数之比。","tip":"固体和纯液体的浓度可视为常数，不用来表示反应速率；计算时注意容器体积和时间单位。","ex":[{"q":"在 2 L 密闭容器中发生反应 N2 + 3H2 ⇌ 2NH3，5 min 内 NH3 的物质的量由 0 增加到 1.2 mol。求 v(NH3) 和 v(H2)。","idea":"先求 v(NH3) = Δn / (V·Δt)，再由 v(H2) : v(NH3) = 3 : 2 求 v(H2)。","ans":"v(NH3) = 1.2 mol / (2 L × 5 min) = 0.12 mol/(L·min)；v(H2) = 0.12 × 3/2 = 0.18 mol/(L·min)。"}]},{"name":"影响化学反应速率的因素","desc":"影响化学反应速率的主要因素有：浓度（增大反应物浓度，速率加快；固体和纯液体的浓度视为常数，改变其用量不影响速率）；温度（升高温度，速率加快）；压强（只对有气体参加的反应有影响，压缩体积使压强增大，速率加快）；催化剂（降低反应活化能，同等程度加快正、逆反应速率）；固体反应物的表面积（增大接触面积，速率加快）。","tip":"恒温恒容下充入与反应无关的气体（如 He），总压强增大但各组分浓度不变，反应速率不变；恒温恒压下充入无关气体会使浓度减小，速率减慢。","ex":[{"q":"下列措施能加快锌与稀硫酸反应速率的是（ ）A. 加入 ZnSO4 固体 B. 加入少量水 C. 将锌粒改为锌粉 D. 降低温度","idea":"增大接触面积、升高温度、增大 H+ 浓度可加快反应。","ans":"选 C。锌粉增大了接触面积，速率加快；ZnSO4 不影响 H+ 浓度，加水稀释会减慢速率，降温也会减慢速率。"},{"q":"在恒温恒容的密闭容器中进行反应 N2 + 3H2 ⇌ 2NH3，若充入 He 使容器内压强增大，则反应速率如何变化？","idea":"判断是否改变反应物浓度。","ans":"速率不变。He 不参与反应，恒容时各反应物的浓度未改变，因此反应速率不变。"}]},{"name":"可逆反应与化学平衡状态的判断","desc":"可逆反应是在相同条件下，既能向正反应方向进行，又能向逆反应方向进行的反应，反应物不能完全转化。化学平衡状态的特征：正反应速率等于逆反应速率（v正 = v逆），反应体系中各组分的浓度、质量、物质的量、百分含量保持不变。若某物理量在反应过程中一直不变，则不能作为平衡标志。","tip":"判断平衡标志时要看“变量”：若某物理量在未平衡时发生变化，且平衡后保持不变，则可作为标志；如恒温恒容下气体密度始终不变，就不能作为平衡标志。","ex":[{"q":"一定温度下，恒容密闭容器中进行反应 2SO2(g) + O2(g) ⇌ 2SO3(g)，下列情况不能说明反应已达到平衡的是（ ）A. 容器内压强不再变化 B. SO3 的浓度不再变化 C. v(SO2)正 = v(SO3)逆 D. 混合气体的密度不再变化","idea":"逐项判断变量是否保持不变；恒容时混合气体总质量与体积都不变。","ans":"选 D。该反应气体物质的量减小，压强为变量，不变可判断平衡（A 对）；浓度不变是平衡标志（B 对）；C 与 v(SO2)正 = v(SO2)逆 等价，是平衡标志（C 对）；恒容时气体密度始终不变，不能作为平衡标志（D 错）。"},{"q":"对于可逆反应 A(g) + B(g) ⇌ 2C(g)，在恒温恒容下，混合气体的平均摩尔质量是否可以作为平衡标志？","idea":"平均摩尔质量 = 总质量 / 总物质的量；比较反应前后总物质的量。","ans":"不可以。反应前后气体总物质的量均不变（1+1 = 2），总质量也不变，因此平均摩尔质量始终不变，不能说明反应达到平衡。"}]}]},{"title":"第十一章 有机化合物（必修）","items":[{"name":"烷烃","desc":"烷烃是只含 C、H 两种元素、碳原子之间以单键结合的饱和链烃，通式为 CnH2n+2。烷烃的化学性质比较稳定，常温下与强酸、强碱、强氧化剂一般不反应；在光照条件下能与卤素单质发生取代反应，如 CH4 + Cl2 =（光照）CH3Cl + HCl。相邻烷烃在组成上相差一个 CH2 原子团，互为同系物。常温常压下，C1–C4 的烷烃为气体。","tip":"烷烃卤代产物有多种，取代产物是混合物；书写取代反应时，要注意卤素的个数与产物的对应关系。","ex":[{"q":"写出 CH4 与 Cl2 在光照条件下生成 CH2Cl2 的化学方程式。","idea":"每生成 1 mol CH2Cl2 需要 2 mol Cl2，同时生成 2 mol HCl。","ans":"CH4 + 2Cl2 =（光照）CH2Cl2 + 2HCl。"},{"q":"戊烷 C5H12 有几种同分异构体？分别写出其名称。","idea":"按碳链骨架的不同分类书写。","ans":"共 3 种：正戊烷 CH3CH2CH2CH2CH3、异戊烷（2-甲基丁烷）、新戊烷（2,2-二甲基丙烷）。"}]},{"name":"乙烯与加成反应","desc":"乙烯的分子式为 C2H4，结构简式为 CH2=CH2，分子中含有碳碳双键，为平面形分子。乙烯能使溴水和酸性 KMnO4 溶液褪色。主要反应有加成反应：CH2=CH2 + Br2 → CH2Br-CH2Br；CH2=CH2 + H2O →（催化剂，加热、加压）CH3CH2OH；加聚反应：nCH2=CH2 →（催化剂）-[CH2-CH2]n-（聚乙烯）。","tip":"鉴别甲烷与乙烯时，不能用酸性 KMnO4 溶液除杂，因为乙烯被氧化会生成 CO2 引入新杂质；除去甲烷中的乙烯应用溴水洗气。","ex":[{"q":"写出乙烯与溴的加成反应方程式，并计算标准状况下 2.24 L 乙烯完全加成需要 Br2 多少克？","idea":"加成比例为 1:1；n(C2H4) = V / Vm。","ans":"CH2=CH2 + Br2 → CH2Br-CH2Br。n(C2H4) = 2.24 / 22.4 = 0.1 mol，需 n(Br2) = 0.1 mol，m(Br2) = 0.1 × 160 = 16 g。"},{"q":"如何用化学方法鉴别甲烷与乙烯？","idea":"乙烯含碳碳双键，能发生加成反应或被氧化。","ans":"将两种气体分别通入溴的四氯化碳溶液或溴水中，能使溴水褪色的是乙烯，无明显变化的是甲烷。"}]},{"name":"苯的结构与性质","desc":"苯的分子式为 C6H6，分子为平面正六边形结构，6 个碳碳键完全相同，介于碳碳单键与双键之间。苯不能使酸性 KMnO4 溶液褪色，在常温下不与溴水发生加成反应（溴被萃取到苯层）。在 FeBr3 催化下，苯与液溴发生取代反应：C6H6 + Br2 →（FeBr3）C6H5Br + HBr；与浓硝酸、浓硫酸的混合酸在 50–60 ℃ 发生硝化反应：C6H6 + HNO3 →（浓硫酸，50–60 ℃）C6H5NO2 + H2O。苯在催化剂加热条件下可与 H2 加成生成环己烷。","tip":"苯与溴水混合振荡时发生萃取而非反应，静置后分层，上层为橙红色的溴苯层，下层为无色水层。","ex":[{"q":"苯与溴水混合振荡、静置后，观察到的现象是什么？","idea":"苯与溴水不反应，但能萃取溴。苯的密度小于水。","ans":"溶液分层：上层（苯层）为橙红色，下层（水层）近无色。"},{"q":"写出苯与浓硝酸反应的化学方程式，并说明浓硫酸的作用。","idea":"硝基取代苯环上的一个氢原子。","ans":"C6H6 + HNO3 →（浓硫酸，50–60 ℃）C6H5NO2 + H2O。浓硫酸作催化剂，同时吸收反应生成的水，使平衡正向移动。"}]},{"name":"乙醇、乙酸与酯化反应","desc":"乙醇含有羟基（−OH），可与金属钠反应放出 H2。乙酸含有羧基（−COOH），具有弱酸性。在浓硫酸作用下加热，乙酸与乙醇发生酯化反应生成乙酸乙酯：CH3COOH + CH3CH2OH ⇌ CH3COOCH2CH3 + H2O。","tip":"酯化反应是可逆反应；浓硫酸作催化剂和吸水剂；饱和碳酸钠溶液用于收集乙酸乙酯并除去乙酸和乙醇。","ex":[{"q":"用 6 g 乙酸与足量乙醇反应，假设产率为 100%，理论上可生成乙酸乙酯多少克？（M(CH3COOH) = 60 g/mol，M(CH3COOCH2CH3) = 88 g/mol）","idea":"酯化反应中乙酸与乙酸乙酯的物质的量之比为 1 : 1，乙醇过量，以乙酸计算。","ans":"n(CH3COOH) = 6 / 60 = 0.1 mol，生成乙酸乙酯 0.1 mol，质量为 0.1 × 88 = 8.8 g。"},{"q":"用 18O 标记乙醇分子中的羟基氧原子后发生酯化反应，写出反应方程式，并说明 18O 出现在哪种产物中。","idea":"酯化反应中，羧酸脱去 -OH，醇脱去羟基上的 H，因此醇中的氧原子进入酯分子。","ans":"CH3COOH + CH3CH2-18OH ⇌（浓硫酸，△）CH3COOCH2CH3 + H2O。18O 进入乙酸乙酯中，生成的水中不含 18O。"}]},{"name":"糖类、油脂与蛋白质","desc":"糖类包括单糖（葡萄糖 C6H12O6、果糖）、二糖（蔗糖、麦芽糖）和多糖（淀粉、纤维素）。葡萄糖是多羟基醛，能发生银镜反应，与新制 Cu(OH)2 加热生成砖红色沉淀。淀粉、纤维素水解最终得到葡萄糖：(C6H10O5)n + nH2O →（催化剂）nC6H12O6。油脂是高级脂肪酸与甘油形成的酯，酸性水解得甘油和高级脂肪酸，碱性水解（皂化）得到肥皂的主要成分。蛋白质水解最终得到氨基酸；盐析是可逆过程，加热、重金属盐等可使蛋白质变性（不可逆）。","tip":"检验淀粉用碘水，溶液变蓝；检验水解液中的葡萄糖前，需先加入 NaOH 中和硫酸，再加入新制 Cu(OH)2 或银氨溶液。","ex":[{"q":"写出葡萄糖与银氨溶液反应的化学方程式。","idea":"醛基被氧化为羧基（以铵盐形式存在），Ag+ 被还原为 Ag。","ans":"CH2OH(CHOH)4CHO + 2Ag(NH3)2OH =（△）CH2OH(CHOH)4COONH4 + 2Ag↓ + 3NH3 + H2O。"},{"q":"如何证明淀粉已经完全水解？如何证明淀粉水解产物中含有葡萄糖？","idea":"淀粉遇碘变蓝，水解完全则不再变蓝；葡萄糖有还原性，需在碱性条件下检验。","ans":"取少量水解液加入碘水，不变蓝，说明淀粉已完全水解。另取水解液，先加 NaOH 溶液中和硫酸，再加入银氨溶液水浴加热，出现银镜，说明含有葡萄糖。"}]}]},{"title":"第十二章 化学实验基础","items":[{"name":"常见化学仪器与基本操作","desc":"可直接加热的仪器有试管、蒸发皿、坩埚；需要垫石棉网加热的有烧杯、烧瓶、锥形瓶。计量仪器中，量筒精确到 0.1 mL，不能用于配制溶液或作反应容器；容量瓶用于配制一定物质的量浓度溶液，不能加热；滴定管精确到 0.01 mL，酸式滴定管盛装酸性溶液和氧化性溶液，碱式滴定管盛装碱性溶液；托盘天平精确到 0.1 g。分液漏斗用于分液与萃取。","tip":"量取液体时，应选择能一次量取且与所需体积最接近的量器，以减小误差；读数时视线要与凹液面最低处相平。","ex":[{"q":"下列仪器中能加热但需要垫石棉网的是（ ）A. 试管 B. 烧杯 C. 容量瓶 D. 量筒","idea":"烧杯受热面积大，需要垫石棉网均匀受热；容量瓶与量筒不能加热。","ans":"选 B。试管可直接加热；容量瓶和量筒不能加热。"},{"q":"现需量取 8.6 mL 浓盐酸，应选用下列哪种仪器？A. 10 mL 量筒 B. 50 mL 量筒 C. 100 mL 量筒 D. 50 mL 烧杯","idea":"选择与所需体积最接近的量筒，减小误差。","ans":"选 A。10 mL 量筒的精度与量程最符合要求；50 mL 与 100 mL 量筒误差较大，烧杯精度差，不能用于准确量取。"}]},{"name":"物质的分离与提纯","desc":"常用的分离提纯方法有：过滤（分离不溶性固体与液体）；蒸发结晶（分离可溶性固体与溶剂，如从 NaCl 溶液中获得 NaCl）；蒸馏（利用沸点差异分离液体混合物，如乙醇与水的分离，温度计水银球置于蒸馏烧瓶支管口处）；萃取与分液（利用溶质在互不相溶的两种溶剂中溶解度的差异，如用 CCl4 萃取碘水，下层为紫红色）。除杂原则为：不增（不引入新杂质）、不减（不减少被提纯物质）、易分离、易复原。","tip":"分液时，下层液体从下口放出，上层液体从上口倒出；蒸发时不能蒸干，应在出现大量晶体时停止加热，利用余热蒸干。","ex":[{"q":"除去 NaCl 溶液中含有的少量 Na2SO4 与 CaCl2 杂质，写出加入试剂的顺序、有关离子方程式及操作步骤。","idea":"加入过量 BaCl2 除去 SO4^2-，过量 Na2CO3 除去 Ca2+ 与过量 Ba2+，过滤后用盐酸除去过量 CO3^2-。","ans":"加入过量 BaCl2：Ba2+ + SO4^2- = BaSO4↓；加入过量 Na2CO3：Ca2+ + CO3^2- = CaCO3↓，Ba2+ + CO3^2- = BaCO3↓；过滤后加适量盐酸：CO3^2- + 2H+ = CO2↑ + H2O，再蒸发结晶得 NaCl。"},{"q":"如何分离乙醇（沸点 78 ℃）与水（沸点 100 ℃）组成的混合液？","idea":"乙醇与水互溶，沸点差异较大，可用蒸馏法分离。","ans":"采用蒸馏法：将混合液加入蒸馏烧瓶中，加热至 78 ℃ 左右，收集馏分，即可得到较纯的乙醇。"}]},{"name":"常见离子的检验","desc":"SO4^2-：先加稀盐酸酸化（排除 CO3^2-、SO3^2-、Ag+ 的干扰），再加 BaCl2 溶液，产生白色沉淀。Cl-：加入 AgNO3 溶液产生白色沉淀，再加稀硝酸，沉淀不溶解。CO3^2-：加稀盐酸产生无色无味气体，通入澄清石灰水变浑浊。NH4+：加入浓 NaOH 溶液并加热，生成使湿润红色石蕊试纸变蓝的气体。Fe3+：加入 KSCN 溶液，溶液变血红色。","tip":"检验 SO4^2- 时不能用硝酸酸化，因为硝酸会把 SO3^2- 氧化为 SO4^2-，造成误判。","ex":[{"q":"某溶液中加入稀盐酸无明显现象，再加入 BaCl2 溶液产生白色沉淀，则该溶液中一定含有什么离子？","idea":"先排除 Ag+ 与 CO3^2-、SO3^2- 的干扰。","ans":"一定含有 SO4^2-。加入盐酸无沉淀，排除 Ag+；加入 BaCl2 产生的白色沉淀为 BaSO4，因此含有 SO4^2-。"},{"q":"如何用一种试剂区分 Na2CO3 与 NaHCO3 溶液？","idea":"利用 CO3^2- 与 Ca2+ 生成沉淀，而 HCO3- 不能。","ans":"加入 CaCl2 溶液，产生白色沉淀的是 Na2CO3，无沉淀的是 NaHCO3（Na2CO3 + CaCl2 = CaCO3↓ + 2NaCl）。"}]},{"name":"实验安全与意外事故处理","desc":"实验时应遵守安全规则：浓硫酸稀释时，应将浓硫酸沿器壁慢慢注入水中并不断搅拌；酒精灯应用灯帽盖灭，不能用嘴吹灭；闻气体时不能直接用鼻子对准瓶口，应用手在瓶口轻扇；金属钠等活泼物质不能与水接触，剩余药品不能放回原瓶，也不能随意丢弃；皮肤沾上浓硫酸，应先用干布擦去，再用大量水冲洗，最后涂上 3%–5% 的 NaHCO3 溶液；皮肤沾上碱液，应用大量水冲洗后涂硼酸溶液。有毒气体（如 Cl2、SO2）应用 NaOH 溶液吸收。","tip":"稀释浓硫酸时切不可将水倒入浓硫酸中，否则会因放热而溅出，造成伤害。","ex":[{"q":"实验室不慎将少量浓硫酸沾到皮肤上，应如何处理？","idea":"浓硫酸具有强腐蚀性和脱水性，应先除去大部分硫酸，再用水冲洗，最后中和。","ans":"应先用干布擦去浓硫酸，再用大量水冲洗，最后涂上 3%–5% 的 NaHCO3 溶液。"},{"q":"下列实验操作正确的是（ ）A. 将 NaOH 固体直接放在托盘天平的纸片上称量 B. 闻气体时用鼻子直接对准瓶口 C. 用灯帽熄灭酒精灯 D. 给试管中的液体加热时，试管口朝向自己或他人","idea":"逐项对照实验安全规则。","ans":"选 C。NaOH 易潮解且腐蚀性强，应放在小烧杯中称量（A 错）；闻气体应用手扇闻（B 错）；加热时试管口不能对着人（D 错）；用灯帽盖灭酒精灯是正确操作（C 对）。"}]}]},{"title":"第十三章 化学反应的热效应","items":[{"name":"反应热与焓变","desc":"化学反应过程中吸收或放出的热量称为反应热。在恒压条件下，反应热等于焓变 ΔH，ΔH = H(生成物) - H(反应物)。ΔH < 0 为放热反应，ΔH > 0 为吸热反应。常见放热反应有燃烧、中和反应、金属与酸反应、大多数化合反应；常见吸热反应有 Ba(OH)2·8H2O 与 NH4Cl 反应、C 与 CO2 高温生成 CO、大多数分解反应。化学反应的本质是旧键断裂吸收能量、新键形成释放能量，ΔH = 反应物键能总和 - 生成物键能总和。","tip":"放热反应的 ΔH 为负，吸热反应的 ΔH 为正；反应物总能量高于生成物总能量时为放热反应。","ex":[{"q":"已知断开 1 mol H-H 键吸收 436 kJ，断开 1 mol Cl-Cl 键吸收 243 kJ，形成 1 mol H-Cl 键放出 431 kJ。求 H2(g) + Cl2(g) = 2HCl(g) 的 ΔH。","idea":"ΔH = 反应物键能之和 - 生成物键能之和；注意 2 mol HCl 含 2 mol H-Cl 键。","ans":"ΔH = (436 + 243) - 2 × 431 = 679 - 862 = -183 kJ/mol，为放热反应。"},{"q":"下列变化属于吸热反应的是（ ）A. 镁条与盐酸反应 B. 木炭在氧气中燃烧 C. 碳酸钙高温分解 D. 氢氧化钠与盐酸中和","idea":"常见吸热反应包括大多数分解反应和 C 参与的高温还原反应。","ans":"选 C。CaCO3 高温分解为 CaO 与 CO2 需持续吸热；A、B、D 均为放热反应。"}]},{"name":"热化学方程式","desc":"表示参加反应物质的量和反应热关系的化学方程式叫热化学方程式。书写要点：(1) 必须注明各物质的聚集状态（s、l、g、aq）；(2) ΔH 的单位为 kJ/mol，数值与化学计量数对应，化学计量数可为分数；(3) ΔH 的正负号与数值必须与方程式一致；(4) 不标注反应条件（如加热）时默认为常温常压下的数据。例如：H2(g) + 1/2 O2(g) = H2O(l)  ΔH = -285.8 kJ/mol。","tip":"同一反应，化学计量数加倍，ΔH 也加倍；逆反应的 ΔH 数值相等、符号相反。","ex":[{"q":"1 mol C2H5OH(l) 完全燃烧生成 CO2(g) 和 H2O(l)，放出 1366.8 kJ 热量。写出该反应的热化学方程式。","idea":"配平后以 1 mol 乙醇为基准，标注聚集状态，焓变为负值。","ans":"C2H5OH(l) + 3O2(g) = 2CO2(g) + 3H2O(l)  ΔH = -1366.8 kJ/mol。"},{"q":"已知 2H2(g) + O2(g) = 2H2O(l)  ΔH = -571.6 kJ/mol。则 H2O(l) = H2(g) + 1/2 O2(g) 的 ΔH 是多少？若生成 9 g 液态水需要吸收多少热量？","idea":"逆反应焓变符号相反，数值按化学计量数缩放；9 g 水为 0.5 mol。","ans":"正向 ΔH = -285.8 kJ/mol，逆向 ΔH = +285.8 kJ/mol。生成 9 g H2O(l) 为 0.5 mol 的逆反应，需吸收 0.5 × 285.8 = 142.9 kJ 热量。"}]},{"name":"盖斯定律及其应用","desc":"化学反应的焓变只与反应的始态和终态有关，与反应途径无关。利用盖斯定律，可将若干已知热化学方程式通过加减组合得到目标方程式，其 ΔH 也进行相应的加减。计算步骤：先确定目标方程式中各物质所在位置，再按系数乘除已知方程式，最后将 ΔH 同步处理。","tip":"方程式乘以系数时 ΔH 同乘该系数；方程式反向时 ΔH 变号。","ex":[{"q":"已知：(1) C(s) + O2(g) = CO2(g)  ΔH1 = -393.5 kJ/mol；(2) CO(g) + 1/2 O2(g) = CO2(g)  ΔH2 = -283.0 kJ/mol。求 C(s) + 1/2 O2(g) = CO(g) 的 ΔH3。","idea":"目标式 = (1) - (2)，焓变同样相减。","ans":"ΔH3 = ΔH1 - ΔH2 = -393.5 - (-283.0) = -110.5 kJ/mol。"},{"q":"已知：(1) C(s) + O2(g) = CO2(g)  ΔH1 = -393.5 kJ/mol；(2) 2CO(g) + O2(g) = 2CO2(g)  ΔH2 = -566.0 kJ/mol。求 C(s) + 1/2 O2(g) = CO(g) 的 ΔH3。","idea":"目标式 = (1) - (2)/2，焓变同样按系数处理。","ans":"ΔH3 = ΔH1 - ΔH2/2 = -393.5 - (-566.0)/2 = -393.5 + 283.0 = -110.5 kJ/mol。"}]}]},{"title":"第十四章 化学反应速率与化学平衡（选择性必修）","items":[{"name":"勒夏特列原理与平衡移动","desc":"如果改变影响平衡的一个条件（浓度、压强、温度），平衡会向着减弱这种改变的方向移动。增大反应物浓度、降低温度、增大压强（反应前后气体分子数减小的方向）等会使平衡向相应方向移动。催化剂只改变反应速率，不影响平衡位置。","tip":"恒容时充入惰性气体，各物质浓度不变，平衡不移动；恒压时充入惰性气体，相当于减小压强。","ex":[{"q":"反应 2SO2 + O2 ⇌ 2SO3 的 ΔH < 0。为提高 SO2 的转化率，可采取哪些措施？","idea":"放热反应降温平衡正向移动；正反应气体分子数减少，加压平衡正向移动；增大 O2 浓度或移走 SO3 也可使平衡正向移动。","ans":"降低温度、增大压强、增大 O2 的浓度或及时移走 SO3。使用催化剂不能提高 SO2 的转化率。"}]},{"name":"化学平衡常数 K","desc":"在一定温度下，可逆反应达到平衡时，生成物浓度幂之积与反应物浓度幂之积的比值是一个常数，称为平衡常数 K。对于 aA + bB ⇌ cC + dD，K = c(C)^c · c(D)^d / (c(A)^a · c(B)^b)。固体和纯液体不写入表达式。K 只随温度变化。","tip":"K 越大，反应进行得越彻底；用浓度商 Q 与 K 比较，可判断反应进行的方向。","ex":[{"q":"某温度下，在 1 L 密闭容器中反应 CO(g) + H2O(g) ⇌ CO2(g) + H2(g) 达到平衡，测得 c(CO) = 0.2 mol/L，c(H2O) = 0.3 mol/L，c(CO2) = 0.3 mol/L，c(H2) = 0.3 mol/L。求该温度下的平衡常数 K。","idea":"K = 生成物浓度幂之积 / 反应物浓度幂之积，各物质化学计量数均为 1。","ans":"K = c(CO2)·c(H2) / (c(CO)·c(H2O)) = (0.3 × 0.3) / (0.2 × 0.3) = 1.5。"}]},{"name":"化学平衡图像与三段式计算","desc":"平衡图像常见类型有：浓度-时间图（反应开始时反应物浓度下降、生成物上升，达平衡后不再变化）；速率-时间图（改变条件瞬间速率出现跳跃则为该条件变化，如升温、加压，且 v 正、v 逆变化方向反映平衡移动方向）；含量-温度/压强图（先拐先平，数值大则条件强）。三段式法：列出起始量、变化量、平衡量，利用变化量之比等于化学计量数之比进行计算，从而求转化率、平衡常数、体积分数等。转化率 = 转化的量 / 起始量 × 100%。","tip":"“先拐先平数值大”：在含量-时间图中，拐点先出现的曲线对应温度或压强更高。","ex":[{"q":"在 2 L 密闭容器中，充入 2 mol N2 与 6 mol H2，在一定条件下发生反应 N2 + 3H2 ⇌ 2NH3，5 min 后达到平衡，测得 NH3 为 1.2 mol。求 N2 的转化率及 0~5 min 内 v(H2)。","idea":"用三段式：生成 1.2 mol NH3 需消耗 0.6 mol N2、1.8 mol H2。","ans":"消耗 N2 0.6 mol，转化率 = 0.6/2 × 100% = 30%。消耗 H2 1.8 mol，v(H2) = 1.8 mol / 2 L / 5 min = 0.18 mol·L⁻¹·min⁻¹。"},{"q":"某反应 A(g) + B(g) ⇌ 2C(g) 在不同温度下 C 的体积分数随时间变化的图像显示：T1 曲线先达到平衡，且平衡时 C 的体积分数比 T2 时更高。判断该反应的热效应。","idea":"先拐先平则温度高；由平衡移动判断焓变符号。","ans":"T1 先平衡说明 T1 > T2；T1 时 C 的含量更高，说明升温平衡向生成 C 的方向移动，即正反应吸热，ΔH > 0。"}]},{"name":"化学平衡的特征与状态判断","desc":"可逆反应在一定条件下，正反应速率与逆反应速率相等，反应体系中各组分浓度保持不变，称为化学平衡状态。判断依据：(1) v 正 = v 逆（同一物质的生成速率等于消耗速率，或不同物质速率之比等于化学计量数之比且方向相反）；(2) 各组分的浓度、质量分数、物质的量等保持不变；(3) 对于气体反应物质的量或总压、平均相对分子质量在气体分子数变化的反应中保持不变。平衡状态是动态平衡，正逆反应仍在进行。","tip":"若反应前后气体分子数相等，压强和总物质的量始终不变，不能作为平衡标志。","ex":[{"q":"在恒温恒容密闭容器中发生反应 A(s) + 2B(g) ⇌ C(g) + D(g)，下列能说明反应达到平衡的是（ ）A. 混合气体的密度不变 B. 混合气体的压强不变 C. B 的物质的量浓度不变 D. 单位时间内生成 1 mol C 的同时消耗 2 mol B","idea":"A 为固体，气体总质量随反应变化，因此密度是判据；反应前后气体分子数相等，压强恒定，不能作判据。","ans":"选 AC。A 项：气体总质量变化而体积不变，密度不变说明总质量不变，即平衡；B 项：气体分子数前后均为 2，压强始终不变，不能判断；C 项：B 浓度不变即平衡；D 项：生成 C 与消耗 B 均为正反应方向，不能判断。"},{"q":"在一定温度下的恒容容器中发生反应 2NO2(g) ⇌ N2O4(g)，下列情况中一定说明达到平衡的是（ ）A. 颜色不再变化 B. 混合气体的平均相对分子质量不变 C. 2v 正(NO2) = v 逆(N2O4) D. 体系压强不变","idea":"颜色由 NO2 浓度决定；平均摩尔质量 = 总质量/总物质的量，总质量不变时随 n 变化。","ans":"选 ABD。A：颜色由 NO2 浓度决定，颜色不变即浓度不变，为平衡标志；B：总质量不变，平均相对分子质量仅随总物质的量变化，不变即平衡；C：平衡时应满足 v 正(NO2) = 2v 逆(N2O4)，题中 2v 正(NO2) = v 逆(N2O4) 不满足；D：反应前后气体分子数不等，恒容时压强随总物质的量变化，压强不变即平衡。"}]}]},{"title":"第十五章 水溶液中的离子平衡（选择性必修）","items":[{"name":"弱电解质的电离与溶液的pH","desc":"弱电解质（如 CH3COOH、NH3·H2O）在水中只部分电离，存在电离平衡，如 CH3COOH ⇌ CH3COO⁻ + H⁺。pH = −lg c(H⁺)。25 ℃ 时，水的离子积 Kw = c(H⁺)·c(OH⁻) = 1×10⁻¹⁴；pH < 7 为酸性，pH = 7 为中性，pH > 7 为碱性。","tip":"强酸、强碱溶液可直接由浓度求 c(H⁺) 或 c(OH⁻)；弱酸、弱碱溶液中 c(H⁺) 远小于酸的浓度，不能直接用酸的浓度计算。","ex":[{"q":"分别求 0.01 mol/L HCl 溶液和 0.01 mol/L NaOH 溶液的 pH（25 ℃）。","idea":"HCl 是强酸，c(H⁺) = 0.01 mol/L；NaOH 是强碱，先求 c(OH⁻)，再由 Kw 求 c(H⁺)。","ans":"HCl：c(H⁺) = 10⁻² mol/L，pH = 2。NaOH：c(OH⁻) = 10⁻² mol/L，c(H⁺) = 10⁻¹² mol/L，pH = 12。"}]},{"name":"盐类的水解","desc":"盐电离出的离子与水电离出的 H⁺ 或 OH⁻ 结合生成弱电解质，从而促进水的电离。强碱弱酸盐（如 CH3COONa、Na2CO3）溶液显碱性，强酸弱碱盐（如 NH4Cl）溶液显酸性，强酸强碱盐（如 NaCl）溶液显中性。水解是可逆的，程度通常很小。","tip":"多元弱酸盐分步水解，以第一步为主，如 CO3²⁻ + H2O ⇌ HCO3⁻ + OH⁻；记住“谁弱谁水解，谁强显谁性”。","ex":[{"q":"判断 NH4Cl、Na2CO3、NaCl 水溶液的酸碱性，并写出 NH4Cl 水解的离子方程式。","idea":"看盐由哪种酸、哪种碱生成：弱碱阳离子水解显酸性，弱酸阴离子水解显碱性。","ans":"NH4Cl 溶液显酸性；Na2CO3 溶液显碱性；NaCl 溶液显中性。NH4Cl 水解：NH4⁺ + H2O ⇌ NH3·H2O + H⁺。"}]},{"name":"水的电离与离子积常数 Kw","desc":"水是极弱的电解质，H2O ⇌ H⁺ + OH⁻，在 25 ℃ 时 c(H⁺) = c(OH⁻) = 1.0 × 10⁻⁷ mol/L，离子积 Kw = c(H⁺)·c(OH⁻) = 1.0 × 10⁻¹⁴。Kw 只与温度有关，水的电离是吸热过程，升温 Kw 增大。向水中加入酸或碱会抑制水的电离，加入能水解的盐则促进水的电离。pH = -lg c(H⁺)，溶液呈中性时 pH = 7（25 ℃），酸性时 pH < 7，碱性时 pH > 7。","tip":"判断溶液酸碱性应比较 c(H⁺) 与 c(OH⁻)，而非仅看 pH 数值，高温下中性 pH 小于 7。","ex":[{"q":"25 ℃ 时，0.01 mol/L 的 NaOH 溶液中由水电离出的 c(H⁺) 是多少？","idea":"碱溶液中 H⁺ 全部来自水的电离，用 Kw 求 c(H⁺)。","ans":"溶液中 c(OH⁻) = 0.01 mol/L，c(H⁺) = Kw / c(OH⁻) = 1.0 × 10⁻¹⁴ / 0.01 = 1.0 × 10⁻¹² mol/L，即水电离出的 c(H⁺) = 1.0 × 10⁻¹² mol/L。"},{"q":"100 ℃ 时 Kw = 1.0 × 10⁻¹²，该温度下 pH = 6 的纯水是否呈中性？求 pH = 2 的盐酸与 pH = 10 的 NaOH 溶液等体积混合后的 pH（100 ℃）。","idea":"中性条件下 c(H⁺) = c(OH⁻) = √Kw；混合后按过量碱计算 c(OH⁻)，再换算 pH。","ans":"100 ℃ 纯水 c(H⁺) = c(OH⁻) = √(1.0 × 10⁻¹²) = 1.0 × 10⁻⁶ mol/L，pH = 6 即为中性。pH = 2 的盐酸 c(H⁺) = 10⁻² mol/L；pH = 10 的 NaOH 中 c(H⁺) = 10⁻¹⁰，故 c(OH⁻) = Kw / c(H⁺) = 10⁻¹² / 10⁻¹⁰ = 10⁻² mol/L。二者等体积恰好完全中和，溶液呈中性，c(H⁺) = 10⁻⁶ mol/L，pH = 6。"}]},{"name":"沉淀溶解平衡与溶度积 Ksp","desc":"难溶电解质在水中存在溶解平衡：沉淀与溶解速率相等时达到平衡。例如 AgCl(s) ⇌ Ag⁺(aq) + Cl⁻(aq)，溶度积 Ksp = c(Ag⁺)·c(Cl⁻)，只与温度有关。比较 Q（离子积）与 Ksp：Q > Ksp 时生成沉淀，Q = Ksp 时饱和，Q < Ksp 时沉淀溶解。沉淀转化的实质是溶解度更小的物质转化为更难溶的物质，如 AgCl 转化为 AgI。利用沉淀溶解平衡可进行沉淀的生成、溶解与转化，如用 Na2S 除去废水中的 Cu²⁺、Hg²⁺。","tip":"Ksp 仅与温度有关；同类型难溶物可直接比较 Ksp 大小，不同类型需计算溶解度。","ex":[{"q":"已知 25 ℃ 时 Ksp(AgCl) = 1.8 × 10⁻¹⁰，将 0.001 mol/L 的 AgNO3 溶液与等体积 0.002 mol/L 的 NaCl 溶液混合，能否生成 AgCl 沉淀？","idea":"混合后 c 减半，计算 Q = c(Ag⁺)·c(Cl⁻) 并与 Ksp 比较。","ans":"混合后 c(Ag⁺) = 0.0005 mol/L，c(Cl⁻) = 0.001 mol/L，Q = 5 × 10⁻⁴ × 1 × 10⁻³ = 5 × 10⁻⁷ > Ksp，因此有 AgCl 沉淀生成。"},{"q":"已知 Ksp(BaSO4) = 1.1 × 10⁻¹⁰，Ksp(BaCO3) = 2.6 × 10⁻⁹。向 BaSO4 悬浊液中加入饱和 Na2CO3 溶液能否转化为 BaCO3？写出离子方程式并计算平衡常数 K = Ksp(BaSO4)/Ksp(BaCO3)。","idea":"沉淀转化方向由 K 大小决定，K 较大时易转化；K = c(SO4²⁻)/c(CO3²⁻) 的平衡关系。","ans":"BaSO4(s) + CO3²⁻(aq) ⇌ BaCO3(s) + SO4²⁻(aq)。K = Ksp(BaSO4)/Ksp(BaCO3) = 1.1 × 10⁻¹⁰ / 2.6 × 10⁻⁹ ≈ 0.042，较小，需高浓度 Na2CO3 才能部分转化；在饱和 Na2CO3 中可以实现转化（工业上用饱和 Na2CO3 处理重晶石）。"}]},{"name":"酸碱中和滴定","desc":"用已知浓度的标准溶液测定未知溶液浓度的方法。以 HCl 滴定 NaOH 为例：c(待测) = c(标准) × V(标准) / V(待测)。主要仪器：酸式滴定管（盛酸、氧化性溶液）、碱式滴定管（盛碱）、锥形瓶、滴定管夹。指示剂：强酸强碱滴定可用甲基橙或酚酞；终点判断：当滴入最后半滴标准液，溶液颜色发生变化且半分钟内不恢复，即为滴定终点。误差分析：根据 c(待测) = c(标准) × V(标准) / V(待测)，判断 V(标准) 偏大则测定结果偏高。","tip":"锥形瓶不能用待测液润洗；滴定管装液前需用标准液润洗 2~3 次，否则结果偏高。","ex":[{"q":"用 0.1000 mol/L 的 HCl 滴定 20.00 mL 未知浓度的 NaOH 溶液，消耗 HCl 体积为 18.50 mL，求 NaOH 的浓度。","idea":"中和反应 H⁺ + OH⁻ = H2O，n(H⁺) = n(OH⁻)。","ans":"n(HCl) = 0.1000 × 0.01850 = 1.850 × 10⁻³ mol，n(NaOH) = 1.850 × 10⁻³ mol，c(NaOH) = 1.850 × 10⁻³ / 0.02000 = 0.0925 mol/L。"},{"q":"某同学滴定前用待测 NaOH 润洗了锥形瓶，则测定结果偏高还是偏低？若滴定管未用标准液润洗，结果如何变化？","idea":"锥形瓶残留待测液会使溶质增多；滴定管被稀释则耗液增多。","ans":"锥形瓶用待测液润洗会使待测溶质物质的量偏多，消耗标准液增多，结果偏高。滴定管未用标准液润洗相当于标准液被稀释，消耗体积增大，结果偏高。"}]}]},{"title":"第十六章 电化学（选择性必修）","items":[{"name":"电解池","desc":"电解池把电能转化为化学能。与电源负极相连的是阴极，发生还原反应；与电源正极相连的是阳极，发生氧化反应。电解饱和食盐水的总反应为：2NaCl + 2H2O =(通电) 2NaOH + H2↑ + Cl2↑。","tip":"惰性电极（如石墨、Pt）只让溶液中的离子放电；活性电极（如 Cu）在阳极本身被氧化。","ex":[{"q":"用石墨电极电解 CuSO4 溶液，写出阴极反应、阳极反应和总反应方程式。","idea":"阴极上 Cu²⁺ 得电子；阳极上溶液中的 OH⁻（来自水）失电子生成 O2。","ans":"阴极：Cu²⁺ + 2e⁻ = Cu；阳极：2H2O − 4e⁻ = O2↑ + 4H⁺；总反应：2CuSO4 + 2H2O =(通电) 2Cu + O2↑ + 2H2SO4。"}]},{"name":"电解原理的应用","desc":"电解在工业上应用广泛：(1) 氯碱工业：电解饱和食盐水，阳极 2Cl⁻ - 2e⁻ = Cl2↑，阴极 2H2O + 2e⁻ = H2↑ + 2OH⁻，总反应 2NaCl + 2H2O =（电解）= 2NaOH + H2↑ + Cl2↑；离子交换膜只允许 Na⁺ 通过。(2) 电解精炼铜：粗铜作阳极，纯铜作阴极，CuSO4 溶液作电解质，阳极溶解的杂质如 Zn、Fe 进入溶液，Au、Ag 等沉积为阳极泥。(3) 电镀：镀件作阴极，镀层金属作阳极，电解质溶液含镀层金属离子。(4) 电冶金：电解熔融 NaCl 制 Na：阴极 2Na⁺ + 2e⁻ = 2Na，阳极 2Cl⁻ - 2e⁻ = Cl2↑。","tip":"电解水溶液时，阴极先放电的是氧化性强的阳离子（Ag⁺ > Cu²⁺ > H⁺），阳极先放电的是还原性强的阴离子（I⁻ > Br⁻ > Cl⁻ > OH⁻）。","ex":[{"q":"用石墨电极电解 CuSO4 溶液，写出阴、阳极的电极反应及总反应方程式。","idea":"阴极 Cu²⁺ 放电，阳极 OH⁻（水）放电生成 O2。","ans":"阴极：2Cu²⁺ + 4e⁻ = 2Cu；阳极：2H2O - 4e⁻ = O2↑ + 4H⁺；总反应：2CuSO4 + 2H2O =（电解）= 2Cu + O2↑ + 2H2SO4。"},{"q":"电解精炼铜时，若阳极（粗铜）中含有 Zn、Fe、Ag、Au 等杂质，下列说法正确的是（ ）A. 阳极减少的质量等于阴极增加的质量 B. Ag 与 Au 沉积在阳极泥中 C. 电解质溶液中 Cu²⁺ 浓度基本不变 D. 阴极只析出 Zn","idea":"阳极 Zn、Fe 先于 Cu 失电子，Ag、Au 不溶解形成阳极泥；阴极只析出 Cu。","ans":"选 B、C。A 错，阳极溶解的包括 Zn、Fe 等，质量不等；B 对；C 对，因溶解的 Cu 与析出的 Cu 基本等量；D 错，阴极只析出 Cu。"}]},{"name":"金属的腐蚀与防护","desc":"金属腐蚀分为化学腐蚀与电化学腐蚀，后者更为常见。在潮湿空气中，钢铁发生吸氧腐蚀：负极 2Fe - 4e⁻ = 2Fe²⁺，正极 O2 + 2H2O + 4e⁻ = 4OH⁻，Fe²⁺ 与 OH⁻ 进一步生成 Fe(OH)2，再被氧化为铁锈 Fe2O3·xH2O。在酸性较强的条件下发生析氢腐蚀：正极 2H⁺ + 2e⁻ = H2↑。防护方法：(1) 改变金属内部结构（合金）；(2) 覆盖保护层（涂漆、镀层）；(3) 电化学保护：牺牲阳极法，使被保护金属作正极，如船体装锌块；外加电流法，被保护金属接电源负极。","tip":"同一金属在不同条件下的腐蚀速率：电解池阳极 > 原电池负极 > 化学腐蚀 > 原电池正极（被保护）。","ex":[{"q":"将铁钉分别放入：①干燥空气中；②食盐水中；③纯水中，腐蚀速率由快到慢的顺序是什么？","idea":"电解质溶液加快电化学腐蚀，干燥环境几乎不腐蚀。","ans":"②>③>①。食盐水为强电解质溶液，导电性好，腐蚀最快；纯水弱导电，仍发生吸氧腐蚀但较慢；干燥空气中缺少电解质与水，几乎不腐蚀。"},{"q":"为保护海上钢铁船体，在船身连接锌块，这种保护方法属于什么？写出正极和负极的电极反应。","idea":"锌比铁活泼，锌作负极被牺牲，钢铁作正极得到保护。","ans":"属于牺牲阳极的阴极保护法。负极：Zn - 2e⁻ = Zn²⁺；正极（海水中吸氧）：O2 + 2H2O + 4e⁻ = 4OH⁻。"}]},{"name":"电解的计算","desc":"电解计算的核心是电子守恒：在各电极上转移的电子的物质的量相等。法拉第常数 F ≈ 96500 C/mol，电量 Q = I·t，转移电子物质的量 n(e⁻) = Q / F。根据电极反应式计算各产物的量。例如电解 CuSO4 溶液，阴极析出 Cu 与阳极产生 O2 满足 n(Cu) × 2 = n(O2) × 4。若电解后溶液需加入某物质复原，遵循“缺什么补什么”的原则，补充量为析出物的组成。","tip":"复原问题应以析出物的组成计算：析出 Cu 与 O2 时需加入 CuO；析出 Cu 与 H2 时需加入 Cu(OH)2。","ex":[{"q":"用石墨电极电解 500 mL 0.2 mol/L CuSO4 溶液，通电一段时间后阴极析出 Cu 1.28 g。求阳极产生的 O2 在标准状况下的体积，并说明若要复原溶液应加入何种物质及其质量。","idea":"n(Cu) = 1.28/64 = 0.02 mol，转移电子 0.04 mol；阳极 4e⁻ 生成 1 mol O2。","ans":"n(O2) = 0.04/4 = 0.01 mol，V = 0.01 × 22.4 = 0.224 L。析出 Cu 与 O2 相当于失去 CuO，加入 CuO 质量为 0.02 × 80 = 1.6 g。"},{"q":"用惰性电极电解 CuSO4 与 NaCl 的混合溶液（各 0.1 mol），电路中通过 0.3 mol 电子时，阳极与阴极各产生什么气体？物质的量分别为多少？","idea":"阴极依次析出 Cu（0.1 mol，转移 0.2 mol e⁻），再放电 H2；阳极先 Cl⁻ 放电（0.1 mol Cl2，转移 0.1 mol e⁻）再 OH⁻ 放电。","ans":"阴极：先 Cu²⁺ + 2e⁻ = Cu，0.1 mol Cu 转移 0.2 mol e⁻；剩余 0.1 mol e⁻ 发生 2H⁺ + 2e⁻ = H2↑，生成 H2 0.05 mol。阳极：先 2Cl⁻ - 2e⁻ = Cl2↑，0.1 mol Cl⁻ 生成 Cl2 0.05 mol，转移 0.1 mol e⁻；剩余 0.2 mol e⁻ 发生 2H2O - 4e⁻ = O2↑ + 4H⁺，生成 O2 0.05 mol。结论：阴极产 Cu 0.1 mol 与 H2 0.05 mol，阳极产 Cl2 0.05 mol 与 O2 0.05 mol。"}]}]},{"title":"第十七章 原子结构与元素性质（选择性必修）","items":[{"name":"核外电子排布规律","desc":"原子核外电子按能量由低到高排布于能级 1s、2s、2p、3s、3p、4s、3d……，遵循能量最低原理、泡利不相容原理和洪特规则。构造原理的顺序为 1s→2s→2p→3s→3p→4s→3d→4p。洪特规则特例：当 3d 轨道为全空、半充满（d⁵）或全充满（d¹⁰）时原子更稳定，因此 Cr 为 [Ar]3d⁵4s¹，Cu 为 [Ar]3d¹⁰4s¹。基态原子失电子时先失最外层 4s 电子，如 Fe²⁺ 为 [Ar]3d⁶，Fe³⁺ 为 [Ar]3d⁵。价层电子排布决定元素的化学性质。","tip":"书写过渡金属阳离子电子排布时，先失 ns 电子，再失 (n-1)d 电子。","ex":[{"q":"写出基态 Cr（Z = 24）和 Cu（Z = 29）的电子排布式，并说明为何与构造原理有差异。","idea":"按构造原理排布后，检查 3d 是否达到半充满或全充满。","ans":"Cr：[Ar]3d⁵4s¹；Cu：[Ar]3d¹⁰4s¹。按构造原理应为 3d⁴4s²、3d⁹4s²，但 3d⁵、3d¹⁰ 为半满或全满的稳定结构，因此发生电子跃迁。"},{"q":"写出 Fe²⁺ 与 Fe³⁺ 的基态电子排布式，并判断 Fe³⁺ 更稳定的原因。","idea":"先写 Fe 的排布 [Ar]3d⁶4s²，失电子时先失去 4s 再失去 3d。","ans":"Fe²⁺：[Ar]3d⁶；Fe³⁺：[Ar]3d⁵。Fe³⁺ 的 3d⁵ 为半充满结构，较稳定，所以 Fe²⁺ 易被氧化为 Fe³⁺。"}]},{"name":"元素的电离能与电负性","desc":"第一电离能指气态基态原子失去一个电子所需的最低能量，同周期从左到右总体增大，同主族从上到下减小。异常情况：ⅡA 族（ns²全满）大于 ⅢA 族，ⅤA 族（np³半满）大于 ⅥA 族，因此 Mg > Al，N > O。电负性是原子在分子中吸引电子能力的标度，同周期从左到右增大，同主族从上到下减小，F 的电负性最大（4.0）。电负性差值大于 1.7 时通常形成离子键，小于 1.7 时通常形成共价键。电负性差值也可用于判断键的极性。","tip":"电离能与电负性的反常规律要记住 N>O、Mg>Al 的原因是半满、全满或全满的 s 轨道较稳定。","ex":[{"q":"比较 N、O、F 三种元素第一电离能的大小，并说明理由。","idea":"N 的 2p 轨道为半充满，比相邻元素稳定。","ans":"第一电离能：F > N > O。N 的 2p³ 为半充满结构，比 O 的 2p⁴ 更稳定，故 N 的第一电离能大于 O。"},{"q":"已知 NaCl、AlCl3、HCl 中成键元素电负性：Na 0.9、Al 1.5、Cl 3.0、H 2.1。判断三种化合物的化学键类型。","idea":"计算各化合物的电负性差值，与 1.7 比较。","ans":"NaCl：差值 2.1 > 1.7，为离子键；AlCl3：差值 1.5 < 1.7，为共价键；HCl：差值 0.9，为极性共价键。"}]}]},{"title":"第十八章 分子结构与性质（选择性必修）","items":[{"name":"价层电子对互斥模型（VSEPR）","desc":"分子的空间构型由中心原子的价层电子对数决定，价层电子对包括成键电子对与孤电子对，彼此尽可能远离。价层电子对数 = 中心原子价电子数 + 配位原子提供的电子数（氢提供 1 个，卤素提供 1 个，氧与硫不提供），对数除以 2 向上取整后再计算。孤电子对会压缩键角。常见构型：2 对直线形（CO2、BeCl2），3 对平面三角形（BF3），4 对四面体形（CH4，无孤对），3 对 2 孤对为 V 形（H2O、SO2 中 S 价层为 3 对，含 1 孤对），4 对 1 孤对为三角锥形（NH3）。","tip":"H2O 的价层电子对数为 4，构型为 V 形而非直线形；NH3 为三角锥形，键角约 107°。","ex":[{"q":"用 VSEPR 模型判断 SO2、SO3、NH4⁺ 的空间构型，并写出中心原子的杂化类型。","idea":"SO2 中 S 的价层电子对数为 3（含 1 孤对），SO3 为 3 对无孤对，NH4⁺ 为 4 对。","ans":"SO2：V 形，S 为 sp² 杂化；SO3：平面三角形，S 为 sp² 杂化；NH4⁺：正四面体形，N 为 sp³ 杂化。"},{"q":"判断 CH4、NH3、H2O 的键角大小顺序，并解释原因。","idea":"孤对电子对成键电子对的排斥力更大，使键角变小。","ans":"键角：CH4（109°28′）> NH3（约 107°）> H2O（约 104.5°）。孤对数依次增多，对成键电子对的排斥增强，键角依次减小。"}]},{"name":"杂化轨道理论","desc":"杂化是同一原子中能量相近的原子轨道重新组合成新的杂化轨道的过程，杂化轨道数等于参与杂化的原子轨道数。sp³ 杂化：1 个 s 与 3 个 p 杂化，构型为正四面体（CH4）；sp² 杂化：1 个 s 与 2 个 p 杂化，构型为平面三角形（乙烯 C、BF3）；sp 杂化：1 个 s 与 1 个 p 杂化，构型为直线形（乙炔 C、CO2 中 C）。判断方法：杂化轨道数 = 价层电子对数，即 sp³ 对应 4 对，sp² 对应 3 对，sp 对应 2 对。","tip":"有机分子中单键碳为 sp³，双键碳为 sp²，三键碳为 sp；σ 键数 = 单键数 + 双键中 1 个 + 三键中 1 个。","ex":[{"q":"乙烯（CH2=CH2）与乙炔（HC≡CH）中碳原子的杂化类型各是什么？分子中 σ 键与 π 键数目各是多少？","idea":"双键碳有 3 个 σ 区域，三键碳有 2 个 σ 区域；σ 键包括 C-H 与 C-C。","ans":"乙烯：C 为 sp²；σ 键 5 个，π 键 1 个。乙炔：C 为 sp；σ 键 3 个，π 键 2 个。"},{"q":"下列分子中心原子采取 sp³ 杂化且分子构型为 V 形的是（ ）A. CO2 B. H2O C. BF3 D. NH3","idea":"先算价层电子对数，sp³ 对应 4 对，再看孤对数决定构型。","ans":"选 B。H2O 中 O 有 4 对价层电子（2 对成键，2 对孤对），sp³ 杂化，因有孤对而构型为 V 形。CO2 为 sp 直线形；BF3 为 sp² 平面形；NH3 为三角锥形。"}]},{"name":"分子的极性与手性","desc":"分子若正负电荷中心重合则为非极性分子，否则为极性分子。双原子分子：同核分子为非极性，异核分子为极性。多原子分子：空间结构对称、中心原子无孤对、各键极性相互抵消时为非极性分子，如 CO2、CH4、BF3、CCl4；空间结构不对称或有孤对时为极性分子，如 H2O、NH3、SO2、CHCl3。相似相溶原理：极性溶质易溶于极性溶剂（如 HCl 溶于水），非极性溶质易溶于非极性溶剂（如 I2 溶于 CCl4）。手性碳指连有四个不同基团的碳原子。","tip":"判断分子极性时，先判断键是否有极性，再看整体构型是否对称。","ex":[{"q":"判断下列分子的极性：CO2、H2O、CH4、CHCl3、BF3。","idea":"看构型是否对称、是否存在孤对。","ans":"CO2 非极性（直线对称）；H2O 极性（V 形）；CH4 非极性（正四面体对称）；CHCl3 极性（四面体结构不对称）；BF3 非极性（平面三角形对称）。"},{"q":"下列物质在水中溶解度最大的是（ ）A. CO2 B. I2 C. CH4 D. NH3","idea":"极性分子易溶于极性溶剂水，且 NH3 能与水形成氢键。","ans":"选 D。NH3 为极性分子，且与 H2O 之间可形成氢键并与水反应，溶解度极大；CO2、CH4 为非极性或弱极性，I2 为非极性，溶解度都较小。"}]},{"name":"氢键与范德华力","desc":"范德华力是分子间普遍存在的弱作用力，影响物质的熔沸点与溶解性，相对分子质量越大、分子间作用力越强。氢键是 H 与 F、O、N 等电负性大、半径小的原子之间形成的较强分子间作用力，表示为 X-H…Y。氢键使物质熔沸点升高，如 H2O 沸点高于 H2S；乙醇与水互溶。分子内氢键会使熔沸点降低，如邻羟基苯甲醛的熔沸点低于对羟基苯甲醛。","tip":"氢键属于分子间作用力，不属于化学键；它不影响分子的稳定性。","ex":[{"q":"比较 H2O、HF、NH3 的沸点高低，并解释原因。","idea":"三者均可形成氢键，每个 H2O 可形成两个氢键，形成的氢键数越多沸点越高。","ans":"沸点：H2O（100 ℃）> HF（19.5 ℃）> NH3（-33 ℃）。H2O 每个分子平均形成 2 个氢键，氢键作用最强；HF 形成氢键的能力也较强；NH3 氢键较弱。"},{"q":"比较卤素单质 F2、Cl2、Br2、I2 的沸点高低，并说明影响因素。","idea":"均为非极性分子，只存在范德华力，相对分子质量越大范德华力越大。","ans":"沸点：I2 > Br2 > Cl2 > F2。四者均为非极性分子，无氢键，相对分子质量依次增大，范德华力依次增强，沸点依次升高。"}]},{"name":"配合物的组成与结构","desc":"配合物由中心原子（或离子）与配位体通过配位键结合形成，配位键由配体提供孤电子对、中心原子提供空轨道。例如 [Cu(NH3)4]SO4 中，Cu²⁺ 为中心离子，NH3 为配体，配位数为 4，内界为 [Cu(NH3)4]²⁺，外界为 SO4²⁻。常见配体有 NH3、H2O、Cl⁻、CN⁻、SCN⁻ 等。检验 Fe³⁺ 时，SCN⁻ 与 Fe³⁺ 形成血红色的 [Fe(SCN)]²⁺ 配离子。","tip":"配位数指直接与中心原子成键的配体数，而非配体总数；内界与外界之间为离子键。","ex":[{"q":"在 CuSO4 溶液中逐滴加入过量氨水，现象是什么？写出有关离子方程式，并指出中心离子、配体与配位数。","idea":"先生成 Cu(OH)2 蓝色沉淀，继续加氨水生成深蓝色的 [Cu(NH3)4]²⁺。","ans":"先出现蓝色沉淀：Cu²⁺ + 2NH3·H2O = Cu(OH)2↓ + 2NH4⁺；继续加氨水沉淀溶解，溶液变深蓝色：Cu(OH)2 + 4NH3 = [Cu(NH3)4]²⁺ + 2OH⁻。中心离子 Cu²⁺，配体 NH3，配位数 4。"},{"q":"下列物质中不能与 Fe³⁺ 形成配合物的是（ ）A. SCN⁻ B. F⁻ C. NH4⁺ D. CN⁻","idea":"常见配体需含孤电子对，NH4⁺ 无孤电子对且不是配体。","ans":"选 C。SCN⁻、F⁻、CN⁻ 均能提供孤电子对作为配体，与 Fe³⁺ 形成配离子；NH4⁺ 中 N 已无孤电子对，不能作为配体。"}]}]},{"title":"第十九章 晶体结构与性质（选择性必修）","items":[{"name":"四类晶体的结构与性质","desc":"晶体按构成粒子和作用力分为四类。离子晶体：阴阳离子通过离子键结合，如 NaCl、CsCl，熔沸点较高，硬而脆，熔融或溶于水导电。共价晶体（原子晶体）：原子通过共价键形成空间网状结构，如金刚石、晶体硅、SiO2、SiC，熔沸点极高，硬度大。分子晶体：分子间以范德华力（有时含氢键）结合，如干冰、I2、冰，熔沸点低，硬度小。金属晶体：金属阳离子与自由电子之间的金属键，如 Cu、Fe，多数熔沸点较高，有良好的导电、导热与延展性。熔点比较：共价晶体 > 离子晶体 > 分子晶体。","tip":"石墨是混合型晶体，层内为共价键、层间为范德华力，因此导电且质软。","ex":[{"q":"比较下列物质熔点高低：SiC、NaCl、干冰（CO2 固体）、I2、Na。","idea":"先判断晶体类型，再比较作用力强弱。","ans":"SiC（共价晶体）> NaCl（离子晶体）> Na（金属晶体，但 Na 的金属键较弱，熔点约 98 ℃，低于 NaCl）> I2（分子晶体，相对分子质量较大）> CO2（分子晶体，范德华力较弱）。"},{"q":"下列关于晶体的说法正确的是（ ）A. 分子晶体中一定存在共价键 B. 离子晶体一定含金属阳离子 C. 共价晶体熔化时需破坏共价键 D. 金属晶体的导电性是因为存在自由移动的阴离子","idea":"结合四类晶体的构成粒子与作用力分析。","ans":"选 C。稀有气体形成的分子晶体中无共价键，A 错；NH4Cl 为离子晶体但阳离子是 NH4⁺，B 错；金属导电来源于自由电子，D 错；共价晶体熔化需破坏共价键，C 对。"}]},{"name":"晶胞结构与计算","desc":"晶胞是晶体中最小的重复单元。晶胞中粒子的数目计算：顶点为 1/8，棱上为 1/4，面上为 1/2，体心为 1。例如面心立方（fcc，如 Cu）每个晶胞含 4 个原子；NaCl 晶胞含 4 个 Na⁺ 与 4 个 Cl⁻；CsCl 晶胞含 1 个 Cs⁺ 与 1 个 Cl⁻。密度计算：ρ = n·M / (NA·a³)，其中 n 为晶胞中粒子数，M 为摩尔质量，a 为晶胞棱长，NA 为阿伏加德罗常数。","tip":"计算时注意单位换算：1 pm = 10⁻¹⁰ cm，且 a³ 的单位须与密度单位一致。","ex":[{"q":"NaCl 晶体的晶胞棱长为 564 pm，求 NaCl 晶体的密度（NA = 6.02 × 10²³ mol⁻¹，M(NaCl) = 58.5 g/mol）。","idea":"一个晶胞含 4 个 NaCl 单元；a = 5.64 × 10⁻⁸ cm。","ans":"a³ = (5.64 × 10⁻⁸)³ cm³ ≈ 1.794 × 10⁻²² cm³；n·M = 4 × 58.5 = 234 g/mol；ρ = 234 / (6.02 × 10²³ × 1.794 × 10⁻²²) = 234 / 108.0 ≈ 2.17 g/cm³。"},{"q":"CsCl 晶胞为简单立方，Cs⁺ 与 Cl⁻ 各在晶胞顶点与体心，求每个晶胞中含有的 Cs⁺ 与 Cl⁻ 数目，并判断 Cs⁺ 的配位数。","idea":"顶点与体心的粒子分别按 1/8 与 1 计算；配位数指一个 Cs⁺ 周围最近的 Cl⁻ 数。","ans":"Cs⁺ 在顶点：8 × 1/8 = 1；Cl⁻ 在体心：1。每个晶胞含 1 个 Cs⁺ 与 1 个 Cl⁻（看作 CsCl 组成比）。Cs⁺ 周围最近的 Cl⁻ 数为 8，配位数为 8。"}]}]},{"title":"第二十章 有机化学基础（选择性必修）","items":[{"name":"烃的结构与性质","desc":"烃是只含碳、氢两种元素的有机物。烷烃（如 CH4）只含 C–C 单键，性质稳定，在光照下可与 Cl2 发生取代反应。烯烃含有碳碳双键 C=C（如 CH2=CH2），能与 Br2 发生加成反应，使溴水褪色。","tip":"官能团决定有机物的主要性质，如碳碳双键、羟基、羧基等；烷烃的取代反应在光照下进行。","ex":[{"q":"写出乙烯与溴水反应的化学方程式，并说明实验现象。","idea":"碳碳双键断开一个键，两个 Br 原子分别加在两个碳原子上，属于加成反应。","ans":"CH2=CH2 + Br2 → CH2Br–CH2Br（1,2-二溴乙烷）。现象：溴水的橙色褪去。"}]},{"name":"同分异构体","desc":"分子式相同而结构不同的化合物互为同分异构体。例如 C4H10 有两种：正丁烷 CH3CH2CH2CH3 和异丁烷 CH3CH(CH3)CH3。同分异构现象包括碳链异构、位置异构和官能团异构。","tip":"书写同分异构体时，先写碳链异构，再移动官能团或双键的位置，最后检查是否重复。","ex":[{"q":"分子式为 C4H8 的烯烃有几种？（不考虑顺反异构）写出它们的结构简式。","idea":"先写出 C4 的碳链，再在链上放置碳碳双键，注意去除重复结构。","ans":"共 3 种：CH2=CHCH2CH3（1-丁烯）、CH3CH=CHCH3（2-丁烯）、CH2=C(CH3)2（2-甲基丙烯）。"}]},{"name":"有机物的分类与官能团","desc":"有机物按碳骨架分为链状（脂肪族）与环状（脂环、芳香）化合物；按官能团分为烃、卤代烃、醇、酚、醚、醛、酮、羧酸、酯、胺、酰胺等。常见官能团：碳碳双键 C=C、碳碳三键 C≡C、卤素原子 -X、羟基 -OH（醇或酚）、醛基 -CHO、羰基 C=O（酮）、羧基 -COOH、酯基 -COO-、氨基 -NH2。具有相同官能团的有机物化学性质相似。","tip":"酚羟基连在苯环上，醇羟基连在链烃基上，二者性质不同：酚具有弱酸性。","ex":[{"q":"下列有机物中，能与 NaHCO3 溶液反应放出 CO2 的是（ ）A. 苯酚 B. 乙醇 C. 乙酸 D. 乙酸乙酯","idea":"只有酸性强于碳酸的物质能与 NaHCO3 反应，羧酸符合。","ans":"选 C。乙酸酸性强于碳酸，与 NaHCO3 反应生成 CO2；苯酚酸性弱于碳酸，不能与 NaHCO3 反应；乙醇为中性，乙酸乙酯不反应。"},{"q":"写出 CH2=CH-CH2-OH 所含的官能团名称，并判断它与 CH3-CH2-CH2-OH 的关系。","idea":"分析碳碳双键与羟基的存在。","ans":"官能团为碳碳双键与羟基（醇羟基）。两者虽然碳原子数相同，但官能团不同，性质不同，前者含双键，二者不是同系物。"}]},{"name":"卤代烃的性质与应用","desc":"卤代烃是烃分子中的氢被卤素原子取代的产物。卤代烃的水解（取代）反应：在 NaOH 水溶液中加热，C-X 键断裂，-X 被 -OH 取代生成醇，如 CH3CH2Br + NaOH →（H2O，△）CH3CH2OH + NaBr。消去反应：在 NaOH 醇溶液中加热，脱去 HX 生成不饱和烃，如 CH3CH2Br + NaOH →（乙醇，△）CH2=CH2↑ + NaBr + H2O。检验卤素原子：先加 NaOH 溶液加热水解，再加稀 HNO3 酸化，最后加 AgNO3 溶液，根据沉淀颜色判断。","tip":"消去反应的条件是强碱醇溶液，水解反应的条件是强碱水溶液，二者条件不同、产物不同。","ex":[{"q":"设计实验检验 CH3CH2Br 中的溴元素，写出步骤与相关化学方程式。","idea":"必须先水解，再用 HNO3 中和过量的 NaOH，最后加 AgNO3 观察沉淀。","ans":"步骤：①取少量样品加入 NaOH 溶液加热；②冷却后加入过量稀 HNO3 酸化；③加入 AgNO3 溶液，产生淡黄色沉淀，说明含溴。方程式：CH3CH2Br + NaOH →（△）CH3CH2OH + NaBr；Br⁻ + Ag⁺ = AgBr↓。"},{"q":"由 2-溴丙烷在不同条件下反应，分别得到的有机产物是什么？写出两种条件下的化学方程式。","idea":"NaOH 水溶液加热发生取代，NaOH 醇溶液加热发生消去生成丙烯（主要产物遵循扎伊采夫规则）。","ans":"NaOH 水溶液、加热：CH3CH(Br)CH3 + NaOH →（H2O，△）CH3CH(OH)CH3 + NaBr，生成 2-丙醇；NaOH 醇溶液、加热：CH3CH(Br)CH3 + NaOH →（乙醇，△）CH2=CHCH3↑ + NaBr + H2O，生成丙烯。"}]},{"name":"醇与酚的结构与性质","desc":"醇的官能团为羟基 -OH，连在饱和碳上。醇的化学性质：与 Na 反应放出 H2；催化氧化：伯醇（-CH2OH）氧化为醛再氧化为羧酸，仲醇（>CHOH）氧化为酮，叔醇不能被氧化；消去反应生成烯烃；与羧酸发生酯化反应。酚的官能团为羟基直接连在苯环上。苯酚的弱酸性：C6H5OH + NaOH → C6H5ONa + H2O，但苯酚酸性弱于碳酸，C6H5OH + Na2CO3 → C6H5ONa + NaHCO3。苯酚与浓溴水反应生成白色沉淀 2,4,6-三溴苯酚，可用于检验与定量测定。","tip":"苯酚与 NaHCO3 不反应；苯酚遇 FeCl3 溶液显紫色，常用于检验酚羟基。","ex":[{"q":"分别写出 2-丙醇催化氧化、苯酚与浓溴水反应的化学方程式。","idea":"仲醇氧化生成酮；苯酚的邻、对位上 H 被 Br 取代。","ans":"2CH3CH(OH)CH3 + O2 →（Cu，△）2CH3COCH3 + 2H2O；C6H5OH + 3Br2 → C6H2Br3OH↓（2,4,6-三溴苯酚）+ 3HBr。"},{"q":"下列物质中酸性由强到弱排列正确的是（ ）A. CH3COOH > H2CO3 > C6H5OH > HCO3⁻ B. C6H5OH > CH3COOH > H2CO3 > HCO3⁻ C. H2CO3 > CH3COOH > C6H5OH > HCO3⁻ D. HCO3⁻ > C6H5OH > H2CO3 > CH3COOH","idea":"乙酸强于碳酸，碳酸强于苯酚，苯酚强于碳酸氢根。","ans":"选 A。酸性：CH3COOH > H2CO3 > C6H5OH > HCO3⁻，对应反应可由 H2CO3 能与苯酚钠反应生成苯酚验证。"}]},{"name":"醛与酮的结构与性质","desc":"醛的官能团为醛基 -CHO，酮的官能团为羰基 C=O（两侧为烃基）。醛的特征反应：银镜反应，CH3CHO + 2Ag(NH3)2OH →（△）CH3COONH4 + 2Ag↓ + 3NH3 + H2O；与新制 Cu(OH)2 反应，CH3CHO + 2Cu(OH)2 + NaOH →（△）CH3COONa + Cu2O↓ + 3H2O。醛可被氧化为羧酸，可被 H2 加成还原为醇。酮不能被弱氧化剂氧化，不能发生银镜反应。","tip":"银镜反应必须水浴加热，试管需洁净；银氨溶液需现配并避免久置生成爆炸性物质。","ex":[{"q":"写出乙醛与新制 Cu(OH)2 反应的方程式，并说明实验现象。","idea":"醛基被 Cu(OH)2 氧化为羧基，Cu²⁺ 还原为红色 Cu2O。","ans":"CH3CHO + 2Cu(OH)2 + NaOH →（△）CH3COONa + Cu2O↓ + 3H2O；现象：加热后生成砖红色沉淀。配平校验：左侧 C2H4O + 2Cu(OH)2 + NaOH，右侧 CH3COONa + Cu2O + 3H2O，Cu、H、O 原子均守恒。"},{"q":"区分丙醛与丙酮，可选用的试剂是（ ）A. 银氨溶液 B. 钠 C. 氢氧化钠溶液 D. 氯化钠溶液","idea":"醛能发生银镜反应，酮不能；钠、NaOH、NaCl 与二者均不发生明显反应。","ans":"选 A。丙醛含醛基，与银氨溶液水浴加热生成银镜，丙酮无此现象，可以区分；B、C、D 对两者均无明显现象，无法区分。"}]},{"name":"羧酸与酯的结构与性质","desc":"羧酸的官能团为羧基 -COOH，具有弱酸性，能与碱、碳酸盐、活泼金属反应；能与醇发生酯化反应。酯的官能团为酯基 -COO-，由羧酸与醇缩合生成，低级酯有香味，易水解。酯的水解：酸性条件下可逆水解，如 CH3COOCH2CH3 + H2O ⇌（H⁺，△）CH3COOH + CH3CH2OH；碱性条件下彻底水解（皂化），CH3COOCH2CH3 + NaOH →（△）CH3COONa + CH3CH2OH。油脂属于高级脂肪酸甘油酯，在碱性条件下水解为高级脂肪酸钠与甘油，即肥皂的制备原理。","tip":"酯化反应的脱水方式是羧酸脱去 -OH、醇脱去 -H；浓硫酸作催化剂与吸水剂，饱和 Na2CO3 溶液用于吸收乙酸并降低乙酸乙酯溶解度。","ex":[{"q":"乙酸乙酯在 NaOH 溶液中加热完全水解，写出方程式。若需 0.1 mol 乙酸乙酯完全水解，至少需要 NaOH 多少摩尔？","idea":"碱性水解生成羧酸钠与醇，1 mol 酯消耗 1 mol NaOH。","ans":"CH3COOCH2CH3 + NaOH →（△）CH3COONa + CH3CH2OH；n(NaOH) = 0.1 mol，即至少需要 0.1 mol NaOH。"},{"q":"某酯与乙醇发生水解的逆反应（酯化）得到的酯相对分子质量为 102，且该酯由一元饱和羧酸与乙醇生成。求羧酸的分子式与结构简式，并写出酯的名称。","idea":"酯化反应中 M(酯) = M(酸) + M(醇) - 18，乙醇 M = 46，代入求羧酸的相对分子质量。","ans":"M(酸) = 102 + 18 - 46 = 74，对应分子式 C3H6O2，为一元饱和羧酸，结构简式为 CH3CH2COOH（丙酸）。酯为 CH3CH2COOCH2CH3，名称为丙酸乙酯。"}]}]},{"title":"第二十一章 有机合成与推断（选择性必修）","items":[{"name":"有机反应类型","desc":"常见有机反应类型：取代反应（烷烃卤代、苯的卤代、酯化与水解、卤代烃水解）；加成反应（烯烃、炔烃、苯环与 H2、X2、HX、H2O 的加成）；消去反应（醇脱水生成烯烃、卤代烃消去生成烯烃或炔烃）；氧化反应（醇催化氧化、醛被氧化、烯烃被 KMnO4 氧化）；还原反应（醛与 H2 加成生成醇、硝基还原为氨基）；加聚反应（乙烯生成聚乙烯）与缩聚反应（苯酚与甲醛、氨基酸生成多肽并生成小分子）。","tip":"取代与加成的区别：取代后生成两种或多种产物，加成后仅一种产物且不饱和度减少。","ex":[{"q":"判断下列反应类型：①CH2=CH2 + Br2 → CH2Br-CH2Br；②CH3CH2OH → CH2=CH2 + H2O（浓硫酸，170 ℃）；③nCH2=CH2 → 聚乙烯；④CH3COOH + CH3CH2OH ⇌ CH3COOCH2CH3 + H2O。","idea":"根据反应物与产物的结构变化分类。","ans":"①加成反应；②消去反应；③加聚反应；④酯化反应（属于取代反应）。"},{"q":"由乙烯制取乙二醇，写出各步反应类型与化学方程式。","idea":"乙烯先加成得 1,2-二溴乙烷，再水解得乙二醇。","ans":"①CH2=CH2 + Br2 → CH2Br-CH2Br（加成反应）；②CH2Br-CH2Br + 2NaOH →（H2O，△）HOCH2-CH2OH + 2NaBr（取代/水解反应）。"}]},{"name":"逆合成分析与有机合成路线设计","desc":"逆合成分析法从目标产物出发，逆向推导其前体，直至找到易得的原料。设计步骤：(1) 分析目标分子的官能团与碳骨架；(2) 选择合适的反应，逐步逆推；(3) 检查每步的反应条件是否可行、选择性是否足够。常用策略：官能团转化（如醇氧化为醛、再氧化为酸）、碳链增长（如卤代烃与 NaCN 反应、格氏反应）、引入官能团（烷烃光卤代、烯烃加成）。合成时需注意保护官能团，并注意产率与原子经济性。","tip":"设计合成路线时，应从目标产物结构出发，先确定最后一步反应，再向前推导。","ex":[{"q":"以乙烯为原料，设计合成乙酸乙酯的路线，写出各步化学方程式。","idea":"乙烯与水加成得乙醇，乙醇氧化得乙醛，再氧化为乙酸，最后与乙醇酯化。","ans":"①CH2=CH2 + H2O →（催化剂，加热加压）CH3CH2OH；②2CH3CH2OH + O2 →（Cu，△）2CH3CHO + 2H2O；③2CH3CHO + O2 →（催化剂）2CH3COOH；④CH3COOH + CH3CH2OH ⇌（浓硫酸，△）CH3COOCH2CH3 + H2O。"},{"q":"由苯与乙烯为主要原料合成苯乙烯，说明逆合成分析思路并写出两步反应方程式。","idea":"苯乙烯可由乙苯消去氢得到，乙苯由苯与乙烯在 AlCl3 催化下加成（烷基化）得到。","ans":"逆推：苯乙烯 ← 乙苯 ← 苯 + 乙烯。①C6H6 + CH2=CH2 →（AlCl3，△）C6H5CH2CH3（加成/烷基化）；②C6H5CH2CH3 →（催化剂，△）C6H5CH=CH2 + H2（消去反应，脱氢）。"}]}]}],"biology":[{"title":"第一章 细胞的分子组成（必修一）","items":[{"name":"元素与化合物","desc":"组成细胞的元素分为大量元素（C、H、O、N、P、S、K、Ca、Mg等）和微量元素（Fe、Mn、Zn、Cu、B、Mo等）。C是构成生物大分子的基本骨架，细胞鲜重中O含量最多，干重中C含量最多。组成细胞的化合物分为无机化合物（水、无机盐）和有机化合物（糖类、脂质、蛋白质、核酸）。细胞中各种元素的含量与无机环境相差很大，体现了生物界与非生物界的差异性；元素种类大体相同，体现了统一性。","tip":"微量元素含量少，但同样不可缺少，“微量”不等于“不重要”。","ex":[{"q":"下列元素中，属于微量元素的是（ ）A. C B. Mg C. Zn D. Ca","idea":"微量元素包括Fe、Mn、Zn、Cu、B、Mo等，Mg、Ca属于大量元素，C是基本元素。","ans":"C。Zn属于微量元素。"},{"q":"分别指出细胞鲜重和干重中含量最多的元素。","idea":"鲜重中水占比最大，故O最多；干重中有机物占比大，有机物以碳链为骨架，故C最多。","ans":"鲜重中含量最多的是O，干重中含量最多的是C。"},{"q":"缺Mg时植物叶片会发黄，其原因是什么？","idea":"Mg是叶绿素分子的组成成分，从无机盐功能角度分析。","ans":"缺Mg导致叶绿素合成受阻，叶片因叶绿素减少而发黄。"}]},{"name":"水与无机盐","desc":"水是细胞中含量最多的化合物。自由水是细胞内良好的溶剂，参与化学反应，运输营养物质和代谢废物；结合水是细胞结构的重要组成成分。自由水与结合水的比值越高，细胞代谢越旺盛，抗逆性越弱；比值越低，抗逆性越强。无机盐多以离子形式存在，如Fe2+是血红蛋白的成分，Mg2+是叶绿素的成分，血钙过低会引起肌肉抽搐，Na+、Cl-维持细胞外液渗透压。","tip":"晒干的种子失去的主要是自由水，失去后仍能保持生命力，但代谢减弱。","ex":[{"q":"种子晒干后仍能保持生命力，但失去的水主要是哪一类？","idea":"自由水含量高、易蒸发，结合水与细胞结构结合不易丢失。","ans":"自由水。"},{"q":"抗旱植物细胞内自由水与结合水的比值通常比一般植物____（填高或低）。","idea":"比值低则代谢弱、抗逆性强，适应干旱环境。","ans":"低。"},{"q":"血液中钙离子含量过低时，动物会出现抽搐，这说明无机盐的作用之一是什么？","idea":"无机盐对维持细胞和生物体的生命活动有重要作用。","ans":"无机盐对于维持细胞和生物体的生命活动具有重要作用。"}]},{"name":"糖类与脂质","desc":"糖类由C、H、O组成，分为单糖（葡萄糖、果糖、核糖、脱氧核糖）、二糖（蔗糖、麦芽糖、乳糖）和多糖（淀粉、糖原、纤维素）。淀粉是植物细胞的储能物质，糖原是动物细胞的储能物质，纤维素是植物细胞壁的主要成分。糖类是主要能源物质。脂质包括脂肪（储能、保温、缓冲减压）、磷脂（构成生物膜的基本骨架）和固醇（胆固醇、性激素、维生素D）。等质量的脂肪比糖类含H多、O少，氧化分解时释放能量更多。","tip":"纤维素是植物细胞壁的成分，人和动物不能消化利用，一般不作为能源物质。","ex":[{"q":"等质量的脂肪和糖类彻底氧化分解，释放能量较多的是哪一种？","idea":"脂肪中C、H比例高而O比例低，氧化时需要的氧多，释放能量也多。","ans":"脂肪。"},{"q":"下列属于动物细胞特有的多糖是（ ）A.淀粉 B.纤维素 C.糖原 D.麦芽糖","idea":"淀粉、纤维素是植物多糖，麦芽糖是二糖，糖原是动物细胞的储能多糖。","ans":"C。"},{"q":"有同学认为纤维素是植物细胞的能源物质，这种说法是否正确？","idea":"纤维素是细胞壁的组成成分，人体缺乏分解纤维素的酶，不能提供能量。","ans":"不正确。纤维素主要构成植物细胞壁，一般不作为能源物质。"}]},{"name":"蛋白质","desc":"蛋白质的基本单位是氨基酸，组成蛋白质的氨基酸约有21种。两个氨基酸通过脱水缩合形成肽键（-CO-NH-）相连，多个氨基酸形成肽链，肽链盘曲、折叠形成具有一定空间结构的蛋白质。蛋白质功能多样，如催化（酶）、运输（血红蛋白）、免疫（抗体）、调节（部分激素）和构成细胞结构等。高温、强酸、强碱会使蛋白质变性，空间结构被破坏，功能丧失，但肽键一般不断裂。","tip":"脱水缩合形成的肽键数=氨基酸数-肽链数，脱去的水分子数与肽键数相等；变性不破坏肽键，仍能与双缩脲试剂发生紫色反应。","ex":[{"q":"某蛋白质由3条肽链、共200个氨基酸组成，形成该蛋白质时脱去的水分子数和形成的肽键数分别是多少？","idea":"肽键数=氨基酸数-肽链数=200-3，脱去水分子数与肽键数相等。","ans":"脱去水分子数为197，形成肽键数为197。"},{"q":"某蛋白质由2条肽链、共含100个氨基酸，氨基酸平均相对分子质量为128，求该蛋白质的相对分子质量（水的相对分子质量为18）。","idea":"肽键数=98，脱去水分子98个，蛋白质相对分子质量=氨基酸总质量-脱去水的质量。","ans":"蛋白质相对分子质量=100×128-98×18=12800-1764=11036。"},{"q":"加热变性的蛋白质用双缩脲试剂检测仍会呈紫色，原因是什么？","idea":"高温只破坏蛋白质的空间结构，肽键并未断裂，双缩脲试剂仍可检测到肽键。","ans":"高温破坏的是空间结构，肽键仍然存在，因此仍能与双缩脲试剂发生紫色反应。"}]},{"name":"核酸","desc":"核酸包括DNA和RNA，基本单位是核苷酸，每个核苷酸由一分子磷酸、一分子五碳糖和一分子含氮碱基组成。DNA的五碳糖为脱氧核糖，碱基为A、T、G、C，通常为双链，主要分布在细胞核中，是主要的遗传物质。RNA的五碳糖为核糖，碱基为A、U、G、C，通常为单链，主要分布在细胞质中，包括mRNA、tRNA和rRNA。核酸是携带、储存和传递遗传信息的生物大分子。","tip":"含脱氧核糖或T的核酸是DNA，含核糖或U的核酸是RNA；细胞生物的遗传物质都是DNA，只有部分病毒以RNA为遗传物质。","ex":[{"q":"双链DNA分子中腺嘌呤（A）占全部碱基的20%，求鸟嘌呤（G）所占的比例。","idea":"依据碱基互补配对原则，A=T，G=C，且A+G=50%。","ans":"A=T=20%，G=C=50%-20%=30%，故G占30%。"},{"q":"某双链DNA的一条链中(A+T)/(G+C)=0.4，则其互补链中该比值是多少？","idea":"互补链与原链的A与T互换，G与C互换，因此两条链中(A+T)/(G+C)的比值相等。","ans":"0.4。"},{"q":"某生物的核酸中含有碱基A、T、G、C，该生物的遗传物质是什么？","idea":"含T说明含有DNA，细胞生物的遗传物质均为DNA。","ans":"DNA。"}]}]},{"title":"第二章 细胞的结构（必修一）","items":[{"name":"细胞学说与原核、真核细胞","desc":"细胞学说的主要内容是：一切动植物都是由细胞发育而来的；细胞是一个相对独立的有机体；新细胞是由老细胞分裂产生的。原核细胞没有由核膜包被的细胞核，只有核糖体一种细胞器，如细菌、蓝藻、支原体、放线菌；真核细胞有核膜包被的细胞核和多种细胞器，如动物、植物、真菌、原生动物。病毒没有细胞结构，只能寄生在活细胞中生活。","tip":"细菌、蓝藻都是原核生物；“菌”字不等于真菌，酵母菌、霉菌才是真菌。","ex":[{"q":"下列生物中属于原核生物的是（ ）A.酵母菌 B.蓝藻 C.草履虫 D.衣藻","idea":"原核生物包括细菌、蓝藻、支原体等；酵母菌、草履虫、衣藻都是真核生物。","ans":"B。"},{"q":"细胞学说的主要建立者是施莱登和施旺，其中“新细胞是由老细胞分裂产生的”这一观点由谁补充？","idea":"回忆细胞学说的发展历程。","ans":"魏尔肖（菲尔绍）。"},{"q":"发菜和颤蓝细菌属于原核生物，它们的遗传物质主要位于什么结构中？","idea":"原核
